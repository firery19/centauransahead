 ANT_new_anticetus_base:0 "New Western Naval Base"
 ANT_new_anticetus_base_desc:0 "Devon is the perfect location for a new base, with an ideal location for harrasing Cetan shipping, although work will take longer and facilities will be less advanced than the already existing ones in Northead."
