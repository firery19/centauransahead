 ANT_experimental_tank:0 "Experimental Armour Research"
 ANT_experimental_tank_desc:0 "Recent studies into further armouring and enlarging armoured cars, along with giving them tracks for better mobility in the trenches of a modern battlefield have proven to be promising. We will invest more into research in this area, and construct a few prototypes."
 ANT_build_tank:0 "Start Tank Production"
 ANT_build_tank_desc:0 "We shall start production of our first proper tank: the E/1911 shall be a mechanized and armoured force of steel which will force our enemy to submission!"
 ANT_improved_tank:0 "Improved Tank Designs"
 ANT_improved_tank_desc:0 "The E/1911 has proven itself to be... inadequate for our needs to say the least. We shall begin production of the E/1912, with thicker armour and a 2-inch gun in front to act as a mobile artillery platform."
 ANT_integrate_south_centaura:0 "Integrate South Centaura"
 ANT_integrate_south_centaura_desc:0 "Cetus and Aquila are nominally a part of our great Imperium, yet their people are not. Although a difficult task, we must sway the hearts and minds of the populus and realize their true identities as a part of the glorious Antares Imperium. Aquila, Ara, Cetus, Skorpius, Norma and Lupus all united under one flag!"
 ANT_integrate_cetus:0 "Unite Cetus Into \n The Imperium"
 ANT_integrate_cetus_desc:0 "For the first time since the founding of the Antares Imperium, a new member nation will be added. Our recently conquered land of Cetus will be officially integrated into the Empire and join the ranks of Skorpius, Ara, Lupus and Norma. Finally, war and conflict between Antares and Cetus will be a thing of the past."
 ANT_integrate_aquila:0 "Unite Aquila Into The Imperium"
 ANT_integrate_aquila_desc:0 "Like Cetus before, Aquila has proven itself incapable of resisting the might of the Antares Imperial Army. Now a broken and destroyed nation, we will graciously offer aid to the Kingdom of Aquila now that it is a part of the Antares Imperium. Peace, unity and prosperity will at last decend upon the nations of Cetus, Aquila and Antares."
 ANT_resolve_internal_disputes:0 "Resolve Internal Disputes"
 ANT_resolve_internal_disputes_desc:0 "Now that the great unity has decended upon South Centaura, we can finally resolve the centuries old disputes and grievances of our now internal borders, forever."
 ANT_rebuild_aquila:0 "Rebuild Aquila"
 ANT_rebuild_aquila_desc:0 "The Conquest of Aquila has sadly brought disasterous consequences to the region. We must send aid to rebuild this once productive state, and show we are not aggresive conquerors, but unifiers in the name of peace."
 ANT_new_administration:0 "Reorganize New Holdings"
 ANT_new_administration_desc:0 "With our new conquest, we have absorbed two additional seperate administrative structures into our empire. We must seek to reorganize these internal administrations for smoother long-term operations, even if it will make our integration process harder."
 ANT_continuity:0 "Incorporate Existing Administrations"
 ANT_continuity_desc:0 "We are not conquerors; the nations of Cetus and Aquila that we have annexed must return to their old habbits and way of life. The existing administrative structures, regions and institutions must be preserved for the sake of stability."


