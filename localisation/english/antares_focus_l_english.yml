#Events
 T.ANT.1:0 "The Speech"
 D.ANT.1:0 "Kalvin Tau stood in the antarean Supreme Kouncil. He had been thinking about this for years, and now he was ready to announce his plans to the world. He would unite Centaura under Antarean rule, and then all of Forma. He would end war forever."
 A.ANT.1:0 "The Emperor must assume absolute power to end war through force"
 B.ANT.1:0 "Antares must strengthen its democracy to end war through diplomacy"
 T.ANT.2:0 "Demonstrations in Ananteria University"
 ANT_2_D:0 "Recent political moves has lead to liberals and socialists protesting against the Emperor, denouncing him and calling him a tyrant. They say that this path will lead Antares to war and inevitabily to its fall." 
 A.ANT.2:0 "Me? A warmongerer?!?"
 T.ANT.3:0 "Pact With Antares?"
 D.ANT.3:0 "Antares has emerged as our closest ally in these trying times, and they have now reached out for a pact of non-aggression to officialize this deepening relationship."
 A.ANT.3:0 "Ofcourse we shall accept!"
 B.ANT.3:0 "We wish not to antagonize the Cetans further..."
 T.ANT.4:0 "Protesters And Police Clash!"
 D.ANT.4:0 "The recent violence in major cities like Ananteria have gotten worse lately. In a recent clash between protesters and counter-protesters, the riot police failed to controll the situation and multiple protestors and police have been killed or injured." #write some more here
 A.ANT.4:0 "There is nothing we can do"
 B.ANT.4:0 "Try to calm down the situation"
 C.ANT.4:0 "We can take advantage of this..."
 T.ANT.5:0 "Protests Escalate"
 D.ANT.5:0 "The protests that have up to this point been relatively small and manageable have escalated. The protestors have become more aggressive and organized, with some even calling for the overthrow of the Emperor. If not adressed, this can greatly shake the country and ruin stability."
 A.ANT.5:0 "We must adress this as our first priority!"
