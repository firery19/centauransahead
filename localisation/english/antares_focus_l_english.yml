 ANT_army_reform:0 "20th Century Army"
 ANT_army_reform_desc:0 "Our Army, Despite being the pride of the nation, is not ready for the future plans conflicts ahead. We must start work on a great army truly fit for the 20th Century."
 ANT_analyse_war_games:0 "Analyse Wargames"
 ANT_analyse_war_games_desc:0 "We have previously commenced a series of war games and exercises, which require further analysis to gain new insight."
 ANT_equipment_needs:0 "Equipment Needs"
 ANT_equipment_needs_desc:0 "A modern army requires new equipment and lots of it."
 ANT_army_navy_coop:0 "Army-Navy Cooperation"
 ANT_army_navy_coop_desc:0 "Getting the two branches of the militaty to cooperate on the few things they can cooperate on will be imperative for winning upcomming conflicts... and military budget negotiations."
 ANT_army_navy_war_game:0 "Joint Wargames"
 ANT_army_navy_war_game_desc:0 "We will conduct more exercises to develop our shore-bombardment, transportation and naval invasion tactictics."
 ANT_rethink_arty_doctrine:0 "Reform Artillery Doctrine"
 ANT_rethink_arty_doctrine_desc:0 "Artillery has developed alot over the years and have proved to truly be the king of battle, yet our doctrines are still outdated in this department. That must change!"
 ANT_learn_from_grease_war:0 "Learn from the Grease War"
 ANT_learn_from_grease_war_desc:0 "The recent conflict in Canis is an humanitarian and natural tragedy, but also an oppertunity to study how modern warfare unfolds!"
 ANT_reorganize_army:0 "The Grand Army Reform"
 ANT_reorganize_army_desc:0 "We must start taking greater measures to improve the army. A great Army Reform will be conducted, and ambitious targets for this reorganisation have been set, both in terms of equipment, technology, doctrine, organization and army size."
 ANT_navy_reform:0 "Naval Expansion"
 ANT_navy_reform_desc:0 "Although our navy is the second largest in South Centaura, it still pales in comparison to the Cetan Whale. A drastic reform of the navy will (hopefully) close the gap in numbers and make our ships fight more effectively than theirs."
 ANT_solve_coms_isssue:0 "Adress communication Issues"
 ANT_solve_coms_isssue_desc:0 "Our earlier defeat in Aquila was as much due to their resilience as our coordination failiure. With modern wars having larger armies than ever before, and stretching over greater frontlines, communication will be the key to fight effectively."
 ANT_radio_tech:0 "Radio Technology"
 ANT_radio_tech_desc:0 "Although still in its infancy and many years in the future, long-range communication using electro-magnetic wavelengths have become a possibility. If we succed in developing this technology, its military usage will be great."
