 aqu.1:0 "Civil Guard Recruitment Finished"
 cg_recruitment_event.1.t:0 "Civil Guard Recruitment Finished"
 cg_recruitment_event.1.desc:0 "Our organisation of Civil Guard units have finished and turned them into functional units!!"
 cg_recruitment_event.1.a:0 "Let them fight alongside the army"
 aqu.4.t:0 "The Scorch"
 aqu.4.d:0 "Antares is burning our forests to make it easier to attack!"
 aqu.4.a:0 "Oh no!"
 
 ###event abondon the radicals
 aqu.1118965.t:0 "Cutting ties"
 aqu.1118965.d:0 "For years, we were on good terms with social democrats while they were nothing but a bunch of opportunists, who would jump at every opportunity to criticize us and steal our votes. No more! We would rather enter these elections alone than with these rats!"
 aqu.1118965.a:0 "We are better off on our own..."
 
 ###event coalition with the Socialist
 aqu.1118964.t:0 "We are stronger together!"
 aqu.1118964.d:0 "Although we were not always on the best of terms with the social democrats, we have little to no chance to win the upcoming elections without them. Maybe it would be good to put our grudges aside for the time being and try negotiating forming a coalition with them?"
 aqu.1118964.a:0 "Towards victory!"
 
 ###coalition path speech 1
 aqu.1118966.t:0 "Falkner's speech"
 aqu.1118966.d:0 "For several last decades, our government has been doing nothing but stealing. Fouwler and his party own many companies in our country and have been avoiding taxes while paying minimal wages to our people. This ends now! We need to stop this and build even more factories than we have now. Antares is growing its army fast while we've been neglecting it for decades, thinking the peace would last forever. We shall develop ourselves even more, so that we can defend Aquila! "
 aqu.1118966.a:0 "For a better Aquila!"
 
 ###coalition path speech 2
 aqu.1118967.t:0 "XXX's speech"
 aqu.1118967.d:0 "Our people are struggling due to the companies having too much power over our economy. We need fair wages and jobs for everyone, who can work. And for those who can't work, we shall strengthen our social safety net, so they can have a nice life just like anyone else. together, hand in hand, we will fight for fair wages, more free time, general happiness and decreasing unemployment in our beloved country!"
 aqu.1118967.a:0 "For the people of Aquila!"
 
 ###a meeting with the socailist
 aqu.1118968.t:0 "A meeting with the Socialist"
 aqu.1118968.d:0 "L: Well, let´s see... we aren´t that different, you want jobs for the people and we want industrialization, which can provide jobs as well. \n\nSD: That is mostly correct. However, we want more powerful worker unions and fair wages for our people, too. \n\nL: Look, our country is not in the best situation at the moment, we can´t afford to pay workers as much as you demand. \n\nSD: While we agree to support the industrialization, we want fair treatment of workers and better wages. \n\nL: Very well. I will think about it." 
 aqu.1118968.a:0 "........"
 
 ###speech for the border regions
 aqu.1118969.t:0 "Border region speech"
 aqu.1118969.d:0 "The government has been neglecting our border regions for many years, all while focusing on the heartlands of our country. This ends now! If we win the elections, we will focus on improving the quality of life here. We will build better roads for you all, as well as electrify the countryside, so that you all can have life as good as the inhabitants of Volucris!"
 aqu.1118969.a:0 "Long Live Aquila!"
 
 ###criticize the foreign policy
 aqu.1118970.t:0 "Speech on foreign policy" 
 aqu.1118970.d:0 "Our country borders a dangerous aggressive empire to the south which tried attacking us not so long ago. Yet our government refuses to have good relations with any of our neighbours, saying we are stronger when we are alone, rather than pacting with Cetans. However, we need to have good relations with our neighbours in order to live in peace."
 aqu.1118970.a:0 "An inspiring speech"
 
 ###criticize the economic policy
 aqu.1118971.t:0 "Outdated economy"
 aqu.1118971.d:0 "Our current government does nothing but invest in forestry and agriculture, while keeping Aquila a backwards country. All the modern countries of the world, like Antares or Orion, invested in their industrial sector long ago and look how strong they are! It is time to invest in factories, since outdated armies have no place in our turbulent world. However, we cannot achieve a modern army with a government like the one we have now. By voting for us, you are also voting for a happy and safe future of our beloved nation, as only with a modern economy can we produce modern weaponry and machinery!"
 aqu.1118971.a:0 "We need change!"
 
 ###meet with the worker unions
 aqu.1118972.t:0 "A promise to the workers"
 aqu.1118972.d:0 "In Aquila, it is normal for workers to work 12 hour shifts, which leaves very little time for family and other things. We believe workers should work for 8 hours at most! You may say that isn´t possible while keeping the productivity on its current level, however, if we modernize our economy and buy new machinery, it won´t be a problem. This government has done nothing but bully the workers and robbing them of their time. By voting for us, you are also voting for happy future of the workers of this country, as well as their families!"
 aqu.1118972.a:0 "For a fair working environment!"
 
 ###appeal to the farmers
 aqu.1118973.t:0 "A safeguard for the farmers"
 aqu.1118973.d:0 "While our agricultural sector is well developed, you, farmers, get often damaged by natural disasters, like tornadoes, which are quite common in our lands. And while our current government keeps expanding your fields and sector, they refuse to cover the costs for damages, which made several farmers go bankrupt. If you vote for us, we will do everything we can to pass a law that helps cover the costs of the damages from natural disasters, as well as grant farmers more subsidies."
 aqu.1118973.a:0 "Stable farms, stable food supplies."
 
 ###election day
 aqu.18661112.t:0 "Election day!"
 aqu.18661112.d:0 "The day we've been waiting for is finally here. The voter turnout this year is much higher than normally, as the people from all across the country decided to go vote even though the voting places are often far away from them due to our dense forests. However, thanks to the Aquilan election and political systems, the elections are fair for everyone. Thankfully, the electoral race has been mostly clean and fair. All the parties are promising better life for the populace. Nevertheless, only one party can win, that party is... "
 aqu.18661112.a:0 "And the winner is.....!"
 
