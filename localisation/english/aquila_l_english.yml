 AQU_adopting_M99_rifle:0 "Adopt The M99"
 AQU_adopting_M99_rifle_desc:0 "While our army uses the old and trusty single shot Albus Graham rifle series, it is time to adopt a completely new weapon. Most of the armies on our continent use some type of bolt action rifle, like for example, the not-so-long-ago adopted Modelo 1898 in Vega. We should adopt a new bolt action rifle, as they have faster fire rate and are overall more effective. Our army has enough iron and wood, as well as industry for the production. We can leave the Albus Graham rifles to the irregulars, but our main army needs to be equipped with the best weapons we can offer!"
 
