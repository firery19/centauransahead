 # research (military)
 ##########
 AQU_army_modernisation:0 "Army Modernisation"
 AQU_army_modernisation_desc:0 "An impossible task to argue with the high command to modernise it!"
 AQU_new_thinking:0 "Bright New Officers"
 AQU_new_thinking_desc:0 "The new officers of this generation are the key to keeping our army up to standards."
 AQU_innovate:0 "Innovating Tactics"
 AQU_innovate_desc:0 "The officers will work on new tactics to overcome any obstacle."
 AQU_observe_the_canis_war:0 "Observe The Canis War"
 AQU_observe_the_canis_war_desc:0 "Across the Libran Ocean, a conflict has broken out in the region of Canis. We should keep an eye on the modern battle tactics both sides use by sending "journalists"."
 
 #########
 # focuses
 #########
 AQU_the_status_quo:0 "Legacy of The Revolution"
 AQU_the_status_quo_desc:0 "Our country went through a revolution not so long ago. It brought us the establishment of senate, a constitution and the most important, democracy. The best of all was that the revolution was peaceful and our beloved king got to keep his role of the monarch, now serving as a figurehead. Even though Antares tried to take our democracy away, we managed to hold them back. May we never lose our democracy!"

 AQU_address_the_parliament:0 "The Incoming Senate Election"
 AQU_address_the_parliament_desc:0 "After the revolution, our senate got established. Finally, another elections are coming. Although its always been mostly a battle between the liberals and conservatives with conservatives having the upper hand, it seems that more and more people long for a change of course. Perhaps we will see big changes in the senate soon?"
 
 AQU_support_the_tories:0 "Ewan For Second Term!"
 AQU_support_the_tories_desc:0 "Ewan's term can be easily describe as uneventful but stable. His administration kept the economy stable but stagnant, the only highlights are his agricultural policies, which provided the needed subsidized for farmers to purchase mechanized equipments, bolstering the agricultural. You can really say, nothing ever happens."
 
 AQU_raise_campaign_funds:0 "Raise Campaign Funds"
 AQU_raise_campaign_funds_desc:0 "Campaign funds are absolutely critical, this is especially true when it comes to supporting our senators, who face increasingly expensive and highly competitive reelection. Securing these resources early allows us to more easily defend our seats against aggressive CPP challenges."
 
 AQU_last_minute_deal:0 "Review DAP's Achievements" 
 AQU_last_minute_deal_desc:0 "Analyzing our past achievements allows us to reflect on our progress, refine our policies, and prove to the public that we are a self-aware and adaptive party despite our views."
 
 AQU_nominate_ewan:0 "Proctector of The Status Quo"
 AQU_nominate_ewan_desc:0 ""
 
 AQU_support_the_whigs:0 "Leonard The Progressive Economist"
 AQU_support_the_whigs_desc:0 "Leonard The Progressive Economist"
 
 AQU_CPP_speech_talona:0 "Speech in Talona"
 AQU_CPP_speech_talona_desc:0 "Speech in Talona"
 
 AQU_liberal_appeal_intellectual:0 "Appeal To The Intellectuals"
 AQU_liberal_appeal_intellectual_desc:0 "Appeal To The Intellectuals"
 
 AQU_liberal_reorganize_CPP:0 "Reorganize The CPP"
 AQU_liberal_reorganize_CPP_desc:0 "Reorganize The CPP"
 
 AQU_failed_election:0 "Failed Election"
 AQU_failed_election:0 "Failed Election_desc"
 
 AQU_the_kings_return:0 "Our Glorious king, Lucas Silva!"
 AQU_the_kings_return_desc:0 "Our Glorious king, Lucas Silva!"
 
 AQU_prepare_for_the_elections:0 "Start The Campaigning"
 AQU_prepare_for_the_elections_desc:0 "The elections are coming soon and both the liberals and conservatives are slowly starting their campaign. The conservatives are driving around the rural areas, campaigning there among the populace while the liberals are focusing on bigger cities and universities. Even smaller parties like the collectivists started their campaign. Perhaps the politics of Aquila will change greatly..."
 
 AQU_another_five_years_in_Volucris:0 "Another Five Years In Volucris"
 AQU_another_five_years_in_Volucris_desc:0 "As the election coming to an end, the DAPP have secure majority in the Senate, and the party will rule Aquila for another term."
 
 AQU_domestic_policy:0 "Domestic Policies"
 AQU_domestic_policy_desc:0 "Domestic policies are critical to determine the country's direction and future, with the problem of the Leonites and unfunded educations we must shift our focus into internal issues."
 
 AQU_continue_economy_policy:0 "Continue Our Economic Policies"
 AQU_continue_economy_policy_desc:0 "Another term for us means we can continue our economic policy interrupted, maximizing economic growth."
 
 AQU_Aquila_Industrial_Industries:0 "Industrial Industries"
 AQU_Aquila_Industrial_Industries_desc:0 "Even though Aquila is a largely agrarian society, this doesn't mean we should overly neglect our industrial sectors."
 
 AQU_industrial_development:0 "Industrial Development"
 AQU_industrial_development_desc:0 "Investing in civilian Industrial capacity is a must, regardless of whether it's an agrarian society or not."
 
 AQU_industrial_innovationtion:0 "Industrial Innovationtion"
 AQU_industrial_innovationtion_desc:0 "With our new innovationtions we improve our industrial capacity, helping our factories."
 
 AQU_further_industrial_development:0 "Further Industrial Development"
 AQU_further_industrial_development_desc:0 "Continuing to expand our factories will allow us to speed up production of goods and further our construction efforts."
 
 AQU_con_capitalist_market:0 "Free Market Capitalism"
 AQU_con_capitalist_market_desc:0 "A free market is an economic system where prices, production, and the distribution of goods are determined by the forces of supply and demand, rather than by government control or central planning."
 
 AQU_cut_profit_taxes:0 "Cut Profit Tax"
 AQU_cut_profit_taxes_desc:0 "By cutting profit tax, we can stimulate economic activity, encouraging business investment and innovation, and fuels economic growth."
 
 AQU_low_interest_loan_guarantees:0 "Low Interest Loan Guarantees"
 AQU_low_interest_loan_guarantees_desc:0 "By guaranteeing low interest loans, we can help small businesses and boost competition in the market."
 
 AQU_infrastructure_investments:0 "Infrastructure Investments"
 AQU_infrastructure_investments_desc:0 "Expanding infrastructure will enable necessary transport and Communication for development."
 
 AQU_agricultural_focus:0 "Agricultural Sectors"
 AQU_agricultural_focus_desc:0 "As agriculture remains Aquila's most profitable industry and the backbone of our economy, it demands greater state focus and investment."
 
 AQU_mechanized_farming_subsidies:0 "Limited Mechanized Farming Subsidies"
 AQU_mechanized_farming_subsidies_desc:0 "While mechanized farming will boost agricultural output and strengthen the economy, excessive subsidies could cause a long-term financial risk. We must limite this spending carefully."
 
 AQU_develop_rural_roads:0 "Develop Rural Roads"
 AQU_develop_rural_roads_desc:0 "Developing rural roads can improve transportation of agricultural goods."
 
 AQU_rural_region_development:0 "Rural Region Development"
 AQU_rural_region_development_desc:0 "While rural regions may naturally lag behind urban centers in development, we cannot simply abandon them to decay."
 
 AQU_expand_rural_region_development:0 "Further Rural Region Development"
 AQU_expand_rural_region_development_desc:0 "While rural regions may naturally lag behind urban centers in development, we cannot simply abandon them to decay."
 
 AQU_expand_rural_educations:0 "Investments In Rural Education"
 AQU_expand_rural_educations_desc:0 "Education is a necessity in a functional country, regardless of whether it is for city dwellers or rural residents."
 
 AQU_expand_the_cities:0 "Expand the Cities"
 AQU_expand_the_cities_desc:0 "A country without proper infrastructure cannot pursue advanced projects."
 
 AQU_aquilan_police:0 "Protector of Stability"
 AQU_aquilan_police_desc:0 "Law enforcement is the backbone of order, making sure laws are obeyed, crimes are investigated, and public safety and order are maintained."
 
 AQU_support_for_law_enforcement:0 "Support for The Law Enforcement"
 AQU_support_for_law_enforcement_desc:0 "Supporting law enforcement is essential not just for maintaining general public safety and crime deterrence, but for countering the growing threat of terrorism and separatism from the Leonites."
 
 AQU_Aquila_Neutrality_Act:0 "Aquilan Neutrality Act"
 AQU_Aquila_Neutrality_Act_desc:0 "Adopting neutrality can protect ourselves from costly wars and boost market confidence, allowing us to focus more on internal stability and domestic development."
 
 AQU_democratic_armoury:0 "Democratic Armoury"
 AQU_democratic_armoury_desc:0 "Even if we participate in neutrality, this doesn't mean we shouldn't expand our military production capabilities."
 
 AQU_Fund_the_Ministry_of_foreign_affairs:0 "Fund the Ministry of Foreign Affairs"
 AQU_Fund_the_Ministry_of_foreign_affairs_desc:0 "Increase comminication with foreign nations not only will boost our relations, but also preventing unnecssary wars."
 
 AQU_leonite_problem:0 "The Leonite Problem"
 AQU_leonite_problem_desc:0 "The Leonites are an active pain in our neck for ages, we should take action now and remove this irritation before it gets worse."
 
 AQU_increase_patrols:0 "Increase Patrols"
 AQU_increase_patrols_desc:0 "Those troublesome Leonites will do anything to achieve their separatist dreams, this includes acts of terrorism and riots. We must increase our patrols in this regions to deter our acts."
 
 AQU_stalk_the_restorationist_movement:0 "Stalk The Restorationist Movement"
 AQU_stalk_the_restorationist_movement_desc:0 "The restorationist movement is a hightly dangerous group of people, actively supporting separatism. We have bases of suspicion that they are connect with the GAP, stalking them allows us to gain more information on them."
 
 AQU_target_the_GAP:0 "Target The GAP"
 AQU_target_the_GAP_desc:0 "It is essential for us to activity target and arrest these Leonites terrorists within our nation, as their separatism and terrorism is a national security risk."
 
 AQU_go_on_a_hunting_trip:0 "Go On A Hunting Trip"
 AQU_go_on_a_hunting_trip_desc:0 "It's a wonderful day today! The weather is great, the sun is not too bright and the temperature is not too cold. Why not go on a hunting trip and unwind? Oh, you're asking what we're hunting? Lions!"
 
 AQU_review_education_funds:0 "Increase National Research funds"
 AQU_review_education_funds_desc:0 "Yes, we admit that we might have overlooked our technological sector in Ewan's last term, this is why we must correct it before it get worse. We have concluded that research funds must be raised, but how much? We are still debating."
 
 AQU_defences_of_aquila:0 "First Line of Defence"
 AQU_defences_of_aquila_desc:0 "The Aquilan Royal Army are our nation's shield, our small but well-trained army will be the first line of defence against certain annihilation attempted by our enemies."
 
 AQU_military_funding_bill:0 "Review The Military Budget"
 AQU_military_funding_bill_desc:0 "To improve our soldiers we must first ensure that our funds can support such improvements, otherwise it's all empty talks."
 
 AQU_the_Aquila_Royal_Army:0 "Improve The Aquila Royal Army"
 AQU_the_Aquila_Royal_Army_desc:0 "The Royal Army are a capable force, but even in peacetime we must maintain it's standards."
 
 AQU_2nd_Antarean_Aquilan_war_defend:0 "The 2nd Antarean-Aquilan War"
 AQU_2nd_Antarean_Aquilan_war_defend_desc:0 "The Second Antarean-Aquilan War was speculated to happen after the capitulation of Cetus by our high command. It became clear that the imperialist Antareans were not satisfied with just hunting the whale, they also wanted to shoot down the eagle. When facing the a war of annihilation, every patriots must §YARISE§! §YFOR§! §YTHE§! §YNATION§!"
 
 AQU_increase_regular_troop_training:0 "Increase Regular Training"
 AQU_increase_regular_troop_training_desc:0 "The Royal Army have a tradition of having one of the most tough training cycles to compensate their size. Since we still face a shortage of new recruits, we must continue this tradition by introducing harsher trainings."
 
 AQU_NCO_training:0 "Increase NCO Training"
 AQU_NCO_training_desc:0 "NCOs or Non-commissioned officers are the backbone of a functioning military, as they not only enforce discipline and standards, but also train soldiers and advise to the commissioned officers. We need to ensure their capabilities for such important role."
 
 AQU_review_the_doctrine_pre_reform:0 "Review The Doctrine"
 AQU_review_the_doctrine_pre_reform_desc:0 "By reviewing our military doctrine and analysis past battles we can ensure that our commmanders are proficient and knowledgeable when commanding an army."
 
 AQU_secure_ring_of_fire_construction_funds:0 "Ring of Fire Construction Fund"
 AQU_secure_ring_of_fire_construction_funds_desc:0 "Our people have the right to feel safe. For many years, our country was endangered by Antares. To ensure we hold them back again if they attack us, we should build the ring of fire. However, for a project this large, we need to secure the funds. Although our economy might become a bit slower, we need to be protected."
 
 AQU_falkner's_term:0 "Falkner's Term"
 AQU_falkner's_term_desc:0 "This path isn't finished yet!"
 
 AQU_the_South_Corvus_War:0 "The South Corvus Situation"
 AQU_the_South_Corvus_War_desc:0 "A war between Corvus and Cetus was destined to happen after the annexation of 1886... A starved crow facing death will attack any animal for food, even if it is a stubborn tortoise or an ancient whale."
 
 AQU_contact_the_crow:0 "Contact The Crow"
 AQU_contact_the_crow_desc:0 "If we view this conflict in a moral perspective ,Corvus is clearly the victim in this war, economically starved by Ceuts they are justified to retake what was theirs."
 
 AQU_keeping_the_eagle_feathers_dry:0 "Keep the eagle's feathers dry"
 AQU_keeping_the_eagle_feathers_dry_desc:0 "Why join the squabble? Supporting the Corvun's political adventure is risky and supporting the Cetans is morally questionable. The mighty eagle should fly above and observe the chaos on the ground, not adding fuel to the fire."
 
 AQU_contact_the_whale:0 "Contact The Whale"
 AQU_contact_the_whale_desc:0 "Even if Corvus was justified to start this war, their recent cooperation with the imperialist Antares calls for conern. If Corvus wins this war, Antares' §Rinfluence§! over Centaura could be larger than ever and our national security will be at stakes."
 
 AQU_food_aid_to_cov:0 "Food Aid To Corvus"
 AQU_food_aid_to_cov_desc:0 "To support the war effort Corvus have implemented rationing, the Crovuns desperately need food supply and as an agricultural powerhouse we shouldn't stand by and let them starve."
 
 AQU_medical_aid_cov:0 "Medical Aid To Corvus"
 AQU_medical_aid_cov_desc:0 "Compare to Cetus the weak Corvus is far lacking in medical supplies, in a moral standpoint we should send medical aid to ease their suffering."
 
 AQU_lend_lease_guns_cet:0 "Cetan Lend-Lease Act"
 AQU_lend_lease_guns_cet_desc:0 "The past between Cetus and Aquila is complicated, but when compared to Antares we'll help them in any time of the day. This act will provide the Cetans with the necessary means to resist the Crovuns and the growing Antares influence."
 
 AQU_aquilan_volunteer_force:0 "Aquilan Advisors"
 AQU_aquilan_volunteer_force_desc:0 "Sending advisors into a foreign war might seem idiotic at first, Yet, this conflict extends far beyond control over South Corvus, it is the frontline against Antares’ expansionism. If Cetus falls we might be next...."
 
 AQU_send_attache_sc:0 "Observe the War"
 AQU_send_attache_sc_desc:0 "No matter which side you support, observing this war offers valuable firsthand information on modern military tactics. We must not waste this opportunity to deepen our understanding of modern warfare."
 
 AQU_wartime_propaganda:0 "Wartime Propaganda"
 AQU_wartime_propaganda_desc:0 "The Ants will not be able to beat our spirit, the hearts and minds of the Aquilan people are indestructible. We beat them before and we'll beat them again!"
 
 AQU_adopting_M99_rifle:0 "Adopt The M99"
 AQU_adopting_M99_rifle_desc:0 "While our army uses the old and trusty single shot Albus Graham rifle series, it is time to adopt a completely new weapon. Most of the armies on our continent use some type of bolt action rifle, like for example, the not-so-long-ago adopted Modelo 1898 in Vega. We should adopt a new bolt action rifle, as they have faster fire rate and are overall more effective."
 
 AQU_adopting_efforts:0 "M99 Adopting Efforts"
 AQU_adopting_efforts_desc:0 "Even though we invented a new type of rifle, our industry still isn´t fully ready to produce it and many of our factories are still producing the old albus graham rifle. We should get new machinery in our factories, so that our industry is fully capable of producing this new kind of weapon."
 
 AQU_develop_the_M2:0 "Develop The M12" 
 AQU_develop_the_M2_desc:0 "Warfare is rapidly evolving, artillery is deadlier than ever, and combat vehicles are now equipped with machine guns. To adapt to this new era of warfare, we must increase our firepower. The development of the M12 submachine allow our frontline soldiers to gain significantly more firepower, ensuring we hold the upper hand against armies that still uses bolt-action rifles."
 
 AQU_M2_production_efforts:0 "M12 Production Efforts"
 AQU_M2_production_efforts_desc:0 "Even though we developed the M12, our industry isn't able to fully adopt and produce the M12 in mass, we should increase our efforts in replacing the bolt-action rilfes with the newly made M12 to ensure our troops with more firepower."
 
 AQU_the_civil_guard:0 "The Civil Guard"
 AQU_the_civil_guard_desc:0 "Civil Guards are civilian volunteers and policemen who were called up in their country's hour of need. Due not being trained or receive standardized equipments, Civil guards often carry a variety of self-owned firearms and wear anything from civilian coats and hats to police uniforms."
 
 AQU_a_tight_policy:0 "A Tight Policy"
 AQU_a_tight_policy_desc:0 "The Civil Guards are patriots who wish to defend the beloved nation without enduring the harsh army treatment. Even though aims of the Civil Guards are to protect the nation, it is still a highly conerning to have people with guns running around."
 
 AQU_a_loose_policy:0 "A Loose Policy"
 AQU_a_loose_policy_desc:0 "Imposing a looser policy will encourage more and more people to willingly join the Civil Guard. After all, when you can prove your loyalty and patriotism just by signing your name on a list, who would refuse?"
 
 AQU_continue_monthly_reporting:0 "Increase Monthly Report"
 AQU_continue_monthly_reporting_desc:0 "While monthly reporting of guns and Civil Guard members already exist, but they are often times sloppy done. Increase and standardize the monthly reporting will allow the government to track and calculate mobilisable Civil Guards."
 
 AQU_civil_guard_subsidies:0 "Civil Guard Subsidies"
 AQU_civil_guard_subsidies_desc:0 "Subsiding the Civil Guardsman will give our people more incentive to join the Civil Guard, increasing the mobilisable guardsman incase of a war."
 
 AQU_minimum_training:0 "Standardize Minimum Training"
 AQU_minimum_training_desc:0 "Although Civil Guards are traditional an untrained militia force, they would be obviously more effective if we provide standardised training to them, even if the training is only a 3 week short courses."
 
 AQU_wartime_factories:0 "Convert Civilian Factories"
 AQU_wartime_factories_desc:0 "The Ants are coming, we must increase produce of our military equipments, converting previously consumer good related factories into producing military equipment will boost our logistics and war efforts."
 
 AQU_national_defense_bond:0 "National Defense Bonds"
 AQU_national_defense_bond_desc:0 "The cost of maintaining a stable war effort is surprising higher than anyone could imagine, even though our national treasury can maintain the war effort to some extent, it would be better to have more for emergencies."
 
 AQU_hold_the_ring_of_fire_at_all_cost:0 "Hold The Ring Of Fire At All Cost!"
 AQU_hold_the_ring_of_fire_at_all_cost_desc:0 "The Ring of Fire is the first line of defence against the Ants, our soldiers must hold the line §RAT ALL COST§! to buy time to mobilise the nation!"
 
 AQU_unite_the_people:0 "Promate Nationalism"
 AQU_unite_the_people_desc:0 "Promating nationalism is a great way to push the masses to join the war effort against the dirty Ants, from the students in the schools to the workers in the factories, the people of Aquila must unite under a common cause!"
 
 AQU_new_form_of_communication:0 "A New Form Of Communication"
 AQU_new_form_of_communication_desc:0 "Radios are essential in a modern military, as they enhance communication and chain-of-command response times, allowing our army to be more coordinated."
 
 AQU_we_are_losing:0 "We are losing..."
 AQU_we_are_losing_desc:0 "Where all the roads have ended, but the path we walk does not! It is apparent to everyone in Aquila, that we must continue the Fight §Rtill the end!§! §YFor this is not the end, nor the beginning of it, but the end of the beginning.§!"
 
 AQU_desperate_military_reforms:0 "Desperate Military Reform"
 AQU_desperate_military_reforms_desc:0 "It is clear that our army isn't prepare for such wars, therefore it is essential to keep our army modernised to the current standards."
 
 AQU_will_wins_Wars:0 "Will Wins Wars"
 AQU_will_wins_Wars_desc:0 "Winning a war is not only about logistics, technology, or military tactics. Tt is also about the will to fight, only with the will to fight can our army succeed on the battlefield."
 
 AQU_stubborn_defence:0 "Stubborn Defence"
 AQU_stubborn_defence_desc:0 "In such situations, every inch of the eagle's nest must be defended, every inch of land must be fought and paid in their red Antareans blood. For every second we fought, means every second Aquila lives on."
 
 AQU_discipline_above_alll:0 "Discipline Above All"
 AQU_discipline_above_alll_desc:0 "Our lines are breaking, our cities are falling, and panic spreads through all fronts like wildfire. Retreating is no longer an option, we must treat every fight like it's our last. Now, It's either fight or die."
 
 AQU_defence_in_depth:0 "Defence In Depth"
 AQU_defence_in_depth_desc:0 "The valuable experience of warfare taught us that delaying rather than preventing the advance of an attacker and causing additional casualties by yielding space can be more tactically superior than sending thousand of men into a same trench over and over again."
 
 AQU_utillze_the_terrain:0 "Utillze The Terrain"
 AQU_utillze_the_terrain_desc:0 " Our divisions are not equipped with the latest equipment, but if there is something we know deeply it is our own lands. We can use every tree, hill, and field to our advantage, and thus make the experience of any who dare to invade a living hell. "
 
 AQU_strike_when_they_don't_see:0 "Strike When They Don't See"
 AQU_strike_when_they_don't_see_desc:0 "No successful commander ever struck the enemy where and how they expected it. Deception is foundational to war and we must always seem to be weak when we are strong, and strong when we are weak. "
 
 AQU_defend_the_cities:0 "Defend The Cities"
 AQU_defend_the_cities_desc:0 "With the threat of antarean invasion, we should focus on improving the defense of our towns and cities. We can achieve this by fortifying the streets. However, we need someone who knows the streets well enough to place the fortifications well... Who knows it the best? The inhabitants of those towns. Thus we shall establish town defense councils, which will plan the fortifications."
 
 AQU_prepare_for_battle_of_talona:0 "Prepare The Batlle Of Talona"
 AQU_prepare_for_battle_of_talona_desc:0 "Talona is a very important city in the northeast of Aquila. In case Volucris falls, it could become our new provisional capital. Although it lays in deep forests, it is connected via few important roads, mainly route 23. We could mine the road and dig deep trenches against the tanks to stop the enemy. In case the enemy reaches the town, we should of course fortify the streets and the metro."
 
 AQU_prepare_for_battle_of_volucris:0 "Prepare The Battle Of Volucris"
 AQU_prepare_for_battle_of_volucris_desc:0 "Volucris is without a doubt our most important city, the centre of the nation, the seat of our beloved king and the Senate. If we let it fall, our country will be severely crippled in terms of communications and infrastructure. We should focus on fortificating our capital. We can't let it fall in the hands of the enemy!"
 
 AQU_increase_cg:0 "Increase Civil Guard"
 AQU_increase_cg_desc:0 "Raising Civil Guards is more cost effective and easier than integrate them into the military, imagine the logistics strain that would happen if we Integrate them."
 
 AQU_integrate_cg:0 "Integrate the Civil Guard"
 AQU_integrate_cg_desc:0 "The Civil Guard supports our troops during wartime in urban areas, but improvements could be made. By integrating the Civil Guards into the military they will receive simple training, standardised weapons and uniform. This will allow the Civil Guardsmen be more effective on the battlefield than before."
 
 AQU_develop_tank:0 "Develop The AHT"
 AQU_develop_tank_desc:0 "Applying what we have learned from the Antarean Tanks, we can copy their design and develop our own armored tank as well. The AHT shall be a mechanized and heavily armoured force of steel that will halt the enemy's advances."
 
 AQU_emergency_tank_production:0 "Emergency Tank Production"
 AQU_emergency_tank_production_desc:0 "The AHT has proven itself to be a force to be reckoned with, we must fasten the production of such amazing vehicle as fast as we could, the AHT will turn the ties of the WAR!"
 
 AQU_research_tank_doctrine:0 "Research Tank Doctrine"
 AQU_research_tank_doctrine_desc:0 "Every good weapon can be ruined by how the user uses it, every bad weapon can be effective by how the user uses it. "
 
 AQU_to_the_blue_skies:0 "To The Blue Skies"
 AQU_to_the_blue_skies_desc:0 "A new front have been revealed by the invention of planes, the skies. We can not allow the Antareans to keep dominating, it is a shame that the eagle with wings couldn't protect it's sky while the scorpion without wings dominates it"
 
 AQU_lesson_from_the_canis_war:0 "Lession From The Canis War"
 AQU_lesson_from_the_canis_war_desc:0 "By inspecting the Canis War we can learn from the Ursan, even though the Ursans mostly used the airforce for recon purposes, we can still learn about valuable tactics of camouflaging."
 
 AQU_observe_the_AIAF:0 "Observe The AIAF"
 AQU_observe_the_AIAF_desc:0 "To further prepare our airforce we can observe the AIAF in the skies, what is a better way to learn than just observing it yourself?"
 
 AQU_defend_our_skies:0 "Defend Our Skies"
 AQU_defend_our_skies_desc:0 "Our Preparation finally paid off, the Royal Aquilan Airforce is ready for takeoff, we will claim our eagle's sky!"
 
 AQU_mass_barrage:0 "Mass Barrage"
 AQU_mass_barrage_desc:0 "As a wise man once said "How do you solve a practical problem? The answer, use a gun, and if that don't work... Use more gun.""
 
 AQU_flexible_artillery_command:0 "Flexible Artillery Command"
 AQU_flexible_artillery_command_desc:0 "Having a flexible artillery command allows our artillery units to rapidly shift, decentralize or mass their fire support across a battlefield based on real-time threats"
 
 AQU_on_call_artillery_support:0 "Call For Fire"
 AQU_on_call_artillery_support_desc:0 "Having our troops on the ground be able to indentify and call for artillery support independently allows our artillery to be more deadly and flexible than ever."
 
 AQU_centralized_artillery_command:0 "Centralized Artillery Command"
 AQU_centralized_artillery_command_desc:0 "By concentrating the fire direction, target prioritization, and tactical control of all artillery assets under a unified command, we can pour shells into a strategic points. "
 
 AQU_planned_barrage:0 "Planned Barrage"
 AQU_planned_barrage_desc:0 "Before our troop's every move, the artillery will calculate every coordinate and strategic points on a map. When our troops go on the attack, the synchronized barrage of shells along side of the infantry will crush any enemies on our path."
 
 AQU_recon_tactics:0 "Recon Tactics"
 AQU_recon_tactics_desc:0 "Having recons to provide location of the enemy is a must, since our artillery can not fire at the enemy if they don't know where they are."
 
 AQU_victory_b:0 "Victory?"
 AQU_victory_b_desc:0 "Is... is this, victory?"
 
 AQU_announce_total_mobilization:0 "Announce Total Mobilisation"
 AQU_announce_total_mobilization_desc:0 "To win this losing war, we must use everything available in our ability to avoid total annihilation of our people and our ideals, even if something us be sacrificed."
 
 AQU_integrate_cgww:0 "Integrate the Civil Guard"
 AQU_integrate_cgww_desc:0 "The Civil Guard supports our troops during wartime in urban areas, but improvements could be made. By integrating the Civil Guards into the military they will receive simple training, standardised weapons and uniform. This will allow the Civil Guardsmen be more effective on the battlefield than before."
 
 AQU_increase_cg_bawewewaewa:0 "Increase Civil Guard"
 AQU_increase_cg_bawewewaewa_desc:0 "Raising Civil Guards is more cost effective and easier than integrate them into the military, imagine the logistics strain that would happen if we Integrate them."
 
 AQU_the_homefront:0 "The Homefront"
 AQU_the_homefront_desc:0 "War is not only a matter of equipment, artillery, group troops or air force; it is largely a matter of spirit, or morale."
 
 AQU_nationalizing_war_factories:0 "Nationalise Factories"
 AQU_nationalizing_war_factories_desc:0 "Continue efforts to expand our military factories are necessary to meet the demands for new equipment."
 
 AQU_control_the_media:0 "Total Control The Media"
 AQU_control_the_media_desc:0 "There is no room for independent media in this kind of situation, their honest report on front could destroy our homefront's morale, sabotaging the war effort."
 
 AQU_crush_defeatism:0 "Crush Defeatism"
 AQU_crush_defeatism_desc:0 "In the time of need, every man, woman or even child should all focus on one goal and one goal only, §YVICTORY.§!"
 
 AQU_material_salvaging_program:0 "Material Salvaging Program" 
 AQU_material_salvaging_program_desc:0 "Steel is deeply foundational for our industries, to support the war effort, we expect every household to lend a hand for our common struggle."
 
 AQU_mobilize_the_woman_and_children:0 "Mobilise The Woman And Childern"
 AQU_mobilize_the_woman_and_children_desc:0 "Sending woman and childerns to the factories might be ethically and morally wrong, but to fill the factories this is a necessary step to make for the final victory."
 
 AQU_solve_the_lack_of_workers_problem:0 "Solve The Shortage Of Workers"
 AQU_solve_the_lack_of_workers_problem_desc:0 "With our men marching to the frontlines, It is time to call upon the other half of our nation. By bringing women into the factories and assembly lines, we will ensure that every soldier will receive their fair share of supplies. Total war requires total mobilization."
 
 AQU_full_military_controll:0 "Full Military Control"
 AQU_full_military_controll_desc:0 "Some might call this an overreach of power, a clear sign that Aquila is devolving into dictatorship, to those people who doubt our motives I ensure you our only motive is to free our country from the Ants no matter this cost." 
 
 AQU_wartime_military_reforms:0 "Wartime Military Reforms"
 AQU_wartime_military_reforms_desc:0 "With our newly learned experience of modern war, we will implement them into the iron army in hopes of reaching the same level as our enemies. "
 
 AQU_will_wins_Wars_b:0 "Will Wins Wars"
 AQU_will_wins_Wars_b_desc:0 "Winning a war is not only about logistics, technology, or military tactics. Tt is also about the will to fight, only with the will to fight can our army succeed on the battlefield."
 
 AQU_stubborn_defence_b:0 "Stubborn Defence"
 AQU_stubborn_defence_b_desc:0 "In such situations, every inch of the eagle's nest must be defended, every inch of land must be fought and paid in their red Antareans blood. For every second we fought, means every second Aquila lives on."
 
 AQU_discipline_above_alll_b:0 "Discipline Above All"
 AQU_discipline_above_alll_b_desc:0 "Our lines are breaking, our cities are falling, and panic spreads through all fronts like wildfire. Retreating is no longer an option, we must treat every fight like it's our last. Now, It's either fight or die."
 
 AQU_defence_in_depth_b:0 "Defence In Depth"
 AQU_defence_in_depth_b_desc:0 "The valuable experience of warfare taught us that delaying rather than preventing the advance of an attacker and causing additional casualties by yielding space can be more tactically superior than sending thousand of men into a same trench over and over again."
 
 AQU_utillze_the_terrain_b:0 "Utillze The Terrain"
 AQU_utillze_the_terrain_b_desc:0 " Our divisions are not equipped with the latest equipment, but if there is something we know deeply it is our own lands. We can use every tree, hill, and field to our advantage, and thus make the experience of any who dare to invade a living hell. "
 
 AQU_strike_when_they_dont_see_b:0 "Strike When They Don't See"
 AQU_strike_when_they_dont_see_b_desc:0 "No successful commander ever struck the enemy where and how they expected it. Deception is foundational to war and we must always seem to be weak when we are strong, and strong when we are weak. "
 
 AQU_develop_tank_b:0 "Develop The AHT"
 AQU_develop_tank_b_desc:0 "Applying what we have learned from the Antarean Tanks, we can copy their design and develop our own armored tank as well. The AHT shall be a mechanized and heavily armoured force of steel that will halt the enemy's advances."
 
 AQU_emergency_tank_production_b:0 "Emergency Tank Production"
 AQU_emergency_tank_production_b_desc:0 "The AHT has proven itself to be a force to be reckoned with, we must fasten the production of such amazing vehicle as fast as we could, the AHT will turn the ties of the WAR!"
 
 AQU_research_tank_doctrine_b:0 "Research Tank Doctrine"
 AQU_research_tank_doctrine_b_desc:0 "Every good weapon can be ruined by how the user uses it, every bad weapon can be effective by how the user uses it. "
 
 AQU_to_the_blue_skies_b:0 "To The Blue Skies"
 AQU_to_the_blue_skies_b_desc:0 "A new front have been revealed by the invention of planes, the skies. We can not allow the Antareans to keep dominating, it is a shame that the eagle with wings couldn't protect it's sky while the scorpion without wings dominates it"
 
 AQU_lesson_from_the_canis_war_b:0 "Lession From The Canis War"
 AQU_lesson_from_the_canis_war_b_desc:0 "By inspecting the Canis War we can learn from the Ursan, even though the Ursans mostly used the airforce for recon purposes, we can still learn about valuable tactics of camouflaging."
 
 AQU_observe_the_AIAF_b:0 "Observe The AIAF"
 AQU_observe_the_AIAF_b_desc:0 "To further prepare our airforce we can observe the AIAF in the skies, what is a better way to learn than just observing it yourself?"
 
 AQU_defend_our_skies_b:0 "Defend Our Skies"
 AQU_defend_our_skies_b_desc:0 "Our Preparation finally paid off, the Royal Aquilan Airforce is ready for takeoff, we will claim our eagle's sky!"
 
 AQU_Operation_Silva:0 "Operation Silva"
 AQU_Operation_Silva_desc:0 "In the name of our king, Lucas Silva, Aquila shall be freed from the enemy's hands. Every inch of the nation will be returns to the eagle's claw."
 
 AQU_victory:0 "Victory?"
 AQU_victory_desc:0 "Is... is this, victory?"
 
 AQU_aquila_the_unconquerable:0 "Aquila The Unconquerable"
 AQU_aquila_the_unconquerable_desc:0 "Through mud and blood we have proven ourself to be the unconquerable eagle of Centaura. Twice, twice those Antarean tried to annihilation our spirit and twice we prevailed. The future of Aquila will be held in OUR hands."
 
 ###generic war Reform
 AQU_aquila_under_attack_generic:0 "Aquila Is Under Attack!"
 AQU_aquila_under_attack_generic_desc:0 "The enemies are on our doorstep! Every patriots must §YARISE§! §YFOR§! §YTHE§! §YNATION§!"
 
