 aqu.1:0 "Civil Guard Recruitment Finished"
 cg_recruitment_event.1.t:0 "Civil Guard Recruitment Finished"
 cg_recruitment_event.1.desc:0 "Our organisation of Civil Guard units have finished and turned them into functional units!!"
 cg_recruitment_event.1.a:0 "Let them fight alongside the army"
 aqu.4.t:0 "The Scorch"
 aqu.4.d:0 "Antares is burning our forests to make it easier to attack!"
 aqu.4.a:0 "Oh no!"
 aqu.11402.t:0 "Aquilan Food Aid"
 aqu.11402.d:0 "The Aquilans send their regards. For humanitarian reasons, Aquila have sent a massive amount of food aid to us hoping to provide necessary rations to ease the suffering in our homefront."
 aqu.11402.a:0 "Huh, unexpected aid."
 aqu.11401644.t:0 "Aquilan Medical Aid"
 aqu.11401644.d:0 "The Aquilans send their regards. For humanitarian reasons, Aquila have sent a massive amount of medical related technology to us hoping to decrease the suffering and casualties on the frontlines."
 aqu.11401644.a:0 "Huh, unexpected aid."
 aqu.11401.t:0 "Aquilan Support"
 aqu.11401.d:0 "The Aquilans send their regards. To support our war effort against the Corvun threat, a massive convoy of their military equipment has just arrived to our backlines, ready to reinforce our frontline soldier"
 aqu.11401.a:0 "Well needed assistance."
 aqu.11403.t:0 "Aquilan Assistance"
 aqu.11403.d:0 "Our recent conflict with Corvus has raised alarm bells in Aquila. Fearing the expansion of Antarean influence, the Aquilans have contacted us to offer valuable tactical and strategic advice, bringing their military doctrine directly to our front lines. This assistance may help our campaign against the Corvuns , after all they are not called the 'Iron Army' for nothing."
 aqu.11403.a:0 "Most needed aid."
 
 ###the king announce the suspend of the senate
 aqu.11189564848418.t:0 "Our king suspends the senate with loyalist in the army and LAP"
 aqu.11189564848418.d:0 "weijwaiewa"
 aqu.11189564848418.a:0 "haha write" 
 
 ###party withdraw
 aqu.11189564223232.t:0 "Breaking News!"
 aqu.11189564223232.d:0 "CPP and DAP nominee fucking dies, alongside the whole senate!"
 aqu.11189564223232.a:0 "???"
 
 ###Start of the SCW
 aqu.114255456156.t:0 "The South Corvus War"
 aqu.114255456156.d:0 "The situation in Southern Corvus has dissolved into absolute chaos. The Antares-backed Corvun have launched a unexpected strike against the Cetans. While a war between the two nations was inevitable following the annexation of 1886, none anticipated it would be today. It is an open secret that the Antareans has long backed Corvus. If we dismiss this conflict as yet another foreign war, Antares' expansionist ambitions will go unchecked. Yet, openly backing Cetus raises moral conerns, the Corvuns only started this reckless gamble to prevent the domestic collapse caused by the Cetans. Regardless of our stance, we must position ourselves strategically to maximize the benefit of our own people."
 aqu.114255456156.a:0 "Surely this war won't escalate beyond South Corvus... right?"
 
 ###Leonites
 aqu.9181.t:0 "The Leonites Revolt"
 aqu.9181.d:0 "Although we had some limited information about the Leonite movement, we failed to destroy their movement before it could start the revolt. Now, they are in the streets together with their followers, engaging in street fighting. Some of them even obtained guns from armories, because they had followers in the army! Nevertheless, we have to crush their uprising and execute its leaders now..."
 aqu.9181.a:0 "Those damn separatists!"
 aqu.9181.b:0 "WHEN THE DAY COMES, THE LION SHALL BE FREED"
 
 ###Leonites focus 1
 aqu.9182.t:0 "The Leonites Problem"
 aqu.9182.d:0 "The Leonite Restorationist Movement is a highly organized and dangerous movement, full of militants and terrorists actively plotting sabotage and terrorism. Operating in the western borderlands, these Leonites openly advocate for the separatism of the nation and pose a direct threat to our security. We must take action before it is too late."
 aqu.9182.a:0 "A real pain in the neck aren't they?"
 
 ###Leonites focus 3
 aqu.9184.t:0 "Report on Leonite related suspicion activity"
 aqu.9184.d:0 "Members of our secret police spent several past weeks spying on suspected Leonite members, following them everywhere they go. We found out that every once in a while, they meet up at an abandoned warehouse in the outskits of the city. After installing a device in the warehouse, we found out they plot against the current government, trying to start a bloody revolution. We have to do something about it, since having terrorist running around isn't a great idea!"
 aqu.9184.a:0 "Better keep an eye on them..."
 
 ###Leonites focus 4
 aqu.9185.t:0 "Interrogation"
 aqu.9185.d:0 "One wednesday evening, our secret police broke into one of suspected Leonites flat as he was asleep. They silently arrested him without anyone knowing, instead putting a look-alike in his place who now goes to Leonite meetings instead, spying for us. The imprisoned Leonite is now being interrogated and has already told us many important things. With this, it shouldn´t be hard to arrest the rest of Leonites, putting an end to their little rebelion."
 aqu.9185.a:0 "Interesting information."
 
 ###Leonites revolt peace
 aqu.9186.t:0 "The Leonites Offer Peace"
 aqu.9186.d:0 "Even after fierce fighting with the Leonites for more than a year, we still couldn´t crush their uprising. Our country keeps suffering for no reason and thousands of our civilians died already, with many villages razed. Antares is eyeing us hungrily, perhaps preparing to attack us at our weakest point. Perhaps we should finally end this pointless war with white peace? It´s not like the frontline will change anytime soon anyway and at least we can keep what we defended..." 
 aqu.9186.a:0 "We just need more time." 
 aqu.9186.b:0 "Fine..."
 
 ###Senator woods crashing out about not crushing the Leonites
 aqu.9187.t:0 "Government Under Fire From Senator"
 aqu.9187.d:0 ""For an entire year, we've been trying to crush the separatis. However, due to your hesitation and incompetence, we failed. Now, the Leonites have taken our western borderlands and 1/4 of the Ring Of Fire. The incompetence of your leadership is now not only apparent to our people, but to the whole wide world. You should be ashamed, ASHAMED for letting this even happen!" said senator Wood. His words shook the senate, with many senators, even within the ruling party debating whether to push for a motion of no confidence against the first councillor or not."
 aqu.9187.a:0 "..."
 
 ###Cetus troops flee into Aquila
 formageneric.1.t:0 "Cetus Troops Ask For Asylum"
 formageneric.1.d:0 "Cetus is about to fall and some of their troops are now at our borders, seeking asylum. Although we've had issues with cetus in the past, they're long gone and many people forgot our old grudges. The League of Aquilan Patriots is protesting against letting them in, but the final choice is up to us. If we let them in, we could use their experience to train our army. However, letting them in could be dangerous. Maybe they're spies?"
 formageneric.1.a:0 "What are you waiting for? Welcome them in!"
 formageneric.1.b:0 "Not worth the risk."
 
 ###DAP review ###"Review DAP's Achievements"
 aqu.1118975.t:0 "Self improvement"
 aqu.1118975.d:0 "Many people see our last term of governance as very successful, mainly those from rural areas, like farmers or lower class. The last term was mainly about supporting smaller farmers around the countryside, while providing food for the poor from those farmers. Nevertheless, it wasn't all positive. While we supported the agricultural sector, we forgot about those working in forestry. In our next term, we need to support them more."
 aqu.1118975.a:0 "This will surely help."
 
 ###Raise funds DAP
 aqu.1118974.t:0 "Raise Funds"
 aqu.1118974.d:0 "Money and resources are necessities for a successful campaign, without it our senators will have a harder time against the CPP opposition. We must increase our efforts to secure valuable funds before the eventual elections."
 aqu.1118974.a:0 ""Hey sir, do you mind donating?""
 
 ###campaigning
 aqu.111896.t:0 " "200 Days till the Senate Elections!" "
 aqu.111896.d:0 "In several months, the Senate elections shall take place in many towns around our country. The main parties already started their campaigns. While the conservatives are trying to hold the majority, the liberals promised their voters to win the Senate, thus having a bigger say in our country's matters. Even the collectivists and ultra nationalists are trying to gain more voters, although most of election polls don't favor them much."
 aqu.111896.a:0 "Oh, it's time for some campaignin'!" 
 
 ###campaigning starts DAPP 
 aqu.111898964.t:0 "DAPP Moving Moves"
 aqu.111898964.d:0 "The DAPP has officially started its election campaign today. Their main goal is to keep their lead in the Senate over the liberals, keeping the country under their careful conservative lead. Ewan L. Fouwler shall ensure the senate stays in their hands and the country stays on the right track."
 aqu.111898964.a:0 "Huh, interesting."
  
 ###campaigning starts CPP
 aqu.1118965.t:0 "CPP Moving Moves"
 aqu.1118965.d:0 "The liberals are tired from the conservative rule, promising better future full of innovations. They are focusing their campaign on students and the people from urban areas. If they win, they will break the long streak of conservative rule. They need just few more senators and they will have the upper hand in the senate."
 aqu.1118965.a:0 "Huh, interesting."
 
 ###the CPP election ai
 aqu.111898964152.t:0 "CPP Moving Moves" 
 aqu.111898964152.d:0 "The liberals are tired from the conservative rule, promising better future full of innovations. They are focusing their campaign on students and the people from urban areas. If they win, they will break the long streak of conservative rule. They need just few more senators and they will have the upper hand in the senate."
 aqu.111898964152.a:0 "Huh, interesting."
 
 ###event coalition with the Socialist
 aqu.1118964.t:0 "We are stronger together!"
 aqu.1118964.d:0 "Although we were not always on the best of terms with the social democrats, we have little to no chance to win the upcoming elections without them. Maybe it would be good to put our grudges aside for the time being and try negotiating forming a coalition with them?"
 aqu.1118964.a:0 "Towards victory!"
 
 ###coalition path speech 1
 aqu.1118966.t:0 "Falkner's speech"
 aqu.1118966.d:0 "For several last decades, our government has been doing nothing but stealing. Fouwler and his party own many companies in our country and have been avoiding taxes while paying minimal wages to our people. This ends now! We need to stop this and build even more factories than we have now. Antares is growing its army fast while we've been neglecting it for decades, thinking the peace would last forever. We shall develop ourselves even more, so that we can defend Aquila! "
 aqu.1118966.a:0 "For a better Aquila!"
 
 ###coalition path speech 2
 aqu.1118967.t:0 "XXX's speech"
 aqu.1118967.d:0 "Our people are struggling due to the companies having too much power over our economy. We need fair wages and jobs for everyone, who can work. And for those who can't work, we shall strengthen our social safety net, so they can have a nice life just like anyone else. together, hand in hand, we will fight for fair wages, more free time, general happiness and decreasing unemployment in our beloved country!"
 aqu.1118967.a:0 "For the people of Aquila!"
 
 ###A country that doesn't change is destined to fail
 aqu.1118968.t:0 "A Country That Doesn't Change Is Destined To Fail"
 aqu.1118968.d:0 "L: Well, let´s see... we aren´t that different, you want jobs for the people and we want industrialization, which can provide jobs as well. \n\nSD: That is mostly correct. However, we want more powerful worker unions and fair wages for our people, too. \n\nL: Look, our country is not in the best situation at the moment, we can´t afford to pay workers as much as you demand. \n\nSD: While we agree to support the industrialization, we want fair treatment of workers and better wages. \n\nL: Very well. I will think about it." 
 aqu.1118968.a:0 "........"
 
 ###speech for the border regions
 aqu.1118969.t:0 "Border region speech"
 aqu.1118969.d:0 "The government has been neglecting our border regions for many years, all while focusing on the heartlands of our country. This ends now! If we win the elections, we will focus on improving the quality of life here. We will build better roads for you all, as well as electrify the countryside, so that you all can have life as good as the inhabitants of Volucris!"
 aqu.1118969.a:0 "Long Live Aquila!"
 
 ###criticize the foreign policy
 aqu.1118970.t:0 "Speech on foreign policy" 
 aqu.1118970.d:0 "Our country borders a dangerous aggressive empire to the south which tried attacking us not so long ago. Yet our government refuses to have good relations with any of our neighbours, saying we are stronger when we are alone, rather than pacting with Cetans. However, we need to have good relations with our neighbours in order to live in peace."
 aqu.1118970.a:0 "An inspiring speech"
 
 ###criticize the economic policy
 aqu.1118971.t:0 "Outdated economy"
 aqu.1118971.d:0 "Our current government does nothing but invest in forestry and agriculture, while keeping Aquila a backwards country. All the modern countries of the world, like Antares or Orion, invested in their industrial sector long ago and look how strong they are! It is time to invest in factories, since outdated armies have no place in our turbulent world. However, we cannot achieve a modern army with a government like the one we have now. By voting for us, you are also voting for a happy and safe future of our beloved nation, as only with a modern economy can we produce modern weaponry and machinery!"
 aqu.1118971.a:0 "We need change!"

 ###White peace Victory
 aqu.2110003.t:0 "Victory..?"
 aqu.2110003.d:0 "After the Aquilan-Antarean war started, Antarean armies managed to push Aquilans deep into their territory. However, it seems that all this effort was pointless, because as of today, Aquilans pushed Antareans out of their country and liberated most of their lost lands. Will Antares be able to push Aquilans yet again, or will it be forced to negotiate?"
 aqu.2110003.a:0 "Only time will tell.."
 
 ###White peace Victory 2
 aqu.2110004.t:0 "Victory"
 aqu.2110004.d:0 "After many months of fighting against a much stronger foe, we managed to prove the worth of the iron army. While we lost many good men in the war, thanks to many of our successful offensives, we forced Antares to come to the negotiation table. They want to sign a white peace. Maybe it's finally time to end this pointless bloodshed and rebuild our country."
 aqu.2110004.a:0 "The Iron Army lives up to it's name!"
 
 ###Victory focus
 aqu.2110005.t:0 "Cost Of Victory"
 aqu.2110005.d:0 "As of today, the curtain has fallen on this horrible war, the war that will be known as the 2nd Antarean-Aquilan in the future has officially ended.This terrible war has claimed thousands, if not millions, of lives on both sides of the war, many of which were just coming of age. \n\nIn a small town near Volans, a letter arrived at a cottage. A middle aged looking farmer sits at his dining table, holding the letter in his hand. \n\n“Lentia, March 21, 1912 \n To my dearest Mother and Father, \n\nMy superiors have told me to write this letter just in case the worst has happened to me, even though I seriously doubt something like that would happen, this will be my last letter to you if the worst truly has come to pass. \n\nBy the time you are reading this letter, it means I didn’t make it back home. The hardest part of writing this is knowing the pain it will cause you. I understand the unbearable grief you must be feeling right now, but please do not grieve for I have died defending our beloved nation, please be proud of me instead of crying, for I have died for a just cause. If for a reason you miss me, just look at our national map and wipe your tears, for I will forever sleep within it. \n\nThough I have left this world, my only last wish is for you both to live a happy and prosperous life. \n\nGoodbye." \n\nThe man simply stared at the letter, no matter how loudly as the people outside celebrated the sweet victory of war, the man only stared at it without a single word...."
 aqu.2110005.a:0 "Only the dead have seen the end of war."
 
 ###meet with the worker unions
 aqu.1118972.t:0 "A promise to the workers"
 aqu.1118972.d:0 "In Aquila, it is normal for workers to work 12 hour shifts, which leaves very little time for family and other things. We believe workers should work for 8 hours at most! You may say that isn´t possible while keeping the productivity on its current level, however, if we modernize our economy and buy new machinery, it won´t be a problem. This government has done nothing but bully the workers and robbing them of their time. By voting for us, you are also voting for happy future of the workers of this country, as well as their families!"
 aqu.1118972.a:0 "For a fair working environment!"
 
 ###appeal to the farmers
 aqu.1118973.t:0 "A safeguard for the farmers"
 aqu.1118973.d:0 "While our agricultural sector is well developed, you, farmers, get often damaged by natural disasters, like tornadoes, which are quite common in our lands. And while our current government keeps expanding your fields and sector, they refuse to cover the costs for damages, which made several farmers go bankrupt. If you vote for us, we will do everything we can to pass a law that helps cover the costs of the damages from natural disasters, as well as grant farmers more subsidies."
 aqu.1118973.a:0 "Stable farms, stable food supplies."
 
 ###election day
 aqu.18661112.t:0 "Election day!"
 aqu.18661112.d:0 "The day we've been waiting for is finally here. The voter turnout this year is much higher than normally, as the people from all across the country decided to go vote even though the voting places are often far away from them due to our dense forests. However, thanks to the Aquilan election and political systems, the elections are fair for everyone. Thankfully, the electoral race has been mostly clean and fair. All the parties are promising better life for the populace. Nevertheless, only one party can win, that party is... "
 aqu.18661112.a:0 "And the winner is.....!"
 
 ###DAP Victory
 aqu.18661116.t:0 "DAP victory!"
 aqu.18661116.d:0 "The Senate has decided that Ewan L. Fouwler will continue in his position as the First Councilor for a second term! The DAP shall keep leading Aquila with their status quo, as they have for many years already. It seems like the populace didn't want any changes and considers the DAP the most able party..."
 aqu.18661116.a:0 " "I'm coming back to serve a second term." -Ewan L. Fouwler "
 
 ###generic war start military Reform
 aqu.2110000.t:0 "AQUILA UNDER ATTACK"
 aqu.2110000.d:0 "Without warning, the clouds of war has reached our homeland, Aquila is under attack! We must mobilise the army and industries to hopefully hold the front and protect the nation. Shoulder to shoulder, united we stand, the eagle shall not fall against the enemy!"
 aqu.2110000.a:0 "To arms!"
 
 ###start of the 2nd ant-aqu war
 aqu.2110001.t:0 "2nd Antarean Aquilan War"
 aqu.2110001.d:0 "The aggressive Empire of Antares has decided to attack us again. Defeating Cetus apparently wasn´t enough for them. Although we have defeated them many times in the past when they attacked us, they have modern technology now. Thankfully, we have the Ring of Fire to protect us this time, so hopefully, we can hold them back from the inland. "
 aqu.2110001.a:0 "CHHAARGEEE!"

 ###we are losing...
 aqu.2110002.t:0 "Report from the front"
 aqu.2110002.d:0 "Bad news from the front! The empire of Antares managed to break through our carefully prepared fortifications. Although it wasn´t hard to hold them at the beginning, their persistent attempts at breaking through paid off and now, they´re advancing further! How could this have happened... What are we supposed to do now?"
 aqu.2110002.a:0 "Lord help us..."
 
 ###Military government
 aqu.3110001.t:0 "A proposal from the cabinet"
 aqu.3110001.d:0 "The war is not looking good for us. The parliament has been discussing for more than a week and came up with an interesting proposal. We could give emergency powers to our military. Although it could bring authoritarianism and take our democracy away, if we give the army too much power..."
 aqu.3110001.a:0 "There is no need for that."
 aqu.3110001.b:0 "We're out of options...."
 
 ###force women and maybe childern into the Factories
 aqu.3110002.t:0 "Solving the problem"
 aqu.3110002.d:0 "Since the war with antares began, we had to mobilize many of our nations men. This brought a really big problem however. Our factories lack workforce and without it, our army will soon crumble. Work in the factories is hard and tiring, but now we have many unemployed housewives who could do it... Or even the children, if needed..."
 aqu.3110002.a:0 "Childern are unfit for the factories."
 aqu.3110002.b:0 "We need the extra workforce."
 
 ###recruit air Officers
 aqu.510.t:0 "The Pioneers Of Our Air Force"
 aqu.510.d:0 "After many months of training, first two of our pilots are ready to defend our country from invaders. Their names are Arthur Vance and Henri Delacroix. They will now focus on training more new pilots and later on, they shall both lead their own squadron and defend our skies. It is great news for our country, as we have finally become the masters of air. The eagle got its wings!"
 aqu.510.a:0 "To the skies we go!"
 
 ###why are you here? this path isn't finished yet###
 aqu.9995959458.t:0 "This path isn't finished yet!"
 aqu.9995959458.d:0 "Hello! This is the developer for Aquila, unfortunately this path you are playing isn't finished yet, there is no more content beyond this point. I understand the disappointment you must be feeling right now, but please be patient for new updates."
 aqu.9995959458.a:0 "Thanks for playing! :D"
 
