 AQU_the_national_assembly:0 "The Senate"
 AQU_the_national_assembly_desc:0 "After the peaceful Democratic Revolution, the Council of advisors began implementing democratic reforms. Institutions like the State Constitutional Court or the Senate were established. The Council was replaced with Executive council led by the First Councilor, who would then serve for 5 years. The Executive council consists of 10 members. \n\nThe Senate is located in the capital of Aquila, Volucris. Senators are elected by the people in national elections for 5 years and hold the power to elect the First Councilor. \n\nConservative Seats: [?AQU_senate_conservative_var|+1%]. \nLiberal Seats: [?AQU_senate_liberal_var|+1%]. \nDemocratic Socialist Seats: [?AQU_senate_social_democratic_var|+1%]."
 
 
