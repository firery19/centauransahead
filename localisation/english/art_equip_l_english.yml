 artillery_equipment_0_short:0 "Artillery 1"
 artillery_equipment_0_desc:0 "New methods of lobbing shells at the enemy have been developed and we must take advantage in order to win the coming wars."
 interwar_artillery:0 "Pre-war Artillery"
 interwar_artillery_short:0 "Pre-war Artillery"
 interwar_artillery_desc:0 "Improvements in other fields have helped us improve our artillery development"
 artillery_equipment_3:0 "Late-war Artillery"
 artillery_equipment_3_short:0 "Artillery 3"
 artillery_equipment_3_desc:0 "The latest developments in artillery technology have allowed us to create more powerful and accurate artillery pieces, which will be crucial in the coming wars."
