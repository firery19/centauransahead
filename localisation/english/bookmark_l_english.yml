l_english:
 BM_HISTORY_TITLE:0 "Brief History"
 GATHERING_STORM_NAME:0 "Gathering Storm"
 GATHERING_STORM_DESC:0 "Dark times are coming. In Europe, Hitler has consolidated his power and his attention is now increasingly drawn beyond Germany's borders. Mussolini's Italy continues to embark on daring military adventures, while the Empire of Japan stands poised to attack China in Asia. Almost twenty years have passed since the end of the Great War, and the world has yet again been doused in gasoline. A single spark may be all it takes."
 HITTING_FAN_NAME:0 "The Hitting of the Fan"
 HITTING_FAN_DESC:0 "Yup, that's right! That umbrella collection is about to come in real handy."
 #The influence of the once great Libran Empire is still felt in the world with most of the world speaking Libran (english).
 GREASE_WAR_NAME:0 "The Grease And Centauran Wars"
 GREASE_WAR_DESC:0 "It's the dawn of a new century, and it might be the bloodiest of them all. Worsening relations between Orion and Ursa may ignite a war at any moment while Hydrus, the newly independent country of Forma, seeks to claim the former territories of the Ursan Federation. Over at Centaura, 20 years after the invasion of South Corvus, Corvus prepares to retake their former territory while Antares prepares on an unification, unseen since the days of the Libran Empire."
 ANT_1900_DESC:0 "The Antares Imperium was established as an union between Skorpius, Ara, Norma and Lupus in the 1200s, and has been a powerhouse of southern Centaura ever since. With one of the largest armed forces and industry in the world, Antares under Kalvin Tau's leadership is preparing for something. And it is something great..."
 ORI_1900_DESC:0 "The Orion Republic is the largest and arguably most powerful nation in the world. It's industrial might is unrivaled and across it's vast territory there are boundless resources. However, the rural areas are underdeveloped, there is rampant corruption and massive differences between the rich and the poor.\n\nEven with all these, the republic is now preparing for a war to finally end Ursan influence on the continent and kick them out of Canis."
 CET_1900_DESC:0 "Cetus is the predominant naval power of the world and is in a confortable position; it has a relatively industrialized economy, large amounts of resources and something.\n\nHowever, it's isolationist policy has led to worsening relations with it's neighbours, and the prioritization of the navy over the army has left it vulnerable to land invasions."
 COV_1900_DESC:0 "It has been 14 years since the Cetan invasion of South Corvus, and the Corvuns are reeling from the loss of their resource-rich and developed southern territories.\n\nBecause of this, the revanchist Corvun government and its patriotic population are forced to prepare to retake their lost southern territories, or die trying."
 URS_1900_DESC:0 "The Federation of Ursa is an empire of northern Forma which is in decline. Internal protests, the ever more rebellious Hydran colonies and the threat of Orion and the recently independent Hydrus shows that the 20th century will be harsh for the Federation of Ursa.\n\nUrsa will have to navigate this turn of the century carefully, or collapse."
 HYS_1900_DESC:0 "Hydrus is the most recent nation of Forma, previously being a colony of Ursa. The momentum of colonial revolts across the Ursan empire gained from Hydrus' independence makes it clear that Ursa's domination will soon end, and Hydrus stands to gain. Who knows what this new nation will accomplish in this new century."
 RIA_1900_DESC:0 "The tiger of the north that is the Republic of Riaa is the first republic on Centaura after it's monarchy was overthrown in the civil war of 1888 with the dynasty retreating to the western islands of Vulpa.\n\nAlthough it has a massive population and military, it is a poor nation ruled by the total control of the nationalist party which ever since the revolution has reformed and modernized Riaa. Whatever the future brings, the ever strengthening Riaa will play an important part in it."
 LBR_1900_DESC:0 "The Federation of Libra is the remnant of the ancient Libran Empire which at it's height controlled the whole world. Libra has been an extremely isolationist country ever since the empire withered away and retreated back to it's home islands in year 0.\n\nIts prestige as the legitimate descendant of the Empire has made it an international mediator and ever since the end of it's isolationism it has been the host of many multinational conferences and organizations."
 VUL_1900_DESC:0 "The former Dynasty that controlled the mainland territory of the current Riaan Republic retreated onto the islands of the former provinces of Vulpa in the aftermath of the Riaan Civil War."
 AQU_1900_DESC:0 "The Kingdom of Aquila has the history of winning against its neighbouring countries of Vega and Antares, earning its army the moniker "Iron Army". Aquila is covered in forests, and prairies."
 GRS_1900_DESC:0 "The Crane of the Deserts, Grusa. This country was once a proud empire that spanned from Vega to Centauri, encapsulating the entirety of Eastern Centaura. It has long since fallen from its powerful status, but it still retains one of the best fleets in the world.\n\nIt's rivalry with its southern neighbour Vega has forced both nations into an aggressive state for centuries over petty differences. However, sentiment for unification has long existed amongst the populace, but no attempts at reunification was ever attempted."
 VEG_1900_DESC:0 "Vega was the former southern lands of Grusa, however it seceded from Grusa during a secession crisis between two royals. It has a good geographical defence due to the Murus Plateau in the west."
 CLB_1900_DESC:0 "The country that inhibits the great divider of North and South Centaura that is the Macer Mountains, the United Columban Territories is a country that was formed from the nations of Phact, Nohae, Euria and Quara.\n\nIts strategic geographical location with the world's grandest mountains to the south leaves little worry except in the north, where flat plains at the border with Riaa stands as a threat."
 TUC_1900_DESC:0 "The north Centauran nation that leads the world within industrial capabilities is the country of Tucana. Tucana has the worlds greatest engineers, and so the country has an edge within anything mechanical."
 CTA_1900_DESC:0 "The Kingdom of Centauri is a democratic nation in North Centaura. It boasts the strongest navy of the north and the most extensive coastal battery network due to its history with the nation to its south, Grusa."
 AUR_1900_DESC:0 "Auriga was once a regional power within Hydra. However, the emergence of Orion to the north has forced its hand and so the western part of the country was sold off in order to ward off any invasions and to foster a good relation."
 LAC_1900_DESC:0 "At the forgotten corner of the world rests Lacerta. It is the southernmost landmass within Forma, and it leads to nowhere."
 MUS_1900_DESC:0 "The holy unist writings are here in the northeastern corner of the world, Musca."
 FORMAN_WAR_NAME:0 "The Forman War" # DOES NOT EXIST AND WILL CRASH ON START
 FORMAN_WAR_DESC:0 "In the aftermath of the bloody Centauran Wars, Antares has finally taken over the continent. The armies of Antares and Ursa are advancing upon the last bastion, the Hydran continent. Ursa laments the loss of Canis to Hydrus, and tensions between Orion and Antares are worsening. As both worlds collide, a war of unthinkable magnitude will soon consume Forma, and the fate of who wins this war will undoubtedly decide the course of the next centuries."
 ANT_1944_DESC:0 "After over 30 years of war, Antares has conquered Centaura and has the biggest army and navy in the world. But everything is not as good as it seems. Decades of war has exhausted the homefront, massive territories needs to be garrisoned and integrated. But Antares can not relax, for it has another massive war to prepare for; a war, greater than the Centauran war, to conquer ALL  OF  FORMA."
 ORI_1944_desc:0 "Having stood idily by while watching Antares consume a continent, the Orion Republic has maintained it's position as the largest economic power in the world, and is ready to defend itself against any Antarean Invasion and is ready and willing to do so."