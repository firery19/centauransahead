 # events 
 TCET1:0 "The South Corvus Question"
 DCET1:0 "The resistance in South Corvus has been causing us issues ever since the occupation in 1886."
 ACET1:0 "Integration is the best way forward."
 BCET1:0 "Continuing the occupation is better."
 cet.4.t:0 "Mirren-Elke Pact"
 cet.4.d:0 "Cetus has reached out to us, seeking a non-aggression pact. Should we accept?"
 cet.4.a:0 "Accept."
 cet.4.b:0 "Refuse."
 cet.5.t:0 "Antares Signs The Pact"
 cet.5.d:0 "After a series of negotiations, the agreement of the non-aggression pact between us and Antares has been accepted."
 cet.5.a:0 "Sweet"
 cet.6.t:0 "Antares Refuses The Pact"
 cet.6.d:0 "After a series of negotiations, the offer of the non-aggression pact has fallen out of favor, leading to Antares refusing it in the end."
 cet.6.a:0 "Oh well."
 cet.7.t:0 "Cetus Demands Subjugation"
 cet.7.d:0 "After taking over Antares, Cetus, which also possesses the worlds strongest Navy, has come knocking on our door. They seek our subjugation and threaten war if we do not give in."
 cet.7.a:0 "We cannot do anything."
 cet.7.b:0 "Let them come."
 cet.8.t:0 "Lacerta Submits"
 cet.8.d:0 "Our ultimatum was accepted by the ambassador of Lacerta this morning. With this, we can turn our eyes elsewhere."
 cet.8.a:0 "Great"
 cet.9.t:0 "Lacerta Refuses"
 cet.9.d:0 "Lacerta stands defiant against an overwhelmingly powerful nation. We could had avoided destruction and casualties in Lacerta."
 cet.9.a:0 "Nothing we can do."
 cet.10.t:0 "Cetus deports Corvuns!"
 cet.10.d:0 "Recently, a huge line has appeared at the Corvun-Cetan border! After we asked the people what they were doing there, they said that Cetus had deported them back here."
 cet.10.a:0 "So these Cetans would go this far..."
