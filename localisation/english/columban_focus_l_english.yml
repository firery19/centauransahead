# spirits
CLB_lots_of_mountains_idea:0 "Disjointed Country"
CLB_lots_of_mountains_idea_desc:0 "The geography of our country is very mountainous, which makes it difficult to build infrastructure and connect our people. This has led to a disjointed country, with many isolated communities and a lack of national unity."

CLB_underfunded_armed_forces_idea:0 "Underfunded Armed Forces"
CLB_underfunded_armed_forces_idea_desc:0 "Our armed forces are underfunded and lack the resources they need to defend our country. This has led to a lack of morale and a decrease in our military capabilities. A bigger investment in the defense sector, will put our little industry in a bit of a pickle."

CLB_looming_miner_strike_idea:0 "Looming miner strike"
CLB_looming_miner_strike_idea_desc:0 "The working conditions of the miners in Columba had been neglected for a long time, this has led the UCMA (United Columban Miner Association) to try to organize a general strike. We have to adress their concerns before the problem escalates."

