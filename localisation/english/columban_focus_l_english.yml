##AGRICULTURE LARP

# focuses
CLB_development_plan:0 "Columban Development Plan"
CLB_development_plan_desc:0 "The development of our nation is a priority. We must focus on improving our infrastructure."

CLB_infraestructure_development_in_the_north:0 "Northern infrastructure"
CLB_infraestructure_development_in_the_north_desc:0 "The northern regions of our country lack basic infrastructure. We must invest in these areas to improve the lives of our citizens, and to strengthen our agricultural and industrial capabilities."

CLB_northen_plains:0 "Develop The Countryside"
CLB_northen_plains_desc:0 "Something something agriculture idk man..."

CLB_expand_farms:0 "Agricultural Subsidies"
CLB_expand_farms_desc:0 "We need to support our farmers and improve agricultural productivity."

CLB_expand_farms_2:0 "Mechanization Of Agriculture"
CLB_expand_farms_2_desc:0 "Introducing modern machinery to our farms will increase efficiency and productivity."

CLB_expand_farms_3:0 "Land Consolidation"
CLB_expand_farms_3_desc:0 "Consolidating small plots of land will allow for more efficient farming and a better use of the new machinery, allowing us to maximize our agricultural output. This will be an unpopular decision, we need to compensate the affected farmers to reduce opposition."

CLB_expand_meat_industry:0 "Expand Meat Industry"
CLB_expand_meat_industry_desc:0 "We need to support our meat industry and improve our livestock production."

CLB_form_agrarian_cooperatives:0 "Form Agrarian Cooperatives"
CLB_form_agrarian_cooperatives_desc:0 "Forming cooperatives will help our farmers pool their resources and improve their bargaining power with buyers."

CLB_clear_new_land:0 "Clear New Land For Agriculture"
CLB_clear_new_land_desc:0 "We need to clear new land for agriculture to increase our food production and support our growing population."

CLB_increment_food_exports:0 "Increment Food Exports"
CLB_increment_food_exports_desc:0 "With our increased agricultural output, we can export more food to other countries, generating revenue and strengthening our economy."

CLB_agricultural_development_in_the_north_1:0 "Ruphis Fertilizer Factory"
CLB_agricultural_development_in_the_north_1_desc:0 "We need to invest in fertilizer production to support our agricultural development in the north. The Ruphis fertilizer factory will provide the necessary resources for our farmers to increase their crop yields and improve food security."

CLB_agricultural_development_in_the_north_2:0 "Expand Berrysburg Nitrate Mine"
CLB_agricultural_development_in_the_north_2_desc:0 "Expanding the Berrysburg nitrate mine will provide the necessary resources for our agricultural development in the north."

CLB_Use_the_nitrate_for_military_use:0 "Use the nitrate for military use"
CLB_Use_the_nitrate_for_military_use_desc:0 "The nitrate produced in the Berrysburg mine can be used for military purposes, such as the production of explosives and ammunition. This will strengthen our armed forces and improve our national defense capabilities."

## MOUNTAIN FOCUSES

##EAST
CLB_eastern_region_infrastructure_effort:0 "Develop Eastern Macer"
CLB_eastern_region_infrastructure_effort_desc:0 "We need to develop the eastern regions of our country to improve infrastructure and support economic growth."

CLB_eastern_region_infrastructure_effort_2:0 "Expand Coal Industry in Euria"
CLB_eastern_region_infrastructure_effort_2_desc:0 "Expanding the coal industry in Euria will help to support our growing industrial sector and provide jobs for our citizens. This will also help to improve our energy security and reduce our dependence on foreign sources of coal."

CLB_eastern_region_infrastructure_effort_3:0 "Support New Coaltowns"
CLB_eastern_region_infrastructure_effort_3_desc:0 "Supporting the development of new coaltowns will help to create jobs and atract workers to the eastern regions of our country. This will also help to improve infrastructure and support economic growth in these areas."

CLB_eastern_region_infrastructure_effort_4:0 "Open A New Steelmill In Euria"
CLB_eastern_region_infrastructure_effort_4_desc:0 "With the expansion of our coal industry, we can support the development of a new steelmill in Euria. This will help to create jobs and stimulate the steel related industries."

##WEST
CLB_western_region_infrastructure_effort:0 "Develop Western Macer"
CLB_western_region_infrastructure_effort_desc:0 "We need to develop the western regions of our country to improve infrastructure and support economic growth."

##SOUTH
CLB_southern_region_infrastructure_effort:0 "Develop Southern Macer"
CLB_southern_region_infrastructure_effort_desc:0 "We need to develop the southern regions of our country to improve infrastructure and support economic growth."

##URBAN FOCUSES

CLB_Phact_tractor_factory:0 "Open The Phact Tractor Factory"
CLB_Phact_tractor_factory_desc:0 "The Phact tractor factory will provide the necessary machinery for our farmers to modernize their operations and increase productivity."

CLB_from_tractor_to_tanks:0 "From Tractors To Tanks"
CLB_from_tractor_to_tanks_desc:0 "The Phact tractor factory can be repurposed to produce tanks for our armed forces, desperate times call for desperate measures, and we need to ensure that our military is well-equipped to defend our nation."

CLB_develop_urban_centers:0 "Develop Urban Centers"
CLB_develop_urban_centers_desc:0 "We need to invest in the development of our urban centers to improve infrastructure, create jobs, and support economic growth."

CLB_modernize_our_industry:0 "Modernize Our Industry"
CLB_modernize_our_industry_desc:0 "We need to modernize our industry to improve efficiency, increase productivity, and to not fall behind our neighbors."

CLB_Urban_planning:0 "Urban Planning"
CLB_Urban_planning_desc:0 "We need to implement urban planning strategies to improve the development of our cities and ensure that they are sustainable and livable for our citizens. This will help our industrialist too..."

CLB_efficient_city_expansion:0 "Efficient City Expansion"
CLB_efficient_city_expansion_desc:0 "We need to expand our cities in an efficient and sustainable manner to accommodate our growing population and support economic growth."

CLB_Separate_housing_and_industry:0 "Separate Housing And Industry"
CLB_Separate_housing_and_industry_desc:0 "We need to separate housing and industry to improve the quality of life for our citizens and reduce pollution in our cities. This will also help to create a more attractive environment for businesses and investors."

CLB_Expand_Mundare_university:0 "Expand Mundare University"
CLB_Expand_Mundare_university_desc:0 "We need to expand Mundare university to provide more opportunities for higher education and research. This will help to develop a skilled workforce and support innovation in our country."

CLB_Open_the_Phact_politechnic:0 "Open The Phact Politechnic"
CLB_Open_the_Phact_politechnic_desc:0 "We need to open the Phact politechnic to provide technical education and training for our citizens. This will help to develop a skilled workforce and support the growth of our industrial sector."

##Political LARP

CLB_Continue_Miron_Blackwell's_socialist_government:0 "Continue Miron Blackwell's Government"
CLB_Continue_Miron_Blackwell's_socialist_government_desc:0 "Miron Blackwell's government has been successful in his two first years in office, it needs to adress the elefant in the room, the looming miner strike, or it may collapse."

CLB_Rally_the_people:0 "Rally The People"
CLB_Rally_the_people_desc:0 "We need to rally the people behind our government to ensure that we have the support we need to implement our policies and address the challenges facing our nation."

CLB_Address_the_parliament:0 "Address The Parliament"
CLB_Address_the_parliament_desc:0 "Miron Blackwell needs to address the parliament to present his government's policies and plans to address the actual crises."

