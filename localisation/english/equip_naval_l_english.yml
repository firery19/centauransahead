 battle_cruiser_1:0 "Battlecruiser I"
 battle_cruiser_2:0 "Battlecruiser II"
 battle_cruiser_3:0 "Battlecruiser III"
 battle_cruiser_4:0 "Battlecruiser IV"
 battle_cruiser_1_desc:0 "The post-war battlecruiser arms race resulted in several heavily armed designs, sacrificing armor for speed compared to battleships."
 battle_cruiser_2_desc:0 "Rebuilt and repurposed battlecruisers continue to outrun even modern battleship designs by lighter protection, but have developed better systems for fire control, detection and aerial defenses."
 battleship_1:0 "Battleship I"
 battleship_2:0 "Battleship II"
 battleship_3:0 "Battleship III"
 battleship_4:0 "Battleship IV"
 battleship_5:0 "Battleship V"
 battleship_6:0 "Battleship VI"
 battleship_1_desc:0 "The Cetan Diphda-Class ship-of-the-line would be the first 'steelpot' type battleship and would revolutionize naval warfare forever with her turreted heavy battery design. These ships are the second generation of steelpot battleships, usually armed with four or more large-caliber guns."
 battleship_2_desc:0 "As technology advanced, battleships were fitted with more guns in more turrets. This lead to the development of the semi-super steelpots, a name given to them retroactively."
 battleship_3_desc:0 "The super-steelpot battleships outclassed every previous design with their larger armament and other advancements, and would be the foundation of all future battleship designs. These ships usually had superfiring turrets and an overally improved turret layout and higher main gun caliber."
 battleship_4_desc:0 "The 20s and 30s saw the development of battleships which would be in service even until the Forman war. These ships, fitted with the largest guns to-date and with all centre-line turret mounts, easily outclassed all previous designs."
 ship_hull_heavy_1_desc:0 "The Cetan Diphda-Class ship-of-the-line would be the first 'steelpot' type battleship and would revolutionize naval warfare forever with her turreted heavy battery design. These ships are the second generation of steelpot battleships, usually armed with four or more large-caliber guns."
 ship_hull_heavy_2_desc:0 "As technology advanced, battleships were fitted with more guns in more turrets. This lead to the development of the semi-super steelpots, a name given to them retroactively."
 ship_hull_heavy_3_desc:0 "With the building of the Mira-Class, the super-steelpot battleships outclassed every previous design with their larger armament and other advancements, and would be the foundation of all future battleship designs. These ships usually had superfiring turrets and an overally improved turret layout and higher main gun caliber."
 ship_hull_heavy_4_desc:0 "The 20s and 30s saw the development of battleships which would be in service even until the Forman war. These ships, fitted with the largest guns to-date and with all centre-line turret mounts, easily outclassed all previous designs."
 ship_hull_heavy_5_desc:0 "With the end of naval action in the Annulus and the build up to the Forman war, navies around the world began building these massive 'fast-battleships', not only more powerfull in terms of armour and armament, but also fitted with new technology like RADAR and advanced fire-controll systems. Ships like the Tau, with her 17-inch guns, and Basilisk, with her three quadruple 16-inch turrets, are exemplary of this."
 ship_hull_heavy_6_desc:0 "The Forman war saw the development of the last battleships, with naval aviation increasingly taking over. These ships, like the Hyperion-, Hermes-, and Vindicta- Classes would be some of the most advanced capital ships ever deployed by their respective navies."
 carrier_1:0 "Carrier I"
 carrier_2:0 "Carrier II"
 carrier_3:0 "Carrier III"
 carrier_4:0 "Carrier IV"
 carrier_5:0 "Carrier V"
 carrier_6:0 "Carrier VI"
 carrier_1_desc:0 "The newest type of ships, they were created from converted capital ships or ocean liners in order to carry aircraft."
 carrier_2_desc:0 "The first purpose-built carriers are being designed to carry more aircraft and launch them more efficiently, with the help of catapults and deck-edge elevators."
 carrier_3_desc:0 "In the lead up to the Forman war, improved construction methods and more specialized systems like deck edge elevators allow these carriers to transport more planes more efficiently."
 carrier_4_desc:0 "The fleet carriers and light carriers of the mid to late Forman War were fitted with advanced technology and capable of launching jet-planes with the help of steam catapults."
 #actually carrier 2, with carrier_2 being carrier_3 and so on
 ship_hull_carrier_1_desc:0 "As work begins on the first keel-up carrier designs, we must ensure that these ships have the range and speed to keep up with the rest of our navy, and the ability to launch larger and more advanced aircraft."
 ship_hull_carrier_2_desc:0 "In the lead up to the Forman war, improved construction methods and more specialized systems like deck edge elevators allow these carriers to transport more planes more efficiently."
 ship_hull_carrier_3_desc:0 "The fleet carriers and light carriers of the mid to late Forman War were fitted with advanced technology and capable of launching jet-planes with the help of steam catapults."
 SH_battleship_1:0 "Dreadnought"
 SH_battleship_2:0 "Improved Dreadnought"
 SH_battleship_1_desc:0 "Dreadnoughts is a unique classification of ship. Much larger and heavier than battleships, dreadnoughts could be deployed to a theater of war as an almost guaranteed way to establish irrefutable dominance in that region due to their potential to decimate surface fleets with their overwhelming firepower."
 SH_battleship_2_desc:0 "With the emergence of jet engines and the new gargantuan Fleet Carriers, they challenged the dominance of Dreadnoughts, no longer invulnerable at sea. The Dreadnoughts were upfitted with a modified arsenal of rocket pods, and advanced radio equipment for quick communication with land forces."
 ship_hull_super_heavy_1_desc:0 " we can focus entirely on creating the heaviest, most well-armed battleships of all time, able to engage multiple lesser vessels."
