 ship_hull_heavy:0 "Capital Ship"
 ship_hull_heavy_desc:0 "The ultimate symbol of naval power, these massive, heavily armored behemoths command respect on the high seas."
 ship_hull_heavy_1:1 "1890 Capital Ship Hull"
 ship_hull_heavy_2:1 "1900 Capital Ship Hull"
 ship_hull_heavy_3:1 "1910 Capital Ship Hull"
