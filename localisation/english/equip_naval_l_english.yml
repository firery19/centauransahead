 destroyer_1:0 "Destroyer I"
 destroyer_2:0 "Destroyer II"
 destroyer_3:0 "Destroyer III"
 destroyer_4:0 "Destroyer IV"
 destroyer_1_desc:0 "The development of torpedoboats means that we need a light ship capable of screening our capital ships from enemy torpedos; a torpedoboat destroyer, if you will. These new generations of destroyers and torpedoboats are more heavily armed and faster than older versions of the pre-Steelpot era."
 destroyer_2_desc:0 "Further development of destroyers have not only increased their size and speed, but also their torpedo armament, ironically making them the very threat they were intended to counter."
 destroyer_3_desc:0 "The Grease War and South Corvus War has shown how light ships have taken their role in modern naval warfare, and the importance of developing them further."
 destroyer_4_desc:0 "Longer torpedo range and faster reload speeds, along with new types of armaments such as anti-air guns, will allow our destroyers to remain efficient and versatile."
 ship_hull_light_1_desc:0 "The development of torpedoboats means that we need a light ship capable of screening our capital ships from enemy torpedos; a torpedoboat destroyer, if you will. These new generations of destroyers and torpedoboats are more heavily armed and faster than older versions of the pre-Steelpot era."
