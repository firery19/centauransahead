# --- LEADERS ---
 GRS_fernan_flamenco:0 "Fernan Flamenco"
 GRS_fernan_flamenco_ill:0 "Fernan Flamenco"
 GRS_valentine_flamenco:0 "Valentine Flamenco"
 GRS_emperor_valentine:0 "Emperor Valentine I"
 GRS_xavier_navarro:0 "Xavier Navarro"
 
# -- political advisors -- 
 GRS_prince_valentine:0 "Prince Valentine"
 GRS_prince_valentine_desc:0 "The Crown Prince of the Kingdom, Valentine Flamenco. He is the next in line to assume the crown upon the death or abdication of his father, Fernan Flamenco." 
 
# --- IDEAS ---
 GRS_desert_warriors_idea:0 "Desert Warriors"
 GRS_desert_warriors_idea_desc:0 "Grusa is the only nation on Centaura with the vast Arida Desert covering the majority of their lands. The Grusan people have learned to overcome the harsh challenges of the desert climate."
 
 GRS_masters_of_the_arida_idea:0 "Masters of the Arida"
 GRS_masters_of_the_arida_idea_desc:0 "To outsiders the Arida is an unforgiving, hostile wasteland. To us it is our home. Our soldiers have learned to live, move, and fight within it, turning the desert into a decisive advantage against any who dare cross it."
 
 GRS_devastation_at_cabo_vesca_idea:0 "Devastation at Cabo Vesca"
 GRS_devastation_at_cabo_vesca_idea_desc:0 "The naval engagement at Cabo Vesca, 1868, left the Grusan fleet crippled and subsequently led to Grusa losing the Strait War. The navy's confidence never truly recovered, despite being formidable on paper, the navy's will to fight remains uncertain."
 
 GRS_imprisoned_council_idea:0 "Imprisoned King's Council"
 GRS_imprisoned_council_idea_desc:0 "The King's Council are a group of the most trusted and loyal advisors to the King. They assist in making decisions for the King, or carrying out orders on his behalf. Those who are not in active service have been imprisoned indefinetely, deemed 'ineffective and traitorous'."
  
 GRS_emptiness_of_the_interior:0 "Emptiness of the Interior"
 GRS_emptiness_of_the_interior_desc:0 "The vast Arida consumes the Grusan heartland. Grusa has few places to farm, fewer places to build, and the fishing industry must work overtime to break even."

 GRS_devastation_at_cabo_vesca: "Devastation at Cabo Vesca"
 GRS_devastation_at_cabo_vesca_desc: "The naval engagement at Cabo Vesca, 1868, left the Grusan fleet crippled and subsequently led to us losing the Strait War. The King’s Grand Armada, despite being strong, has begun to fall behind; the defeat at Cabo Vesca still stings deep in the minds of Grusans."

 GRS_the_flamenco_dynasty_idea: "The Flamenco Dynasty"
 GRS_the_flamenco_dynasty_idea_desc: "The Flamenco’s have ruled Grusa for centuries. They hold uncontentested power over Grusa."
 
 GRS_reforming_navy_0:0 "Pathetic Naval Reforms"
 GRS_reforming_navy_0_desc:0 "The humiliation at Cabo Vesca shattered confidence in the Grusan Navy. Decades of poor management and outdated doctrine have left the fleet a shadow of its former self."

 GRS_reforming_navy_1:0 "Reforming Navy"
 GRS_reforming_navy_1_desc:0 "Attempts at reform have begun, but the navy remains plagued by incompetence and outdated practices."

 GRS_reforming_navy_2:0 "Recovering Navy"
 GRS_reforming_navy_2_desc:0 "The first reforms have shown promise. Supply chains and officer standards are slowly improving."

 GRS_reforming_navy_3:0 "Reorganized Navy"
 GRS_reforming_navy_3_desc:0 "The navy has begun adopting modern doctrines and command structures, greatly improving coordination."

 GRS_reforming_navy_4:0 "Modernizing Armada"
 GRS_reforming_navy_4_desc:0 "Grusa's dockyards and naval academies are once again producing capable ships and officers."

 GRS_reforming_navy_5:0 "Resurgent Grand Armada"
 GRS_reforming_navy_5_desc:0 "The Grand Armada has largely recovered from its historic humiliation and now stands among the strongest fleets in the region."

 GRS_new_grand_armada:0 "The New Grand Armada"
 GRS_new_grand_armada_desc: "We no longer bear the shame of the humiliation of our defeat at Cabo Vesca. That chapter has been closed. We have moved on, adapted, and modernised where we had faltered. From the lessons of defeat, a stronger navy has been forged, disciplined, resolute, and unyielding. The Grusan flag flies high upon the seas once more, carried by ships worthy of our name. Our naval pride, once thought lost, has returned renewed, and with it, the will to command the waters as we did before."

 GRS_new_grand_armada2:0 "The New Grand Armada"
 GRS_new_grand_armada2_desc: "We no longer bear the shame of the humiliation of our defeat at Cabo Vesca. That chapter has been closed. We have moved on, adapted, and modernised where we had faltered. From the lessons of defeat, a stronger navy has been forged, disciplined, resolute, and unyielding. The Grusan flag flies high upon the seas once more, carried by ships worthy of our name. Our naval pride, once thought lost, has returned renewed, and with it, the will to command the waters as we did before."

 GRS_new_grand_armada3:0 "The New Grand Armada"
 GRS_new_grand_armada3_desc: "We no longer bear the shame of the humiliation of our defeat at Cabo Vesca. That chapter has been closed. We have moved on, adapted, and modernised where we had faltered. From the lessons of defeat, a stronger navy has been forged, disciplined, resolute, and unyielding. The Grusan flag flies high upon the seas once more, carried by ships worthy of our name. Our naval pride, once thought lost, has returned renewed, and with it, the will to command the waters as we did before."

 GRS_new_grand_armada4:0 "The New Grand Armada"
 GRS_new_grand_armada4_desc: "We no longer bear the shame of the humiliation of our defeat at Cabo Vesca. That chapter has been closed. We have moved on, adapted, and modernised where we had faltered. From the lessons of defeat, a stronger navy has been forged, disciplined, resolute, and unyielding. The Grusan flag flies high upon the seas once more, carried by ships worthy of our name. Our naval pride, once thought lost, has returned renewed, and with it, the will to command the waters as we did before."

 GRS_new_grand_armada5:0 "Grusan Naval Hegemony"
 GRS_new_grand_armada5_desc:0 "The humiliation of Cabo Vesca no longer defines us. What was once a symbol of national shame has become the foundation of our resurgence. Through reforms, innovation and unwavering determination and strength, the King's Grand Amarda has been transformed into a force stronger than ever before. The Grusan flag once again commands respect across the seas, and our rivals know that the age of Grusan naval supremacy has returned."

 GRS_expanded_naval_academy:0 "Expanded Naval Academy"
 GRS_expanded_naval_academy_desc:0 "The expansion of the Royal Naval Academy has allowed us to train a greater number of officers while raising educational standards throughout the fleet. Future admirals will enter service with a deeper understanding of modern naval warfare, ensuring the Armada remains prepared for the challenges of the new century."
 
 GRS_avenging_cabo_vesca: "Avenging Cabo Vesca"
 GRS_avenging_cabo_vesca_desc: "Centauri will finally learn what defeat truly is. On that fateful day, our brave sailors were cut down by their cannons, their sacrifice left unanswered for far too long. But that time has passed. Today, our vengeance will be enacted. We will not falter, nor will we forget. The Centaurians will be crushed, their strength broken, and what is rightfully ours will be reclaimed. For every life lost, for every name remembered, we will answer with fury."
 
 
 GRS_the_centimado_idea:0 "The Centimado"
 GRS_the_centimado_idea_desc:0 "The Centimado are responsible for guarding city gates, government buildings and state officials. They are highly trained and disciplined, and will always defend their post."
 
 GRS_expanded_centimado_idea:0 "Expanded Centimado"
 GRS_expanded_centimado_idea_desc:0 "The Centimado are responsible for guarding city gates, government buildings and state officials. They are highly trained and disciplined, and will always defend their post."
   
 GRS_desert_aviators:0 "Desert Aviators"
 GRS_desert_aviators_desc:0 "Flying over the Arida desert demands discipline, endurance and skill. Grusan pilots are trained to navigate through sandstorms, extreme temperatures and vast stretches of barren terrain."
 
 GRS_desert_aviators_upgrade:0 "Desert Aces"
 GRS_desert_aviators_upgrade_desc:0 "The harsh skies of Arida has brought forward an elite group of pilots whose skill is unmatched throughout the region."

 GRS_flying_artillery_idea:0 "Air-to-Ground Support"
 GRS_flying_artillery_idea_desc:0 "Aircraft will be used to support ground troops, delivering firepower from above, striking with guns, bombs and any other means at our disposal."
 
 GRS_royal_fighter_squadron_idea: "Royal Fighter Squadron"
 GRS_royal_fighter_squadron_idea_desc: "We will prioritise the formation of a Royal Fighter Squadron, ensuring control of our skies through speed, discipline and superior pilots."
 
 GRS_mobile_recon_corps: "Mobile Recon Corps"
 GRS_mobile_recon_corps_desc: "Highly mobile reconnaissance units allow our forces to move swiftly across harsh terrain and react faster than the enemy."
 
 GRS_desert_artillery_corps: "Desert Artillery Corps"
 GRS_desert_artillery_corps_desc: "Our artillery units have been trained to operate effectively in the harsh desert environment, delivering devastating firepower when it matters most."
 
 GRS_engineer_corps: "Grusan Engineers"
 GRS_engineer_corps_desc: "Engineers are vital to keep supply chains running, creating defensive fortifications and so much more, they are key to survival in warfare."
 
 GRS_desert_warfare: "Desert Warfare"
 GRS_desert_warfare_desc: "The Arida is our desert, we know how the sand shifts, dunes rise and fall. We will make our enemies struggle, our strength."
 
 GRS_desert_warfare_a: "Desert Warfare"
 GRS_desert_warfare_a_desc: "The Arida is our desert, we know how the sand shifts, dunes rise and fall. We will make our enemies struggle, our strength."

 GRS_desert_warfare_b: "Desert Warfare"
 GRS_desert_warfare_b_desc: "The Arida is our desert, we know how the sand shifts, dunes rise and fall. We will make our enemies struggle, our strength."
 
 GRS_canned_rations: "Canned Rations"
 GRS_canned_rations_desc: "Canned foods can stay edible for far longer than other food. Supplying our army with them can keep them in the action for longer."
 
 GRS_competent_merchants: "Competent Merchants"
 GRS_competent_merchants_desc: "Our merchants are vital to keep trade flowing, investing in merchants ships can bring in even more trade."
 
 GRS_coastal_construction: "Coastal Construction"
 GRS_coastal_construction_desc: "We must construct new dockyards to keep our fishing industry alive, and also give us space to produce more ships for our navy."
 
 GRS_foreign_goods: "Foreign goods"
 GRS_foreign_goods_desc: "Whilst we must wait for our economy to catch up, importing foreign goods can help mitigate some of the issues we face."

 GRS_centauri_dominance:0 "Centaurian Dominance of the Strait"
 GRS_centauri_dominance_desc:0 "Centauri has established overwhelming influence over the Sagittarius Strait. Merchant captains increasingly defer to Centaurian authority, whilst Grusan patrols struggle to maintain their authority in the strait."

 GRS_centauri_advantage:0 "Centaurian Advantage"
 GRS_centauri_advantage_desc:0 "Centauri maintains a growing advantage within the Sagittarius Strait. Grusan toll collectors face resistance from merchants and regional powers increasingly look toward Centauri as the dominant guarantor of maritime security within the Sagittarius."

 GRS_contested_strait:0 "Contested Strait"
 GRS_contested_strait_desc:0 "Neither Grusa or Centauri possesses complete control over the Sagittarius Strait."

 GRS_grusan_advantage:0 "Grusan Advantage"
 GRS_grusan_advantage_desc:0 "Grusan patrols maintain a respected and effective presence throughout the Sagittarius Strait. Merchant vessels largely comply with toll regulations, strengthening our influence over regional maritime affairs."

 GRS_grusan_strait_dominance:0 "Grusan Dominance of the Strait"
 GRS_grusan_strait_dominance_desc:0 "Grusa stands as the unquestioned master of the Sagittarius Strait. Our tolling fleets dominate regional waters, foreign merchants bow to our authority, and Centaurian influence has been severely weakened."
 
 GRS_low_tolls:0 "Low Strait Tolls"
 GRS_low_tolls_desc:0 "Toll rates across the Sagittarius Strait remain relatively modest. Merchants pass through with little resistance and foreign powers have few reasons to object enforcement."

 GRS_moderate_tolls:0 "Moderate Strait Tolls"
 GRS_moderate_tolls_desc:0 "We have established a balanced tolling policy throughout the Sagittarius Strait. Trade revenues remain healthy whilst foreign merchants and neighbouring powers largely tolerate our presence in the region."
 
 GRS_high_tolls:0 "High Strait Tolls"
 GRS_high_tolls_desc:0 "Toll rates have risen considerably across the Sagittarius. Merchants and foreign governments are becoming increasingly frustrated by our growing demands."
 
 GRS_extortionate_tolls:0 "Extortionate Strait Tolls"
 GRS_extortionate_tolls_desc:0 "The Sagittarius Strait has become a source of immense wealth for Grusa. Merchant captains are subjected to crushing tolls, inspections and arbitrary fees, whilst inflaming regional resentment towards Grusan tolls."
 
 GRS_widespread_riots:0 "Widespread Riots"
 GRS_widespread_riots_desc:0 "Civil unrest has spilled into the streets. Protests, strikes and clashes with the Centimado have brought cities to a standstill, severely disrupting daily governance and industrial production."
 
 GRS_plains1:0 "Línea del Escorpión"
 GRS_plains1_desc:0 "The open plains offer little natural protection, forcing our soldiers to create their own. Defensive earthworks, fortified positions and carefully coordinated fields of fire will blunt any Antarean advance."

 GRS_plains2:0 "Baluartes del Escorpión"
 GRS_plains2_desc:0 "Every hill and ridgeline has become a fortress. Strongpoints now support one another, forcing any enemy breakthrough to come at an unacceptable cost."

 GRS_plains3:0 "Muralla del Escorpión"
 GRS_plains3_desc:0 "Our defensive belt has become a living fortress. Every trench, bunker and gun emplacement is integrated into a single defensive network capable of exhausting even the mightiest offensive."
 
 GRS_desert1:0 "Hijos de la Arida"
 GRS_desert1_desc:0 "Our soldiers have learned to endure the unforgiving Arida desert where others cannot. Heat, thirst and endless sands are no longer obstacles but serve alongside the Grusan Army."

 GRS_desert2:0 "Sombras del Desierto"
 GRS_desert2_desc:0 "Small Grusan detachments roam the Arida unseen, striking isolated supply columns before vanishing back into the dunes."

 GRS_desert3:0 "El Desierto Devora"
 GRS_desert3_desc:0 "The desert has become our greatest weapon. Enemy supplies disappear, railways are sabotaged and entire divisions find themselves defeated long before reaching the battlefield."
 
 GRS_coast1:0 "Guardianes del Litoral"
 GRS_coast1_desc:0 "Observation posts now watch every stretch of coastline. Enemy fleets can no longer approach unnoticed."

 GRS_coast2:0 "Murallas del Mar"
 GRS_coast2_desc:0 "Heavy guns, reinforced bunkers and entrenched defenders transform every harbour into a fortress."

 GRS_coast3:0 "Costa Inquebrantable"
 GRS_coast3_desc:0 "The coastline has become an impenetrable wall of steel and concrete. Any landing force will be met with overwhelming resistance before it ever breaches inland."
 
 GRS_grusa_endures:0 "El Aguijón del Escorpión"
 GRS_grusa_endures_desc:0 "The Grusan Army has every aspect of defense mastered. Grusa is the nation ready to make Antares bleed for every mile of ground they conquer."
 
 GRS_imported_goods1:0 "Imported Goods"
 GRS_imported_goods1_desc:0 "We have imported goods from another nation. While these imports keep us afloat, they come at a considerable economic cost."
 
 GRS_imported_goods2:0 "Imported Goods"
 GRS_imported_goods2_desc:0 "We have imported goods from another nation. While these imports keep us afloat, they come at a considerable economic cost."

 GRS_imported_goods3:0 "Imported Goods"
 GRS_imported_goods3_desc:0 "We have imported goods from another nation. While these imports keep us afloat, they come at a considerable economic cost."

 GRS_imported_goods4:0 "Imported Goods"
 GRS_imported_goods4_desc:0 "We have imported goods from another nation. While these imports keep us afloat, they come at a considerable economic cost."

 GRS_imported_goods5:0 "Imported Goods"
 GRS_imported_goods5_desc:0 "We have imported goods from another nation. While these imports keep us afloat, they come at a considerable economic cost."
 
 GRS_pay_factory:0 "Resource concessions"
 GRS_pay_factory_desc:0 "We have agreed to sell off some of our natural resources in exchange for military equipment from Orion and Tucana."
 
 GRS_fort_construction:0 "Fortification Construction"
 GRS_fort_construction_desc:0 "As tensions rise across Centaura, engineers, labourers and soldiers have been mobilised to help strengthen Grusa's defensive network."
 
 GRS_joint_commission:0 "Joint Military Commission"
 GRS_joint_commission_desc:0 "Close cooperation between Grusan and Antarean officers has improved battlefield planning, organisation and operational coordination."

 GRS_officer_reforms:0 "Officer Corps Reforms"
 GRS_officer_reforms_desc:0 "The officers of the Grusan Army has been rebuilt according to modern Antarean principles, creating a more capable and professional officer corps."

 GRS_integrated_tactics:0 "Integrated Antarean Tactics"
 GRS_integrated_tactics_desc:0 "Adopting Antarean doctrine, training and combat experience has transformed the Grusan Army into a disciplined and highly coordinated fighting force."
 
 GRS_antares_overlord:0 "Skorpii Grusii"
 GRS_antares_overlord_desc:0 "Our alignment with Antares guarantees our survival, even if it demands the surrender of our autonomy."  
 
 GRS_canned_rations:0 "Canned Rations"
 GRS_canned_rations_desc:0 "Modern food preservation allows Grusan produce to be stored for long periods and provide reliable supplies for both civilians and the armed forces."

 GRS_expanded_trade_routes:0 "Expanded Trade Routes"
 GRS_expanded_trade_routes_desc:0 "Our merchants now sail further than ever before, establishing profitable trade connections with foreign markets and bringing greater wealth home."
 
 GRS_blockade_minor:0 "Minor Blockade"
 GRS_blockade_minor_desc:0 "The Antarean Navy has established a limited blockade around Grusa. While most shipping continues to reach our ports, some merchant convoys are being intercepted, causing minor disruptions to trade."
 
 GRS_blockade_limited:0 "Limited Blockade"
 GRS_blockade_limited_desc:0 "The Antarean blockade is tightening. Merchant vessels are finding it increasingly difficult to evade Antarean ships, reducing imports and slowing the flow of overseas commerce."
 
 GRS_blockade_strong:0 "Strong Blockade"
 GRS_blockade_strong_desc:0 "The blockade is firmly established. Essential imports are becoming scarce, exports are piling up in our ports and the strain on the economy is beginning to show."
 
 GRS_blockade_severe:0 "Severe Blockade"
 GRS_blockade_severe_desc:0 "The Antarean Navy dominates the surrounding seas. Most merchant traffic has been halted, shortages are becoming widespread and the economy is under considerable pressure." 
 
 GRS_blockade_crippling:0 "Crippling Blockade"
 GRS_blockade_crippling_desc:0 "The blockade has become almost total. Grusa has been effectively cut off from international trade, vital supplies are running dangerously low and the nation's economy is failing to keep up with wartime demands."
 
 GRS_emergency_shipbuilding_idea:0 "Emergency Shipbuilding Program"
 GRS_emergency_shipbuilding_idea_desc:0 "With the blockade threatening our trade with the rest of Forma, we have been forced to rapidly expand our naval capacity and prioritise dockyard construction above all else."
 
 GRS_rations_idea1:0 "Nationwide Rationing"
 GRS_rations_idea1_desc:0 "To reduce the effects of the blockade, the production and consumption of civilian goods will be strictly regulated. Every citizen must make do with less so our soldiers have more."
 
 GRS_rations_idea2:0 "Nationwide Rationing"
 GRS_rations_idea2_desc:0 "To reduce the effects of the blockade, the production and consumption of civilian goods will be strictly regulated. Every citizen must make do with less so our soldiers have more."
 
 GRS_canned_rations:0 "Canned Rations"
 GRS_canned_rations_desc:0 "Modern food preservation allows Grusan produce to be stored for long periods and provide reliable supplies for both civilians and the armed forces."

 GRS_expanded_trade_routes:0 "Expanded Trade Routes"
 GRS_expanded_trade_routes_desc:0 "Our merchants now sail further than ever before, establishing profitable trade connections with foreign markets and bringing greater wealth home."
 
 GRS_unfit_monarch_idea:0 "Unfit Monarch"
 GRS_unfit_monarch_idea_desc:0 "King Fernan's declining health has made it increasingly difficult for him to continue fulfilling his duties. Government affairs are beginning to slow down and Fernan's advisors are becoming responsible for administrating the Kingdom."
 
 GRS_unfit_monarch_idea2:0 "Unfit Monarch"
 GRS_unfit_monarch_idea2_desc:0 "King Fernan's declining health has made it increasingly difficult for him to continue fulfilling his duties. Government affairs are beginning to slow down and Fernan's advisors are becoming responsible for administrating the Kingdom."
 
 GRS_unfit_monarch_idea3:0 "Unfit Monarch"
 GRS_unfit_monarch_idea3_desc:0 "King Fernan's declining health has made it increasingly difficult for him to continue fulfilling his duties. Government affairs are beginning to slow down and Fernan's advisors are becoming responsible for administrating the Kingdom."
 
 GRS_unfit_monarch_idea4:0 "Unfit Monarch"
 GRS_unfit_monarch_idea4_desc:0 "King Fernan's declining health has made it increasingly difficult for him to continue fulfilling his duties. Government affairs are beginning to slow down and Fernan's advisors are becoming responsible for administrating the Kingdom."
 
 GRS_national_mourning:0 "National Mourning"
 GRS_national_mourning_desc:0 "The death of King Fernan has brought sadness throughout the kingdom."



