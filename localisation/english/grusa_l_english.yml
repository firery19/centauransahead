 GRS_vega_influence:0 "Grusan Influence over Vega"
 GRS_pressure_vega:0 "Promote Change in Vega"
 GRS_diplomatic_mission:0 "Send Diplomatic Mission"
 GRS_economic_investment:0 "Invest in Vega"
 GRS_military_advisors:0 "Send Military Advisors"
 GRS_support_of_unification:0 "Grusan influence in Vega"
 GRS_support_of_unification_desc:0 "Grusa and Vega have been rivals ever since the former broke away from the Grusan empire; And yet the people of each nation are so alike. Under old leadership unification would never happen, but under Xavier's guidance, we may now undertake efforts to persuade the Vegan people and her majesty, Alina Verde, that we should put aside our differences once and for all and unite again as one. That is if the Vegans allow unification to happen.\n\n§YCurrent Influence in Vega:§! [?GRS_influence_VEG]"
 GRS_secret_propaganda_missions:0 "Secret propaganda missions"
 GRS_continued_outreach:0 "Continued diplomatic outreach"
 GRS_economic_cooperation:0 "Trade goods"
 GRS_cultural_exchange:0 "Cultural exchange"
 GRS_demand_referendum:0 "Demand a referendum"
 
 
 
 GRS_sagittarius_category:0 "Influence over the Sagittarius Strait"
 GRS_sagittarius_category_desc:0 "The Sagittarius Strait remains fiercely contested between Grusa and Centauri. If we are to continue tolling merchant vessels we must proceed carefully; excessive tolls or the seizure of foreign cargo will anger the powers that rely upon the strait, whilst scaling back tolling will slowly allow Centauri to strengthen its influence over the region. These competing pressures must be carefully managed if we seek to maintain our dominance over the Sagittarius.\n\nCurrent Toll Policy: [GRS_toll_level_text]\nCurrent Strait Control: [GRS_control_level_text]"
 
 
 GRS_inspect_foreign_merchants:0 "Inspect Foreign Merchants"
 GRS_inspect_foreign_merchants_desc:0 "Merchant traffic through the strait shall be subjected to inspections and searches by Grusan sailors."
 GRS_escort_friendly_convoys:0 "Escort Friendly Convoys"
 GRS_escort_friendly_convoys_desc:0 "Escorting friendly merchant vessels will improve trade confidence and reinforce our influence over the Sagittarius Strait."
 GRS_naval_crackdown:0 "Naval Crackdown"
 GRS_naval_crackdown_desc:0 "A temporary surge in naval enforcement will restore order and authority throughout the Sagittarius Strait."
 GRS_suspend_toll_collections:0 "Suspend Toll Collections"
 GRS_suspend_toll_collections_desc:0 "An emergency rollback of toll collection policies may calm tensions and restore confidence in Grusan authority."

 GRS_toll_level_text_low:0 "§7Low§!"
 GRS_toll_level_text_moderate:0 "§YModerate§!"
 GRS_toll_level_text_high:0 "§OHigh§!"
 GRS_toll_level_text_extortionate:0 "§RExtortionate§!"

 GRS_control_centauri_dominant:0 "§RCentaurian Dominance§!"
 GRS_control_centauri_favoured:0 "§OCentaurian Favoured§!"
 GRS_control_contested:0 "§YContested§!"
 GRS_control_grusan_favoured:0 "§7Grusan Favoured§!"
 GRS_control_grusan_dominant:0 "§GGrusan Dominance§!"
 
 GRS_raise_tolls:0 "Raise Strait Tolls"
 GRS_raise_tolls_desc:0 "Increasing toll rates will greatly improve state revenues, though excessive taxation risks alienating merchants and foreign powers."
 GRS_reduce_tolls:0 "Reduce Strait Tolls"
 GRS_reduce_tolls_desc:0 "Reducing tolls will ease tensions and improve commercial relations throughout the Sagittarius Strait."
 GRS_expand_patrols:0 "Expand Strait Patrols"
 GRS_expand_patrols_desc:0 "Additional naval patrols will reinforce Grusan authority throughout the Sagittarius Strait."
 GRS_reduce_patrols:0 "Reduce Patrol Presence"
 GRS_reduce_patrols_desc:0 "Scaling back patrol operations will reduce strain on the navy, though it risks weakening our control over the strait."
 
 GRS_naval_reforms:0 "Naval Reforms"
 GRS_naval_reforms_desc:0 "Cabo Vesca, 1868, The Strait War. The King's Grand Armada was destroyed in a single catastrophic blow. Yet the disaster has no need to define us forever. Through extensive reforms, modern doctrine, and renewed investment, we may once again forge a fleet worthy of ruling the seas.\n\nThe current state of the Naval Reform: [GRS_naval_reform]"
 GRS_officer_training_programs:0 "Officer Training Programs"
 GRS_officer_training_programs_desc:0 "A modern navy requires competent officers capable of adapting to new forms of warfare."
 GRS_modernize_naval_logistics:0 "Modernize Naval Logistics"
 GRS_modernize_naval_logistics_desc:0 "Efficient supply chains and coordinated dockyard operations are essential for sustaining the fleet."
 GRS_update_fleet_coordination:0 "Update Fleet Coordination"
 GRS_update_fleet_coordination_desc:0 "Improved communications and command structures will allow the fleet to operate more effectively."
 GRS_establish_naval_war_college:0 "Establish Naval War College"
 GRS_establish_naval_war_college_desc:0 "A dedicated naval academy will prepare a new generation of officers and strategists."
 GRS_expand_coastal_shipyards:0 "Expand Coastal Shipyards"
 GRS_expand_coastal_shipyards_desc:0 "Additional dockyard facilities will accelerate repairs and ship construction."
 GRS_rebuild_the_grand_armada:0 "Rebuild the Grand Armada"
 GRS_rebuild_the_grand_armada_desc:0 "The humiliation of Cabo Vesca will finally be overcome as Grusa restores its naval prestige."
 GRS_expand_naval_academies:0 "Expand Naval Academies"
 GRS_expand_naval_academies_desc:0 "Expanding naval education will ensure a steady flow of trained personnel for the fleet."
 GRS_recommission_old_vessels:0 "Recommission Old Vessels"
 GRS_recommission_old_vessels_desc:0 "Several aging warships can still serve if properly repaired and modernized."
 GRS_standardize_naval_doctrine:0 "Standardize Naval Doctrine"
 GRS_standardize_naval_doctrine_desc:0 "A unified doctrine will improve coordination between squadrons and commanders."
 GRS_expand_drydock_capacity:0 "Expand Drydock Capacity"
 GRS_expand_drydock_capacity_desc:0 "Larger and more capable drydocks will support the maintenance of modern warships."
 GRS_integrate_coastal_defenses:0 "Integrate Coastal Defenses"
 GRS_integrate_coastal_defenses_desc:0 "Coastal fortifications and naval patrols must work together to secure our shores."
 GRS_naval_industrial_expansion:0 "Naval Industrial Expansion"
 GRS_naval_industrial_expansion_desc:0 "Expanding naval industry will allow Grusa to compete with the great maritime powers." 
 GRS_naval_reform_state_0:0 "§tPathetic§!"
 GRS_naval_reform_state_1:0 "§RLackluster§!"
 GRS_naval_reform_state_2:0 "§ORecovering§!"
 GRS_naval_reform_state_3:0 "§YCompetent§!"
 GRS_naval_reform_state_4:0 "§7Modernizing§!"
 GRS_naval_reform_state_5:0 "§GResurgent§!"
 GRS_naval_reform_state_6:0 "§CGrand Armada Restored§!"
 
 GRS_under_blockade:0 "Under Antarean Blockade"
 GRS_under_blockade_desc:0 "The Antares Imperial Navy has established a blockade around Grusa, severely disrupting maritime trade and commercial shipping. Until the blockade can be broken or circumvented, our economy will continue to suffer from shortages and declining overseas commerce.\n\n§HBlockade Strength§!: [GRS_blockade_level_text]\n§HBreakout Likelihood§!: [GRS_breakout_level_text]" 
 GRS_establish_smuggling_routes:0 "Establish Smuggling Routes"
 GRS_establish_smuggling_routes_desc:0 "Organise secret merchant routes to bypass the Antarean blockade."
 GRS_ration_essential_goods:0 "Ration Essential Goods"
 GRS_ration_essential_goods_desc:0 "Reduce civilian consumption to preserve vital supplies for the war effort."
 GRS_escort_merchant_convoys:0 "Escort Merchant Convoys"
 GRS_escort_merchant_convoys_desc:0 "Assign naval escorts to protect our merchant ships from enemy raiders."
 GRS_hunt_enemy_raiders:0 "Hunt Enemy Raiders"
 GRS_hunt_enemy_raiders_desc:0 "Deploy our fleet to seek out and attempt destroy Antarean ships enforcing the blockade."
 GRS_build_emergency_dockyards:0 "Build Emergency Dockyards"
 GRS_build_emergency_dockyards_desc:0 "Construct dockyard facilities to accelerate naval production."
 GRS_encourage_domestic_production:0 "Encourage Domestic Production"
 GRS_encourage_domestic_production_desc:0 "Expand domestic industry to lessen our dependence on overseas imports."
 GRS_emergency_port_expansion:0 "Emergency Port Expansion"
 GRS_emergency_port_expansion_desc:0 "Expand and improve our ports to increase the flow of supplies into the country."
 GRS_break_the_blockade_operation:0 "Break the Blockade"
 GRS_break_the_blockade_operation_desc:0 "Launch a major naval operation to break the Antarean blockade once and for all. Success depends on our preparations."
 GRS_blockade_level_minor:0 "§GMinor§!"
 GRS_blockade_level_limited:0 "§7Limited§!"
 GRS_blockade_level_effective:0 "§YStrong§!"
 GRS_blockade_level_severe:0 "§OSevere§!"
 GRS_blockade_level_critical:0 "§RCrippling§!"
 
 GRS_breakout_level_unprepared:0 "§RHighly Unlikely§!"
 GRS_breakout_level_planning:0 "§OUnlikely§!"
 GRS_breakout_level_readying:0 "§YPossible§!"
 GRS_breakout_level_prepared:0 "§7Likely§!"
 GRS_breakout_level_ready:0 "§GHighly Likely§!"
   # 
 # ----- focuses ------
 GRS_accept_the_loss_at_cabo_vesca:0 "Accept the Loss at Cabo Vesca"
 GRS_accept_the_loss_at_cabo_vesca_desc:0 "The disaster at Cabo Vesca remains one of the greatest humiliations in our naval history. It was a decisive defeat that ensured our loss in the Strait War. Rather than dwell upon old memories or fantasise about what might have been, we must learn from our mistakes and rebuild our navy into what it once was: mighty and formidable" 
 GRS_learn_from_errors:0 "Learn from the mistakes"
 GRS_learn_from_errors_desc:0 "We will analyse accounts from the battle, point our fingers at what went wrong, and make adjustments so it never happens again."
 GRS_begin_the_reforms:0 "Begin the reforms"
 GRS_begin_the_reforms_desc:0 "We will start to reform our navy, though it will take time."
 GRS_naval_reform_program:0 "Naval Dockyard Program"
 GRS_naval_reform_program_desc:0 "We will initiate the Naval Dockyard Program, it will allow us to build more dockyards within due time."
 GRS_expand_leopolis_dockyards:0 "Expand Leopolis Dockyards"
 GRS_expand_leopolis_dockyards_desc:0 "Leopolis is the beating heart of Grusa, expanding the docks will allow us to build more ships."
 GRS_develop_northern_ports:0 "Develop Northern ports" 
 GRS_develop_northern_ports_desc:0 "Developing our nothern ports will allow us to have a stronger presence on the Sagittarius Strait."
 GRS_libran_dockyards:0 "Libran Ocean dockyards"
 GRS_libran_dockyards_desc:0 "The Libran ocean is vast, if we are to have any impact on the ocean, we will build more dockyards on our Eastern coast."
 GRS_royal_screens:0 "Destroyer Effort"
 GRS_royal_screens_desc:0 "We will put more effort into building smaller screen ships."
 GRS_knights_of_the_libran_ocean:0 "Knights of the Libran Ocean"
 GRS_knights_of_the_libran_ocean_desc:0 "We will put more effort into building Cruisers."
 GRS_restore_the_armada:0 "Restore the Armada"
 GRS_restore_the_armada_desc:0 "We will prioritse battleships over all other vessels."
 GRS_new_grand_armada:0 "The New Grand Amarda"
 GRS_new_grand_armada_desc:0 "We have adapted and moved on from Cabo Vesca. Those lost will never be forgotton but their sacrifice has strengthed our navy to be formidable once again"
 GRS_rapida_class_destroyer:0 "Rapida Class Destroyer"
 GRS_rapida_class_destroyer_desc:0 "Quick, agile and nimble. The Rapida Class destroyers are a more advanced and up-to-date destroyer."
 GRS_arida_class_cruiser:0 "Arida Class Cruiser"
 GRS_arida_class_cruiser_desc:0 "Named after our formidable desert, the Arida Class cruiser is a more advanced and up-to-date cruiser."
 GRS_valentine_class_battleship:0 "Valentine Class Battleship"
 GRS_valentine_class_battleship_desc:0 "Named after Valentine Flamenco, the Valentine Class battleship is a more advanced and lethal Steelpot battleship."
 GRS_new_ship_of_the_line:0 "New Ship of the Line"
 GRS_new_ship_of_the_line_desc:0 "The time has come to develop a new capital ship for the navy. While its final specifications have yet to be decided, one thing is certain. It must surpass even the mighty Super-Steelpots in size, firepower and armour."
 GRS_armour_and_guns:0 "Armour and Guns"
 GRS_armour_and_guns_desc:0 "Before a new warship can be designed, extensive research must be conducted into more modern naval armour and heavier guns."
 GRS_leopolis_class_dreadnought:0 "Leopolis Class Dreadnought"
 GRS_leopolis_class_dreadnought_desc:0 "The Leopolis class will become the pride of the King's Grand Armada. Enormous, heavily armed and exceptionally costly, these dreadnoughts will dominate the seas and destroy any vessel unfortunate enough to challenge them."
 GRS_new_admirals:0 "New Admirals"
 GRS_new_admirals_desc:0 "A new generation of naval leadership is required. Promising officers who have distinguished themselves through skill, discipline and innovation will be elevated to the rank of admiral."
 GRS_expand_naval_academy:0 "Expand the Naval Academy"
 GRS_expand_naval_academy_desc:0 "Our naval academies must be expanded to meet the growing demands of a modern fleet. Better facilities and greater enrollment will ensure a steady supply of capable officers and admirals."
 GRS_prepare_for_an_invasion:0 "Prepare for an Invasion"
 GRS_prepare_for_an_invasion_desc:0 "The wound of Cabo Vesca has not healed. Detailed plans will be drawn up for a future invasion of Centauri, ensuring that when the time comes our forces will be ready."
 GRS_avenge_cabo_vesca:0 "Avenge Cabo Vesca"
 GRS_avenge_cabo_vesca_desc:0 "Grusan sailors perished beneath Centaurian guns at Cabo Vesca. Their sacrifice will not be forgotten, nor will their deaths go unanswered. The time has come to seek justice for the fallen."
 GRS_dominate_the_libran_ocean:0 "Dominate the Libran Ocean"
 GRS_dominate_the_libran_ocean_desc:0 "With our northern rival defeated, the Libran Ocean lies open before us. By expanding our naval presence we will establish unquestioned naval hegemony across the region." 
 GRS_naval_design_bureau:0 "Royal Naval Design Bureau"
 GRS_naval_design_bureau_desc:0 "A dedicated bureau of naval architects, engineers, and strategists has been assembled to oversee the design of future warships. Their work ensures that every vessel launched under the Grusan flag reflects the latest innovations in naval warfare."
 GRS_advanced_gunnery_trials:0 "Advanced Gunnery Trials"
 GRS_advanced_gunnery_trials_desc:0 "The guns of tomorrow cannot be forged through theory alone. Extensive testing and live-fire exercises will reveal the strengths and weaknesses of our newest naval artillery."
 GRS_admiralty_reforms:0 "Admiralty Reforms"
 GRS_admiralty_reforms_desc:0 "The structure of the Admiralty has been modernised and streamlined. A more efficient command system will allow our officers to respond to threats with greater speed and flexibility."
 GRS_fleet_war_games:0 "Fleet War Games"
 GRS_fleet_war_games_desc:0 "Large-scale naval exercises have become a regular occurrence. These war games allow officers to test new tactics, improve coordination, and prepare for future conflicts."
 GRS_marine_assault_training:0 "Marine Assault Training"
 GRS_marine_assault_training_desc:0 "Specialised assault forces have begun training for large-scale amphibious operations. These elite formations will spearhead future landings upon hostile shores."
 GRS_amphibious_logistics:0 "Amphibious Logistics"
 GRS_amphibious_logistics_desc:0 "A successful invasion depends not only upon ships and soldiers, but upon the ability to sustain them. Improved logistical planning ensures our forces remain supplied even during prolonged overseas operations."
 GRS_study_naval_armour:0 "Study Naval Armour"
 GRS_study_naval_armour_desc:0 "Armour is the backbone of any modern ship, inadequate armour, or adding it to the wrong places will put Grusan sailors at risk. Studying why and where armour should and should not be welded too is critical to warship design." 
 
 GRS_begin_production_of_aeroplanes:0 "Begin Production of Aeroplanes"
 GRS_begin_production_of_aeroplanes_desc:0 "Aircraft are rapidly becoming a prominent feature of modern warfare. Grusa must establish a domestic aviation industry before it is left behind."

 GRS_desert_flight_training:0 "Desert Flight Training"
 GRS_desert_flight_training_desc:0 "The skies above Arida provide ideal conditions for training skilled pilots capable of operating in even the harshest environments."

 GRS_construction_of_air_bases:0 "Construction of Air Bases"
 GRS_construction_of_air_bases_desc:0 "An air force requires more than aircraft alone. New airfields will provide the infrastructure needed to launch our aircraft."

 GRS_flying_artillery:0 "Flying Artillery"
 GRS_flying_artillery_desc:0 "Aircraft can serve as extensions of the army, striking enemy positions and supporting troops from above."

 GRS_royal_fighter_squadron:0 "Royal Fighter Squadron"
 GRS_royal_fighter_squadron_desc:0 "Elite fighter pilots will form the backbone of our growing air force, defending Grusan skies and challenging enemy aircraft."

 GRS_streamline_domestic_production:0 "Streamline Domestic Production"
 GRS_streamline_domestic_production_desc:0 "By standardising designs and coordinating industrial efforts, we can greatly increase the efficiency of aircraft production."
 
 GRS_deport_disloyal_vegans:0 "Deport Vegan Loyalists"
 GRS_deport_disloyal_vegans_desc:0 "We will deport any Vegans who are not loyal to Grusa. Their insolence will not be tolerated and they will be forcefully sent to our neighbours."
 
 GRS_war_start:0 "Guerra del Escorpión!"
 GRS_war_start_desc:0 "There is no history of conflict between Grusa and Antares. However the Antarean war machine has turned its gaze upon our Kingdom, we are fighting because another nation has decided that Grusa must cease to exist. Even if millions do not see the end of this war, we must hold onto hope for a future, whatever the cost may be." 
 
 GRS_the_antarean_issue:0 "The Antarean Issue"
GRS_the_antarean_issue_desc:0 "The invasion of Vega has forced us to confront an uncomfortable reality. Antares grows stronger with every passing day and few believe their ambitions end at Vega's borders. We must decide how Grusa will respond before events overtake us."

GRS_review_our_options:0 "Review Our Options"
GRS_review_our_options_desc:0 "The government is divided. Some urge immediate military preparations, while others insist diplomacy may yet avert disaster. Every decision from this point onward may determine the fate of the Kingdom."

GRS_prepare_our_armed_forces:0 "Prepare Our Armed Forces"
GRS_prepare_our_armed_forces_desc:0 "Whether war comes tomorrow or years from now, the Grusan Army must be brought to full readiness. Weapons, supplies and manpower will all be required."

GRS_a_call_to_arms:0 "A Call to Arms"
GRS_a_call_to_arms_desc:0 "The nation must unite. Every factory, every soldier and every citizen has a role to play if Grusa is to survive the coming storm."

GRS_intervene_vegan_war:0 "Intervene in the Vegan War"
GRS_intervene_vegan_war_desc:0 "Though our nations have long been rivals, Vega now stands between Grusa and Antares. If Vega falls, we shall surely be next. We will march to their aid, and assist them in their war."

GRS_preemptive_strike:0 "Launch a Pre-emptive Strike"
GRS_preemptive_strike_desc:0 "Vega has fallen, waiting only gives Antares time to prepare. We must seize the initiative before the enemy does."

GRS_general_mobilisation:0 "Prepare the Populace"
GRS_general_mobilisation_desc:0 "Every available resource must be directed toward the war effort. Industry, transport and manpower shall all be mobilised."

GRS_propganda_efforts:0 "Propaganda Efforts"
GRS_propganda_efforts_desc:0 "Victory depends not only on weapons, but on resolve. Newspapers, posters and radio broadcasts will remind every Grusan what is at stake."

GRS_hold_the_plains:0 "Hold the Plains"
GRS_hold_the_plains_desc:0 "The Southern Plains is the gateway to the Arida. Here we shall deny the enemy every metre of ground."

GRS_hill_strongpoints:0 "Defensive Strongpoints"
GRS_hill_strongpoints_desc:0 "The hills and ridges overlooking the plains will become natural fortresses, connected by trenches, bunkers and artillery positions."

GRS_interlocking_defenses:0 "Interlocking Defenses"
GRS_interlocking_defenses_desc:0 "Each bunker, trench and artillery position shall support the next. Any enemy breakthrough will immediately come under devastating crossfire."

GRS_defend_the_arida:0 "Defend the Arida"
GRS_defend_the_arida_desc:0 "The Arida consumes most of Grusa beneath an endless sea of sand and dunes. To our soldiers every dune, ridge and dry riverbed can become a fortress. If Antares wishes to cross the desert, they will find an enemy that knows every grain of sand."

GRS_masters_of_desert_warfare:0 "Masters of the Arida"
GRS_masters_of_desert_warfare_desc:0 "The Arida Desert is our home, not theirs. We shall use its heat, size and unforgiving terrain as weapons."

GRS_sabotage_behind_enemy_lines:0 "Raiding Parties"
GRS_sabotage_behind_enemy_lines_desc:0 "Our engineers and raiding parties will strike supply depots, railways and communications before vanishing back into the sands."

GRS_secure_the_coastline:0 "Secure the Coastline"
GRS_secure_the_coastline_desc:0 "Our shores must never become the enemy's gateway into Grusa. Every harbour and beach shall be defended."

GRS_coastal_observation_posts:0 "Oberservation Posts"
GRS_coastal_observation_posts_desc:0 "A chain of observation posts will ensure no enemy fleet approaches unnoticed."

GRS_fortress_ports:0 "Fortress Ports"
GRS_fortress_ports_desc:0 "The ports of Grusa shall become bastions capable of resisting even the strongest naval assault."

GRS_seek_aid:0 "Seek Foreign Aid"
GRS_seek_aid_desc:0 "Grusa cannot stand entirely alone. Nations abroad may provide the weapons and supplies we desperately need."

GRS_import_foreign_equipment:0 "Import Foreign Equipment"
GRS_import_foreign_equipment_desc:0 "Foreign arms manufacturers possess the industrial capacity we lack. Contracts must be signed before it is too late."

GRS_reach_out_to_orion_and_tucana:0 "Reach Out to Orion and Tucana"
GRS_reach_out_to_orion_and_tucana_desc:0 "Both Orion and Tucana have industries capable of sustaining our war effort. Their support may prove decisive."

GRS_negotiate_with_orion:0 "Negotiate with Orion"
GRS_negotiate_with_orion_desc:0 "Orion's vast industry produce some of the finest military equipment. We should secure their cooperation."

GRS_negotiate_with_tucana:0 "Negotiate with Tucana"
GRS_negotiate_with_tucana_desc:0 "Tucana possesses a of surplus military supplies. We must persuade them to support our struggle."

GRS_setup_arms_contracts:0 "Establish Arms Contracts"
GRS_setup_arms_contracts_desc:0 "Formal agreements will ensure a steady flow of foreign military equipment despite the hardships of war."

GRS_purchase_tucanese_firearms:0 "Purchase Tucanese Firearms"
GRS_purchase_tucanese_firearms_desc:0 "Thousands of rifles and small arms from Tucana will replenish our exhausted stockpiles."

GRS_purchase_orion_artillery:0 "Purchase Orion Artillery"
GRS_purchase_orion_artillery_desc:0 "Heavy guns from Orion will greatly strengthen our defensive lines."

GRS_purchase_tucanese_trucks:0 "Purchase Tucanese Trucks"
GRS_purchase_tucanese_trucks_desc:0 "Reliable motor transport will allow supplies and reinforcements to reach the front far more quickly."

GRS_purchase_orion_support_equipment:0 "Purchase Orion Support Equipment"
GRS_purchase_orion_support_equipment_desc:0 "Modern equipment from Orion will improve the effectiveness of our divisions."

GRS_purchase_orion_support_equipment:0 "Purchase Orion Support Equipment"
GRS_purchase_orion_support_equipment_desc:0 "Modern equipment from Orion will improve the effectiveness of our divisions."

GRS_acquire_oversea_factories:0 "Resources for Equipment"
GRS_acquire_oversea_factories_desc:0 "We will use our natural resources as another form of payment for foreign military equipment and supplies."
 
GRS_purchase_orion_armoured_cars:0 "Purchase The M.5-E Armoured Car"
GRS_purchase_orion_armoured_cars_desc:0 "Orion are willing to supply us with its M.5-E armoured cars, although at a greater cost than other equipment."

GRS_purchase_tucanese_tanks:0 "Purchase The Chuikov II"
GRS_purchase_tucanese_tanks_desc:0 "Tucana has agreed to give a number of its Chuikov II heavy tanks. However it is expensive to import and costly to maintain."

GRS_contact_NCA:0 "Contact the Northern Centauran Alliance"
GRS_contact_NCA_desc:0 "The remaining free nations of northern Centaura have begun coordinating against Antares. We should establish formal diplomatic contact."

GRS_join_NCA:0 "Join the NCA"
GRS_join_NCA_desc:0 "Grusa cannot fight the greatest military power on the continent alone. United, we stand a far greater chance of survival."

GRS_we_stand_alone:0 "We Stand Alone"
GRS_we_stand_alone_desc:0 "We do not need help from other nations. Our survival will depend upon our own determination, our own industry and our own soldiers."

GRS_begin_fortication_efforts:0 "Begin Fortification Efforts"
GRS_begin_fortication_efforts_desc:0 "Defensive works must rise across the nation while there is still time. Every bunker constructed today may save hundreds of lives tomorrow."

GRS_defend_the_plains:0 "Fortify the Southern Plains"
GRS_defend_the_plains_desc:0 "The open plains are the most direct route into the Arida. Without prepared positions our armies would be forced to fight exposed against superior forces. We will transform the plains into a continuous defensive belt."

GRS_desert_fortifications:0 "The Arida Defensive Line"
GRS_desert_fortifications_desc:0 "The deserts offer little natural shelter, but they provide countless opportunities to funnel and exhaust an invading force. A chain of hardened positions will ensure that every kilometre of sand is paid for in Antarean blood."

GRS_fortify_leopolis:0 "Fortify Leopolis"
GRS_fortify_leopolis_desc:0 "Leopolis stands as Grusa's largest and most prominant city. Should our lines fail, the city must remain an unbreakable bastion capable of anchoring the nation's defence and denying the enemy a victory."

GRS_fallback_lines:0 "Construct Fallback Lines"
GRS_fallback_lines_desc:0 "No defence is perfect. If the outer fortifications are breached, our armies must have prepared positions from which to regroup and continue the fight. Every retreat should lead only to another wall the enemy must overcome."

GRS_coastal_fortifications:0 "Strengthen the Coastal Batteries"
GRS_coastal_fortifications_desc:0 "Antares possesses a strong and fearsome navy. We cannot challenge them ship for ship, but we can ensure that every harbour and stretch of coastline becomes a fortress. If they seek to land upon our shores, they will sail directly into our guns."

GRS_find_a_diplomatic_answer:0 "Find a Diplomatic Answer"
GRS_find_a_diplomatic_answer_desc:0 "A war with Antares would almost certainly destroy Grusa in the process. If our nation is to survive, we must consider whether diplomacy can achieve what armies never could."

GRS_contact_antares:0 "Contact Antares"
GRS_contact_antares_desc:0 "Our envoys shall travel to Aquila carrying an extraordinary proposal. Rather than opposing Antares, Grusa offers cooperation in exchange for preserving its sovereignty."

GRS_no_response:0 "No Response"
GRS_no_response_desc:0 "Our delegation returned empty-handed. Whether ignored, forgotten or deliberately delayed, Antares has left us waiting in uncertainty."

GRS_antares_accepts:0 "Antares Accepts"
GRS_antares_accepts_desc:0 "Against all expectations, Antares has accepted negotiations. Our independence will survive, but only beneath the shadow of the Imperium."

GRS_antares_declines:0 "Antares Declines"
GRS_antares_declines_desc:0 "The answer from Aquila is unequivocal. Antares has no interest in compromise. If Grusa is to survive, it must prepare for a bloody struggle."

GRS_survival_at_cost:0 "Survival at Any Cost"
GRS_survival_at_cost_desc:0 "Pride has little value if Grusa ceases to exist. Better to have an imperfect peace than glorious annihilation."

GRS_accept_antarean_supervision:0 "Accept Antarean Supervision"
GRS_accept_antarean_supervision_desc:0 "Antares will oversee our foreign policy and military affairs. In return, Grusa retains its government, its identity and its future."

GRS_banish_the_monarchy:0 "Banish the Monarchy"
GRS_banish_the_monarchy_desc:0 "The monarchy remains a symbol of resistance. Their removal will reassure Antares that Grusa has embraced a different future."

GRS_execute_unpopular_royals:0 "Execute the Royal Family"
GRS_execute_unpopular_royals_desc:0 "Some believe exile is too merciful. By eliminating the royal family, Grusa will prove beyond doubt that the old kingdom can never return."

GRS_support_the_antareans:0 "Support the Antareans"
GRS_support_the_antareans_desc:0 "Loyalty cannot simply be declared, it must be demonstrated. Grusan soldiers will stand beside Antares wherever they are needed."

GRS_joint_military_commission:0 "Joint Military Commission"
GRS_joint_military_commission_desc:0 "Grusan and Antarean officers shall work together to coordinate planning, logistics and military doctrine."

GRS_antarean_investment:0 "Antarean Investment"
GRS_antarean_investment_desc:0 "Imperial capital will modernise our industries, strengthening Grusa while binding our economy ever closer to Antares."

GRS_modernise_the_railways:0 "Modernise the Railways"
GRS_modernise_the_railways_desc:0 "A modern railway network is essential for economic development and the rapid deployment of troops across the country."

GRS_expand_the_ports:0 "Expand the Ports"
GRS_expand_the_ports_desc:0 "New docks and expanded harbours will strengthen commerce while supporting Antarean naval operations in the region."

GRS_foreign_capital:0 "Foreign Capital"
GRS_foreign_capital_desc:0 "Additional investment from Antares will accelerate industrial growth, even if much of the wealth ultimately returns to Antares."

GRS_antarean_military_advisors:0 "Antarean Military Advisors"
GRS_antarean_military_advisors_desc:0 "Veteran officers from the Imperial Army will oversee the modernisation of our armed forces."

GRS_reform_the_officer_corps:0 "Reform the Officer Corps"
GRS_reform_the_officer_corps_desc:0 "Outdated traditions must give way to a professional command structure capable of fighting alongside the Empire."

GRS_antarean_training_missions:0 "Antarean Training Missions"
GRS_antarean_training_missions_desc:0 "Joint exercises and instructor exchanges will ensure that Grusan soldiers meet Antarean standards."

GRS_integrate_antarean_tactics:0 "Integrate Antarean Tactics"
GRS_integrate_antarean_tactics_desc:0 "Cooperation with Antares has reshaped the Grusan Army. Antarean battlefield doctrine has become second nature to our officers."

GRS_a_new_grusa:0 "A New Grusa"
GRS_a_new_grusa_desc:0 "No longer a defeated kingdom clinging to survival, Grusa has become a prosperous and trusted partner within the Antarean sphere."

GRS_invite_vega:0 "Invite Vega"
GRS_invite_vega_desc:0 "We will invite Vega to the Nothern Centauran Alliance."
#
GRS_antarean_blockade:0 "The Antarean Blockade" 
GRS_antarean_blockade_desc:0 "The Antarean Navy has established a blockade around Grusa, intercepting merchant convoys and cutting vital sea lanes. Imports are bound to become increasingly scarce, while exports lie stranded in harbours."

GRS_produce_blockade_runners:0 "Produce Blockade Runners"
GRS_produce_blockade_runners_desc:0 "Small and fast merchant vessels stand a better chance of slipping through the Antarean blockade. By converting existing ships and constructing new ones, we can keep vital supplies flowing into Grusa."

GRS_increase_dockyard_capcity:0 "Increase Dockyard Capacity"
GRS_increase_dockyard_capcity_desc:0 "Our dockyards must operate around the clock to keep pace with wartime demand. Expanding their capacity will allow us to repair and construct vessels more efficiently."

GRS_cease_non_essential_production:0 "Cease Non-Essential Production"
GRS_cease_non_essential_production_desc:0 "Luxury goods and civilian industries must take a back seat. Redirecting resources towards the war effort will strengthen our ability to withstand the blockade."

GRS_enforce_rationing:0 "Enforce Rationing"
GRS_enforce_rationing_desc:0 "Food and essential supplies must be carefully distributed. Though unpopular, rationing will ensure that our people and armed forces receive exactly the amount of food they need."

GRS_increase_the_workforce:0 "Increase the Workforce"
GRS_increase_the_workforce_desc:0 "With every available hand contributing to the war effort, factories and dockyards can continue operating despite mounting shortages."

GRS_supress_defeatistism:0 "Suppress Defeatism"
GRS_supress_defeatistism_desc:0 "Rumours of defeat and surrender only strengthen Antares. We must maintain public confidence and reinforce the nation's determination to endure."

GRS_fund_navy:0 "Fund the Navy"
GRS_fund_navy_desc:0 "Breaking the blockade will require a stronger and more capable fleet. Additional funding will allow the navy to prepare for the breakout."

GRS_boost_naval_production:0 "Boost Naval Production"
GRS_boost_naval_production_desc:0 "Shipyards must prioritise the construction and repair of warships above all else. Every vessel launched brings us one step closer to challenging the blockade."

GRS_build_new_dockyards:0 "Build New Dockyards"
GRS_build_new_dockyards_desc:0 "Expanding the amount of dockyards available will increase our naval production capacity and ensure that replacement ships can be built as quickly as possible."

GRS_break_the_blockade:0 "Break the Blockade"
GRS_break_the_blockade_desc:0 "The time has come to challenge Antares' grip on our shores. If our preparations have been sufficient, the Royal Grusan Navy may yet force a path through the blockade and restore the nation's lifeline."

 GRS_expand_the_merchant_fleet:0 "Expand the Merchant Fleet"
GRS_expand_the_merchant_fleet_desc:0 "Merchant vessels are the lifeblood of the nation. Expanding our commercial fleet will strengthen overseas trade and lay the foundations for future prosperity."

GRS_royal_merchant_marine:0 "Royal Merchant Marine"
GRS_royal_merchant_marine_desc:0 "By officially establishing a Royal Merchant Marine, we integrate our commercial shipping directly into our government, increasing the effectiveness of civilian sailors and ensuring merchants are under protection." 

GRS_expand_trade_routes:0 "Expand Trade Routes"
GRS_expand_trade_routes_desc:0 "New commercial agreements and shipping lanes will open distant markets to Grusan merchants, increasing both the flow of wealth and the availability of foreign goods."

GRS_modernise_fishing_fleet:0 "Modernise the Fishing Fleet"
GRS_modernise_fishing_fleet_desc:0 "Our fishermen still rely upon ageing vessels and outdated equipment. Investing in modern boats and machinery will greatly increase the nation's harvest from the sea."

GRS_deep_sea_fishing:0 "Deep-Sea Fishing"
GRS_deep_sea_fishing_desc:0 "The rich waters beyond our coastline remain largely untouched. By equipping our fleet for longer voyages, Grusa can exploit these valuable fishing grounds."

GRS_create_fish_farms:0 "Create Fish Farms"
GRS_create_fish_farms_desc:0 "Natural catches alone cannot satisfy the growing demand for seafood. Establishing fish farms will provide a reliable and sustainable source of food for our people."

GRS_expand_canning_industry:0 "Expand the Canning Industry"
GRS_expand_canning_industry_desc:0 "Proper preservation will allow Grusan seafood to be exported across the continent instead of spoiling in our harbours. A thriving canning industry will become another pillar of our economy."

GRS_improve_cold_storage:0 "Improve Cold Storage"
GRS_improve_cold_storage_desc:0 "Modern refrigerated warehouses will greatly reduce spoilage, allowing fish and other perishables to be transported safely across the country."

GRS_develop_fish_preservatives:0 "Develop Better Preservatives"
GRS_develop_fish_preservatives_desc:0 "Scientific advances in food preservation will extend the shelf life of our food."

GRS_develop_port_leopolis:0 "Develop The Port of Leopolis"
GRS_develop_port_leopolis_desc:0 "Leopolis has long served as the beating heart of Grusa. By expanding its harbour facilities and encouraging new businesses to settle nearby, we can transform Leopolis into something greater."

GRS_develop_coastal_warehouses:0 "Develop Coastal Warehouses"
GRS_develop_coastal_warehouses_desc:0 "A merchant fleet is worthless if its cargo cannot be stored safely. Constructing warehouses and improving the roads leading to our ports will allow goods to move quickly from ship to market."

GRS_invest_neuva_quebrada:0 "Investestments outside Leopolis"
GRS_invest_neuva_quebrada_desc:0 "Every other city in Grusa has remained overshadowed by Leopolis. Targeted investment will encourage new businesses and help improve local industry."

GRS_expand_leopolis:0 "Expand Leopolis"
GRS_expand_leopolis_desc:0 "Leopolis must continue to grow, new industrial districts, expanded dockyards and improved transport will ensure the city remains the undisputed centre of Grusa for decades to come."

GRS_improve_smaller_harbours:0 "Improve Smaller Harbours"
GRS_improve_smaller_harbours_desc:0 "Expanding smaller harbours along the Grusan coastline will ensure merchant vessels gain additional ports while local communities receive investment needed to prosper."

GRS_new_shipyards_on_alnair:0 "New Shipyards on the coast"
GRS_new_shipyards_on_alnair_desc:0 "Our coast possess an ideal location for shipbuilding facilities. New workshops and dockyards will allow both merchant and naval vessels to be constructed far more efficiently."

GRS_new_tiaki_drydocks:0 "Construct New Drydocks"
GRS_new_tiaki_drydocks_desc:0 "By constructing newer drydocks we will strengthen both our commercial and our navy's capabilities to produce ships."

GRS_improve_coastal_infrastructure:0 "Improve Coastal Infrastructure"
GRS_improve_coastal_infrastructure_desc:0 "Upgrading the transport network that links our coastal settlements will allow goods, workers and military supplies to move swiftly between harbours."

GRS_prioritse_the_saggitarius:0 "Prioritise the Saggitarius"
GRS_prioritse_the_saggitarius_desc:0 "The Saggitarius Strait remains one of Grusa's most strategically valuable waterways. Concentrating investment along its coastline will expand commerce and ensure that Grusan merchants have easy access into the strait."

GRS_prioritse_the_annalus:0 "Prioritise the Annalus"
GRS_prioritse_the_annalus_desc:0 "The Annalus coast offers natural harbours and excellent access into the Annalus sea, by prioritising our efforts here, we can ensure we have a strong presence on the Annalus sea."

GRS_enhance_existing_dockyards:0 "Enhance Existing Dockyards"
GRS_enhance_existing_dockyards_desc:0 "Upgrading existing dockyards with improved machinery, expanded workshops and more efficient construction methods will ensure that every shipyard operates at maximum capacity."

GRS_survey_the_plains:0 "Survey the Plains"
GRS_survey_the_plains_desc:0 "The plains of Grusa are among the most fertile lands in the kingdom. We must determine how best to develop this valuable region."

GRS_expand_the_farms:0 "Expand the Farms"
GRS_expand_the_farms_desc:0 "With much of Grusa's fertile land still underdeveloped, there is ample opportunity to expand our farms and increase agricultural production."

GRS_prepare_industrial_expansion:0 "Prepare Industrial Expansion"
GRS_prepare_industrial_expansion_desc:0 "The development of the plains provides an opportunity to establish new industries and prepare the region for greater economic activity."

GRS_advancements_in_agriculture:0 "Advancements in Agriculture"
GRS_advancements_in_agriculture_desc:0 "New methods of farming and cultivation can greatly improve the productivity of our land. We must encourage further study and experimentation."

GRS_breed_more_livestock:0 "Breed More Livestock"
GRS_breed_more_livestock_desc:0 "The fertile plains provide excellent conditions for raising livestock. Better breeding practices will allow us to make greater use of this resource."

GRS_irrigate_the_plains:0 "Irrigate the Plains"
GRS_irrigate_the_plains_desc:0 "Much of the plains remains dependent on rainfall. Investment in irrigation will allow more of the land to be cultivated throughout the year."

GRS_mechanise_agriculture:0 "Mechanise Agriculture"
GRS_mechanise_agriculture_desc:0 "Agriculture can no longer rely entirely upon traditional methods. The introduction of modern machinery will increase production while reducing the burden on our farmers."

GRS_develop_the_plains:0 "Develop the Plains"
GRS_develop_the_plains_desc:0 "Investment into the plains has transformed the region into one of Grusa's most productive regions. We can now expand its industries and infastructure further."

GRS_civfactories_in_the_plains:0 "Civilian Industry in the Plains"
GRS_civfactories_in_the_plains_desc:0 "With the agricultural foundations of the region secured, we can turn our attention towards civilian industry and further economic development."

GRS_milfactories_in_the_plains:0 "Military Industry in the Plains"
GRS_milfactories_in_the_plains_desc:0 "The growing prosperity of the plains gives us the opportunity to establish a stronger industrial base for the production of military equipment."

 GRS_import_industrial_machinery:0 "Import Industrial Machinery"
 GRS_import_industrial_machinery_desc:0 "Our workshops lack much of the machinery needed for modern production. Importing equipment from abroad will help lay the foundations for further industrial development."

 GRS_domestic_tooling_industry:0 "Domestic Tooling Industry"
 GRS_domestic_tooling_industry_desc:0 "Relying on foreign tools and equipment is costly. Developing domestic tooling will allow Grusan workshops to support our growing industries."

 GRS_develop_civilian_industry:0 "Develop Civilian Industry"
 GRS_develop_civilian_industry_desc:0 "Grusa's economy remains limited by a lack of industrial capacity. Investment in civilian industry will provide the goods and facilities needed for future growth."

 GRS_expand_construction_firms:0 "Expand Construction Firms"
 GRS_expand_construction_firms_desc:0 "As development spreads, our construction firms must be able to keep pace. Expanding their capacity will help new factories and infrastructure take shape."

 GRS_nothern_military_factories:0 "Northern Military Factories"
 GRS_nothern_military_factories_desc:0 "Establishing military production in the north will give the kingdom another source of equipment for its army."

 GRS_tiaki_factories:0 "Tiaki Factories"
 GRS_tiaki_factories_desc:0 "Tiaki's position in the south makes it a useful centre for industrial growth. New factories will serve the city and the nearby plains."

 GRS_leopolis_industrial_district:0 "Leopolis Industrial District"
 GRS_leopolis_industrial_district_desc:0 "As the kingdom's capital, Leopolis should become a centre of Grusan industry. Investment in its infrastructure and factories will strengthen the city's role in the economy."

 GRS_leopolis_steelworks:0 "Leopolis Steelworks"
 GRS_leopolis_steelworks_desc:0 "A reliable supply of steel would reduce our dependence on foreign suppliers. Establishing steel production in Leopolis would support the kingdom's growing needs for resources."

 GRS_leopolis_military_factories:0 "Leopolis Military Factories"
 GRS_leopolis_military_factories_desc:0 "Expanding arms production in the capital will help supply the army and strengthen Grusa's ability to equip its armed forces."
 
 GRS_leopolis_civilian_factories:0 "Leopolis Civilian Factories"
 GRS_leopolis_civilian_factories_desc:0 "Expanding civilian industry in the capital will increase the kingdom's productive capacity and provide the goods needed to continue further economic development."
 
 GRS_prepare_the_war_machine:0 "Prepare the War Machine"
 GRS_prepare_the_war_machine_desc:0 "Grusa must prepare its industry for the demands of war. New factories and increased production will help ensure the army is properly equipped."

 GRS_military_industrial_expansion:0 "Military Industrial Expansion"
 GRS_military_industrial_expansion_desc:0 "The army requires a steady supply of weapons and equipment. Expanding military production will help meet these demands."

 GRS_relocate_factories:0 "Relocate Factories"
 GRS_relocate_factories_desc:0 "Some factories must be relocated to ensure the safety of the economy."

 GRS_convert_civilian_factories:0 "Convert Civilian Factories"
 GRS_convert_civilian_factories_desc:0 "Civilian industry has served the kingdom well, but the needs of the army must now take priority. Several factories will be converted to produce military equipment."

 GRS_grusan_sun_ascends:0 "The Grusan Sun Ascends"
 GRS_grusan_sun_ascends_desc:0 "Grusa is prepared, we stand ready for what lies ahead of us and our resolve shines as bright as the sun."
 #
 GRS_a_new_century:0 "A New Century"
 GRS_a_new_century_desc:0 "It is the end of the 19th century and the beginning of the 20th!"

 GRS_reign_of_fernan:0 "The Reign of Fernan"
 GRS_reign_of_fernan_desc:0 "Fernan Flamenco's reign over Grusa has been quiet and uneventful. He has attempted to rectify the mistakes of his father and the consequences of the Strait War."

 GRS_fernans_government:0 "Fernan's Government"
 GRS_fernans_government_desc:0 "The kingdom continues to be governed by Fernan and his appointed Nobles. Although little has changed, the government remains committed to maintaining stability throughout Grusa."

 GRS_consult_the_council:0 "Consult the Assembly of Nobles"
 GRS_consult_the_council_desc:0 "The Assembly of Nobles are a great tool to the Flamenco dynasty. Their experience and advice help assist the monarchy in making important decisions and carrying out orders on their behalf."

 GRS_seek_new_advisors:0 "Seek New Advisors"
 GRS_seek_new_advisors_desc:0 "The kingdom requires capable men to assist in its administration. New advisors may bring fresh ideas and help improve the workings of the government."

 GRS_royal_investments:0 "Royal Investments"
 GRS_royal_investments_desc:0 "Fernan has taken an interest in improving the kingdom through personal investments. New projects will provide work and help Grusa's economy."

 GRS_military_inspection:0 "Military Inspection"
 GRS_military_inspection_desc:0 "The King has ordered an inspection of the Grusan armed forces. Their equipment, organisation and readiness must be examined."

 GRS_military_investment:0 "Military Investment"
 GRS_military_investment_desc:0 "The kingdom must ensure that its armed forces receive the equipment and resources they require. Further investment will help prepare Grusa for future conflicts."

 GRS_maintain_status_quo:0 "Maintain the Status Quo"
 GRS_maintain_status_quo_desc:0 "Fernan has little desire to introduce sweeping changes to the kingdom. For now, the established order shall remain undisturbed."

 GRS_the_vega_question:0 "The Vega Question"
 GRS_the_vega_question_desc:0 "Relations with Vega remain uncertain. Both nations continue to prepare for the possibility of reunification by force and neither appears willing to abandon its ambitions."

 GRS_the_death_of_fernan:0 "The Death of Fernan"
 GRS_the_death_of_fernan_desc:0 "King Fernan Flamenco has passed away. After years of ruling Grusa, the crown now passes to his son Valentine Flamenco."

 GRS_continue_fernans_work:0 "Passing the Torch"
 GRS_continue_fernans_work_desc:0 "Valentine has inherited the Grusan crown. He intends to continue his father's work and preserve the kingdom his family has ruled for generations."

 GRS_golden_opportunity:0 "A Golden Opportunity"
 GRS_golden_opportunity_desc:0 "The death of a monarch presents a rare opportunity. With the old order weakened and the future of Grusa uncertain, perhaps the time is right for another man to lead the kingdom..."

 GRS_state_funeral:0 "A State Funeral"
 GRS_state_funeral_desc:0 "Fernan is to be given a grand state funeral in Leopolis. Nobles, military officers and citizens from across the kingdom will gather to pay their respects to the late King."

 GRS_address_the_nation:0 "Address the Nation"
 GRS_address_the_nation_desc:0 "King Valentine will address the people of Grusa for the first time since his father's death. He must reassure the kingdom that he is prepared to take up the responsibilities of the crown."
 
 GRS_royal_parade:0 "A Royal Parade"
 GRS_royal_parade_desc:0 "A parade will be held in Leopolis to mark the accession of King Valentine. The armed forces and the people will gather to celebrate the beginning of a new reign."

 GRS_tour_the_kingdom:0 "A Tour of the Kingdom"
 GRS_tour_the_kingdom_desc:0 "Valentine will travel throughout Grusa, visiting its towns and regions. It will give the new King an opportunity to meet his subjects and become familiar with the kingdom."
 
 GRS_the_new_king:0 "The New King"
 GRS_the_new_king_desc:0 "With his father's reign at an end, Valentine must now establish himself as the new King of Grusa and take responsibility for the kingdom."




 GRS_deport_disloyal_vegans:0 "Deport Vegan Loyalists"
 GRS_deport_disloyal_vegans_desc:0 "We will deport any Vegans who are not loyal to Grusa. Their insolence will not be tolerated and they will be forcefully sent to our neighbours." # I LOVE LARPING
 
