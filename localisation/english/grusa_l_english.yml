 GRS_control_grusan_dominant:0 "§GGrusan Dominance§!"
 
 GRS_raise_tolls:0 "Raise Strait Tolls"
 GRS_raise_tolls_desc:0 "Increasing toll rates will greatly improve state revenues, though excessive taxation risks alienating merchants and foreign powers."
 GRS_reduce_tolls:0 "Reduce Strait Tolls"
 GRS_reduce_tolls_desc:0 "Reducing tolls will ease tensions and improve commercial relations throughout the Sagittarius Strait."
 GRS_expand_patrols:0 "Expand Strait Patrols"
 GRS_expand_patrols_desc:0 "Additional naval patrols will reinforce Grusan authority throughout the Sagittarius Strait."
 GRS_reduce_patrols:0 "Reduce Patrol Presence"
 GRS_reduce_patrols_desc:0 "Scaling back patrol operations will reduce strain on the navy, though it risks weakening our control over the strait."
 
 GRS_naval_reforms:0 "Naval Reforms"
 GRS_naval_reforms_desc:0 "Cabo Vesca, 1868, The Strait War. The King's Grand Armada was destroyed in a single catastrophic blow. Yet the disaster has no need to define us forever. Through extensive reforms, modern doctrine, and renewed investment, we may once again forge a fleet worthy of ruling the seas.\n\nThe current state of the Naval Reform: [GRS_naval_reform]"
 GRS_officer_training_programs:0 "Officer Training Programs"
 GRS_officer_training_programs_desc:0 "A modern navy requires competent officers capable of adapting to new forms of warfare."
 GRS_modernize_naval_logistics:0 "Modernize Naval Logistics"
 GRS_modernize_naval_logistics_desc:0 "Efficient supply chains and coordinated dockyard operations are essential for sustaining the fleet."
 GRS_update_fleet_coordination:0 "Update Fleet Coordination"
 GRS_update_fleet_coordination_desc:0 "Improved communications and command structures will allow the fleet to operate more effectively."
 GRS_establish_naval_war_college:0 "Establish Naval War College"
 GRS_establish_naval_war_college_desc:0 "A dedicated naval academy will prepare a new generation of officers and strategists."
 GRS_expand_coastal_shipyards:0 "Expand Coastal Shipyards"
 GRS_expand_coastal_shipyards_desc:0 "Additional dockyard facilities will accelerate repairs and ship construction."
 GRS_rebuild_the_grand_armada:0 "Rebuild the Grand Armada"
 GRS_rebuild_the_grand_armada_desc:0 "The humiliation of Cabo Vesca will finally be overcome as Grusa restores its naval prestige."
 GRS_expand_naval_academies:0 "Expand Naval Academies"
 GRS_expand_naval_academies_desc:0 "Expanding naval education will ensure a steady flow of trained personnel for the fleet."
 GRS_recommission_old_vessels:0 "Recommission Old Vessels"
 GRS_recommission_old_vessels_desc:0 "Several aging warships can still serve if properly repaired and modernized."
 GRS_standardize_naval_doctrine:0 "Standardize Naval Doctrine"
 GRS_standardize_naval_doctrine_desc:0 "A unified doctrine will improve coordination between squadrons and commanders."
 GRS_expand_drydock_capacity:0 "Expand Drydock Capacity"
 GRS_expand_drydock_capacity_desc:0 "Larger and more capable drydocks will support the maintenance of modern warships."
 GRS_integrate_coastal_defenses:0 "Integrate Coastal Defenses"
 GRS_integrate_coastal_defenses_desc:0 "Coastal fortifications and naval patrols must work together to secure our shores."
 GRS_naval_industrial_expansion:0 "Naval Industrial Expansion"
 GRS_naval_industrial_expansion_desc:0 "Expanding naval industry will allow Grusa to compete with the great maritime powers." 
 GRS_naval_reform_state_0:0 "§tPathetic§!"
