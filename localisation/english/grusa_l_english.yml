 GRS_diplomatic_mission:0 "Send Diplomatic Mission"
 GRS_economic_investment:0 "Invest in Vega"
 GRS_military_advisors:0 "Send Military Advisors"
 GRS_support_of_unification:0 "Grusan influence in Vega"
 GRS_support_of_unification_desc:0 "Grusa and Vega have been rivals ever since the former broke away from the Grusan empire; And yet the people of each nation are so alike. Under old leadership unification would never happen, but under Xavier's guidance, we may now undertake efforts to persuade the Vegan people and her majesty, Alina Verde, that we should put aside our differences once and for all and unite again as one. That is if the Vegans allow unification to happen.\n\n§YCurrent Influence in Vega:§! [?GRS_influence_VEG]"
 GRS_secret_propaganda_missions:0 "Secret propaganda missions"
 GRS_continued_outreach:0 "Continued diplomatic outreach"
 GRS_economic_cooperation:0 "Trade goods"
 GRS_cultural_exchange:0 "Cultural exchange"
 GRS_demand_referendum:0 "Demand a referendum"
 
 
 
 GRS_sagittarius_category:0 "Influence over the Sagittarius Strait"
 GRS_sagittarius_category_desc:0 "The Sagittarius Strait remains fiercely contested between Grusa and Centauri. If we are to continue tolling merchant vessels we must proceed carefully; excessive tolls or the seizure of foreign cargo will anger the powers that rely upon the strait, whilst scaling back tolling will slowly allow Centauri to strengthen its influence over the region. These competing pressures must be carefully managed if we seek to maintain our dominance over the Sagittarius.\n\nCurrent Toll Policy: [GRS_toll_level_text]\nCurrent Strait Control: [GRS_control_level_text]"
 
 
 GRS_inspect_foreign_merchants:0 "Inspect Foreign Merchants"
 GRS_inspect_foreign_merchants_desc:0 "Merchant traffic through the strait shall be subjected to inspections and searches by Grusan sailors."
 GRS_escort_friendly_convoys:0 "Escort Friendly Convoys"
 GRS_escort_friendly_convoys_desc:0 "Escorting friendly merchant vessels will improve trade confidence and reinforce our influence over the Sagittarius Strait."
 GRS_naval_crackdown:0 "Naval Crackdown"
 GRS_naval_crackdown_desc:0 "A temporary surge in naval enforcement will restore order and authority throughout the Sagittarius Strait."
 GRS_suspend_toll_collections:0 "Suspend Toll Collections"
 GRS_suspend_toll_collections_desc:0 "An emergency rollback of toll collection policies may calm tensions and restore confidence in Grusan authority."

