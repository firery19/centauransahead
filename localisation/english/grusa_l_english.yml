 # ----- focuses ------
 GRS_accept_the_loss_at_cabo_vesca:0 "Accept the Loss at Cabo Vesca"
 GRS_accept_the_loss_at_cabo_vesca_desc:0 "The disaster at Cabo Vesca remains one of the greatest humiliations in our naval history. It was a decisive defeat that ensured our loss in the Strait War. Rather than dwell upon old memories or fantasise about what might have been, we must learn from our mistakes and rebuild our navy into what it once was: mighty and formidable" 
 GRS_learn_from_errors:0 "Learn from the mistakes"
 GRS_learn_from_errors_desc:0 "We will analyse accounts from the battle, point our fingers at what went wrong, and make adjustments so it never happens again."
 GRS_begin_the_reforms:0 "Begin the reforms"
 GRS_begin_the_reforms_desc:0 "We will start to reform our navy, though it will take time."
 GRS_naval_reform_program:0 "Naval Dockyard Program"
 GRS_naval_reform_program_desc:0 "We will initiate the Naval Dockyard Program, it will allow us to build more dockyards within due time."
 GRS_expand_leopolis_dockyards:0 "Expand Leopolis Dockyards"
 GRS_expand_leopolis_dockyards_desc:0 "Leopolis is the beating heart of Grusa, expanding the docks will allow us to build more ships."
 GRS_develop_northern_ports:0 "Develop Northern ports" 
 GRS_develop_northern_ports_desc:0 "Developing our nothern ports will allow us to have a stronger presence on the Sagittarius Strait."
 GRS_libran_dockyards:0 "Libran Ocean dockyards"
 GRS_libran_dockyards_desc:0 "The Libran ocean is vast, if we are to have any impact on the ocean, we will build more dockyards on our Eastern coast."
 GRS_royal_screens:0 "Destroyer Effort"
 GRS_royal_screens_desc:0 "We will put more effort into building smaller screen ships."
 GRS_knights_of_the_libran_ocean:0 "Knights of the Libran Ocean"
 GRS_knights_of_the_libran_ocean_desc:0 "We will put more effort into building Cruisers."
 GRS_restore_the_armada:0 "Restore the Armada"
 GRS_restore_the_armada_desc:0 "We will prioritse battleships over all other vessels."
 GRS_new_grand_armada:0 "The New Grand Amarda"
 GRS_new_grand_armada_desc:0 "We have adapted and moved on from Cabo Vesca. Those lost will never be forgotton but their sacrifice has strengthed our navy to be formidable once again"
 GRS_rapida_class_destroyer:0 "Rapida Class Destroyer"
 GRS_rapida_class_destroyer_desc:0 "Quick, agile and nimble. The Rapida Class destroyers are a more advanced and up-to-date destroyer."
 GRS_arida_class_cruiser:0 "Arida Class Cruiser"
 GRS_arida_class_cruiser_desc:0 "Named after our formidable desert, the Arida Class cruiser is a more advanced and up-to-date cruiser."
 GRS_valentine_class_battleship:0 "Valentine Class Battleship"
 GRS_valentine_class_battleship_desc:0 "Named after Valentine Flamenco, the Valentine Class battleship is a more advanced and lethal Steelpot battleship."
 GRS_new_ship_of_the_line:0 "New Ship of the Line"
 GRS_new_ship_of_the_line_desc:0 "The time has come to develop a new capital ship for the navy. While its final specifications have yet to be decided, one thing is certain. It must surpass even the mighty Super-Steelpots in size, firepower and armour."
 GRS_armour_and_guns:0 "Armour and Guns"
 GRS_armour_and_guns_desc:0 "Before a new warship can be designed, extensive research must be conducted into more modern naval armour and heavier guns."
 GRS_leopolis_class_dreadnought:0 "Leopolis Class Dreadnought"
 GRS_leopolis_class_dreadnought_desc:0 "The Leopolis class will become the pride of the King's Grand Armada. Enormous, heavily armed and exceptionally costly, these dreadnoughts will dominate the seas and destroy any vessel unfortunate enough to challenge them."
 GRS_new_admirals:0 "New Admirals"
 GRS_new_admirals_desc:0 "A new generation of naval leadership is required. Promising officers who have distinguished themselves through skill, discipline and innovation will be elevated to the rank of admiral."
 GRS_expand_naval_academy:0 "Expand the Naval Academy"
 GRS_expand_naval_academy_desc:0 "Our naval academies must be expanded to meet the growing demands of a modern fleet. Better facilities and greater enrollment will ensure a steady supply of capable officers and admirals."
 GRS_prepare_for_an_invasion:0 "Prepare for an Invasion"
 GRS_prepare_for_an_invasion_desc:0 "The wound of Cabo Vesca has not healed. Detailed plans will be drawn up for a future invasion of Centauri, ensuring that when the time comes our forces will be ready."
 GRS_avenge_cabo_vesca:0 "Avenge Cabo Vesca"
 GRS_avenge_cabo_vesca_desc:0 "Grusan sailors perished beneath Centaurian guns at Cabo Vesca. Their sacrifice will not be forgotten, nor will their deaths go unanswered. The time has come to seek justice for the fallen."
 GRS_dominate_the_libran_ocean:0 "Dominate the Libran Ocean"
 GRS_dominate_the_libran_ocean_desc:0 "With our northern rival defeated, the Libran Ocean lies open before us. By expanding our naval presence we will establish unquestioned naval hegemony across the region." 
 GRS_naval_design_bureau:0 "Royal Naval Design Bureau"
 GRS_naval_design_bureau_desc:0 "A dedicated bureau of naval architects, engineers, and strategists has been assembled to oversee the design of future warships. Their work ensures that every vessel launched under the Grusan flag reflects the latest innovations in naval warfare."
 GRS_advanced_gunnery_trials:0 "Advanced Gunnery Trials"
 GRS_advanced_gunnery_trials_desc:0 "The guns of tomorrow cannot be forged through theory alone. Extensive testing and live-fire exercises will reveal the strengths and weaknesses of our newest naval artillery."
 GRS_admiralty_reforms:0 "Admiralty Reforms"
 GRS_admiralty_reforms_desc:0 "The structure of the Admiralty has been modernised and streamlined. A more efficient command system will allow our officers to respond to threats with greater speed and flexibility."
 GRS_fleet_war_games:0 "Fleet War Games"
 GRS_fleet_war_games_desc:0 "Large-scale naval exercises have become a regular occurrence. These war games allow officers to test new tactics, improve coordination, and prepare for future conflicts."
 GRS_marine_assault_training:0 "Marine Assault Training"
 GRS_marine_assault_training_desc:0 "Specialised assault forces have begun training for large-scale amphibious operations. These elite formations will spearhead future landings upon hostile shores."
 GRS_amphibious_logistics:0 "Amphibious Logistics"
 GRS_amphibious_logistics_desc:0 "A successful invasion depends not only upon ships and soldiers, but upon the ability to sustain them. Improved logistical planning ensures our forces remain supplied even during prolonged overseas operations."
 GRS_study_naval_armour:0 "Study Naval Armour"
 GRS_study_naval_armour_desc:0 "Armour is the backbone of any modern ship, inadequate armour, or adding it to the wrong places will put Grusan sailors at risk. Studying why and where armour should and should not be welded too is critical to warship design." 
 GRS_begin_production_of_aeroplanes:0 "Begin Production of Aeroplanes"
 GRS_begin_production_of_aeroplanes_desc:0 "Aircraft are rapidly becoming a prominent feature of modern warfare. Grusa must establish a domestic aviation industry before it is left behind."
 GRS_desert_flight_training:0 "Desert Flight Training"
 GRS_desert_flight_training_desc:0 "The skies above Arida provide ideal conditions for training skilled pilots capable of operating in even the harshest environments."
 GRS_construction_of_air_bases:0 "Construction of Air Bases"
 GRS_construction_of_air_bases_desc:0 "An air force requires more than aircraft alone. New airfields will provide the infrastructure needed to launch our aircraft."
 GRS_flying_artillery:0 "Flying Artillery"
 GRS_flying_artillery_desc:0 "Aircraft can serve as extensions of the army, striking enemy positions and supporting troops from above."
 GRS_royal_fighter_squadron:0 "Royal Fighter Squadron"
 GRS_royal_fighter_squadron_desc:0 "Elite fighter pilots will form the backbone of our growing air force, defending Grusan skies and challenging enemy aircraft."
 GRS_streamline_domestic_production:0 "Streamline Domestic Production"
 GRS_streamline_domestic_production_desc:0 "By standardising designs and coordinating industrial efforts, we can greatly increase the efficiency of aircraft production."

 
 
 GRS_deport_disloyal_vegans:0 "Deport Vegan Loyalists"
 GRS_deport_disloyal_vegans_desc:0 "We will deport any Vegans who are not loyal to Grusa. Their insolence will not be tolerated and they will be forcefully sent to our neighbours." # I LOVE LARPING
 
