# --- IDEAS ---
 GRS_desert_warriors_idea:0 "Desert Warriors"
 GRS_desert_warriors_idea_desc:0 "Grusa is the only nation on Centaura with the vast Arida Desert covering the majority of their lands. The Grusan people have learned to overcome the harsh challenges of the desert climate."
 
 GRS_masters_of_the_arida_idea:0 "Masters of the Arida"
 GRS_masters_of_the_arida_idea_desc:0 "To outsiders the Arida is an unforgiving and hostile wasteland. To us it is our home, our soldiers have learned to live, move, and fight within it, turning the desert into a decisive advantage against any who dare cross it."
 
 GRS_the_flamenco_dynasty_idea: "The Flamenco Dynasty"
 GRS_the_flamenco_dynasty_idea_desc: "The Flamenco’s have ruled Grusa for centuries. They hold uncontentested power over Grusa."

 GRS_devastation_at_cabo_vesca_idea:0 "Devastation at Cabo Vesca"
 GRS_devastation_at_cabo_vesca_idea_desc:0 "The naval engagement at Cabo Vesca, 1868, left the Grusan fleet crippled and subsequently led to Grusa losing the Strait War. The navy's confidence never truly recovered, despite being formidable on paper, the navy's will to fight remains uncertain."
  
 GRS_reforming_navy_0:0 "Pathetic Naval Reforms"
 GRS_reforming_navy_0_desc:0 "The humiliation at Cabo Vesca shattered confidence in the Grusan Navy. Decades of poor management and outdated doctrine have left the fleet a shadow of its former self."

 GRS_reforming_navy_1:0 "Reforming Navy"
 GRS_reforming_navy_1_desc:0 "Attempts at reform have begun, but the navy remains plagued by incompetence and outdated practices."

 GRS_reforming_navy_2:0 "Recovering Navy"
 GRS_reforming_navy_2_desc:0 "The first reforms have shown promise. Supply chains and officer standards are slowly improving."

 GRS_reforming_navy_3:0 "Reorganized Navy"
 GRS_reforming_navy_3_desc:0 "The navy has begun adopting modern doctrines and command structures, greatly improving coordination."

 GRS_reforming_navy_4:0 "Modernizing Armada"
 GRS_reforming_navy_4_desc:0 "Grusa's dockyards and naval academies are once again producing capable ships and officers."

 GRS_reforming_navy_5:0 "Resurgent Grand Armada"
 GRS_reforming_navy_5_desc:0 "The Grand Armada has largely recovered from its historic humiliation and now stands among the strongest fleets in the region."

 GRS_new_grand_armada:0 "The New Grand Armada"
 GRS_new_grand_armada_desc: "We no longer bear the shame of the humiliation of our defeat at Cabo Vesca. That chapter has been closed. We have moved on, adapted, and modernised where we had faltered. From the lessons of defeat, a stronger navy has been forged, disciplined, resolute, and unyielding. The Grusan flag flies high upon the seas once more, carried by ships worthy of our name. Our naval pride, once thought lost, has returned renewed, and with it, the will to command the waters as we did before."

 GRS_new_grand_armada2:0 "The New Grand Armada"
 GRS_new_grand_armada2_desc: "We no longer bear the shame of the humiliation of our defeat at Cabo Vesca. That chapter has been closed. We have moved on, adapted, and modernised where we had faltered. From the lessons of defeat, a stronger navy has been forged, disciplined, resolute, and unyielding. The Grusan flag flies high upon the seas once more, carried by ships worthy of our name. Our naval pride, once thought lost, has returned renewed, and with it, the will to command the waters as we did before."

 GRS_new_grand_armada3:0 "The New Grand Armada"
 GRS_new_grand_armada3_desc: "We no longer bear the shame of the humiliation of our defeat at Cabo Vesca. That chapter has been closed. We have moved on, adapted, and modernised where we had faltered. From the lessons of defeat, a stronger navy has been forged, disciplined, resolute, and unyielding. The Grusan flag flies high upon the seas once more, carried by ships worthy of our name. Our naval pride, once thought lost, has returned renewed, and with it, the will to command the waters as we did before."

 GRS_new_grand_armada4:0 "The New Grand Armada"
 GRS_new_grand_armada4_desc: "We no longer bear the shame of the humiliation of our defeat at Cabo Vesca. That chapter has been closed. We have moved on, adapted, and modernised where we had faltered. From the lessons of defeat, a stronger navy has been forged, disciplined, resolute, and unyielding. The Grusan flag flies high upon the seas once more, carried by ships worthy of our name. Our naval pride, once thought lost, has returned renewed, and with it, the will to command the waters as we did before."
 
 GRS_emptiness_of_the_interior:0 "Emptiness of the Interior"
 GRS_emptiness_of_the_interior_desc:0 "The vast Arida consumes the Grusan heartland. Grusa has few places to farm, fewer places to build, and the fishing industry must work overtime to break even."

 GRS_new_grand_armada5:0 "Grusan Naval Hegemony"
 GRS_new_grand_armada5_desc:0 "The humiliation of Cabo Vesca no longer defines us. What was once a symbol of national shame has become the foundation of our resurgence. Through reforms, innovation and unwavering determination and strength, the King's Grand Amarda has been transformed into a force stronger than ever before. The Grusan flag once again flies high across the seas."

 GRS_expanded_naval_academy:0 "Expanded Naval Academy"
 GRS_expanded_naval_academy_desc:0 "The expansion of the Royal Naval Academy has allowed us to train a greater number of officers while raising educational standards throughout the fleet. Future admirals will enter service with a deeper understanding of modern naval warfare, ensuring the Armada remains prepared for the challenges of the new century."
 
 GRS_avenging_cabo_vesca: "Avenging Cabo Vesca"
 GRS_avenging_cabo_vesca_desc: "Centauri will finally learn what defeat truly is. On that fateful day, our brave sailors were cut down by their cannons, their sacrifice left unanswered for far too long. But that time has passed. Today, our vengeance will be enacted. We will not falter, nor will we forget. The Centaurians will be crushed, their strength broken, and what is rightfully ours will be reclaimed. For every life lost, for every name remembered, we will answer with fury."
 
 GRS_the_centimado_idea:0 "The Centimado"
 GRS_the_centimado_idea_desc:0 "The Centimado are responsible for guarding city gates, government buildings and state officials. They are highly trained and disciplined, and will always defend their post."
 
 GRS_desert_aviators:0 "Desert Aviators"
 GRS_desert_aviators_desc:0 "Flying over the Arida desert demands discipline, endurance and skill. Grusan pilots are trained to navigate through sandstorms, extreme temperatures and vast stretches of barren terrain."
 
 GRS_desert_aviators_upgrade:0 "Desert Aces"
 GRS_desert_aviators_upgrade_desc:0 "The harsh skies of Arida has brought forward an elite group of pilots whose skill is unmatched throughout the region."

 GRS_flying_artillery_idea:0 "Air-to-Ground Support"
 GRS_flying_artillery_idea_desc:0 "Aircraft will be used to support ground troops, delivering firepower from above, striking with guns, bombs and any other means at our disposal."
 
 GRS_royal_fighter_squadron_idea: "Royal Fighter Squadron"
 GRS_royal_fighter_squadron_idea_desc: "We will prioritise the formation of a Royal Fighter Squadron, ensuring control of our skies through speed, discipline and superior pilots."

 GRS_centauri_dominance:0 "Centaurian Dominance of the Strait"
 GRS_centauri_dominance_desc:0 "Centauri has established overwhelming influence over the Sagittarius Strait. Merchant captains increasingly defer to Centaurian authority, whilst Grusan patrols struggle to maintain their authority in the strait."

 GRS_centauri_advantage:0 "Centaurian Advantage"
 GRS_centauri_advantage_desc:0 "Centauri maintains a growing advantage within the Sagittarius Strait. Grusan toll collectors face resistance from merchants and regional powers increasingly look toward Centauri as the dominant guarantor of maritime security within the Sagittarius."

 GRS_contested_strait:0 "Contested Strait"
 GRS_contested_strait_desc:0 "Neither Grusa or Centauri possess control over the Sagittarius Strait."

 GRS_grusan_advantage:0 "Grusan Advantage"
 GRS_grusan_advantage_desc:0 "Grusan patrols maintain a respected and effective presence throughout the Sagittarius Strait. Merchant vessels largely comply with toll regulations, strengthening our influence over regional maritime affairs."

 GRS_grusan_strait_dominance:0 "Grusan Dominance of the Strait"
 GRS_grusan_strait_dominance_desc:0 "Grusa stands as the unquestioned master of the Sagittarius Strait. Our tolling fleets dominate regional waters, foreign merchants bow to our authority, and Centaurian influence has been severely weakened."
 
 GRS_low_tolls:0 "Low Strait Tolls"
 GRS_low_tolls_desc:0 "Toll rates across the Sagittarius Strait remain relatively modest. Merchants pass through with little resistance and foreign powers have few reasons to object enforcement."

 GRS_moderate_tolls:0 "Moderate Strait Tolls"
 GRS_moderate_tolls_desc:0 "We have established a balanced tolling policy throughout the Sagittarius Strait. Trade revenues remain healthy whilst foreign merchants and neighbouring powers largely tolerate our presence in the region."
 
 GRS_high_tolls:0 "High Strait Tolls"
 GRS_high_tolls_desc:0 "Toll rates have risen considerably across the Sagittarius. Merchants and foreign governments are becoming increasingly frustrated by our growing demands."
 
 GRS_extortionate_tolls:0 "Extortionate Strait Tolls"
 GRS_extortionate_tolls_desc:0 "The Sagittarius Strait has become a source of immense wealth for Grusa. Merchant captains are subjected to crushing tolls, inspections and arbitrary fees, whilst inflaming regional resentment towards Grusa."
 
