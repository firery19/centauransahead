l_english:
 VEG_alina_verda:0 "Alina Verda"
 VEG_queens_blessing_idea:0 "Legacy of Lucia"
 VEG_queens_blessing_idea_desc:0 "The Vegan state traces its origins to when a succession crisis divided Grusa and a heroic battle when the first Queen and her knights defeated the Grusan army, who were driven back to the Árida desert. Having successfully protected the sovereignty of her state, and with witnesses praising the heroics of the queen, Lucia Verde was given the Astranist name Lyra by a priest, and in honor of the queen, her new state would be named Vega, Lyra's brightest star."
 VEG_protected_by_murus_idea:0 "Protected by Murus"
 VEG_protected_by_murus_idea_desc:0 "The Murus Plateau is a high rocky ridge extending across the Aquila-Vega border. Sometimes nicknamed El Muro, the plateau had been used by the ancient Grusan Empire to fend off any invaders approaching from Aquila. It still serves that purpose, however protecting the new Vegan country rather than the old unified Grusa."
 
 
