 news.caromite.t:0 "Caromites"
 news.caromite.d:0 "Reports of an overpopulation of Caromites have been reported in one of our regions. We should weigh the options we have.\n\nWhat should we do?"
 news.caromite.a:0 "Leave them alone"
 news.caromite.b:0 "Kill them"
 news.caromite.c:0 "Relocate them"
 
