 # grease wars events
 #news.414.t:0 "Lepus Revolts Against Ursa"
 #news.414.d:0 "In the early morning hours, rebels rose up against the Ursan forces stationed in Lepus. It is reported that small skirmishes have been fought within Port Mathieson and Arneb, and the withdrawal of Ursan forces was announced by the Ursan governor of Lepus."
 #news.414.a:0 "We will not be humiliated a second time!"
 #news.414.b:0 "Establish contact with the rebels immediately!"
 news.414.t:0 "The Lepun Spring"
 news.414.d:0 "During a speech in Obnizov, the Ursan governor of the city was speaking to a crowd. The crowd, having had enough of the oppression, turned into a riot that demanded their freedom.\n\nThe riots overwhelmed local Ursan forces, who were forced to retreat. After this, a provisional government of Lepus was declared, and the withdrawal of Ursan forces from Central and East Lepus was announced by the Ursan governor of Lepus."
 news.414.a:0 "This is terrible!"
 news.414.b:0 "Establish contact with Lepus immediately!"
 news.414.c:0 "A new nation?"
 news.1.t:0 "Fall of Alcor"
 news.1.d:0 "The historic and important city of Alcor, originally established by Ursan settlers decades ago, has fallen to Compact forces recently.\n\nIt was an important administrative capital in Canis for Ursa, and the loss of said city will have immediate effects on the control of Canis by Ursan forces."
 news.1.a:0 "Is the end of the Compact-Ursan War coming to an end?"
 news.1.b:0 "This is a successful campaign!"
 news.1.c:0 "We must retake the city!"
 news.2.t:0 "End of the Grease Wars"
 news.2.d:0 "The war in Canis has ended. The war has ended in favor of the Compact Forces, and the countries of Orion and Hydrus have deepened their diplomatic relations.\n\nEmerging from the war is the newest country of Canis, which has also established diplomatic connections with the rest of the Compact forces.\n\nThe defeated Ursan forces are departing from Alcor, fully withdrawing from the continent of Hydra."
 news.2.a:0 "An interesting development."
 news.2.b:0 "We have reclaimed Canis from Ursa."
 news.2.c:0 "A shameful defeat, but we will return."
 news.3.t:0 "Formation of the Dragon Compact"
 news.3.d:0 "After negotiations between the two countries, a new alliance has formed between the Orion Republic and Hydrus. The alliance was preceded by Orionite help to Hydrus, and it was formed in response to recent Ursan aggression.\n\nUrsan diplomats were shocked at this turn of events, declining to comment on the new development."
 news.3.a:0 "An interesting development."
 news.3.b:0 "We stand against Ursa"
 news.3.c:0 "The hell? This is an act of aggression!"
 
