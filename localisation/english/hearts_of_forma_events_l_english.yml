 news.409.t:0 "The start of the South Corvus War"
 news.409.d:0 "Corvus has invaded Cetus."
 news.409.a:0 "Interesting development."
 news.409.b:0 "What? Defend the territory!"
 news.409.b2:0 "What? Defend our land!"
 news.409.c:0 "Let this be a quick war."
 news.410.t:0 "Fall of Nauta" # antares
 news.410.d:0 "Nauta, the capital city of Cetus, has fallen to Antares in the recent invasion. The outer defense perimiter of the city with it's many fortifications and trenches fell quickly after a large artillery barrage and a rapid cavalry advance breaching the line. In the urban areas the Cetan Army held on, however due to lacking troops to cover the entire city they were gradually pushed out of the city. The future of Cetus has never been so bleak. Reported from the frontlines by Peter Meirrez 1872-, Marcos Tronnel 1886-, Thomas Emmeiz 1893- and Alan Ujery 1883- "
 news.410.a:0 "Interesting development."
 news.410.b:0 "We shall march to Nauta!"
 news.410.c:0 "This is a disaster!"
 news.410.e:0 "They shall march to Nauta!" # corvus
 news.411.t:0 "Fall of Mira" # antares
 news.411.d:0 "Ever since the beginning of The South Corvus War, the defense of Mira has been called into question because of the lack of funding for practically any defensive fortifications in the south, and now, after years of constant war, Mira fell to the Antarean invaders. The future of Cetus has never been so bleak. Reported from the frontlines by Peter Meirrez 1872-, Marcos Tronnel 1886-, Thomas Emmeiz 1893- and Alan Ujery 1883-"
 news.411.a:0 "Interesting development."
 news.411.b:0 "We shall march to Mira!"
 news.411.c:0 "This is a disaster!"
 news.411.e:0 "Antares has marched to MIRA!" # corvus
 news.412.t:0 "Fall of Nauta" # corvus
 news.412.d:0 ""Cetus is not yet lost!" -Cetan Soldier\n\nToday, Corvun forces fully surrounded and cleared out the last bastion of Cetan Army and Naval resistance along the drydocks of Nauta, falling with them came the fall of Cetus' capital. The battle for the city has left it in ruin as the stalwart opposition of the defenders in defense of their homeland has left no building still standing.\n\nIt is unknown if Cetus can continue to resist, but regardless. Standing amidst the rocks and rubble of the aftermath of the lethal Corvun artillery bombardment, only one thought comes to mind; 'Is there a reason to this madness? Did they have to die?'"
 #news.412.d:0 "Nauta, the capital city of Cetus, has fallen to Corvus after a battle in the historic capital city. Cetus had ordered every unit in the city to fight to the death, but it was not enough to stop the Corvun advance."
 news.412.a:0 "Interesting development."
 news.412.b:0 "Corvus shall march to Nauta."
 news.412.c:0 "This is a disaster!"
 news.412.e:0 "We shall march to Nauta!"
 news.413.t:0 "Fall of Mira"
 news.413.d:0 "Ever since the beginning of The South Corvus War, the defense of Mira has been called into question because of the lack of funding for practically any defensive fortifications in the south, prioritizing the northern front, and now, after years of constant war, Mira fell to the Corvun invaders. The future of Cetus has never been so bleak. Reported from the frontlines by Andreu Doddik 1879-, Rafael Tupy Tavares 1864-, Diego Nistikk 1866-, Diego Ob 1894-, Josef Lionnarda 1891-, Juan Lopez 1889-1957, Eduardo Mongglo 1894- and Hilario Trombley 1892-"
 news.413.a:0 "Interesting development."
 news.413.b:0 "Corvus has marched to MIRA!"
 news.413.c:0 "This is a disaster!"
 news.413.e:0 "We shall march to MIRA!"
 news.415.t:0 "Fall of Multa"
 news.415.d:0 "Multa, the biggest city in South Corvus, has recently been taken by Corvun forces, with merely battalions of Cetan resistance scrambling to form defense around southern outskirts.\n\nDiplomats and military strategists across Forma are left in shock as the Corvun advance has moved at an unprecedented speed.\n\n The Cetan monarchy had refused to give a statement so far, but most interviewed officers can agree on one thing – this is only the beginning."
 news.415.a:0 "Interesting development."
 news.415.b:0 "This is a disaster!"
 news.415.c:0 "This is a historic moment."
 news.416.t:0 "Fall of St. Kirk"
 news.416.d:0 "The South Corvus War had officially entered Cetus Proper, as yesterday the Corvus forces took full control of St. Kirk.\n\nKnown for it’s position as a gate between Cetan and Corvun civilisations for many centuries, the city’s fall had effectively shattered any hopes for a ceasefire between the countries, as the Cetan monarchy declares total war."
 news.416.a:0 "Interesting development."
 news.416.b:0 "This is a disaster!"
 news.416.c:0 "This is a historic moment."
 news.417.t:0 "Fall of Carran"
 news.417.d:0 "Carran fell to Corvus. Sorry I can't really write these."
 news.417.a:0 "Interesting development."
 news.417.b:0 "This is a disaster!"
 news.417.c:0 "This is a historic moment."
 news.421.t:0 "Fall of Carran"
 news.421.d:0 "Carran fell to Antares"
 news.421.a:0 "Interesting development."
 news.421.b:0 "This is a disaster!"
 news.421.c:0 "This is great!"
 news.418.t:0 "Sack of Menkar"
 news.418.d:0 "Known unofficially by many as the inland capital of Cetus, Menkar lies in ruins. Corvun troops had entered the city after the mayor’s surrender who had hoped to avoid bringing the city to ruin, but instead of his wishes being followed, the city is currently being ransacked by it’s invaders.\n\nIt is sure the high command will attempt to stop the destruction due to Menkar’s important railway connections, but it is unknown how fast they will be."
 news.418.a:0 "Interesting development."
 news.418.b:0 "This is a disaster!"
 news.418.c:0 "Take everything you see!"
 news.418.d:0 "This is a tactical victory!"
 news.419.t:0 "Fall of Menkar"
 news.419.d:0 "Known unofficially by many as the inland capital of Cetus, Menkar lies in ruins. After a hard fought battle, Antarean troops had entered the city after the mayor’s surrender who had hoped to avoid any further damage to the city. It is currently seen that the Antarean troops are fortifying this strategic location.\n\nThe Cetan high command will likely attempt to retake the city due to Menkar’s important railway connections, but it is unknown how fast they will be."
 news.419.a:0 "Interesting development."
 news.419.b:0 "This is a disaster!"
 news.419.c:0 "This is a tactical victory!"
 news.420.t:0 "Fall of Lycus"
 news.420.d:0 "The South Corvus War had backfired against the Crow. Lycus, the southernmost corvun city as of 1886, had been captured by cetan forces after gruelling weeks of street-to-street fighting. The city’s population, fuelled by hate for being 1886’s greatest victims, brutally defended every inch of their city, leading to extreme civilian casulties.\n\nExperts say this will repeat in all Corvun cities until the last has fallen."
 news.420.a:0 "Interesting development."
 news.420.b:0 "Thats good."
 news.420.c:0 "We have to counterattack!"
 news.422.t:0 "Razing of Ravo"
 news.422.d:0 "The most brutal siege in history of Forma to date had just ended. Cetan newspapers are spreading pictures of Ravo’s mayor, Ernst Nollak, beaten and dragged through ruined cities of Corvus’ capital as a show of total victory over the city. Before the royal family fled the city, they ordered defending the city to the last man, an order that was largely followed as scattered reports suggest even the king’s son took part in the fighting.\n\nMajority of the city had been levelled by constant artillery, explosives and gunfire. Majority consider this the end of Corvus."
 news.422.a:0 "Interesting development."
 news.422.b:0 "This is our victory!
 news.422.c:0 "We are cooked son"
 news.423.t:0 "Fall of Port Dramon"
 news.423.d:0 "An important city which connects Ravo and Kraz by sea and the islands off the coast of Corvus, Port Dramon, has fallen to Cetan forces.\n\nA fierce battle was fought, with even the Corvun navy participating in the battle, shelling the Cetan positions. In the end, the Corvun ships were sunk by arriving Cetan ships and the city fell to Cetan forces."
 news.423.a:0 "Interesting development."
 news.423.b:0 "This is a tactical victory!"
 news.423.c:0 "We have to retake it!"
 news.424.t:0 "Fall of Kraz" # variant, Ravo has not fallen
 news.424.d:0 "Unexpectedly, the second most important city in Corvus, Ravo has fallen to Cetan forces. Currently, the Corvun forces are moving to counterattack and recapture the city while Cetan troops remain to fortify their positions.\n\nIt remains to be seen what will happen in the coming days."
 news.424.a:0 "Interesting development."
 news.424.b:0 "What? We took Kraz without taking Ravo?"
 news.424.c:0 "Its over"
 news.425.t:0 "Fall of Kraz"
 news.425.d:0 "In what is considered by many as an end to the South Corvus War, Kraz has fallen to the Cetan army. The royal family of Corvus had narrowly fled to Antares with the combined help of whatever was left of the Corvun navy and the diplomatic pressure of the Antarean government.\n\nMany can expect news of corvun surrender within following weeks, if not days."
 news.425.a:0 "Interesting development."
 news.425.b:0 "It's over for Corvus."
 news.425.c:0 "It's over"
