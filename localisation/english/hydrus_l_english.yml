 # ideas
 HYS_recently_independent_idea:0 "Recently Independent"
 HYS_recently_independent_idea_desc:0 "The nation of Hydrus is a new country, having just recently gained independence from the Federation of Ursa a year ago, a consequence of the weakening hold of Ursa on Hydra."
 HYS_new_army_idea:0 "Recently Established Army"
 HYS_new_army_idea_desc:0 "Hydrus did not have much time to create a professional army, only having militias and a handful of trained infantry."
