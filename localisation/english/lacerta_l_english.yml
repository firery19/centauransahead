 # generic
 LAC_industrial_effort:0 "Industrial Effort"
 LAC_industrial_effort_desc:0 "Focus all our political efforts on building up the civilian industry in a great leap forward."
 LAC_industrial_effort_2:0 "Industrial Effort II"
 LAC_industrial_effort_2_desc:0 "With iron will and a relentless work ethic, we can mobilize the people in another great industrial effort."
 LAC_construction_effort:0 "Construction Effort"
 LAC_construction_effort_desc:0 "Civilian industrial capacity must not be underestimated even when war looms over the world."
 LAC_production_effort:0 "Armament Effort"
 LAC_production_effort_desc:0 "If you can build tractors, you can build tanks! We must not allow our military production capacity to lag behind."
 LAC_construction_effort_2:0 "Construction Effort II"
 LAC_construction_effort_2_desc:0 "Continuing to expand our factories will allow us to speed up production of goods for trade and further construction efforts."
 LAC_production_effort_2:0 "Armament Effort II"
 LAC_production_effort_2_desc:0 "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
 LAC_production_effort_3:0 "Armament Effort III"
 LAC_production_effort_3_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
 LAC_infrastructure_effort:0 "Infrastructure Effort"
 LAC_infrastructure_effort_desc:0 "A country without proper infrastructure cannot pursue advanced projects or constructions. Like Lacerta."
 LAC_infrastructure_effort_2:0 "Infrastructure Effort II"
 LAC_infrastructure_effort_2_desc:0 "Extending our infrastructure further will enable the transports and communications necessary for high-tech clandestine projects."
 LAC_construction_effort_3:0 "Construction Effort III"
 LAC_construction_effort_3_desc:0 "Expansion of our infrastructure network has significantly improved our capacity for construction."
 LAC_nuclear_effort:0 "Nuclear Effort"
 LAC_nuclear_effort_desc:0 "Standing on the edge of a world-changing discovery, we cannot let others light the fire that may one day consume the Earth."
 LAC_extra_tech_slot:0 "Extra Research Slot"
 LAC_extra_tech_slot_desc:0 "Our industrial expansion and other recent advances might allow us to conduct more R&D in parallel."
 LAC_extra_tech_slot_2:0 "Extra Research Slot II"
 LAC_extra_tech_slot_2_desc:0 "The rapid industrialization of our nation has opened up new opportunities in R&D that we should pursue."
 LAC_secret_weapons:0 "Secret Weapons"
 LAC_secret_weapons_desc:0 "It is tempting to expend all extra resources into developing tanks and planes, but the secret to winning wars lies in whole new fields of science; electronics, rocketry and nuclear research."
 