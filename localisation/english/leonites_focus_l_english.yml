 leo.9181.t:0 "A Change Of Leadership?"
 leo.9181.d:0 "As the Leonite Empire regains more of its lost lands, the GAP's internal infighting has escalated. The Cyrus Faction—headed by the Grand Regent-Marshal himself—and the Persea Bar Faction have entered into a fierce struggle for leadership. On the one hand, there is the Cyrus Faction. The Grand Regent-Marshal is a brilliant military leader who has led us to freedom and rejuvenation; he also has a strong grasp of Antarean society, which might allow us to receive support from the Antareans. However, the Persea Bar Faction argues that even though he is a great military leader, he lacks the means to lead a stable civilian government. On the other hand, there is the Persea Bar Faction, which consists of intellectuals who gathered at a secret Leonite bar in Persea that promotes Leonite ideals and identity. These people later joined the GAP in the revolt, helping to organize armed revolts and distribute propaganda. Acting as the more logical side of the GAP, they undoubtedly have the skills to stimulate the empire's development. But can they protect the newly revived empire? That remains a big question mark."
 leo.9181.a:0 "Long live the Grand Marshal!"
 leo.9181.b:0 "Hmmmmm, maybe the baby emperor is better."
 leo.9181.c:0 "Cyrus have served his purpose."
 
 leo.9180.t:0 "Victory Over The Occupiers"
 leo.9180.d:0 "After long, fierce fighting, their government finally agrees to a negotiation. The era of the occupiers is finally over, now comes the era of prosperity and greatness. We shall make our country the most advanced and strongest in the world. However, first, we should focus on rebuilding and securing it after the fighting..."
 leo.9180.a:0 "A new future for the Leonites!"
 
 leo.9182.t:0 "Leonite Ultimatum"
 leo.9182.d:0 "Leonites representatives have demanded that we return their rightful land to them, or else their forces will take it back by force. We should carefully weigh our options and make the choice that will benefit us the most."
 leo.9182.a:0 "Sure."
 leo.9182.b:0 "Take it back by force? With what army?" 
 
