 LEO_industrial_effort:0 "Industrial Effort"
 LEO_industrial_effort_desc:0 "Focus all our political efforts on building up the civilian industry in a great leap forward."
 LEO_industrial_effort_2:0 "Industrial Effort II"
 LEO_industrial_effort_2_desc:0 "With iron will and a relentless work ethic, we can mobilize the people in another great industrial effort."
 LEO_construction_effort:0 "Construction Effort"
 LEO_construction_effort_tt:0 "Not enough building slots for §YCivilian Factories§!"
 LEO_construction_effort_desc:0 "Civilian industrial capacity must not be underestimated even when war looms over the world."
 LEO_production_effort:0 "Armament Effort"
 LEO_production_effort_tt:0 "Not enough building slots for §YMilitary Factory§!"
 LEO_production_effort_desc:0 "If you can build tractors, you can build tanks! We must not allow our military production capacity to lag behind."
 LEO_construction_effort_2:0 "Construction Effort II"
 LEO_construction_effort_2_desc:0 "Continuing to expand our factories will allow us to speed up production of goods for trade and further construction efforts."
 LEO_production_effort_2:0 "Armament Effort II"
 LEO_production_effort_2_desc:0 "Trying to adapt civilian factories to produce military equipment is inefficient. We should focus on preparing military production now."
 LEO_production_effort_3:0 "Armament Effort III"
 LEO_production_effort_3_desc:0 "Continued efforts to expand our military factories are necessary to meet the demands for new equipment."
 LEO_infrastructure_effort:0 "Infrastructure Effort"
 LEO_infrastructure_effort_desc:0 "A country without proper infrastructure cannot pursue advanced projects or constructions."
 LEO_infrastructure_effort_tt:0 "Not enough building slots for §YInfrastructure§!"
 LEO_infrastructure_effort_2:0 "Infrastructure Effort II"
 LEO_infrastructure_effort_2_desc:0 "Extending our infrastructure further will enable the transports and communications necessary for high-tech clandestine projects."
 LEO_construction_effort_3:0 "Construction Effort III"
 LEO_construction_effort_3_desc:0 "Expansion of our infrastructure network has significantly improved our capacity for construction."
 
 LEO_lion_rises:0 "The Lion Rises"
 LEO_lion_rises_desc:0 "The Lion's spirit is unbreakable, the leonites have endured through great hardship and oppression, but our mind remain resilient. Today is the day we'll rise again, against the imperialists that have stepped on us for too long!"
 
 LEO_break_eagles_chain:0 "Break The Eagle's Chain"
 LEO_break_eagles_chain_desc:0 "Our people in Aquila shall rise up and break the eagle's chain, the dirty Aquilans will not occupy the lion's land anymore!"
 
 LEO_unshackle_whales_chains:0 "Unshackle Ourself From The Whale"
 LEO_unshackle_whales_chains_desc:0 "Our people in Cetus shall rise up and break the whale's chain, those bastard Cetans will not occupy the lion's land anymore!"
 
 LEO_lion_victory:0 "The Victory The Lion Deserves"
 LEO_lion_victory_desc:0 "Finally, after everything we went through, we're freed from their grips..."
 
 LEO_restore_emperor:0 "Restore The Emperor To His Rightful Thorne"
 LEO_restore_emperor_desc:0 "With our victory, it's time to restore his majesty to his thorne. Long live the Emperor!"
 
 LEO_gap_conference:0 "Future Of The Lion?"
 LEO_gap_conference_desc:0 "We're our own master now, we decide our own future!"
 
 LEO_reclaim_our_lands:0 "Reclaim Our Lands"
 LEO_reclaim_our_lands_desc:0 "We must liberate our people, free our people from our oppressors! No Leonites shall be left behind."
 
 LEO_marshal_cyrus:0 "Long Live The Marshal!"
 LEO_marshal_cyrus_desc:0 "The Persea Bar Faction and the Cyrus Faction have reached a compromise, the marshal will continue to lead the nation while the PBF will control domestic issues."
 
 LEO_contact_antares:0 "Contact Antares"
 LEO_contact_antares_desc:0 "With Cyrus's deep knowledge of the Antareans, we might be able to ask for and receive their aid to help develop the country."
 
 LEO_ant_equipment_supply:0 "Ask For Antarean Equipments"
 LEO_ant_equipment_supply_desc:0 "With their support, we're able to upgrade our armies with Antarean guns, boosting our combat effectiveness."
 
 LEO_ant_military_advisor:0 "Antarean Military Advisor"
 LEO_ant_military_advisor_desc:0 "The Antarean have an impressive military, their advisors will bring their tactics and training to our soldiers, improving the arm forces."
 
 LEO_expand_ant_support:0 "Ask For Economic Aid"
 LEO_expand_ant_support_desc:0 "The Antareans have valuable experience on Industrialising, we can have a easier time improving our industrial capability if we receive their aid."
 
 LEO_ant_economic_adviser:0 "Antarean Economic Advisor"
 LEO_ant_economic_adviser_desc:0 "By receiving their advisors and will be able to speed up our Industrialising efforts."
 
 LEO_ant_leo_trade:0 "Trade Agreement"
 LEO_ant_leo_trade_desc:0 "This agreement will let allow us to import even more Antarean goods, flooding our markets with their domestic goods and technology."
 
 LEO_revive_leonite_culture:0 "Revive The Leonite Culture"
 LEO_revive_leonite_culture_desc:0 "Under the oppressors, our own culture was slowly fading away. Now that we are free from their rule, we must remind our people of our way of life."
 
 LEO_form_culture_youth:0 "Form The Lion's Youth"
 LEO_form_culture_youth_desc:0 "The Lion's Youth will introduce the Leonite way of life to our younger population, igniting their national pride at a young age."
 
 LEO_our_way_of_life:0 "Our Way Of Life"
 LEO_our_way_of_life_desc:0 "We must remind our fellow Leonites about our culture and history; the prosperity we once had and the oppression we endured shall not be forgotten!"
 
 LEO_internal_security:0 "Internal Security"
 LEO_internal_security_desc:0 "National security is important to protect ourself from potential enemies, we shall not allow people with ulterior motives staboge our nation."
 
 LEO_secret_police:0 "Empowering The Secret Police"
 LEO_secret_police_desc:0 "For security and stability reasons, the secret police must receive more jurisdiction and power."
 
 LEO_purge_gap_infighting:0 "Tying Loose Ends"
 LEO_purge_gap_infighting_desc:0 "There are bad eggs among us, people who questions Cyrus decisions, these people have no place here..."
 
 LEO_lion_reborn:0 "The Lion Reborn"
 LEO_lion_reborn_desc:0 "Under Cyrus, the once fading ideals and forgotten histories have been revived, the grand legacy of the Leonite Empire has been preserved, and the future of the lion burns brighter than ever."

 LEO_develop_lion_nest:0 "Develop The Lion's Nest"
 LEO_develop_lion_nest_desc:0 "The liberated lands are greatly underdeveloped, lack of industrial capabilities and are mostly just farm lands, we must catch up with the rest of the world to prevent another partition."
 
 LEO_expand_steel_mine:0 "Expand The Steel Mines"
 LEO_expand_steel_mine_desc:0 "The southwestern lands are enriched in steel, we will open more mines and strengthen resource extraction to boost our development."
 
 LEO_expand_tungsten_mine:0 "Expand The Tungsten Mines"
 LEO_expand_tungsten_mine_desc:0 "The southernmost lands are enriched in tungsten, we will open more mines and strengthen resource extraction to boost our development."
 
 LEO_ant_foreign_investment:0 "Attract Antarean Investment"
 LEO_ant_foreign_investment_desc:0 "While the potential of our economy is endless, the current state of it means that the buildup is going to take time if we are to do it ourselves. A quicker way to turbocharge our economy would be to bring external capital into the country by way of joint ventures."
 
 LEO_expand_national_research:0 "Expand National Research"
 LEO_expand_national_research_desc:0 "Our industrial expansion and other recent advances might allow us to conduct more R&D in parallel."
 
 LEO_redistribute_non_leonite_lands:0 "Redistribute Non-Leonite Lands"
 LEO_redistribute_non_leonite_lands_desc:0 "Most of our farmlands are in the hands of foreign, non-Leonites. This injustice has caused many of our farmers to work under non-Leonites. We must reclaim these lands and redistribute them to our people, the fruits of our labor should only benefit our people."
 
 LEO_fund_leonite_enterprises:0 "Funding Leonite-owned Industries"
 LEO_fund_leonite_enterprises_desc:0 "By funding and promoting Leonite-owned Industries, we can encourage our people to start businesses and ensure our economic independence."
 
 LEO_ant_invite:0 "Deepen Our Friendship"
 LEO_ant_invite_desc:0 "The Antarean support is vital. We must continue to deepen our bonds, ensuring our development and protection."
 
