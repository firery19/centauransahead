l_english:
#characters
 LGS_guard_duke:0 "Duke Guard IV"
#ideas
 LGS_industry_name:0 "Minimal Industrialization"
 LGS_industry_name_desc:0 "Lingstonia is a small and deeply isolated country, and has yet to start industrialization. There are a few small manufactories in the lowlands and urban centres, but the rest of the country is still very much pre-industrial."
 LGS_industry_2_name:0 "Lingstonian Industrialization"
 LGS_industry_2_name_desc:0 "Lingstonia has started the process of industrializing, but it will take time to develop and modernize the country which has been isolated for so long."
 LGS_industry_3_name:0 "Lingstonian Industry"
 LGS_industry_3_name_desc:0 "Lingstonia has developed a strong industrial base, and is now able to produce a wide variety of goods and machines domestically. Together with abundant natural resources, Lingstonia has become a self-sufficient and industrialized country.
 LGS_army_name:0 "Outdated Army"
 LGS_army_name_desc:0 "The Grand Army of Lingstonia is in no way grand. Stuck in the previous century, it is small and poorly supplied with outdated equipment. It is in desperate need of reform and modernization if we want to defend ourselves in the future."
 LGS_army_2_name:0 "Reforming the Army"
 LGS_army_2_name_desc:0 "The army of Lingstonia is being reformed, reorganized and expanded to be a more capable force."
 LGS_army_3_name:0 "Grand Army of Lingstonia"
 LGS_army_3_name_desc:0 "The Grand Army of Lingstonia has gone through a thorough reform and expansion, and has become the fiercest army in Central Centaura. It is very much ready to defend and conquer in the name of Lingstonia"
 LGS_navy_name:0 "No Naval Capabilities"
 LGS_navy_name_desc:0 "Although Lingstonia has a coastline, the tiny navy that the Duchy had was disbanded decades ago due to there being little reason for the country to have one. In the comming years, this might have to change but for now Lingstonia is a naval non-entity."
 LGS_navy_2_name:0 "Establishing a Navy"
 LGS_navy_2_name_desc:0 "Lingstonia has refounded its navy, yet it is still small and lacks experience. There is still work to be done to create a navy ready to fight against Lingstonia's adversaries."
 LGS_navy_3_name:0 "Grand Armada of Lingstonia"
 LGS_navy_3_name_desc:0 "The Grand Armada of Lingstonia has not only been re-established, but is also more powerfull than it ever was. With a fleet of battleships and a modernized navy, Lingstonia is ready to claim the maritime dominance of the West Centauran Coast."
 LGS_neutral_name:0 "Lingstonian Isolationism"
 LGS_neutral_name_desc:0 "Due to it's geography, Lingstonia is a deeply isolationist country with few outside connections."
 LGS_neutral_2_name:0 "Lingstonian Neutrality"
 LGS_neutral_2_name_desc:0 "Although it has opened up in later years, Lingstonia still maintains a policy of neutrality and non-intervention in the affairs of other countries."
 LGS_solism:0 "§8Solism§!"
 LGS_solism_desc:0 "The state religion of Lingstonia, Solism is a monotheistic religion that worships the sun as a god. It has been the dominant religion in Lingstonia for centuries due to persecution in the other Astranist countries of Centaura. Due to the Solist belief that working when the Sun isn't out is sinful, only the high and clear mountains of the Lingstonian Macers have been the only place in Centaura where a Solist society has established."
#tooltip
 LGS_2_slots_tt:0 "Up to §Y2 states§! with at least §G2 available building slots§! gets §G1§! §Ycivilian factory§! and §G1§! §Ymilitary factory§! from this focus."
 LGS_4yp_warning_tt:0 "Failing to get §ROVER§! §R16§! §Ycivilian factories§!, §R5§! §Gmilitary factories§!, and §R3§! §2dockyards§! before the idea times out will §Rlock you out§! from finishing the §YFour Year Plan§! and upgrading the industry national spirit."
 LGS_units1_tt:0 "Three §Gexpanded§! §YTerritorial Brigades§! will be raised."
 LGS_units2_tt:0 "Two §Gexpanded§! §YInfantry Divisions§! and one §Gexpanded§! §YMountaineer Division§! will be raised."
 LGS_chronos_tt:0 "§YThe Empire of Cetus§! transfers a §YChronos Class§! ship"
 CET_approval_tt:0 "§R[CET.GetName] must approve of the agreement for bonuses to take effect.§!\n"
 CLB_approval_tt:0 "§R[CLB.GetName] must approve of the agreement for bonuses to take effect.§!\n"
 AQU_war_tt:0 "§CWe will §Gjoin§! any war that Aquila is involved in.§!"

#events
 T.LGS.1:0 "Lingstonia Buys Destroyers"
 D.LGS.1:0 "We have been approached by Lingstonia to use our shipyards to build them some screens. The six destroyers will go towards re-establishing the Lingstonian Navy. Although selling ships to a potential adversary might be bad, it would be a great opportunity to make some money."
 A.LGS.1:0 "A great deal!"
 T.LGS.2:0 "Lingstonia Buys Battleships"
 D.LGS.2:0 "We have been approached by Lingstonia to buy some of our older battleships, specifically the two Chronos class ships. In addition, they also want us to build two new Kaitos class ships for them."
 A.LGS.2:0 "The pros outweigh the cons."
 B.LGS.2:0 "Selling Battleships to a potential enemy? Outrageous!"
 T.LGS.3:0 "Cetus Refuses Sale of Battleships"
 D.LGS.3:0 "Cetus has returned a response. They refuse to sell their battleships and to construct any other capital ships for us."
 A.LGS.3:0 "Oh well."
 T.LGS.4:0 "Lingstonia Seeks Claim on Ling Valley Resolved"
 D.LGS.4:0 "Our claims on Lingstonian territory has been an issue since the foundation of the Columban state. This is a good oppourtunity to fix the issue."
 A.LGS.4:0 "Relinquish our Claims"
 B.LGS.4:0 "Who do they think they are?"
 T.LGS.5:0 "Lingstonia Seeks Claim on West Lingstonia Resolved"
 D.LGS.5:0 "The hermit isolated state of Lingstonia reaches out to resolve a claim we had on their territory. This is a good oppourtunity to fix the issue."
 A.LGS.5:0 "Relinquish our Claims"
 B.LGS.5:0 "Who do they think they are?"
 T.LGS.6:0 "Lingstonia Proposes Military Pact"
 D.LGS.6:0 "Lingstonia has approached us with a proposal for a non-aggression pact along with mutual guarantees and military access. This can be a great opportunity to secure our influence over the small duchy."
 A.LGS.6:0 "Accept the Pact"
 B.LGS.6:0 "Decline the Pact"
#focus
 LGS_great_lingstonia:0 "Lingstonia In the 20th Century"
 LGS_great_lingstonia_desc:0 "Lingstonia is the greatest country, but how will we fair in the new century?"
 LGS_shining_example_of_country:0 "Beacon of Centauran Freedom"
 LGS_shining_example_of_country_desc:0 "Our country is a shining example of a stable constitutional monarchy in Centaura, yet we must still reform our country in this new age."
 LGS_deport_everyone_to_ocean:0 "Deport Religious Minorities"
 LGS_deport_everyone_to_ocean_desc:0 "Astranists and Unists are a threat to our nation and have historically been a destablizing factor. For the safety of our country, we must deport them and clear our mountains of their sin!"
 LGS_keep_not_solists_people:0 "Tolerate Non-Solists"
 LGS_keep_not_solists_people_desc:0 "We will accept Astranists, Unists and other religious minorities in our country and work towards ending discrimination."
 LGS_industrialisation:0 "Start Industrialization"
 LGS_industrialisation_desc:0 "Lingstonia is a small and isolated country, yet we cannot fall behind our larger neighbours. We must start the long road to industrialization in our mountainous country."
 LGS_new_rails:0 "The Great Western Railway"
 LGS_new_rails_desc:0 "The Great Western Railway will connect the isolated coastal regions in the west to the rest of the country in the east. This will allow for improved transport within our country, and connect the eastern Lingstonia to the rest of the world through the oceans."
 LGS_self_sufficiency:0 "Ensure Self-Sufficiency"
 LGS_self_sufficiency_desc:0 "Lingstonia has always been a self-sufficient country due to our isolation, and we must ensure our self-sufficiency in an industrialized future."
 LGS_develop_country:0 "Develop The Country"
 LGS_develop_country_desc:0 "Our deep valleys and rough hillsides are some of the most scenic places in the world, but also very underdeveloped. We must expand rural infrastructure and invest in key areas like education to modernize our country for a new age."
 LGS_more_factories:0 "Invest In Industry"
 LGS_more_factories_desc:0 "We will import machines and experts from our more developed neighbours and start building up our own industrial base."
 LGS_resources_spawn:0 "Develop our Resources"
 LGS_resources_spawn_desc:0 "Our country is rich in resources, but we have yet to fully exploit them. We will modernize and expand our mining industry and building the infrastructure required to support it."
 LGS_four_year_plan:0 "Four Year Plan"
 LGS_four_year_plan_desc:0 "To finish our industrialization, we will embark on an ambitious four year plan to build up our industry."
 LGS_year_1_infra:0 "National Infrastructure Project"
 LGS_year_1_infra_desc:0 "We will build up our infrastructure to support our growing industry and connect our country together."
 LGS_year_2_coastal:0 "Develop Coastal Regions"
 LGS_year_2_coastal_desc:0 "Due to our mountainous terrain and isolation, our coastal regions are the least developed parts of our country, but also the ones with the most industrial potential."
 LGS_year_3_light_industry:0 "Light Industry Investment"
 LGS_year_3_light_industry_desc:0 "We will invest in light industry to produce consumer goods and build up our civilian economy."
 LGS_year_4_heavy_industry:0 "Heavy Industry Investment"
 LGS_year_4_heavy_industry_desc:0 "We will invest in heavy industry to produce the machines, tools, and resources we need to be self-sufficient."
 LGS_finish_industry:0 "Finish the Four Year Plan"
 LGS_finish_industry_desc:0 "Our four year plan is complete, and we have built up a strong industry compared to our small nation. Truly, Lingstonia is now ready for the 20th century!"

 LGS_end_isolation:0 "End the Isolation"
 LGS_end_isolation_desc:0 "Lingstonia has been deeply isolationist for centuries due to our geography, but in this new century with rapid advancements we can't stay a hermit duchy anymore."

 LGS_lingston_nationalism:0 "Promote Lingstonian Nationalism"
 LGS_lingston_nationalism_desc:0 "Our great country of Lingstonia is the best country in the entire world, and our people know that."
 LGS_sollist_supremacy:0 "Solist Supremacy"
 LGS_sollist_supremacy_desc:0 "The sun is the greatest power of all, working during the times of night would mean we are giving up our powers towards the darkness."
 LGS_sunshine_rays:0 "Sunshine Academy"
 LGS_sunshine_rays_desc:0 "Research is important! Let us establish the Sunshine Academy as the worlds first Solist university."
 LGS_establish_diplomacy:0 "Establish Diplomatic Channels"
 LGS_establish_diplomacy_desc:0 "With the end of our isolation, diplomatic channels would be important to fostering connections with other countries. While we're at it, we can also request Riaa to relinquish the claims they have on our land."
 LGS_everyone_is_useless:0 "Everyone is Useless"
 LGS_everyone_is_useless_desc:0 "Nevermind. Contacting the outside world was a mistake. Let us just cut ties to the world."
 LGS_formalise_columba:0 "Formalize Columban Diplomacy"
 LGS_formalise_columba_desc:0 "Even during our isolated time period, we would have contact with Columba regardless of what we did. Formalizing connection with Columba would be an important step to connecting with the world."
 
 
 
 
 LGS_save_aquila:0 "Save §3Aquila§!"
 LGS_save_aquila_desc:0 "The people of Aquila are our long forgotten brothers and sisters from the past world, and we must do everything in our power to save them from the Antarean invasion!"
 LGS_liberation_war:0 "§RWar of Freedom§!"
 LGS_liberation_war_desc:0 "Sending volunteers and equipment is not enough: If Antares won't stop their aggression in Aquila, mighty Lingstonia must intervene directly and save Aquila!"

 LGS_military:0 "Address the Outdated Military"
 LGS_military_desc:0 "Our military is not only small and under equipped, but also horribly outdated. We must fix this if we want to defend ourselves and the world from the comming storm."
 LGS_equipment:0 "Equipment Needs"
 LGS_equipment_desc:0 "We will start by addressing our current equipment needs, and make sure our army is fully equipped."
 LGS_units:0 "Expand the Territorial Militia"
 LGS_units_desc:0 "We will expand our militia and reserves to support our regular army in times of war."
 LGS_army_reform:0 "Reform Army Recruitment"
 LGS_army_reform_desc:0 "The current recruitment system is outdated and inefficient. We will reform it to ensure we have a large amount of trained soldiers for the army."
 LGS_regular_units:0 "Expand the Regular Army"
 LGS_regular_units_desc:0 "Our standing army is pitifully small, even for our size: We must expand it with new and reformed formations."
 LGS_mil_factories:0 "Establish Domestic Production"
 LGS_mil_factories_desc:0 "We have for too long relied on foreign companies for our equipment. With the industrial revolution's arrival, we should invest in our domestic production capabilities."
 LGS_better_army:0 "Army Reorganization"
 LGS_better_army_desc:0 "It is time we properly reorganize our army, and finish the army reform."
 LGS_regular_army:0 "A Regular Army"
 LGS_regular_army_desc:0 "We must now decide what kind of army we want. A flexible and large regular army of infantry will be what we need."
 LGS_mountaineer_army:0 "An Army for the Macer"
 LGS_mountaineer_army_desc:0 "We must now decide what kind of army we want. A specialized mountaineer army will be what we need to fight in the great Macer Mountains."
 
 LGS_establish_navy:0 "Establish a Navy"
 LGS_establish_navy_desc:0 "It has been decades since we had a proper navy, but in these times we must once again be able to protect our shores and trade. We will start by buying some older destroyers from our neighbours, and rebuilding our old, rusty and dated cruisers whose hulks haven't been scrapped yet."
 LGS_train_ships:0 "Figure Out How to Navy"
 LGS_train_ships_desc:0 "We have no experience with naval warfare, so we will start by training a small fleet of ships, sailors, admirals and get some foreign advisors to figure out how you really do navy."
 LGS_dockyards:0 "Establish Domestic Naval Industry"
 LGS_dockyards_desc:0 "We can't rely on foreign industries to build our navy. We must establish our own dockyards and naval industry to build up our fleet. The naval works in Icarus are a good place to start, and will build us two modern light cruisers in addition to a dozen torpedoboats."
 LGS_dominate_ianis:0 "To Dominate the Ianis"
 LGS_dominate_ianis_desc:0 "Our fleet mustn't be small and irrelevant: We shall build a fleet strong enough to dominate the entire Ianis ocean!... eventually. For now, a few Cetan battleships will be a good place to start."

 LGS_fascist_lapdog:0 "Fascist Coup"
 LGS_fascist_lapdog_desc:0 "The current leadership of the nation is not prepared for the comming storm, but luckily there are a few who are... A rapid take-over of the capital by force can't go wrong, right?"
 LGS_privatise_everything:0 "Privatise §REverything§!"
 LGS_privatise_everything_desc:0 "With the end of the civil war, it is time to give back to our industrialist supporters and strengthen the state."
 LGS_commie_bastard:0 "Peoples Revolution"
 LGS_commie_bastard_desc:0 "Can you hear the people sing? The miners, the peasants, the workers who toil away while the decadent bourgoise holds yet another lavish feast. It is time for Lingstonia to be a duchy no more, and become the §Rvanguard§! of the forman §Rsocialist revolution!§!"
 LGS_share_one_share_all:0 "Everyone Shares Everything"
 LGS_share_one_share_all_desc:0 "With the end of the civil war, we will establish a true communist economy of the people. Everyone owns nothing, for everyone owns everything."
 LGS_duchy_of_lingstonia:0 "Return to Monarchic Leadership"
 LGS_duchy_of_lingstonia_desc:0 "In these trying times our democratic institutions are being tested. It is time for the Duke to stabilize the country and get more powers... only temporarily, of course."
 LGS_elevate_to_empire:0 "Proclaim the §CEmpire of Lingstonia§!"
 LGS_elevate_to_empire_desc:0 "In order to ensure our security and continuing stability, the Duchy will be reorganized into the first Lingstonian Empire, for a safe and secure society!"
 LGS_three_democracies:0 "Strengthen Lingstonian Democracy"
 LGS_three_democracies_desc:0 "It is time to be boring and play the "historical" democratic path. Lingstonia larp, go!"

 LGS_claim_oculum:0 "The Oculum Islands"
 LGS_claim_oculum_desc:0 "We have long had a strong connection to the Oculum sea, and it is time we claim the islands and area around the sea as our own."
 LGS_claim_north_corvus:0 "Claims on Northern Corvus"
 LGS_claim_north_corvus_desc:0 "Many of our people migrated from Northern Corvus long ago to escape religious persecution. It is time we return."
 LGS_war_corvus:0 "War with Corvus"
 LGS_war_corvus_desc:0 "The deplorable rump-state of a confederation which has been left after Cetus occupied South Corvus will be integrated into our glorious nation."
 LGS_corvo-lingstonian_reich:0 "Proclaim §gCorvo-Lingstonia§!"
 LGS_corvo-lingstonian_reich_desc:0 "We will unite Corvus and Lingstonia into a single great state, and proclaim the Corvo-Lingstonian Empire! Must it last a thousand years! Firstly we will start by taking back land from the puny Cetans who have no reason for controlling such a vast empire."
 LGS_columban_war:0 "The Columban Question"
 LGS_columban_war_desc:0 "The most remote parts of Columba has always had more in common with Lingstonia than the great population centres of northern Columba. It is time we take back what is rightfully ours expand our empire!"
 LGS_integrate_clb:0 "Integrate the Macer Range"
 LGS_integrate_clb_desc:0 "With the lands now in our controll, we will start to integrate this area into our empire."
 LGS_clb_military_pact:0 "Columba-Lingstonian Pact"
 LGS_clb_military_pact_desc:0 "In these troubling times, strengthening our relations with Columba will be important. Signing a military pact with Columba will ensure our security, along with allowing us access to the countries of east Centaura."