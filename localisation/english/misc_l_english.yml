 TITLE_CARD:0 "1.2.0 Update"
 LUCKY_STAR:0 "General Mod Timeline"
 LUCKY_STAR_OVA:0 "More details -->"
 TAKOPIS_ORIGINAL_SIN:0 "1899 - 1901: Hydrus and Lepus gains independence, setting the stage for the Grease Wars.\n\n1902 - 1905: Grease Wars, Ursa VS Orion and allies. Ursa lights oil wells on fire in retreat, causing the Cerberus Oil Fires.\n\n1906: Grease War ends, Orion wins. Canis gains independence from Ursa; Hydrus, Lepus and Canis unite as a Commonwealth.\n\n1908: Corvus invades Cetus to retake lost territory with precious coal mines.\n\n1911: As Corvun supplies dwindle in the war against Cetus, they grows desperate and requests Antarean intervention against Cetus. In return, Corvus agrees to being vassalised by Antares.\n\n1911: Antares invades Cetus. Many naval units flee north to Riaa and Vulpa. Corvus is integrated into Antares as Skorpii Korvus.\n\n1912: Antares attacks Aquila, the "Ring of Fire" holds initial Antarean attacks."#In an attempt to root out Aquilan resistance, Antares begins setting forests ablaze. The fire goes out of control quickly and results in 10% of the country burnt by the end of the year.
 TOKIDOKI_BOSOTTO_ROSHIA_GO_DE_DEDERU_TONARI_NO_ALYA_SAN:0 "Its been a while, hasn't it?" #In this update, Hydrus gets the newest content!! Now you get to play past the Grease Wars with actual focuses.
 BOCCHI_THE_ROCK:0 "Antares Imperium\n- Added integration decisions\n- Added Antarean army focus branch\n- Added more political focuses\n\nHydrus\n- Added a focus tree\n\n----------- Miscellaneous -------------\nMap changes\n- Added more states in North Centaura, Vega and Grusa\n- Terrain changes\n- More water canals\n\nMore things that I don't know. "
 
 #- Added this side panel\n\n- Added coal into the map\n\n- Changed states and strategic regions\n\n- Update tech according to vanilla
 
