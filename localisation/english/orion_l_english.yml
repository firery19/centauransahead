 ORS_OrioniteImperialism:0 "Orionite Imperialism"
 ORS_OrioniteImperialism_desc:0 "Within our past, the Kingdom of Orion was once a great empire, conquering many lands in Hydra that we still own today. We should revisit our past and continue the takeover of the world this time. Though, this may not be popular with the people."
 ORS_OrioniteInterventionism:0 "Orionite Interventionism"
 ORS_OrioniteInterventionism_desc:0 "Orion cannot stand by and watch as other nations tip the balance of power in the world. We will take means to attack any nations that dare threaten it."
 ORS_OrioniteIsolationism:0 "Orionite Isolationism"
 ORS_OrioniteIsolationism_desc:0 "Orion does not need to interfere in other countries affairs. We will look inward and manage our country instead."
 
