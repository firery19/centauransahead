 ria.1.t:0 "Riaa invites us to the North Centauran Alliance"
 ria.1.d:0 "With the threat of Antares invading the nations of the northern Centaura as they have done with the south, Riaa seeks for the north to set aside our differences and join arms to form a united front against the existential threat that is the Antares Imperium. Should we join?"
 ria.1.a:0 "Antares is a threat."
 ria.1.b:0 "We should not involve ourselves."
 
