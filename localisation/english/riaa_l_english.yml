RIA_rural_countryside:0 "Undeveloped Rural Regions"
RIA_rural_countryside_desc:0 "Although the largest cities are rapidly developing, large swathes of the country remains undeveloped and still suffer the scars of the civil war from decades ago."
RIA_industrialisation:0 "Industrialisation Process"
RIA_industrialisation_desc:0 "Riaa is a massive country, and industrialisation has only recently begun. Much development remains to be done."
