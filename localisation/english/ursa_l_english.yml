#Focus Tree
URS_resistance_policy:0 "Continue the Suppression Campaign"
URS_resistance_policy_desc:0 "Even if the colonies resist us, they should know their place under the Ursan boot. We should continue the suppression campagains." 
URS_garrison_help:0 "Lepus Countryside Patrolling"
URS_garrison_help_desc:0 "We should carry out continued patrols in the countrysides of Lepus."
URS_free_repair_focus:0 "Tighter Factory Security"
URS_free_repair_focus_desc:0 "Terrorists may appear at any moment, planting bombs and sabotaging our factory work. Increasing our security around factories could mitigate these problems."
URS_equipment_shipments:0 "Equipment Contracts"
URS_equipment_shipments_desc:0 "Guns are important to every army in the world. We should purchase some guns from other nations."
URS_garrison_reduction:0 "Ursan Self Defense Organizations"
URS_garrison_reduction_desc:0 "Rebels may sometimes cause casualties in ambushes and resistance activities. Establishing these organizations could help mitigate some of these effects."
URS_lepus_destruction:0 "Hangman's Trick"
URS_lepus_destruction_desc:0 "Leaving well trapped contraptions behind, we could activate them and destroy infrastructure before leaving if Lepus decides to rebel against us."
URS_resistance_sweep_units:0 "Minutemen Counter-insurgency"
URS_resistance_sweep_units_desc:0 "Insurgents in our colonies could strike at any moment. Having these minutemen can help us against these rebels."

URS_extraction_policy:0 "Recognize the Looming War"
URS_extraction_policy_desc:0 "The situation in our colonies have been deteriorating rapidly, and we are no idiots to know war could be happening soon."
URS_war_propaganda:0 "Curtail Defeatism"
URS_war_propaganda_desc:0 "Defeat is not an option. We will win any future wars in Hydra through our willpower and strength."
URS_mobolization_act:0 "The National Mobilization Act" # why is it mobolization
URS_mobolization_act_desc:0 "Enacting a mobilization act could prepare us for war."
URS_prevent_economic_collapse:0 "Embracing Autarky"
URS_prevent_economic_collapse_desc:0 "Self sufficiency is important in every nation. We gotta follow in their steps too."
URS_eliminate_dissent:0 "Eliminate Internal Dissent"
URS_eliminate_dissent_desc:0 "Many internal factors in our country have been causing troubles for us recently, talking about some useless "We hate war!" "War will bring no good to our country!". Lets just silence them."
URS_selected_service_act:0 "The Selective Service Act"
URS_selected_service_act_desc:0 "Can we afford to choose our recruits in these trying times? I think not. Let us conscript any man that has working limbs and arms."
URS_factory_enticement:0 "Increasing Colonial Quotas"
URS_factory_enticement_desc:0 "We make use of the industrial capacity and resources in our colonies. But it is not enough, we should increase our quotas in Canis."
URS_factory_moving:0 "Moving Industry to Ursa"
URS_factory_moving_desc:0 "The industrial capacity that resides in our colonies cannot have guranteed security there, as we could lose them at any time. We should move them to the safer Ursan mainland."

URS_counter_resistance_support:0 "The Hydrus Thorn"
URS_counter_resistance_support_desc:0 "The recent independence of Hydrus from us has been an issue. They control parts of the waters leading to Lepus, and we should do something about it."
URS_secure_west_canis:0 "Increase Troop Presence" # < this focus has nothing to do with west canis
URS_secure_west_canis_desc:0 "Showing our troops in public spaces can increase the confidence in our army."
URS_antiwar_orion:0 "Supporting Orionite Anti-War Activities"
URS_antiwar_orion_desc:0 "We have many connections in the internal workings of Orion, and we can use those to great effect by supporting anti-war protests within Orion and stirring discontent within their nation."
URS_cp_resistance_support:0 "Martial Law in West Canis"
URS_cp_resistance_support_desc:0 "Canis has been increasing their resistance towards our rule recently. No longer will we tolerate it. We will enact martial law in the Canis region closest to us and suppress the resistance."
URS_improve_supply:0 "Supply Motorization"
URS_improve_supply_desc:0 "Trucks are revolutionary inventions, faster than horses while being able to carry more supplies. More trucks will benefit us."
#URS_defense_bonus:0 "Our Finest Hour"
URS_defense_bonus:0 "Defensive Plans"
URS_defense_bonus_desc:0 "Planning is an important aspect within the army. If an army never planned, it would never be able to get anything done. We should prepare for any Orionite and Hydrusite attacks."

URS_leave_policy:0 "Abandoning The Colonies"
URS_leave_policy_desc:0 "The situation in the colonies have developed not necessarily to our advantage. To avoid a prolonged conflict with the ever more aggressive rebels in Lepus and Canis, we will begin talks with the leaders of these groups."
URS_holding_referendums:0 "Hold Referendums"
URS_holding_referendums_desc:0 "Let the people decide themselves, do they wish to stay with Ursa?"
URS_establish_transitional_governments:0 "Establish Transitional Governments"
URS_establish_transitional_governments_desc:0 "
URS_end_military_involvement_colonies:0 "End Military Involvement"
URS_end_military_involvement_colonies_desc:0 "
URS_negotiate_peaceful_leaving_hydra:0 "Departing from Hydra"
URS_negotiate_peaceful_leaving_hydra_desc:0 "Let it be known that we do not wish to fight."
URS_internal_affairs:0 "Managing Internal Issues"
URS_internal_affairs_desc:0 "
URS_resolve_protests:0 "Resolving the Domestic Unrest"
URS_resolve_protests_desc:0 "
URS_kill_radical_rioters:0 "Silence Radical Protests"
URS_kill_radical_rioters_desc:0 "Dangerous protestors who wish for an unknown ideology to befall upon Ursa should not be allowed to exist."
URS_approach_hydrus:0 "Approach Hydrus"
URS_approach_hydrus_desc:0 "

URS_radical_path:0 "Radical Uprisings"
URS_radical_path_desc:0 "The government of Ursa has dealt themselves a humilitating blow, leaving the colonies uncontested. This is a sign of a weakening government that cannot handle any threats, and we must take control."
stop_radical_path_ursa_tt:0 "Prevents the focus §Y$URS_radical_path$§! to be taken."
URS_democracy_path:0 "Democratic Transition"
URS_democracy_path_desc:0 "With the rule in Hydra ending, the monarchy has lost most of its power. This is an oppourtunity to transition towards democracy peacefully."
URS_monarchy_path:0 "Continued Monarch Rule"
URS_monarchy_path_desc:0 "Even as we lose our colonial holdings in Hydra, the peace in Ursa has been kept. The monarchy has not fallen."




URS_prelude_grease_war:0 "State of Emergency"
URS_prelude_grease_war_desc:0 "War is imminent."
URS_economy_fixing_kill_peasants:0 "Handle the Peasant Riots" # i also never noticed it said kill peasants 🙏🙏🙏
URS_economy_fixing_kill_peasants_desc:0 "Many peasants in our nation have started rioting against us, causing issues internally. Suppressing these riots could be the only way out."
URS_economy_fixing2:0 "Limit Public Spending"
URS_economy_fixing2_desc:0 "To mitigate the effects of the economic depression, we gotta limit public spending."
URS_economy_fixing:0 "The Economic Freefall"
URS_economy_fixing_desc:0 "Wahhh economic depression is no good for any nation"
URS_economy_fixing3:0 "Farmer Subsidies"
URS_economy_fixing3_desc:0 "We can subsidise our farmers to appease them, whilst getting their crops in return."
URS_economy_fixing_trade_partners:0 "Looking Towards Centaura"
URS_economy_fixing_trade_partners_desc:0 "We should reach out to Antares, the power of south Centaura, and negotiate for a trade deal for guns."
URS_economy_fixing_wartime_pwa:0 "Wartime Public Works"
URS_economy_fixing_wartime_pwa_desc:0 "In times of economic depression and war, employment is an important factor towards recovery. Having this wartime public works company can help us construct infrastructures of war whilst employing many people to work."
URS_alcor_trenching:0 "Securing Our Most Vital Port"
URS_alcor_trenching_desc:0 "[117.GetCapitalVictoryPointName], the closest port city in Canis to the Ursan mainland is fundamentally an important city. We should integrate the city and the region itself to Ursa."

