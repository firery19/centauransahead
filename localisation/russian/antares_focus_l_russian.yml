 ANT_alliance_corvus:0 "Союз с Корвусом"
 ANT_alliance_corvus_desc:0 ""
 ANT_war_with_cetus:0 "Война с Цетусом"
 ANT_war_with_cetus_desc:0 "Видение Кальвина Тау о мире через гегемонию Антареса предполагает вторжение во все остальные страны. Цетус станет первым шагом к миру в Кентавре."
