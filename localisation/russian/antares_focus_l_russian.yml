 ANT_war_with_corvus_desc:0 "Война с Корвусом"
 ANT_war_with_aquila:0 "Война с Аквилой"
 ANT_war_with_aquila_desc:0 "Война с Аквилой"

 confirm_cancel_national_focus:0 "Отменить национальный фокус"
 confirm_cancel_national_focus_progress_loss_singular:0 "Вы потеряете §R$LOST_DAYS$§! день прогресса."
 confirm_cancel_national_focus_progress_loss_plural:0 "Вы потеряете §R$LOST_DAYS$§! дней прогресса."
 confirm_cancel_national_focus_desc:0 "Вы уверены, что хотите отменить национальный фокус §H$FOCUS_NAME$§!?"

 ANT_consolidate_power:0 "Укрепить политическую власть"
 ANT_consolidate_power_desc:0 "Чтобы обеспечить безопасность Империума Антарес и монарха, мы должны подавить внутренних диссидентов, чтобы в конечном итоге начать действовать в соответствии с нашими амбициями. Пока мы будем делать это приемлемыми для Антареанского Сената способами."
 ANT_promote_nationalism:0 "Поощрять антареанский национализм"
 ANT_promote_nationalism_desc:0 "Мы будем поощрять национализм в нашей стране различными способами. Наш народ должен быть наиболее готов вмешиваться в иностранные конфликты во имя Императора."
 ANT_antiextremism:0 "Сокрушить экстремистов"
 ANT_antiextremism_desc:0 "Правление Кальвина ни в коем случае не является абсолютной монархией. Группы повсюду выступают против авторитаризма и поддерживают наши полу-демократические институты. Хотя сейчас мы не можем действовать против большинства из них, есть некоторые экстремисты, которых мы можем раздавить без споров, хотя и на пользу некоторым умеренным группам."
 ANT_monarch1:0 "Усилить национализм"
 ANT_monarch1_desc:0 "С помощью пропагандистских кампаний мы усилим антареанский национализм."
 ANT_monarch2:0 "Возвысить Императора"
 ANT_monarch2_desc:0 "Мы возвысим образ Императора в глазах народа как божественного Императора Человечества. Десятки тысяч молотов на заводах и винтовок на войне будут в руках наших верных и благочестивых граждан Империума."
 ANT_monarch3:0 "Идеологическая обработка населения"
 ANT_monarch3_desc:0 "Последний шаг в нашей идеологической обработке народа. Наш народ должен быть наиболее готов вмешиваться в иностранные конфликты во имя Императора."
 ANT_continue_industrialization:0 "Продолжить индустриализацию"
 ANT_continue_industrialization_desc:0 "Продолжить индустриализацию"
 ANT_support_industrial_research:0 "Поддержать промышленные исследования"
 ANT_support_industrial_research_desc:0 "Поддержать промышленные исследования"
 ANT_research_funding:0 "Увеличить финансирование исследований"
 ANT_research_funding_desc:0 "Увеличить финансирование исследований"
 ANT_fund_universities:0 "Расширить имперские университеты"
 ANT_fund_universities_desc:0 "Расширить имперские университеты"
 ANT_fund_factories:0 "Финансировать заводы"
 ANT_fund_factories_desc:0 "Финансировать заводы"
 ANT_fund_construction_companies:0 "Финансировать строительные компании"
 ANT_fund_construction_companies_desc:0 "Финансировать строительные компании"
 ANT_centralized_industry:0 "Централизованная промышленность"
 ANT_centralized_industry_desc:0 "Для достижения наших внешнеполитических целей нам необходимо значительно расширить промышленные мощности. Самый эффективный и быстрый способ сделать это — создать сильную централизованную промышленность с несколькими высокоразвитыми районами."
 ANT_develop_rural_areas:0 "Развивать сельские районы"
 ANT_develop_rural_areas_desc:0 "Чтобы Антарес действительно имел великую промышленность, мы должны развивать всю страну. Мы начнём масштабную программу по расширению промышленности и развитию всей нации. Это займёт гораздо больше времени и денег, чем централизованная промышленность, однако долгосрочные выгоды будут лучше."
 ANT_expand_euskor_extraction:0 "Расширить сталелитейную промышленность Эускора"
 ANT_expand_euskor_extraction_desc:0 "Для наших предстоящих нужд нам необходимо значительно расширить производство стали. Быстро развивающийся район в бассейне Эускор имеет достаточно железа, угля и уже существующей промышленности, чтобы стать великим промышленным активом."
 ANT_develop_euskor_basin:0 "Развивать бассейн Эускор"
 ANT_develop_euskor_basin_desc:0 "Бассейн Эускор, также известный как Железный Банк, является богатым ресурсами регионом Империума Антарес, расположенным на крайнем востоке провинции Скорпиус. К востоку от города Оседон, соседние поселения, такие как Драусас, Ветус-Итер и Дурум-Соли, процветали благодаря высокой концентрации промышленности в этом районе. Теперь, когда индустриализация охватывает Антарес, регион начинает активно разрабатываться и становится центром растущей антареанской промышленности."
 ANT_euskor_industry:0 "Расширить промышленность Эускора"
 ANT_euskor_industry_desc:0 "Расширить промышленность Эускора"
 ANT_develop_islands:0 "Развивать Южные острова"
 ANT_develop_islands_desc:0 "Наши Южные острова в основном представляют собой неразвитые рыбацкие деревушки, однако с недавними достижениями в промышленном оборудовании мы можем легче вырубать джунгли на этих островах и превращать их в более продуктивные районы."
 ANT_expand_coal_industry:0 "Расширить добычу угля"
 ANT_expand_coal_industry_desc:0 "Для наших будущих и текущих нужд нам необходимо массово расширять добычу угля, как для производства стали, так и для производства электроэнергии."
 ANT_new_mines:0 "Разработать новые шахты"
 ANT_new_mines_desc:0 "Антареанская промышленность испытывает ненасытную жажду к ресурсам. Железо, уголь и различные другие металлы и минералы должны добываться с постоянно возрастающей скоростью, чтобы удовлетворить наши будущие потребности."
 ANT_island_dockyards:0 "Островные верфи"
 ANT_island_dockyards_desc:0 "Наше недавнее освоение южных островов позволяет нам превратить некоторые ключевые естественные гавани в новые верфи, а также расширить уже существующие небольшие порты. Мы принесём промышленную революцию в эти отдалённые уголки Империи!"
 ANT_expand_oil_extraction:0 "Расширить добычу нефти"
 ANT_expand_oil_extraction_desc:0 "Во многих случаях нефть гораздо более гибка, чем уголь. Однако нам не хватало крупного внутреннего источника. Давным-давно на наших южных островах было несколько открытий этого чёрного золота, но только сейчас у нас есть инфраструктура, чтобы должным образом использовать этот источник."
 ANT_clean_cities:0 "Очистить города"
 ANT_clean_cities_desc:0 "Очистить города"
 ANT_deregulate_industrial_sector:0 "Дерегулировать промышленный сектор"
 ANT_deregulate_industrial_sector_desc:0 "Дерегулирование никогда не может привести к ошибкам и не может вызвать проблем и негативных последствий в будущем, верно?"
 ANT_urbanization:0 "Принудительная урбанизация"
 ANT_urbanization_desc:0 "Принудительная урбанизация"
 ANT_connect_urban_areas:0 "Соединить городские районы"
 ANT_connect_urban_areas_desc:0 "Соединить городские районы"
 ANT_new_urban_areas:0 "Новые городские районы"
 ANT_new_urban_areas_desc:0 "Новые городские районы"
 ANT_efficient_farming:0 "Эффективное сельское хозяйство"
 ANT_efficient_farming_desc:0 "Для дальнейшей урбанизации и расширения заводов и рабочей силы нам необходимо сократить количество труда в сельском хозяйстве. Мы сделаем это, сделав сельское хозяйство более эффективным и механизированным, что позволит нам сократить количество фермеров, сохранив при этом производство достаточного количества продовольствия для страны."
 ANT_fund_growth_of_new_cities:0 "Поощрять урбанизацию"
 ANT_fund_growth_of_new_cities_desc:0 "Поощрять урбанизацию"
 ANT_develop_rural_infrastructure:0 "Развивать сельскую инфраструктуру"
 ANT_develop_rural_infrastructure_desc:0 "Развивать сельскую инфраструктуру"
 ANT_national_infrastructure_program:0 "Национальная инфраструктурная программа"
 ANT_national_infrastructure_program_desc:0 "Национальная инфраструктурная программа"
 ANT_mass_industrialization_of_the_country_side:0 "Массовая индустриализация страны"
 ANT_mass_industrialization_of_the_country_side_desc:0 "Массовая индустриализация сельской местности"

 ANT_support_status_quo:0 "Поддержать статус-кво"
 ANT_support_status_quo_desc:0 "Мы будем поддерживать статус-кво в антареанской политике, по крайней мере, пока. Убедив сенат в том, что мы будем способствовать сбалансированной полуконституционной монархии, мы сможем получить больше политической благосклонности."
 ANT_unite_local_identities:0 "Объединить местные идентичности"
 ANT_unite_local_identities_desc:0 "Несмотря на то, что наша нация является одной из самых патриотичных в Форме и объединена уже сотни лет, региональные идентичности всё ещё сильны. Мы должны объединить эти местные идентичности и прекратить распри между четырьмя государствами-учредителями в нашей империи, чтобы укрепить национальную стабильность."
 ANT_emperors_speech:0 "Объявление Императора"
 ANT_emperors_speech_desc:0 "Кальвин размышлял об этом годами. С самого окончания войны с Аквилой десятилетия назад он хотел устранить худшую часть человечества — войну. Его отвращало то, как вид, особенно столь разумный, организованный и технологически развитый, как человечество, может убивать друг друга и причинять столько вреда. Годами он размышлял о том, как положить конец этой жестокости, и теперь у него есть решение. \n Форма будет объединена, а наследие Либерийской империи восстановлено."
 ANT_consolidate_monarchic_powers:0 "К абсолютной монархии"
 ANT_consolidate_monarchic_powers_desc:0 "Объединить Кентавру, а затем и всю Форму, будет нелёгкой задачей. Кальвин решил, что путь к этому — одна, последняя, масштабная война, которая объединит континент под антареанским руководством. Для этого мы должны сначала консолидировать внутреннюю политику, построив в Антаресе истинную абсолютную монархию и лишив власти парламент. Сначала это будет непопулярно, но если есть что-то, что народ Антареса любит больше Империи, так это Императора."
 ANT_strengthen_antarean_democracy:0 "Укрепить демократию"
 ANT_strengthen_antarean_democracy_desc:0 "Объединить Кентавру, а затем и всю Форму, — трудная задача, которую нельзя выполнить грубой силой. Война величайшего масштаба принесёт лишь ещё больше страданий, что противоречит собственным убеждениям Кальвина. Мы должны объединить Форму дипломатически под большей федерацией наций. Однако для этого потребуется создание в Антаресе истинной и стабильной демократии."
 ANT_authoritarian1:0 "Чрезвычайные полномочия монарха"
 ANT_authoritarian1_desc:0 "Чтобы провести все необходимые авторитарные реформы, мы должны консолидировать власть монарха и предоставить Кальвину чрезвычайные полномочия."
 ANT_authoritarian2:0 "Использовать народную поддержку"
 ANT_authoritarian2_desc:0 "Император очень популярен среди народа Антареса. От Лепуса до Ары слышны хвалы Императору. Эта народная поддержка станет решающим фактором, позволяющим Императору создать свою абсолютную монархию."
 ANT_authoritarian3:0 "Агрессивная кампания"
 ANT_authoritarian3_desc:0 "Однако есть много людей, выступающих против этого усиления авторитаризма. Мы должны начать масштабную пропагандистскую кампанию, чтобы поддержка Императора стала бесспорной."
 ANT_authoritarian4:0 "Массовые репрессии"
 ANT_authoritarian4_desc:0 "Мы проведём массовые облавы и рейды на оппозиционные партии и организации. Любые республиканцы или социалисты будут загнаны в подполье."
 ANT_authoritarian5a:0 "Приостановить действие демократических институтов"
 ANT_authoritarian5a_desc:0 "Имея на своей стороне великое большинство народа и сильно ослабленную политическую оппозицию, мы можем временно приостановить действие демократических институтов в Антаресе."
 ANT_authoritarian5:0 "Марионеточный парламент"
 ANT_authoritarian5_desc:0 "Когда порядок восстановлен, Антарес реформирован в сторону авторитаризма, а политическая оппозиция сломлена, мы можем безопасно прекратить приостановку работы парламента и судов. Теперь они надёжно под нашим контролем, и их номинальная поддержка значительно объединит нацию."
 ANT_strengthen_military:0 "Усилить политическую власть военных"
 ANT_strengthen_military_desc:0 "Усиление политической власти военных может быть полезно для нас и наших политических целей."
 ANT_protest1:0 "Разобраться с протестами"
 ANT_protest1_desc:0 "Эта недавно возникшая проблема с протестами должна быть решена, пока она не вышла из-под контроля. Увеличение присутствия полиции и меры принуждения, надеюсь, будут адекватными..."
 ANT_protest2:0 "Ввести военное положение"
 ANT_protest2_desc:0 "Это быстро выходит из-под контроля! При поддержке военных мы объявим ВОЕННОЕ ПОЛОЖЕНИЕ (отсылка на TFR)"
 ANT_protest3:0 "Крупномасштабное полицейское воздействие"
 ANT_protest3_desc:0 "Мы должны усилить меры полиции, чтобы остановить этот кризис! Мы оснастим Столичную полицию Анантерии и другие крупные полицейские округа серьёзным оборудованием для подавления беспорядков, бронежилетами и смертоносным оружием."
 ANT_protest4:0 "Сокрушить оплоты"
 ANT_protest4_desc:0 "Чтобы искоренить эту опасную оппозицию, мы должны нанести удар по их сердцу — по их местам встреч, базам операций и забаррикадированным городским кварталам, где находятся их оплоты."
 ANT_protest5:0 "Пойти на компромисс с народом"
 ANT_protest5_desc:0 "Насилие может вести войну, но не может её закончить. Мы начнём переговоры с лидерами оппозиционных групп и будем работать над прекращением этого хаоса."
 ANT_protest5b:0 "Убить их лидеров"
 ANT_protest5b_desc:0 "Никакого компромисса с нашими врагами! Точечные удары по устранению видных лидеров и символов оппозиции наверняка лишат протестующих эффективного руководства и целей."
 ANT_protest6:0 "Завершить кризис"
 ANT_protest6_desc:0 "Последние несколько месяцев были по-настоящему кровавыми и травматичными для Антареса, но теперь мы наконец видим конец этому хаосу, охватившему нашу страну."
 ANT_military_coup:0 "Военный переворот"
 ANT_military_coup_desc:0 "Протесты и политический кризис длятся слишком долго. Военные — единственная сила, способная восстановить порядок в Антаресе. Как защитники народа, армия должна взять контроль и стабилизировать страну."
 ANT_military_junta:0 "Первый совет Хунты"
 ANT_military_junta_desc:0 "Захватив контроль, мы должны теперь решить, как управлять страной и, что более важно, как сохранить наш контроль."
 ANT_reform_intelligence_service:0 "Реформировать разведывательную службу"
 ANT_reform_intelligence_service_desc:0 "Прошедший период показал, насколько серьёзной может быть внутренняя нестабильность. Наши текущие разведывательные службы слишком дезорганизованы, слишком архаичны и слишком устарели, чтобы эффективно использоваться как во внутренних делах, так и во внешнем влиянии. Мы создадим совершенно новую объединённую организацию для защиты антареанского государства и его интересов."
 ANT_foreign_policy:0 "Пересмотреть внешнюю политику Антареса"
 ANT_foreign_policy_desc:0 "Когда наша внутренняя ситуация и политика надёжно закреплены, мы можем обратить взор вовне, чтобы исполнить амбиции Императора. Мы должны перенастроить нашу внешнюю политику в соответствии с нашими новыми целями завоевания и доминирования."
 ANT_economic_domination:0 "Экономическое доминирование"
 ANT_economic_domination_desc:0 "Экономическое доминирование"
 ANT_controll_neighbouring_economies:0 "Контролировать экономики соседей"
 ANT_controll_neighbouring_economies_desc:0 "Контролировать экономики соседей"
 ANT_centauran_trade_pact:0 "Кентаврийский торговый пакт"
 ANT_centauran_trade_pact_desc:0 "Кентаврийский торговый пакт"
 ANT_subversive_activities:0 "Подрывная деятельность"
 ANT_subversive_activities_desc:0 "Подрывная деятельность"
 ANT_expand_spy_agency:0 "Расширить шпионское агентство"
 ANT_expand_spy_agency_desc:0 "Расширить шпионское агентство"
 ANT_destablize_neighbours:0 "Дестабилизировать соседние страны"
 ANT_destablize_neighbours_desc:0 "Дестабилизировать соседние страны"
 ANT_help_corvus:0 "Углубить дружбу с Корвусом"
 ANT_help_corvus_desc:0 "Наши добрые друзья в Корвусе страдают после потери богатого ресурсами Южного Корвуса. Между нами лежит Империя Цетуса, с которой мы номинально союзны. Однако эта ситуация продлится недолго, и мы укрепим наши отношения с Корвусом, чтобы они могли нанести удар на юг. Тогда мы окажемся в идеальном положении, чтобы извлечь выгоду..."
