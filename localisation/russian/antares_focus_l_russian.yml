 ANT_royal_marrige_desc:0 "Королевский брак"
 ANT_support_help_corvun_military:0 "Расширить корвунскую армию"
 ANT_support_help_corvun_military_desc:0 "Расширить корвунскую армию"

 ANT_prepare_war_industry:0 "Подготовить военную промышленность"
 ANT_prepare_war_industry_desc:0 "Пришло время наконец раскрыть истинную цель нашего промышленного развития: для предстоящих войн наша военная промышленность должна обеспечивать армию массовым количеством оборудования, ресурсов и транспортных средств. Мы начнём огромную программу вооружений для мобилизации и подготовки тыла к войне."
 ANT_rapid_build_up:0 "Быстрое военное расширение"
 ANT_rapid_build_up_desc:0 "Нам необходимо расширить наши производственные возможности как можно быстрее, даже если это не будет устойчивым в долгосрочной перспективе."
 ANT_sustainable_spending:0 "Устойчивое военное наращивание"
 ANT_sustainable_spending_desc:0 "Война выигрывается истощением, и наши долгие завоевания впереди определённо не будут исключением. Мы должны стремиться к долгосрочному военно-экономическому плану и более устойчивой военной экономике, чтобы не рухнуть под собственным весом."

 ANT_prepare_for_war_with_cetus:0 "Подготовиться к завоеванию"
 ANT_prepare_for_war_with_cetus_desc:0 "Настало время наконец реализовать наши амбиции. Мы подготовимся к нашему великому божественному завоеванию, чтобы навсегда покончить с войной и объединить человечество. Наша промышленность готова обеспечивать армию, армия и флот прошли реформы и модернизацию, которые, надеюсь, адекватны, а наша внутренняя политика защищена."
