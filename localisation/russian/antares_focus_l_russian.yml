 ANT_expand_northead:0 "Расширить военно-морскую базу Нортхед"
 ANT_expand_northead_desc:0 "Для нашей войны с Цетусом мы должны расширить уже существующую военно-морскую базу в Нортхеде, чтобы более эффективно бороться с цетанским флотом."
 ANT_new_anticetus_base:0 "Новая западная военно-морская база"
 ANT_new_anticetus_base_desc:0 "Девон — идеальное место для новой базы с идеальным расположением для нарушения цетанского судоходства, хотя работы займут больше времени, а объекты будут менее совершенными, чем уже существующие в Нортхеде."
