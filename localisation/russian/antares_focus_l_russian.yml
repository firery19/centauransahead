 ANT_army_reform:0 "Армия XX века"
 ANT_army_reform_desc:0 "Наша армия, хотя и является гордостью нации, не готова к будущим конфликтам. Мы должны начать работу над великой армией, поистине достойной XX века."
 ANT_analyse_war_games:0 "Анализировать военные игры"
 ANT_analyse_war_games_desc:0 "Ранее мы провели серию военных игр и учений, которые требуют дальнейшего анализа для получения новых знаний."
 ANT_equipment_needs:0 "Потребности в оборудовании"
 ANT_equipment_needs_desc:0 "Современная армия требует нового оборудования и в больших количествах."
 ANT_army_navy_coop:0 "Взаимодействие армии и флота"
 ANT_army_navy_coop_desc:0 "Налаживание взаимодействия двух родов войск в тех немногих вещах, в которых они могут сотрудничать, будет иметь решающее значение для победы в предстоящих конфликтах... и для переговоров о военном бюджете."
 ANT_army_navy_war_game:0 "Совместные военные игры"
 ANT_army_navy_war_game_desc:0 "Мы проведём дополнительные учения для отработки тактики береговой бомбардировки, перевозки и морских десантов."
 ANT_rethink_arty_doctrine:0 "Реформировать артиллерийскую доктрину"
 ANT_rethink_arty_doctrine_desc:0 "Артиллерия значительно развилась за эти годы и доказала, что она действительно является королём битвы, однако наши доктрины в этой области всё ещё устарели. Это должно измениться!"
 ANT_learn_from_grease_war:0 "Учиться на Гризианской войне"
 ANT_learn_from_grease_war_desc:0 "Недавний конфликт в Канисе — гуманитарная и природная трагедия, но также возможность изучить, как разворачивается современная война!"
 ANT_reorganize_army:0 "Великая армейская реформа"
 ANT_reorganize_army_desc:0 "Мы должны начать принимать более масштабные меры по улучшению армии. Будет проведена Великая армейская реформа, и установлены амбициозные цели для этой реорганизации как в области оборудования, технологий, доктрины, организации, так и численности армии."
 ANT_navy_reform:0 "Расширение флота"
 ANT_navy_reform_desc:0 "Хотя наш флот является вторым по величине в Южной Кентавре, он всё ещё бледнеет по сравнению с Цетанским Китом. Радикальная реформа флота (надеюсь) сократит разрыв в численности и сделает наши корабли более эффективными в бою, чем их."
 ANT_solve_coms_isssue:0 "Решить проблемы со связью"
 ANT_solve_coms_isssue_desc:0 "Наше предыдущее поражение в Аквиле было связано как с их стойкостью, так и с нашими сбоями в координации. Поскольку современные войны имеют более крупные армии, чем когда-либо, и охватывают более протяжённые линии фронта, связь будет ключом к эффективным боевым действиям."
 ANT_radio_tech:0 "Радиотехнологии"
 ANT_radio_tech_desc:0 "Хотя эта технология ещё находится в зачаточном состоянии и до неё ещё много лет, дальняя связь с использованием электромагнитных волн стала возможной. Если нам удастся разработать эту технологию, её военное применение будет огромным."
