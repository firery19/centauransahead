 AQU_dummy_idea_iron_army_desc:0 "Прозвище «Железная армия» было дано аквиланцам в начале XIX века, когда они отразили крупное наступление Антареса с юга. После той войны аквиланцам удалось сохранить свои границы с минимальными потерями."
 AQU_fake_modifier_ia:0 "Прирост опыта армии: [?AQU_army_xp|%+=] \nПрирост опыта дивизий: [?AQU_army_unit_xp|%+=] \nМаксимальное укрепление: [?AQU_max_trench|+=] \nСкорость укрепления: [?AQU_dig|%+=] \nАтака дивизий: [?AQU_army_attack|%+=] \nОборона дивизий: [?AQU_army_defend|%+=] \nАтака дивизий на родной территории: [?AQU_army_attack_core|%+=] \nОборона дивизий на родной территории: [?AQU_army_defend_core|%+=] \nАтака артиллерии: [?AQU_artillery_attack|%+=] \nОборона артиллерии: [?AQU_artillery_defend|%+=] \nОрганизация дивизий: [?AQU_org|%+=] \nСкорость восстановления дивизий: [?AQU_morale|%+=]"

 AQU_dummy_idea_civil_guard_desc:0 "Гражданская гвардия — это гражданские добровольцы и полицейские, призванные в час нужды страны. Не являясь профессиональной армией, они не имеют стандартизированного снаряжения или униформы и носят разнообразное оружие — от собственного до трофейного, а также носят всё — от гражданских пальто и шляп до полицейской формы."
 AQU_fake_modifier_cg:0 "Стабильность: [?AQU_cg_stability|%+=] \nОборона ополчения: [?AQU_cg_defend|%+=] \nАтака ополчения: [?AQU_cg_attack|%+=] \nСкорость ополчения: [?AQU_cg_speed|%+=] \nУрон от сопротивления ополчения: [?AQU_cg_guerilla|%+=]"

