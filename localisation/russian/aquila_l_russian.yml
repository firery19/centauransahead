 # армия
 ######
 AQU_civil_guard:0 "Гражданская гвардия"
 AQU_civil_guard_desc:0 "Гражданская гвардия поддерживает наши войска во время войны в городских районах. Можно внести улучшения."
 AQU_raise_penal_battalions:0 "Штрафные батальоны"
 AQU_raise_penal_battalions_desc:0 "Наша страна в состоянии войны. Преступникам, таким как убийцы и воры, будет разрешено поступить на службу в обмен на маленький проблеск надежды на свободу."
 AQU_increase_the_cg:0 "Увеличение численности Гражданской гвардии"
 AQU_increase_the_cg_desc:0 "Победа через численность"
 AQU_make_more_weapons:0 "Производить больше оружия"
 AQU_make_more_weapons_desc:0 "Нам нужно обеспечить нашу Гражданскую гвардию снаряжением."
 AQU_improve_cohesiveness:0 "Улучшить сплочённость"
 AQU_improve_cohesiveness_desc:0 "Массовое ополчение должно знать, как правильно организовываться и обороняться. Однако побочным эффектом сплочённой коммуникации является то, что обычные армейские подразделения также начинают лучше организовываться."
 AQU_strength_in_numbers:0 "Сила в численности"
 AQU_strength_in_numbers_desc:0 "Гражданская гвардия будет присутствовать везде, куда враг попытается проникнуть, благодаря нашему численному присутствию."

 AQU_control_cg:0 "Установить контроль над Гражданской гвардией"
 AQU_control_cg_desc:0 "Текст-заполнитель ляляля. Если вы возьмёте это, вы будете §Rнавсегда заблокированы§! от набора новых подразделений Гражданской гвардии через решение."
 AQU_instant_cancel:0 "§RЛюбой текущий набор Гражданской гвардии будет немедленно отменён.§!"
 ###
 AQU_standardise_the_cg:0 "Стандартизация Гражданской гвардии"
 AQU_standardise_the_cg_desc:0 "Первый шаг к улучшению гражданской гвардии — сделать её более организованной в бою."
 AQU_train_the_cg:0 "Обучить Гражданскую гвардию"
 AQU_train_the_cg_desc:0 "Гражданская гвардия — нерегулярное ополчение, не имеющее подготовки. Нельзя ожидать, что они смогут держаться в бою, мы должны обучить их."
 AQU_distribute_modern_weapons:0 "Распределить современное оружие"
 AQU_distribute_modern_weapons_desc:0 "Современное оружие необходимо, чтобы привести их огневую мощь к стандарту."
 AQU_transform_the_cg:0 "Преобразование Гражданской гвардии"
 AQU_transform_the_cg_desc:0 "Гражданская гвардия теперь является прекрасной отлаженной силой ополчения, которая может эффективно поддерживать армию."
 # форты
 AQU_fort_management:0 "Управление укреплениями"
 AQU_fort_management_desc:0 "Наши укрепления могут защитить нас от любых захватчиков. Мы должны поддерживать их в соответствии со стандартами."
 AQU_south_fort:0 "Южное управление"
 AQU_south_fort_desc:0 "Южные границы с Антаресом обширны и важны для защиты от любых будущих атак. Мы должны поддерживать здесь определённый уровень укреплений."
 AQU_west_fort:0 "Западное управление"
 AQU_west_fort_desc:0 "Западные границы с Цетусом не должны нас сильно беспокоить."
 AQU_east_fort:0 "Восточное управление"
 AQU_east_fort_desc:0 "Восточные границы с Вегой должны быть легко обороняемы благодаря естественному преимуществу местности, однако укрепления следует поддерживать на всякий случай."
 AQU_north_fort:0 "Северное управление"
 AQU_north_fort_desc:0 "Северная граница с Колумбой не должна нас сильно беспокоить, так как у обеих сторон нет причин для нападения."
