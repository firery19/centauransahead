 AQU_army_modernisation:0 "Модернизация армии"
 AQU_army_modernisation_desc:0 "Невозможная задача — спорить с высшим командованием о модернизации!"
 AQU_new_thinking:0 "Яркие новые офицеры"
 AQU_new_thinking_desc:0 "Новые офицеры этого поколения — ключ к поддержанию нашей армии на должном уровне."
 AQU_innovate:0 "Инновационные тактики"
 AQU_innovate_desc:0 "Офицеры будут работать над новыми тактиками для преодоления любых препятствий."
 AQU_observe_the_canis_war:0 "Наблюдать за войной в Канисе"
 AQU_observe_the_canis_war_desc:0 "Через Либерийский океан в регионе Канис вспыхнул конфликт. Мы должны следить за современной боевой тактикой обеих сторон, отправив «журналистов»."

