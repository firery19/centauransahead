 aqu.1:0 "Набор Гражданской гвардии завершён"
 cg_recruitment_event.1.t:0 "Набор Гражданской гвардии завершён"
 cg_recruitment_event.1.desc:0 "Наша организация подразделений Гражданской гвардии завершена, и они превратились в боеспособные подразделения!!"
 cg_recruitment_event.1.a:0 "Пусть сражаются вместе с армией"
 aqu.4.t:0 "Выжженная земля"
 aqu.4.d:0 "Антарес сжигает наши леса, чтобы облегчить себе наступление!"
 aqu.4.a:0 "О нет!"

 ###событие — отказ от радикалов
 aqu.1118965.t:0 "Разрыв связей"
 aqu.1118965.d:0 "Годами мы были в хороших отношениях с социал-демократами, хотя они были не более чем кучкой оппортунистов, которые пользовались любой возможностью, чтобы критиковать нас и переманивать наших избирателей. Хватит! Мы лучше пойдём на эти выборы одни, чем с этими крысами!"
 aqu.1118965.a:0 "Нам лучше одним..."

 ###событие — коалиция с социалистами
 aqu.1118964.t:0 "Вместе мы сильнее!"
 aqu.1118964.d:0 "Хотя мы не всегда были в лучших отношениях с социал-демократами, у нас почти нет шансов выиграть предстоящие выборы без них. Возможно, стоит отложить наши разногласия на время и попытаться договориться о коалиции с ними?"
 aqu.1118964.a:0 "К победе!"

 ###речь по коалиционному пути 1
 aqu.1118966.t:0 "Речь Фолкнера"
 aqu.1118966.d:0 "В последние несколько десятилетий наше правительство ничего не делало, кроме воровства. Фоулер и его партия владеют многими компаниями в нашей стране, уклоняются от налогов и платят минимальную зарплату нашим людям. Это кончается сейчас! Мы должны остановить это и построить ещё больше заводов, чем у нас есть сейчас. Антарес быстро наращивает свою армию, а мы пренебрегали этим десятилетиями, думая, что мир будет длиться вечно. Мы должны развиваться ещё больше, чтобы защитить Аквилу!"
 aqu.1118966.a:0 "За лучшую Аквилу!"

 ###речь по коалиционному пути 2
 aqu.1118967.t:0 "Речь XXX"
 aqu.1118967.d:0 "Наши люди страдают из-за того, что компании имеют слишком много власти над нашей экономикой. Нам нужны справедливая зарплата и рабочие места для всех, кто может работать. А для тех, кто не может работать, мы усилим систему социальной защиты, чтобы они могли жить так же хорошо, как и все остальные. Вместе, рука об руку, мы будем бороться за справедливую зарплату, больше свободного времени, всеобщее счастье и снижение безработицы в нашей любимой стране!"
 aqu.1118967.a:0 "За народ Аквилы!"

 ###встреча с социалистами
 aqu.1118968.t:0 "Встреча с социалистами"
 aqu.1118968.d:0 "Л: Ну, посмотрим... мы не так уж и отличаемся: вы хотите рабочие места для людей, а мы хотим индустриализации, которая тоже может обеспечить рабочие места. \n\nСД: Это в основном верно. Однако мы также хотим более мощные профсоюзы и справедливую зарплату для наших людей. \n\nЛ: Послушайте, наша страна сейчас не в лучшем положении, мы не можем платить рабочим столько, сколько вы требуете. \n\nСД: Хотя мы согласны поддерживать индустриализацию, мы хотим справедливого отношения к рабочим и лучшей оплаты. \n\nЛ: Хорошо. Я подумаю об этом."
 aqu.1118968.a:0 "........"

 ###речь для приграничных регионов
 aqu.1118969.t:0 "Речь в приграничном регионе"
 aqu.1118969.d:0 "Правительство многие годы пренебрегало нашими приграничными регионами, сосредотачиваясь на центре страны. Это кончается сейчас! Если мы победим на выборах, мы сосредоточимся на улучшении качества жизни здесь. Мы построим лучшие дороги для всех вас, а также электрифицируем сельскую местность, чтобы у вас была жизнь такая же хорошая, как у жителей Волукриса!"
 aqu.1118969.a:0 "Да здравствует Аквила!"

 ###критика внешней политики
 aqu.1118970.t:0 "Речь о внешней политике"
 aqu.1118970.d:0 "Наша страна граничит с опасной агрессивной империей на юге, которая пыталась атаковать нас не так давно. И всё же наше правительство отказывается иметь хорошие отношения с любыми соседями, говоря, что мы сильнее в одиночестве, чем в союзе с цетанцами. Однако нам нужны хорошие отношения с соседями, чтобы жить в мире."
 aqu.1118970.a:0 "Вдохновляющая речь"

 ###критика экономической политики
 aqu.1118971.t:0 "Устаревшая экономика"
 aqu.1118971.d:0 "Наше текущее правительство ничего не делает, кроме инвестиций в лесное хозяйство и сельское хозяйство, оставляя Аквилу отсталой страной. Все современные страны мира, такие как Антарес или Орион, давно инвестировали в свой промышленный сектор, и посмотрите, какие они сильные! Пришло время инвестировать в заводы, так как устаревшие армии не имеют места в нашем неспокойном мире. Однако мы не можем достичь современной армии с правительством, подобным нашему. Голосуя за нас, вы также голосуете за счастливое и безопасное будущее нашей любимой нации, так как только с современной экономикой мы можем производить современное оружие и технику!"
 aqu.1118971.a:0 "Нам нужны перемены!"

 ###встреча с профсоюзами
 aqu.1118972.t:0 "Обещание рабочим"
 aqu.1118972.d:0 "В Аквиле нормально, когда рабочие работают по 12 часов, что оставляет очень мало времени для семьи и других дел. Мы считаем, что рабочие должны работать максимум 8 часов! Вы можете сказать, что это невозможно при сохранении текущего уровня производительности, но если мы модернизируем нашу экономику и закупим новое оборудование, это не будет проблемой. Это правительство ничего не делало, кроме как издевалось над рабочими и грабило их время. Голосуя за нас, вы также голосуете за счастливое будущее рабочих этой страны и их семей!"
 aqu.1118972.a:0 "За справедливые условия труда!"

 ###обращение к фермерам
 aqu.1118973.t:0 "Защита для фермеров"
 aqu.1118973.d:0 "Хотя наш сельскохозяйственный сектор хорошо развит, вы, фермеры, часто страдаете от стихийных бедствий, таких как торнадо, которые довольно распространены на наших землях. И хотя наше текущее правительство продолжает расширять ваши поля и сектор, они отказываются покрывать расходы на ущерб, что привело к банкротству нескольких фермеров. Если вы проголосуете за нас, мы сделаем всё возможное, чтобы принять закон, который поможет покрыть расходы на ущерб от стихийных бедствий, а также предоставим фермерам больше субсидий."
 aqu.1118973.a:0 "Стабильные фермы — стабильное продовольствие."

 ###день выборов
 aqu.18661112.t:0 "День выборов!"
 aqu.18661112.d:0 "День, которого мы ждали, наконец настал. Явка избирателей в этом году намного выше обычной, так как люди со всей страны решили проголосовать, несмотря на то, что избирательные участки часто находятся далеко из-за наших густых лесов. Однако благодаря аквиланской избирательной и политической системам выборы справедливы для всех. К счастью, предвыборная гонка была в основном честной и чистой. Все партии обещают лучшую жизнь для населения. Тем не менее, победить может только одна партия, и это..."
 aqu.18661112.a:0 "И победитель..."

