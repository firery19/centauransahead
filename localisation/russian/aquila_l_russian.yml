 fix_army_rust_b:0 "Исправить ржавеющую армию"
 fix_army_rust_c:0 "Сгладить армию"
 fix_army_rust_d:0 "Модернизировать армию"
 civil_guard_recruitment:0 "Набор Гражданской гвардии"
 civil_guard_recruitment_desc:0 "Формирование ополчения для поддержки армии во время войны."

 ###
 AQU_the_national_assembly:0 "Сенат"
 AQU_the_national_assembly_desc:0 "После мирной Демократической революции Совет советников начал внедрять демократические реформы. Были созданы такие институты, как Государственный конституционный суд и Сенат. Совет был заменён Исполнительным советом во главе с Первым советником, который затем служил 5 лет. Исполнительный совет состоит из 10 членов. \n\nСенат находится в столице Аквилы, Волукрисе. Сенаторы избираются народом на национальных выборах на 5 лет и имеют право избирать Первого советника. \n\nКонсервативные места: [?AQU_senate_conservative_var|+1%]. \nЛиберальные места: [?AQU_senate_liberal_var|+1%]. \nДемократические социалистические места: [?AQU_senate_social_democratic_var|+1%]."

 #########
 # духи
 #########
 AQU_iron_army:0 "Железная армия"
 AQU_iron_army_desc:0 "Прозвище «Железная армия» было дано аквиланцам в начале XIX века, когда они отразили крупное наступление Антареса с юга. После той войны аквиланцам удалось сохранить свои границы с минимальными потерями."
 AQU_lucas_silva:0 "Король Лукас Силва"
 AQU_lucas_silva_desc:0 "Король Аквилы, хотя он и не обладает реальной властью, он является хорошим номинальным лидером для нашей страны."
 AQU_outdated_technology:0 "Устаревшие технологии"
 AQU_outdated_technology_desc:0 "Из-за отсутствия крупных войн Аквила пренебрегала технологическим отделом вооружений из-за отсутствия современного боевого опыта."
 AQU_rusting_army:0 "Ржавеющая армия"
 AQU_rusting_army_desc:0 "Железная армия Аквилы начала угасать, так как её армия не успевает за современной войной. Боевая эффективность армии снижена и будет снижаться перед лицом более сильных врагов в современной войне."
 AQU_rusting_army_3_idea:0 "Ржавеющая армия"
 AQU_rusting_army_3_idea_desc:0 "Недавние улучшения армии исправили проблемы с устаревшей тактикой."
 AQU_rusting_army_4_idea:0 "Поддерживаемая армия"
 AQU_rusting_army_4_idea_desc:0 "После получения опыта из Гризианских войн аквиланская армия изучила новые базовые боевые тактики для использования в любых будущих конфликтах."
 AQU_rusting_army_5_idea:0 "Современная армия"
 AQU_rusting_army_5_idea_desc:0 "После умных инноваций с боевой тактикой из Гризианских войн блестящее новое поколение офицеров разработало лучшее оборонительное планирование на любом поле боя, где мы можем сражаться, и новые наступательные тактики для возврата любых потерянных земель в наших границах."
 AQU_penal_battalions_idea:0 "Штрафные батальоны"
 AQU_penal_battalions_idea_desc:0 "Преступники приходят"
 AQU_strong_militia:0 "Организованное ополчение"
 AQU_strong_militia_desc:0 "Гражданская гвардия — неформальная организация, которую невозможно отслеживать. Теперь Гражданская гвардия — официальное звание."
 AQU_rampant_militia_idea:0 "Ополчение повсюду"
 AQU_rampant_militia_idea_desc:0 "Куда бы враг ни ступил на аквиланскую землю — гражданские, здания, деревья и трава будут готовы открыть огонь."
 AQU_good_civil_guard:0 "Стандартизированное ополчение"
 AQU_good_civil_guard_desc:0 ""
 AQU_cohesive_militia_idea:0 "Сплочённость"
 AQU_cohesive_militia_idea_desc:0 ""
 AQU_newgens_idea:0 "Новое поколение"
 AQU_newgens_idea_desc:0 "Старым поколениям, застрявшим на оборонительных позициях и медленных атаках, нельзя доверять руководство в меняющемся ландшафте войны. Наши новые офицеры возьмут на себя инновации и мышление для новой грядущей войны."

