 AQU_NCO_training:0 "Усилить подготовку унтер-офицеров"

 AQU_review_the_doctrine_pre_reform:0 "Пересмотреть доктрину"

 AQU_wartime_propaganda:0 "Военная пропаганда"

 AQU_adopting_M99_rifle:0 "Принять винтовку M99"
 AQU_adopting_M99_rifle_desc:0 "Хотя наша армия использует старую и надёжную однозарядную винтовку серии Albus Graham, пришло время принять совершенно новое оружие. Большинство армий на нашем континенте используют магазинные винтовки, например, не так давно принятую Modelo 1898 в Веге. Мы должны принять новую магазинную винтовку, так как у них выше скорострельность и они в целом эффективнее. В нашей армии достаточно железа и дерева, а также промышленности для производства. Мы можем оставить винтовки Albus Graham нерегулярным частям, но наша основная армия должна быть оснащена лучшим оружием, которое мы можем предложить!"

 AQU_adopting_efforts:0 "Усилия по принятию M99"
 AQU_adopting_efforts_desc:0 ""

 AQU_develop_the_M2:0 "Разработать M2"

 AQU_M2_production_efforts:0 "Усилия по производству M2"

 AQU_wartime_factories:0 "Конвертировать гражданские заводы"

 AQU_national_defense_bond:0 "Облигации национальной обороны"

 AQU_hold_the_ring_of_fire_at_all_cost:0 "Удержать Кольцо Огня любой ценой!"

 AQU_unite_the_people:0 "Поощрять национализм"

 AQU_new_form_of_communication:0 "Новая форма связи"

