l_russian:
 BM_HISTORY_TITLE: "Краткая история"
 GATHERING_STORM_NAME: "Gathering Storm"
 GATHERING_STORM_DESC: "Dark times are coming. In Europe, Hitler has consolidated his power and his attention is now increasingly drawn beyond Germany's borders. Mussolini's Italy continues to embark on daring military adventures, while the Empire of Japan stands poised to attack China in Asia. Almost twenty years have passed since the end of the Great War, and the world has yet again been doused in gasoline. A single spark may be all it takes."
 HITTING_FAN_NAME: "The Hitting of the Fan"
 HITTING_FAN_DESC: "Yup, that's right! That umbrella collection is about to come in real handy."
 GREASE_WAR_NAME: "Масляные войны" ###Война смазок, лол
 GREASE_WAR_DESC: "Это начало нового века, и самое кровавое начало что видело человечество. Ухудшающиеся отношения между Орионом и Урсой могут начать войну в любой момент, в тоже самое время Гидрус, страна которая недавно получила независимость на Форме, желает получить колониальные владения Урсы. В Центавре, спустя 20 лет после аннексии южного Корвуса Цетусом, Корвус готовится к мести, пока Антарес готовится к завоеваниям которые мир не видел со времён Либранской Империи."
 ANT_1900_DESC: "Антарес был создан как союз между Скорпиусом, Арой, Нормой и Лупусом в 13 веке, и с тех пор оставался сверхдержавой на юге Центавры. С одной из самых крупнейших армий и промышленностей в мире, Антарес под правлением Кальвина Тау готовится к чему-то. К чему-то великому..."
 ORI_1900_DESC: "Республика Орион это крупнейшее и сильнейшее государство на Форме. Промышленная база, нескончаемые ресурсы, огромные территории. Но неразвитая сельская местность, коррупция, бюрократия и огромная пропасть между богатыми и бедными дают о себе знать.\n\nС этими всемя проблемами, республика готовится к войне с Урсой дабы окончить их присутствие на Гидре и вышвырнуть их из Каниса."
 CET_1900_DESC: "Цетус это морская держава с найлучшим флотом в мире; Империя имеет относительно индустриализированную экономику, и довольно крупное количество ресурсов в южном Корвусе.\n\nНо плохие отношения с соседями и реваншисткие настроения в Корвусе, а также приоритет в флоте вместо сухопутных сил превратили Цетус в лёгкую добычу."
 COV_1900_DESC: "Прошло 14 лет с аннексии богатого на ресурсы южного Корвуса, экономика конфедерации ощутила этот удар.\n\nВ связи с этим, реваншисткое правительство и патриотическое население поддерживают силовое возвращение юга."
 URS_1900_DESC: "Федерация Урса это колониальная империя находящаяся в упадке. Внутрение протесты, и ещё более нестабильные колонии и угроза Ориона вместе с недавно появившимся Гидрусом показывает что 20 век будет ужасным.\n\n Урса должна быть готова к новому времени."
 HYS_1900_DESC: "Гидра — самое молодое государство Формы, ранее бывшее колонией Урсы. Импульс колониальных восстаний по всей Урсанской империи, набранный в результате обретения Гидрой независимости, ясно показывает, что господство Урсы скоро закончится, и Гидра может многое получить.\n\nКто знает, чего добьется это новое государство в новом столетии."
 RIA_1900_DESC: "Северный тигр — Республика Рии — является первой республикой Кентавры после свержения монархии в гражданской войне 1888 года, когда династия отступила на западные острова Вульпы.\n\nХотя она обладает огромным населением и армией, это бедная страна, управляемая тотальным контролем националистической партии, которая с момента революции реформировала и модернизировала Рию. Что бы ни принесло будущее, усиливающаяся Рия сыграет в нем важную роль."
 LBR_1900_DESC: "Федерация Либра — это остаток древней Либерийской империи, которая в период своего расцвета контролировала весь мир. Либра вела крайне изоляционистскую политику с тех пор, как империя пришла в упадок и отступила на свои родные острова в 0 году.\n\nЕё престиж как законного наследника Империи сделал её международным посредником, и с тех пор, как она вышла из изоляции, она стала местом проведения многих многонациональных конференций и организаций."
 VUL_1900_DESC: "Бывшая династия, контролировавшая материковые территории нынешней Республики Рии, отступила на острова бывших провинций Вульпы после Гражданской войны в Рие."
 AQU_1900_DESC: "Королевство Аквила — это коронная республика, нетипичная форма правления для региона, где доминируют парламентские и абсолютные монархии.\n\nСосредоточенное вокруг нескольких городских центров, государство находится под влиянием сельского хозяйства и лесной промышленности в городах, раскинувшихся по плодородным равнинам.\n\nИсторически армия Аквилы была грозной силой, побеждавшей антареан, веган и цетан в прошлых конфликтах и значительно расширившей свою территорию."
 GRS_1900_DESC: "Журавль пустынь — Груса. Эта страна когда-то была гордой империей, простиравшейся от Веги до Туканы и охватывавшей всю Восточную Кентавру. Она давно утратила свой великий статус, но всё ещё сохраняет один из лучших флотов в мире.\n\nЕё соперничество с южным соседом Вегой на протяжении веков заставляло оба государства находиться в агрессивном состоянии из-за мелких разногласий. Однако среди населения уже давно существуют настроения в пользу объединения, но попыток воссоединения никогда не предпринималось."
 VEG_1900_DESC: "Доминион Вега был образован из ослабевшего Королевства Груса как новое государство, созданное после того, как им было отказано в претензиях на престол Королевства принцессой Люсией Верде. В последующие годы Доминион приложил огромные усилия для формирования своей национальной идентичности, романтизируя достижения принцессы, а затем и королевы Люсии Верде в борьбе против угнетателей-грусанцев, а также всеобщую любовь к выпечке.\n\nОн также обладает хорошей географической защитой от Аквилы благодаря обширным укреплениям на плато Мурус."
 CLB_1900_DESC: "Страна, расположенная в великом разделителе Северной и Южной Кентавры — горах Мейсер, — Объединенные Колумбийские Территории — это государство, образованное из наций Факта, Нохае, Эурии и Куара.\n\nЕё стратегическое географическое положение с величайшими горами мира на юге оставляет мало поводов для беспокойства, кроме как на севере, где плоские равнины на границе с Рией представляют угрозу."
 TUC_1900_DESC: "Туканская империя простирается через покрытый лесами угол северной Кентавры, включая заморские территории в море Гюней к востоку. Когда-то она находилась под знаменем Грусы вместе с Кентаври, пока местные жители не подняли восстание.\n\nПосле обретения независимости туканцы вложили значительные средства в увеличение промышленного производства, активно добывая ресурсы в горах на севере. Население, тем временем, сосредоточено на юге и востоке, в районах с более приемлемыми температурами."
 CTA_1900_DESC: "Королевство Кентаври построено на своих великих стенах и укреплениях, созданных для сдерживания бывших колониальных правителей — Королевства Груса — через пролив Сагиттариус.\n\nОно обладает сильнейшим флотом северной Кентавры и самой обширной сетью береговых батарей из-за своей истории с Грусой."
 AUR_1900_DESC: "Королевство Аурига - последняя сохранившаяся монархия на Гидранском континенте, пережившая аннексию Орионом благодаря установлению прочных торговых отношений с этой страной. Современное государство Аурига в настоящее время имеет парламент и придерживается пацифистской позиции.\n\nЕё вооруженные силы были сокращены до целей самообороны, но она продолжала укреплять свое присутствие в региональной торговле, а Республика Орион была её крупнейшим клиентом."
 LAC_1900_DESC: "В забытом углу мира лежит Лацерта. Это самая южная часть суши в Форме, и она ведет в никуда. Страна технологически отстает, а её армия хранит устаревшее десятилетиями оборудование на складах.\n\nУчитывая свою изоляцию, лацертанцы построили самодостаточную экономику и редко участвуют в торговле с другими государствами."
 MUS_1900_DESC: "Муска - родина Унизма, монотеистической религии, популярной в Гидре и возникшей в оппозицию Астранизму. По сей день государство функционирует как теократия с религиозным советом, истутном, и лидером - Павелией, являющимися источниками власти.\n\n Экономика Муски - одна из самых маленьких на Гидре, религиозный туризм является её крупнейшим источником дохода, поскольку тысячи людей совершают паломничества к священным храмам и могиле пророка Альвара и Вальде."
 LGS_1900_DESC: "§BПервоапрельский рофл§! §RФАНЛОР!§!\nОснованное во времена до Колумбийского объединения у Окулумского моря, Герцогство Лингстония — это небольшое, горное, изолированное и часто забытое государство, расположенное в центре Центавры, в высокогорьях гор Мейсер. Несмотря на свои малые размеры и изоляцию, оно одержало победу над Федерацией Нохае и Королевством Куара, имея меньшую численность, благодаря своим новаторским тактикам, расширив свою территорию.\nНесмотря на свою отсталость, продолжающуюся изоляцию и малые размеры, Лингстония всё ещё может сыграть важную роль в ближайшие годы."
 #FORMAN_WAR_NAME: "Форманская война" # ОСТОРОЖНО: ЭТОЙ СТРОКИ НЕ СУЩЕСТВУЕТ И ВЫЗОВЕТ КРАШ ПРИ ЗАПУСКЕ
 #FORMAN_WAR_DESC: "После кровавых Кентаврийских войн Антарес наконец захватил континент. Армии Антареса и Урсы наступают на последний бастион — Гидранский континент. Урса оплакивает потерю Каниса, перешедшего к Гидре, а напряженность между Орионом и Антаресом нарастает. По мере столкновения двух миров, война невообразимых масштабов вскоре поглотит Форму, и судьба победителя в этой войне, несомненно, определит ход следующих столетий."
 #ANT_1944_DESC: "После более чем 30 лет войны Антарес завоевал Кентавру и обладает самой большой армией и флотом в мире. Но всё не так хорошо, как кажется. Десятилетия войны истощили тыл, огромные территории требуют оккупации и интеграции. Но Антарес не может расслабиться, ведь ему предстоит подготовиться к еще одной масштабной войне; войне, более грандиозной, чем Кентаврийская, чтобы ЗАВОЕВАТЬ ВСЮ ФОРМУ."
 #ORI_1944_desc: "Наблюдая со стороны за тем, как Антарес поглощает континент, Республика Орион сохранила свой статус крупнейшей экономической державы в мире и готова защитить себя от любого вторжения Антареса, и готова это сделать."
