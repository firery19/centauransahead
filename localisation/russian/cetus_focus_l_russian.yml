 TCET1:0 "Южнокорвусский вопрос"
 DCET1:0 "Сопротивление в Южном Корвусе создаёт нам проблемы с момента оккупации в 1886 году."
 ACET1:0 "Интеграция — лучший путь вперёд."
 BCET1:0 "Лучше продолжать оккупацию."
 cet.4.t:0 "Миррен-Элькский пакт"
 cet.4.d:0 "Цетус обратился к нам с предложением пакта о ненападении. Стоит ли нам принять его?"
 cet.4.a:0 "Принять."
 cet.4.b:0 "Отказаться."
 cet.5.t:0 "Антарес подписывает пакт"
 cet.5.d:0 "После серии переговоров соглашение о пакте о ненападении между нами и Антаресом было принято."
 cet.5.a:0 "Отлично"
 cet.6.t:0 "Антарес отказывается от пакта"
 cet.6.d:0 "После серии переговоров предложение о пакте о ненападении вышло из фавора, и в итоге Антарес отказался от него."
 cet.6.a:0 "Ну и ладно."
 cet.7.t:0 "Цетус требует подчинения"
 cet.7.d:0 "После захвата Антареса Цетус, обладающий сильнейшим флотом в мире, постучался в наши двери. Они требуют нашего подчинения и угрожают войной, если мы не уступим."
 cet.7.a:0 "Мы ничего не можем сделать."
 cet.7.b:0 "Пусть приходят."
 cet.8.t:0 "Лацерта подчиняется"
 cet.8.d:0 "Наш ультиматум был принят послом Лацерты сегодня утром. С этим мы можем обратить свой взор в другие места."
 cet.8.a:0 "Отлично"
 cet.9.t:0 "Лацерта отказывается"
 cet.9.d:0 "Лацерта стоит непоколебимо против невероятно могущественной нации. Мы могли бы избежать разрушения и жертв в Лацерте."
 cet.9.a:0 "Ничего не поделаешь."
 cet.10.t:0 "Цетус депортирует корвунов!"
 cet.10.d:0 "Недавно на корвусско-цетанской границе появилась огромная очередь! Когда мы спросили людей, что они там делают, они сказали, что Цетус депортировал их обратно сюда."
 cet.10.a:0 "Значит, эти цетанцы готовы зайти так далеко..."
