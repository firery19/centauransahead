 CET_preemptive_strike:0 "Упреждающий удар"
 CET_preemptive_strike_desc:0 "После захвата Южного Корвуса мы заметили, что Корвус питает к нам какую-то обиду. Мы не можем позволить им ударить первыми — необходим упреждающий удар."
 # - огненное дерево фокусов армии
 CET_armed_forces:0 "Цетанские вооружённые силы"
 CET_armed_forces_desc:0 "Цетанские вооружённые силы состоят из армии и флота. Они защищают Цетус от любых потенциальных угроз."
 CET_army:0 "Цетанская армия"
