 CET_mirren_elke_pact:0 "Миррен-Элькский пакт"
 CET_mirren_elke_pact_desc:0 "Мы также заметили более тесные дипломатические отношения между Антаресом и Корвусом, поэтому мы должны добиться пакта о ненападении с Антаресом и сохранить наш нейтралитет в этом мире."
 CET_carran_kharon_accords:0 "Карран-Харонские соглашения"
