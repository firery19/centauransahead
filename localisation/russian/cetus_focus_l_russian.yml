 # дерево фокусов "Вклад Striped'а"
 CET_sc1:0 "Южнокорвусский вопрос"
 CET_sc1_desc:0 "С момента вторжения в Южный Корвус в 1880 году мы удерживаем эту территорию как оккупированную. Возник вопрос о том, как мы будем интегрировать территории Южного Корвуса в будущем. Если мы не сможем решить этот приоритетный вопрос, это навредит нам в долгосрочной перспективе."
 CET_sc_int1:0 "Ради будущего"
 CET_sc_int1_desc:0 "Приняв решение об интеграции территорий Южного Корвуса, мы должны предпринять несколько шагов, чтобы эти территории действительно чувствовали себя как дома в Цетанской империи. Мы должны научиться справляться с всё ещё сохранившимся корвунским населением, оставшимся там с 1880 года."
 CET_sc_int2:0 "Поощрять иммиграцию"
 CET_sc_int2_desc:0 "Поощряя иммиграцию в Южный Корвус, мы можем начать создавать новые цетанские семьи в недавно возникших угледобывающих городах. Если мы сможем обеспечить наших людей хорошим питанием и стабильной работой, мы сможем увеличить цетанское население в этом районе."
 CET_sc_boomtown:0 "Бурно растущие города"
 CET_sc_boomtown_desc:0 "Угледобывающая промышленность привлекла многих людей со всей империи в поисках работы в Южном Корвусе. Известные города, такие как Блэктон, возникли совсем недавно и помогают удовлетворять растущую потребность в угле для нашей промышленности в Науте."
 CET_sc_assimilate:0 "Ассимилировать местных жителей"
 CET_sc_assimilate_desc:0 "Выселение корвунского населения с их родины было бы жестоким поступком, несмотря на их постоянное стремление мешать нашему прогрессу по ассимиляции их в нашей стране. Мы приложим больше усилий к системе образования и пропаганде, чтобы южные корвуны вырастали цетанцами."
 CET_sc_deport:0 "Искоренить партизан"
 CET_sc_deport_desc:0 "Если корвуны не могут сотрудничать с нами, то они просто должны уйти. Отвергая наши усилия по интеграции в нашу великую нацию, они раз за разом отвергали нас. Возможно, нам следует дать сдачи и отправить их туда, где им действительно место — в трущобы Раво."
 CET_sc_new_industry:0 "Новые отрасли промышленности"
 CET_sc_new_industry_desc:0 "Во время войны 1880 года мы вторглись в Южный Корвус из-за его богатых угольных шахт. Теперь мы наконец можем использовать их ещё больше в связи с растущей потребностью в военных товарах. Поскольку индустриализация Цетуса продолжает набирать обороты, нам нужно искать новые возможности для производства оружия, чтобы защитить себя от соседей."
 CET_sc_policing:0 "Полицейские меры"
 CET_sc_policiing_desc:0 "Не все корвуны ценят новую индоктринацию, которую мы навязываем их детям, и выходят на улицы с протестами, а также саботируют угольные шахты, в которых работают. Нам нужно принять более решительные меры против этих преступных действий, если мы действительно хотим сохранить контроль над регионом."
 CET_sc_core:0 "Больше не чужие"
 CET_sc_core_desc:0 "После многих лет упорной работы мы наконец добились этого. Корвунское население наконец считает себя цетанцами или покинуло нас в поисках своей старой родины. Корвус наверняка будет огорчён нашим достижением..."
 CET_sc_railways:0 "Соединить железные дороги"
 CET_sc_railways_desc:0 "Чтобы более эффективно транспортировать большие объёмы угля из региона Южного Корвуса, мы должны построить новые железные дороги для удовлетворения этого спроса. Эти пути также дадут нам мобильность для быстрого сосредоточения наших армий на корвунском фронте."
 CET_sc_occupy:0 "Они здесь не место"
 CET_sc_occupy_desc:0 "Вторжение 1880 года было лишь для поддержки наших экономических проблем. Люди, уже жившие в Южном Корвусе, не принадлежат нам в Цетусе. Оккупация Южного Корвуса будет продолжаться, пока мы его удерживаем."
 CET_sc_remove_debuff:0 "Решить вопрос"
 CET_sc_remove_debuff_desc:0 "Мы ясно дали понять, каковы наши намерения в отношении корвунов, живущих в Цетусе, и мы не будем тратить больше времени на обсуждение этого вопроса. Цетус — империя, и мы будем вести себя империалистически по отношению к нашим подданным."
 CET_sc_light_industry:0 "Лёгкая промышленность"
 CET_sc_light_industry_desc:0 "Мы должны создать некоторые лёгкие производства, чтобы местное население не голодало, пока они целый день работают на угольных шахтах. Мертвец не сможет добывать уголь, в конце концов."
 CET_sc_new_mines:0 "Открыть новые шахты"
 CET_sc_new_mines_desc:0 "Наше решение не делать Южный Корвус нашим собственным было осознанным — этот регион существует для поддержки нашей промышленности на родине, а не для того, чтобы мы полагались на их промышленность. Создание новых шахт должно помочь поддерживать бесперебойную работу метрополии."
 CET_sc_heavy_industry:0 "Тяжёлая промышленность"
 CET_sc_heavy_industry_desc:0 "Распределение наших производств по всей стране должно помочь с продолжающимся строительством вооружённых сил. Надоедливые партизаны мешались, но как только они увидят, что мы производим оружие прямо у них под носом, они наверняка подумают дважды."
 CET_sc_dockyards:0 "Расширить верфи"
 CET_sc_dockyards_desc:0 "Цетус всегда был нацией, гордящейся своим флотом и морским престижем. Чтобы сохранить нашу роль на мировой арене как величайшей морской державы, мы должны увеличить производство кораблей."
 CET_sc_partial_integration:0 "Разрешить свободы"
 CET_sc_partial_integration_desc:0 "С намерением сохранить Южный Корвус на данный момент следует отметить, что населению придётся адаптироваться к новому правителю. Возможно, если мы предоставим больше свобод в регионе, они будут относиться к нам лучше."
 #CET_sc_war_corvus:0 "Объединить Корвусы"
 #CET_sc_war_corvus_desc:0 "Пришло время продолжить наше завоевание Корвуса. Хотя земли не так богаты ресурсами, как те, которые мы уже взяли, людей всё ещё можно использовать на наших заводах и в армии. Их еретический образ мышления должен быть уничтожен."
 CET_status_quo:0 "Статус-кво"
 CET_status_quo_desc:0 "Империя Цетус существует как независимое государство уже тысячелетие, без особых милитаристских тенденций. Мы должны продолжать этот подход."

