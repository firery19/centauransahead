 CET_aircraft_research:0 "Исследование самолётов"
 CET_aircraft_research_desc:0 "Люди мечтали летать как птицы с древних времён. Мы должны начать исследования всего, что позволит нам летать. Это может помочь нам в любых будущих войнах."
 CET_est_air_corp:0 "Создать воздушный корпус"
 CET_est_air_corp_desc:0 "У нас есть чертежи для производства летательных аппаратов, прозванных «самолётами». Мы должны создать небольшой воздушный корпус для армии и флота."
