 # духи

 CET_cetus_rules_the_waves:0 "Цетус правит волнами"
 CET_cetus_rules_the_waves_desc:0 "Цетус всегда был нацией, гордящейся своей морской историей. На протяжении веков Цетанский флот стал сильнейшим во всей Форме. Стремление исследовать весь Инанис движет этим расширением."
 CET_independent_armed_forces:0 "Самостоятельно действующие вооружённые силы"
 CET_independent_armed_forces_desc:0 "С момента вторжения в Южный Корвус вооружённые силы доказали, что вполне могут действовать самостоятельно. С тех пор цетанское правительство ослабило контроль над армией и флотом и теперь занимается только иностранными делами."
 CET_independent_armed_forces_2:0 "Самостоятельно действующие вооружённые силы"
 CET_independent_armed_forces_2_desc:0 "Недавняя военная реорганизация улучшила некоторые части армии за счёт флота."
 CET_independent_armed_forces_3:0 "Самостоятельно действующие вооружённые силы"
 CET_independent_armed_forces_3_desc:0 "Армия недавно получила дополнительное внимание от цетанского Верховного командования."
 CET_independent_armed_forces_2_b:0 "Самостоятельно действующие вооружённые силы"
 CET_independent_armed_forces_2_desc:0 "Недавнее сокращение бюджета ослабило армию."
 CET_independent_armed_forces_3_b:0 "Самостоятельно действующие вооружённые силы"
 CET_independent_armed_forces_3_b_desc:0 "Армия мертва."
 CET_military_reorganisation_nf:0 "Реорганизация цетанской армии"
 CET_military_reorganisation_nf_desc:0 "Цетус внёс изменения в структуру армии. Это отрицает любые наступательные возможности."
 CET_SC_question:0 "Южнокорвусский вопрос"
 CET_SC_question_desc:0 "Возник вопрос о том, что делать с Южным Корвусом в будущем. Если его не решить, это может привести к росту беспорядков."
 CET_expand_em:0 "Расширить Exercitus Maris"
 CET_expand_em_desc:0 "нам нужно больше морской пехоты!!"
 CET_counterattack:0 "Цетанская контратака"
 CET_counterattack_desc:0 "убить их, пока мы не умерли"
 CET_defence:0 "Цетанская быстрая оборона"
 CET_defence_desc:0 "Пусть истекают кровью."
 CET_army_cut:0 "Сокращение бюджета армии"
 CET_army_cut_desc:0 "Флот усилен."
 CET_naval_cut:0 "Сокращение бюджета флота"
 CET_naval_cut_desc:0 "Реформы армии разрешены!"
 CET_budget_reviewed:0 "Пересмотр бюджета"
 CET_budget_reviewed_desc:0 "Мы пересмотрели наш бюджет в армии и флоте. Снижает потребление товаров народного потребления."
 CET_defence_planning:0 "Планирование обороны"
 CET_defence_planning_desc:0 "Бункеры повсюду."
 CET_desperate_defence:0 "Внедрённые оборонительные меры"
 CET_desperate_defence_desc:0 "Мы втянуты в войну, и нам нужно принять меры, чтобы не капитулировать немедленно."
 CET_master_s_centaura:0 "Властелин Южной Кентавры"
 CET_master_s_centaura_desc:0 "Свергнув региональную державу — Антарес, мы можем заявить, что никакая другая южнокентаврийская страна не может сравниться с нашей силой."
 CET_strengthened_monarch:0 "Усиленная монархия"
 CET_strengthened_monarch_desc:0 "Сильная монархия может принести лучшую стабильность среди народа."
 CET_refurbish_scaphan_line:0 "Обновление линии Скафана"
 CET_refurbish_scaphan_line_desc:0 "Линия Скафана пришла в упадок из-за отсутствия ремонта и ухода за бункерами, которые её охраняют. Мы должны вернуть этой оборонительной линии её былое величие, если хотим, чтобы она выдержала атаки."
 CET_the_whale_sea:0 "Кит"
 CET_the_whale_sea_desc:0 "Созвездие Цетуса основано на ките. С древних времён было решено, что Цетус должен претендовать на океаны."
 CET_towards_greater_cetus:0 "К великому Цетусу"
 CET_towards_greater_cetus_desc:0 "Судьба Цетуса — захватить мир, как он захватил древнюю Венеру."
 CET_develop_selves_idea:0 "Развитие себя"
 CET_develop_selves_idea_desc:0 "Мы должны сосредоточиться на себе, чтобы улучшить наши страны, а не захватывать больше земель."
 CET_southern_frontier:0 "Южный рубеж"
 CET_southern_frontier_desc:0 "В последнее время отношения между Империумом Антарес и нами испортились. Мы не можем сомневаться, что у них армия сильнее нашей, и мы должны подготовиться к любым угрозам, которые могут прийти с юга."

