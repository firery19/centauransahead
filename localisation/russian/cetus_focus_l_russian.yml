 CET_unite_corvuses:0 "Объединить Корвусы"
 CET_unite_corvuses_desc:0 "Захвата Южного Корвуса недостаточно. Непреодолимая империалистическая сила требует полностью стереть Корвус как суверенное государство и интегрировать северный и южный Корвус."
 CET_deport_corvuns_north:0 "Депортировать корвунов"
 CET_deport_corvuns_north_desc:0 "Мы можем посадить несотрудничающих корвунов на корабли, направляющиеся в великий океан Инанис, где их судьбу можно оставить на ваше усмотрение."
 CET_towards_a_greater_cetus:0 "К великому Цетусу"
 CET_towards_a_greater_cetus_desc:0 "Говорят, что Цетус доминировал на Венере, таким образом Цетус привёл своих последователей в Форму как часть Итермунди и создал обширные океаны. Мы верим, что будем доминировать над Формой, как Цетус когда-то доминировал над Венерой миллиарды лет назад."
