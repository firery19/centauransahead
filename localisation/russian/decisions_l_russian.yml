 FRA_communist_civil_war_decision:0 "Неминуемое коммунистическое восстание"
 FRA_communist_civil_war_decision_desc:0 "Растущее возбуждение радикальной политики становится всё труднее успокаивать — в конце концов нам придётся противостоять этому так или иначе."
 FRA_fascist_civil_war_decision:0 "Неминуемое фашистское восстание"
 FRA_fascist_civil_war_decision_desc:0 "Растущие популистские настроения оказываются непреодолимой волной. Неизбежного не избежать."
 ETH_defeat_italy:0 "Разгромить колонизаторов"
 ETH_defeat_italy_category:0 "Вторая итало-эфиопская война"
 ETH_defeat_italy_category_desc:0 "Италия вновь стремится превратить Эфиопию в простую колонию. В прошлый раз мы разгромили захватчиков, и мы сможем разгромить их снова, если только сможем окончательно вытеснить их с наших границ!"
 seize_some_trains_woo:0 "Реквизировать гражданские поезда"
 seize_some_trains_woo_desc:0 "Частные железнодорожные компании контролируют нашу инфраструктуру. С приближением войны мы имеем полное право реквизировать оборудование для государственных нужд."
 random_general_monarchy_tt:0 "Случайный [FROM.GetAdjective] генерал тайно проникнется монархическими симпатиями."
 removed_when_cancelled_war_prop:0 "Пропагандистские кампании прекращены."
 war_propaganda_casualties:0 "Воспевать героизм"
 war_propaganda_casualties_desc:0 "Хотя число погибших растёт, наш народ должен усвоить, что герои куются только в бою."
 war_propaganda_convoys:0 "Поощрять бережливость"
 war_propaganda_convoys_desc:0 "Даже гражданские могут помочь выиграть войну — заботой и вниманием к использованию материалов каждый грамм стали может стать вдвое ценнее для военных нужд."
 war_propaganda_bombing:0 "Поддерживать боевой дух"
 war_propaganda_bombing_desc:0 "Хотя бомбы падают вокруг нас, наши отважные рабочие продолжают трудиться. Именно этим духом мы одержим победу."
 war_support_during_war:0 "Поддержка войны"
 CHI_occupation_actions:0 "Меры против оккупации"
 CHI_breach_the_yellow_river:0 "Прорвать дамбы Хуанхэ"
 CHI_breach_the_yellow_river_desc:0 "Хуанхэ — источник жизни для окрестных регионов, но она стоит на пути надвигающегося вторжения. Как крайняя мера для задержки вторгающихся сил было предложено взорвать сложную систему дамб и плотин.\n\nЭффективность этого действия трудно определить, но последствия будут серьёзными."
 yellow_river_blown:0 "Масштабное наводнение"
 yellow_river_blown_desc:0 "Этот регион сильно затоплен из-за диверсии на противопаводковых сооружениях Хуанхэ."

