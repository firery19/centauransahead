 DOMESTIC_FILM_INDUSTRY_DESC:0 "[ROOT.GetAdjective] киноиндустрия значительно развилась за последнее десятилетие. Имея население, жаждущее развлечений, мы можем извлечь выгоду из кинопродукции, созданной для пробуждения патриотических чувств."
