 # ТИПЫ ВСПОМОГАТЕЛЬНЫХ СУДОВ
 support_ship_hull:0 "Судно обеспечения"
 support_ship:0 "Судно обеспечения"
 support_ship_1:0 "Судно обеспечения"
 support_ship_1_desc:0 "Суда обеспечения — это небоевые корабли, ориентированные на логистическую поддержку боевого флота, увеличивая оперативную автономность за счёт запасов топлива и припасов."
 support_ship_2:0 "Улучшенное судно обеспечения"
 support_ship_2_desc:0 "Боевой опыт позволяет создать более совершенное и эффективное судно обеспечения, способное поддерживать боевой флот на ещё больших расстояниях."
 repair_ship_hull:0 "Ремонтное судно"
 repair_ship:0 "Ремонтное судно"
 repair_ship_1:0 "Ремонтное судно"
 repair_ship_1_desc:0 "Ремонтные суда несут тяжёлое восстановительное оборудование, которое может стать решающим фактором между сильно повреждённым кораблём, способным добраться до порта, и затонувшим."
 repair_ship_2:0 "Улучшенное ремонтное судно"
 repair_ship_2_desc:0 "Ещё более совершенное ремонтное судно с новейшим оборудованием, способное спасти дружественные боевые корабли от всех, кроме самых критических повреждений."
 escort_carrier:0 "Эскортный авианосец"
 escort_carrier_desc:0 "Меньший и более дешёвый авианосец, обычно используемый для сопровождения конвоев и противолодочной борьбы, а не для прямых флотских операций. Несёт небольшую, но полезную авиагруппу."