l_russian:
 ship_hull_carrier_conversion_bb:1 "Переоборудованный корпус линкора"
 ship_hull_carrier_conversion_bb_desc:0 "Переоборудование корпуса линкора. Этот новый тип кораблей был создан во время Гризианских войн Урсой для транспортировки и запуска самолётов."
 ship_hull_carrier_conversion_ca:1 "Переоборудованный корпус крейсера"
 ship_hull_carrier_conversion_ca_desc:0 "Переоборудование корпуса крейсера. Этот новый тип кораблей был создан во время Гризианских войн Урсой для транспортировки и запуска самолётов."
 ship_hull_mega_carrier:0 "Ледяной авианосец"
 ship_hull_mega_carrier_desc:0 "Гигантский авианосец, созданный из экспериментальных ледовых композитов, таких как Пайкерит, позволяющий использовать обычные самолёты, увеличивая дальность нашей морской авиации."
 ship_hull_nuclear_submarine:0 "Атомная подводная лодка"
 ship_hull_nuclear_submarine_desc:0 "Благодаря ядерным реакторам наши подводные лодки могут находиться под водой очень долго, сохраняя высокую скорость, что делает их чрезвычайно смертоносным инструментом в нашем арсенале."

