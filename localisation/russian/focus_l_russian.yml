 COV_navy: "Флот конфедерации"
 COV_navy_desc: "Практически найменьший флот на всём свете, но Корвунский флот всё ещё представляет 'угрозу' для побережья различных стран."
 COV_dockyards: "Построить верфи"
 COV_dockyards_desc: ""
