 COV_officer_exchange_desc: ""
 COV_ant_military_cooperation: "Военное сотрудничество с Антаресом"
 COV_establish_official_connections: "Официальные связи"
 COV_ant_military_cooperation_desc: ""
 COV_tech_sharing: "Обмен технологиями"
