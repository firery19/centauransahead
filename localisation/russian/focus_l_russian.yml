 LEO_industrial_effort: "Развитие промышленности"
 LEO_industrial_effort_desc: "Все политические усилия следует сосредоточить на том, чтобы обеспечить развитие промышленности мирного назначения."
 LEO_industrial_effort_2: "Развитие промышленности II"
 LEO_industrial_effort_2_desc: "Стальная воля и всенародный трудовой подъем помогут нам собрать силы для нового промышленного прорыва."
 LEO_construction_effort: "Развитие строительства"
 LEO_construction_effort_tt: "Недостаточно стройплощадок для §Yфабрик§!"
 LEO_construction_effort_desc: "Не следует недооценивать гражданскую промышленность, даже когда надвигается война."
 LEO_production_effort: "Развитие вооружений"
 LEO_production_effort_tt: "Недостаточно стройплощадок для §Yвоенных заводов§!"
 LEO_production_effort_desc: "Кто умеет делать трактора, сумеет делать и танки! Мы не можем допустить отставания военной промышленности."
 LEO_construction_effort_2: "Развитие строительства II"
 LEO_construction_effort_2_desc: "Мы должны усовершенствовать фабрики, чтобы ускорить производство товаров для торговли и обеспечить дальнейшее строительство."
 LEO_production_effort_2: "Развитие вооружений II"
 LEO_production_effort_2_desc: "Не стоит пытаться переориентировать фабрики на выпуск военной продукции. Мы должны сосредоточиться на развитии военной промышленности как таковой."
 LEO_production_effort_3: "Развитие вооружений III"
 LEO_production_effort_3_desc: "Необходимо и дальше совершенствовать военные заводы для производства самой современной военной техники."
 LEO_infrastructure_effort: "Развитие инфраструктуры"
 LEO_infrastructure_effort_desc: "Страна без соответствующей инфраструктуры не может заниматься продвинутыми исследованиями и строительством."
 LEO_infrastructure_effort_tt: "Недостаточно стройплощадок для §Yинфраструктуры§!"
 LEO_infrastructure_effort_2: "Развитие инфраструктуры II"
 LEO_infrastructure_effort_2_desc: "Необходимо расширять инфраструктуру, развивая транспорт и средства связи для работы над высокотехнологичными секретными проектами."
 LEO_construction_effort_3: "Развитие строительства III"
 LEO_construction_effort_3_desc: "Расширение нашей инфраструктуры открыло для нас новые возможности в строительной сфере."
  
 ###Полит.Ветка
 LEO_lion_rises: "Рёв льва"
 LEO_lion_rises_desc: "Дух льва непоколебим, леониты прошли через годы и века угнетения, но наша нация устояла. Сегодня день когда мы восстанем из пепла, против импералистов которые держали нас в наших оковах!"
 
 LEO_break_eagles_chain: "Изгнать орла"
 LEO_break_eagles_chain_desc: "Наш народ в Аквиле должен восстать и сбросить оковы орла. Лев сильнее орла!"
 
 LEO_unshackle_whales_chains: "Изгнать кита"
 LEO_unshackle_whales_chains_desc: "Наш народ в Цетусе должен восстать и сбросить оковы кита. Эти грёбанные цетаны больше не будут оккупировать нашу землю!"
 
 LEO_lion_victory: "Львиная победа"
 LEO_lion_victory_desc: "Наконец, после всего через что мы прошли, мы свободны..."
 
 LEO_restore_emperor: "Вернуть трон императору"
 LEO_restore_emperor_desc: "Пришло время вернуть трон нашему законному императору. Боже храни императора!"
 
 LEO_gap_conference: "Будущее империи"
 
 
