 COV_the_confederation: "Конфедерация"
 COV_the_confederation_desc: "Корвус это националистическая страна находящаяся в западной центавре. Будущее Корвуса начинается здесь и сейчас!"
 ###Хист
 COV_take_SC: "Вернуть юг"
 COV_take_SC_desc: "Потеря южного Корвуса окунула нашу страну в тёмные века, буквально. Нам нужен уголь для поддержки нашей экономики, так что мы начинаем подготовку к реваншу."
 #COV_retake_sc:0 "Retake South Corvus"
 #COV_retake_sc_desc:0 "Our preparations are done. We shall march back into South Corvus and retake what once was ours."
 COV_prepare_to_take_SC: "Начать подготовку"
 COV_prepare_to_take_SC_desc: "Мы должны подготовится к возвращению южного Корвуса. Наша армия слишком слаба чтобы победить Цетус на данный момент."
 COV_conscription: "Увеличить призыв"
 COV_conscription_desc: "Мы введём массовый призыв в городах чтобы задавить мясом армию Цетуса."
 COV_ramp_production_up: "Ускорить производство"
 COV_ramp_production_up_desc: "Нам нужно производить больше вооружения для нашей растущей армии."
 COV_coastal_battery: "Возвести прибережные батареи"
 COV_coastal_battery_desc: "Может у нас и нету сил чтобы сражатся на море, но мы можем отстроить батареи на наших берегах."
 COV_expand_coastal_battery: "Больше батарей!"
 COV_expand_coastal_battery_desc: "Хотя количество батарей которые мы уже построили может хватать, но мы не можем быть в этом уверены. Мы должны сфокусироватся на построении более крупных и мощных батарей."
 COV_antarean_diplomacy: "Дипломатия с Антаресом" ###Поддержка от Антареса
 COV_antarean_diplomacy_desc: "Антарес разделяет схожие с нами ценности и идеологии, а также торгует с нами необходимыми ресурсами. Разве не очевидно продолжать эти дружественные дипломатические отношения?"
 COV_invite_antarean_advisors: "Пригласить антарийских советников" 
 COV_invite_antarean_advisors_desc: "Мы должны пригласить советников из Антареса чтобы улучшить нашу армию и доктрину к грядущей войне."
 COV_expand_antarean_support: "Поддержка от Империума"
 COV_expand_antarean_support_desc: "Мы попробуем увеличить поддержку от Антареса в виде покупки оружия и что-то в этом роде."
 COV_increase_trade_wtih_ant: "Увеличение торговли с Антаресом"
 COV_increase_trade_wtih_ant_desc: ""
