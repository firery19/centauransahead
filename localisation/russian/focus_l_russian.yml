 COV_torpedo_navy: "Торпедный флот"
 COV_torpedo_navy_desc: "Сосредоточившись на флоте из торпедных катеров, ни один флот не посмеет приблизиться к нам."
 COV_light_navy: "Лёгкий флот"
 COV_light_navy_desc: "Лёгкий флот, полезный как для наступательных, так и для оборонительных действий."
 COV_big_navy: "Тяжёлый флот"
 COV_big_navy_desc: "Несмотря на заявления советников о том, что Корвус не способен собрать большой флот, Оливер Кхорин набухался в стельку и отдал этот приказ. К сожалению к тому моменту как наш король протрезвел - Приказ уже нельзя было отменить."
# исследования
 COV_research: "Учредить исследовательский комплекс Q"
 COV_research_desc: "Мы создадим исследовательский центр для военных и гражданских целей."
 COV_research_military: "Экспериментальные военные разработки"
 COV_research_military_desc: ""
 COV_research_gun: "Модернизация винтовок"
 COV_research_gun_desc: "Для армии важнее всего отдельный солдат. Чтобы наши бойцы сражались лучше, нам стоит сосредоточиться на исследованиях стрелкового оружия."
 COV_research_artillery: "Модернизация артиллерии"
 COV_research_artillery_desc: "Король битвы - артиллерия, важнейшее вооружение в современной войне. Нам нужно разрабатывать новые артиллерийские орудия."
 COV_research_vehicle: "Моторизация армии"
 COV_research_vehicle_desc: "Грузовики можно использовать для перевозки товаров по стране. А также для перевозки солдат."
 COV_research_armored_car: "Бронемашины"
 COV_research_armored_car_desc: "Приварив металлические листы к автомобилям, мы сможем защитить их от стрелкового оружия, а добавив пулемёт сделаем их эффективными против пехоты. Они полезны для подавления вражеского огня."
 COV_research_tank: "Бронетрактора"
 COV_research_tank_desc: "Добавив ещё больше металла на трактора, мы создадим сухопутные корабли, прозванные «танками». Они будут более бронированными чем автомобили, а также иметь лучшее вооружение."
 COV_research_civilian: "Гражданские разработки"
 COV_research_civilian_desc: "Гражданские исследования не должны отставать от военных! Гражданская промышленность тоже важна."
 COV_electronic: "Исследования в электронике"
 COV_electronic_desc: ""
