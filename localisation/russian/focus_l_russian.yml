 AQU_the_status_quo: "Наследие революции"
 AQU_the_status_quo_desc: "Наша страна прошла через революцию не так давно. В результате революции у нас есть сенат, конституция и самое важное - демократия. Наилучшее это то что наш король решил самостоятельно сложить полномочия и стать номинальной главной государства. Несмотря на то что Антарес пытался уничтожить нас и нашу свободу в 1875 году, они с позором нам проиграли. Ничто не пошатнёт нашу демократию!"

 AQU_address_the_parliament: "Выборы в сенат"
 AQU_address_the_parliament_desc: "После революции был создан сенат. В ближайшее время будут проводится выборы в него. Несмотря на то что долгое время в сенате доминировали либералы и консерваторы(в основном вторые), теперь всё больше людей желают изменить текущий статус дел. Грядут огромные изменения в сенат..."
 
 AQU_support_the_tories: "Второй срок Эвана"
 AQU_support_the_tories_desc: "Президенство Эвана можно легко описать - не самое лучшее, но стабильное. При его администрации экономика была стабильной, но стагнирующей, единственные его достижение это его сельскохозяйственная политика, которые субсидировали для фермеров ради механизации. Можно сказать при нём был застой."
 
 AQU_raise_campaign_funds: "Повысить средства на предвыборную кампанию"
 AQU_raise_campaign_funds_desc: "Средства на предвыборную кампанию очень важны, особенно для поддержки сенаторов от нашей партии, которые встречаются лицом к лицу с проблемами на выборах. Поднимая финансирование нашей кампании мы сможем поднять наши шансы в политической борьбе против ГПП."
 
 AQU_last_minute_deal: "Анализировать достижение ДАН" 
 AQU_last_minute_deal_desc: "Мы будем анализировать наши достижение, менять нашу политику и доказывать публике что мы можем адаптироватся под новое время, не смотря на наши взгляды."
 
 AQU_nominate_ewan: "Защитник статуса КВО"
 AQU_nominate_ewan_desc: ""
 
 AQU_support_the_whigs: "Новые лица"
 
 AQU_CPP_speech_talona: "Речь в Талоне"
 
 AQU_liberal_appeal_intellectual: "Дружба с интеллектуалами"
 
 AQU_liberal_reorganize_CPP: "Реорганизировать ГПП"
 
 AQU_failed_election: "Сорванные выборы"
 
 AQU_the_kings_return: "Наш замечательный король, Лукас Сильва!"
 
 AQU_prepare_for_the_elections: "Начать предвыборную кампанию"
 AQU_prepare_for_the_elections_desc: "The elections are coming soon and both the liberals and conservatives are slowly starting their campaign. The conservatives are driving around the rural areas, campaigning there among the populace while the liberals are focusing on bigger cities and universities. Even smaller parties like the collectivists started their campaign. Perhaps the politics of Aquila will change greatly..."
 
 AQU_another_five_years_in_Volucris: "Ещё 5 лет в Волукрисе"
 AQU_another_five_years_in_Volucris_desc: "Выборы закончились, ДАН получили большинство в сенате, мы будем править Аквилой ещё 5 лет."
