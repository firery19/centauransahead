 COV_request_antarean_intervention: "Запросить интервенцию с юга"
 COV_request_antarean_intervention_desc: "Война идёт не в нашу пользу. Если мы не попросим помощи, Цетус захватит северный Корвус и мы перестанем существовать. Буквально."
 COV_khorin_tau_marry: "Королевская свадьба" ###Анна Кхорин❤
