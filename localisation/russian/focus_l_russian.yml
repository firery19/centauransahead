 COV_contact_southern_rebels: "Выслать диверсантов на юг"
 COV_contact_southern_rebels_desc: "Мы должны послать диверсантов в южный Корвус чтобы нарушить операции Цетуса."
 COV_rebel_sabotage: "Саботаж инфраструктуры"
 COV_rebel_sabotage_desc: "Мы начнём атаковать инфраструктуру Цетуса в южном Корвусе."
 COV_sabotage_railway: "Саботаж железных дорог"
 COV_sabotage_railway_desc: "Атакуя железные дороги мы уменьшаем количество припасов которые попадут на фронт к врагу."
 COV_sabotage_supply: "Саботаж узлов снабжения"
 COV_sabotage_supply_desc: "Атаковав узлы снабжения, мы ухудшаем снабжение для противника."
 COV_sabotage_factory: "Саботаж военных заводов"
 COV_sabotage_factory_desc: "Напрямую атакуя их заводы в южном Корвусе мы замедляем их производство оружия. Но мы должны будем их починить если они их сами не починят."
 COV_sabotage_factory_2: "Саботаж военных заводов в Цетусе"
 COV_sabotage_factory_2_desc: "Мы всегда на 1 шаг впереди, мы устроим саботажи в САМОМ ЦЕТУСЕ!"
 ###Война
 COV_war_with_cetus: "Война за южный Корвус"
 COV_war_with_cetus_desc: "Наша подготовка окончена. Мы вернём юг в родную гавань."
 COV_initial_offensive: "Начальное наступление"
 COV_initial_offensive_desc: "Мы быстро продвинемся в Цетус, застав их врасплох — они не ожидают вторжения."
 COV_consolidate_gains: "Закрепить успех"
 COV_consolidate_gains_desc: "Мы вернули часть Южного Корвуса. Мы окопаемся и позволим Цетанцам атаковать нас."
 COV_improve_supply_issue: "Улучшить цепочку снабжения"
 COV_improve_supply_issue_desc: "Цепочка снабжения ужасна! Нам нужно как-то её улучшить."
 COV_fortification_focus: "Приоритет укреплений"
 COV_fortification_focus_desc: "В рамках плана обороны мы построим бункеры, чтобы сдержать их наступление."
 COV_increase_gun_production: "Увеличить производство оружия"
 COV_increase_gun_production_desc: "Нам нужно больше оружия для наших войск. Мы увеличим производство."
 COV_continue_attack: "Возобновить наступление"
 COV_continue_attack_desc: "Мы должны возобновить наступление иначе наше продвижение заглохнет."
 COV_penal_battalions: "Штрафные батальоны"
 COV_penal_battalions_desc: "Все они тут - Убийцы, воры, педофилы, военные преступники и предатели - все они будут добровольно или принудительно призваны на службу на передовой."
 COV_mountain_breaker: "Сокрушители гор"
 COV_mountain_breaker_desc: "Мы воспользуемся 'корвунскими фокусами' для прокладки путей сквозь горы, это поможет нашим силам преодолевать любые горы на пути."
