# --- ЛИДЕРЫ ---
 GRS_fernan_flamenco:0 "Фернан Фламенко"
 GRS_valentine_flamenco:0 "Валентин Фламенко"
 GRS_emperor_valentine:0 "Император Валентин I"
 GRS_xavier_navarro:0 "Ксавьер Наварро"

# --- ИДЕИ ---
 GRS_desert_warriors_idea:0 "Пустынные воины"
 GRS_desert_warriors_idea_desc:0 "Груса — единственная нация в Кентавре, на чьих землях большая часть территории покрыта пустыней Арида. Грусанцы научились преодолевать суровые вызовы пустынного климата."

 GRS_masters_of_the_arida_idea:0 "Хозяева Ариды"
 GRS_masters_of_the_arida_idea_desc:0 "Для чужаков Арида — беспощадная и враждебная пустошь. Для нас это наш дом. Наши солдаты научились жить, двигаться и сражаться в ней, превращая пустыню в решающее преимущество против любого, кто осмелится пересечь её."

 GRS_the_flamenco_dynasty_idea:0 "Династия Фламенко"
 GRS_the_flamenco_dynasty_idea_desc:0 "Фламенко правят Грусой веками. Они обладают безраздельной властью над Грусой."

 GRS_devastation_at_cabo_vesca_idea:0 "Разрушение при Кабо-Веска"
 GRS_devastation_at_cabo_vesca_idea_desc:0 "Морское сражение при Кабо-Веска в 1868 году оставило грусанский флот разбитым и впоследствии привело к проигрышу Грусой Войны за пролив. Уверенность флота так и не восстановилась по-настоящему, несмотря на внушительный вид на бумаге, боевой дух флота остаётся неопределённым."

 GRS_reforming_navy_0:0 "Жалкие морские реформы"
 GRS_reforming_navy_0_desc:0 "Унижение при Кабо-Веска подорвало доверие к Грусанскому флоту. Десятилетия плохого управления и устаревшей доктрины превратили флот в тень самого себя."

 GRS_reforming_navy_1:0 "Реформирование флота"
 GRS_reforming_navy_1_desc:0 "Попытки реформ начались, но флот по-прежнему страдает от некомпетентности и устаревших практик."

 GRS_reforming_navy_2:0 "Восстановление флота"
 GRS_reforming_navy_2_desc:0 "Первые реформы показали обнадёживающие результаты. Цепочки снабжения и стандарты офицеров медленно улучшаются."

 GRS_reforming_navy_3:0 "Реорганизованный флот"
 GRS_reforming_navy_3_desc:0 "Флот начал внедрять современные доктрины и структуры командования, значительно улучшив координацию."

 GRS_reforming_navy_4:0 "Модернизация армады"
 GRS_reforming_navy_4_desc:0 "Грусанские верфи и военно-морские академии снова производят способные корабли и офицеров."

 GRS_reforming_navy_5:0 "Возрождённая Великая Армада"
 GRS_reforming_navy_5_desc:0 "Великая Армада в значительной степени оправилась от своего исторического унижения и теперь входит в число сильнейших флотов региона."

 GRS_new_grand_armada:0 "Новая Великая Армада"
 GRS_new_grand_armada_desc: "Мы больше не несём позор унижения нашего поражения при Кабо-Веска. Эта глава закрыта. Мы двинулись дальше, адаптировались и модернизировались там, где ошибались. Из уроков поражения был выкован более сильный флот — дисциплинированный, решительный и непоколебимый. Грусанский флаг снова гордо реет над морями, несомый кораблями, достойными нашего имени. Наша морская гордость, которую считали утерянной, вернулась обновлённой, а с ней — и воля повелевать водами, как прежде."

 GRS_new_grand_armada2:0 "Новая Великая Армада"
 GRS_new_grand_armada2_desc: "Мы больше не несём позор унижения нашего поражения при Кабо-Веска. Эта глава закрыта. Мы двинулись дальше, адаптировались и модернизировались там, где ошибались. Из уроков поражения был выкован более сильный флот — дисциплинированный, решительный и непоколебимый. Грусанский флаг снова гордо реет над морями, несомый кораблями, достойными нашего имени. Наша морская гордость, которую считали утерянной, вернулась обновлённой, а с ней — и воля повелевать водами, как прежде."

 GRS_new_grand_armada3:0 "Новая Великая Армада"
 GRS_new_grand_armada3_desc: "Мы больше не несём позор унижения нашего поражения при Кабо-Веска. Эта глава закрыта. Мы двинулись дальше, адаптировались и модернизировались там, где ошибались. Из уроков поражения был выкован более сильный флот — дисциплинированный, решительный и непоколебимый. Грусанский флаг снова гордо реет над морями, несомый кораблями, достойными нашего имени. Наша морская гордость, которую считали утерянной, вернулась обновлённой, а с ней — и воля повелевать водами, как прежде."

 GRS_new_grand_armada4:0 "Новая Великая Армада"
 GRS_new_grand_armada4_desc: "Мы больше не несём позор унижения нашего поражения при Кабо-Веска. Эта глава закрыта. Мы двинулись дальше, адаптировались и модернизировались там, где ошибались. Из уроков поражения был выкован более сильный флот — дисциплинированный, решительный и непоколебимый. Грусанский флаг снова гордо реет над морями, несомый кораблями, достойными нашего имени. Наша морская гордость, которую считали утерянной, вернулась обновлённой, а с ней — и воля повелевать водами, как прежде."

 GRS_emptiness_of_the_interior:0 "Пустота внутренних земель"
 GRS_emptiness_of_the_interior_desc:0 "Огромная пустыня Арида поглощает грусанские земли. У Грусы мало мест для земледелия, ещё меньше — для строительства, а рыболовная промышленность должна работать сверхурочно, чтобы сводить концы с концами."

 GRS_new_grand_armada5:0 "Грусанская морская гегемония"
 GRS_new_grand_armada5_desc:0 "Унижение при Кабо-Веска больше не определяет нас. То, что когда-то было символом национального позора, стало основой нашего возрождения. Благодаря реформам, инновациям и непоколебимой решимости и силе, Великая Армада Короля была преобразована в силу, более мощную, чем когда-либо прежде. Грусанский флаг снова гордо реет над морями."

 GRS_expanded_naval_academy:0 "Расширенная военно-морская академия"
 GRS_expanded_naval_academy_desc:0 "Расширение Королевской военно-морской академии позволило нам обучать большее число офицеров, одновременно повышая образовательные стандарты по всему флоту. Будущие адмиралы будут поступать на службу с более глубоким пониманием современной морской войны, гарантируя, что Армада останется готовой к вызовам нового века."

 GRS_avenging_cabo_vesca:0 "Месть за Кабо-Веска"
 GRS_avenging_cabo_vesca_desc: "Кентаври наконец узнает, что такое настоящее поражение. В тот роковой день наши храбрые моряки были скошены их пушками, их жертва осталась без ответа слишком долго. Но это время прошло. Сегодня наша месть свершится. Мы не дрогнем и не забудем. Кентаврийцы будут раздавлены, их сила сломлена, а то, что по праву принадлежит нам, будет возвращено. За каждую потерянную жизнь, за каждое запомненное имя мы ответим яростью."

 GRS_the_centimado_idea:0 "Центимадо"
 GRS_the_centimado_idea_desc:0 "Центимадо отвечают за охрану городских ворот, правительственных зданий и государственных чиновников. Они высоко обучены и дисциплинированы и всегда будут защищать свой пост."

 GRS_desert_aviators:0 "Пустынные лётчики"
 GRS_desert_aviators_desc:0 "Полёты над пустыней Арида требуют дисциплины, выносливости и мастерства. Грусанские пилоты обучены ориентироваться в песчаных бурях, экстремальных температурах и на огромных просторах бесплодной местности."

 GRS_desert_aviators_upgrade:0 "Пустынные асы"
 GRS_desert_aviators_upgrade_desc:0 "Суровое небо Ариды породило элитную группу пилотов, чьё мастерство не имеет равных во всём регионе."

 GRS_flying_artillery_idea:0 "Поддержка с воздуха"
 GRS_flying_artillery_idea_desc:0 "Самолёты будут использоваться для поддержки наземных войск, доставляя огневую мощь сверху, поражая цели из пушек, бомбами и любыми другими средствами, имеющимися в нашем распоряжении."

 GRS_royal_fighter_squadron_idea:0 "Королевская истребительная эскадрилья"
 GRS_royal_fighter_squadron_idea_desc: "Мы отдадим приоритет формированию Королевской истребительной эскадрильи, обеспечивая контроль нашего неба за счёт скорости, дисциплины и превосходных пилотов."

 GRS_centauri_dominance:0 "Господство Кентаври над проливом"
 GRS_centauri_dominance_desc:0 "Кентаври установил подавляющее влияние над проливом Сагиттариус. Капитаны торговых судов всё чаще подчиняются авторитету Кентаври, в то время как грусанские патрули с трудом поддерживают свою власть в проливе."

 GRS_centauri_advantage:0 "Преимущество Кентаври"
 GRS_centauri_advantage_desc:0 "Кентаври сохраняет растущее преимущество в проливе Сагиттариус. Грусанские сборщики пошлин сталкиваются с сопротивлением торговцев, а региональные державы всё чаще смотрят на Кентаври как на доминирующего гаранта морской безопасности в проливе Сагиттариус."

 GRS_contested_strait:0 "Оспариваемый пролив"
 GRS_contested_strait_desc:0 "Ни Груса, ни Кентаври не обладают контролем над проливом Сагиттариус."

 GRS_grusan_advantage:0 "Преимущество Грусы"
 GRS_grusan_advantage_desc:0 "Грусанские патрули поддерживают уважаемое и эффективное присутствие в проливе Сагиттариус. Торговые суда в основном соблюдают пошлинные правила, укрепляя наше влияние на региональные морские дела."

 GRS_grusan_strait_dominance:0 "Господство Грусы над проливом"
 GRS_grusan_strait_dominance_desc:0 "Груса стоит как бесспорный хозяин пролива Сагиттариус. Наши сборщики пошлин доминируют в региональных водах, иностранные торговцы склоняются перед нашей властью, а влияние Кентаври серьёзно ослаблено."

 GRS_low_tolls:0 "Низкие пошлины в проливе"
 GRS_low_tolls_desc:0 "Пошлины в проливе Сагиттариус остаются относительно умеренными. Торговцы проходят с небольшим сопротивлением, и у иностранных держав мало причин возражать против их взимания."

 GRS_moderate_tolls:0 "Умеренные пошлины в проливе"
 GRS_moderate_tolls_desc:0 "Мы установили сбалансированную систему пошлин в проливе Сагиттариус. Доходы от торговли остаются здоровыми, в то время как иностранные торговцы и соседние державы в основном терпят наше присутствие в регионе."

 GRS_high_tolls:0 "Высокие пошлины в проливе"
 GRS_high_tolls_desc:0 "Пошлины в проливе Сагиттариус значительно выросли. Торговцы и иностранные правительства всё больше раздражены нашими растущими требованиями."

 GRS_extortionate_tolls:0 "Грабительские пошлины в проливе"
 GRS_extortionate_tolls_desc:0 "Пролив Сагиттариус стал источником огромного богатства для Грусы. Капитаны торговых судов подвергаются непомерным пошлинам, досмотрам и произвольным сборам, что разжигает региональную неприязнь к Грусе."

