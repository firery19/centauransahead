 GRS_neutrality_party_long:0 "Дом Фламенко"
 GRS_fascism_party:0 "Вооружённые силы Грусы"
 GRS_fascism_party_long:0 "Старшие офицеры и адмиралы"
 GRS_auth_dem_party:0 "Движение за объединение"
 GRS_auth_dem_party_long:0 "Грусско-Веганское движение за объединение"

 # ---- решения -------------------------
 GRS_vega_influence:0 "Влияние Грусы на Вегу"
 GRS_pressure_vega:0 "Продвигать перемены в Веге"
 GRS_diplomatic_mission:0 "Отправить дипломатическую миссию"
 GRS_economic_investment:0 "Инвестировать в Вегу"
 GRS_military_advisors:0 "Отправить военных советников"
 GRS_support_of_unification:0 "Влияние Грусы в Веге"
 GRS_support_of_unification_desc:0 "Груса и Вега были соперниками с тех пор, как последняя отделилась от Грусанской империи; и всё же народы каждой нации так похожи. При старом руководстве объединение никогда бы не произошло, но под руководством Ксавьера мы теперь можем предпринять усилия, чтобы убедить народ Веги и её величество Алину Верде, что мы должны отбросить наши разногласия раз и навсегда и снова объединиться в одно целое. Это если веганцы позволят объединению состояться.\n\n§YТекущее влияние в Веге:§! [?GRS_influence_VEG]"
 GRS_secret_propaganda_missions:0 "Секретные пропагандистские миссии"
 GRS_continued_outreach:0 "Продолжение дипломатических контактов"
 GRS_economic_cooperation:0 "Торговля товарами"
 GRS_cultural_exchange:0 "Культурный обмен"
 GRS_demand_referendum:0 "Потребовать референдум"

 GRS_sagittarius_category:0 "Влияние на пролив Сагиттариус"
 GRS_sagittarius_category_desc:0 "Пролив Сагиттариус остаётся ожесточённо оспариваемым между Грусой и Кентаври. Если мы собираемся продолжать взимать пошлины с торговых судов, мы должны действовать осторожно; чрезмерные пошлины или захват иностранных грузов разозлят державы, зависящие от пролива, в то время как сокращение пошлин позволит Кентаври укрепить своё влияние в регионе. Эти конкурирующие давления должны быть тщательно управляемы, если мы стремимся сохранить наше господство над проливом Сагиттариус.\n\nТекущая пошлинная политика: [GRS_toll_level_text]\nТекущий контроль над проливом: [GRS_control_level_text]"

 GRS_inspect_foreign_merchants:0 "Досматривать иностранные торговые суда"
 GRS_inspect_foreign_merchants_desc:0 "Торговые суда, проходящие через пролив, будут подвергаться досмотру и обыскам грусанскими моряками."
 GRS_escort_friendly_convoys:0 "Сопровождать дружественные конвои"
 GRS_escort_friendly_convoys_desc:0 "Сопровождение дружественных торговых судов улучшит доверие к торговле и укрепит наше влияние на пролив Сагиттариус."
 GRS_naval_crackdown:0 "Военно-морская облава"
 GRS_naval_crackdown_desc:0 "Временное усиление морского контроля восстановит порядок и власть в проливе Сагиттариус."
 GRS_suspend_toll_collections:0 "Приостановить взимание пошлин"
 GRS_suspend_toll_collections_desc:0 "Экстренный откат пошлинной политики может успокоить напряжённость и восстановить доверие к грусанской власти."

 GRS_toll_level_text_low:0 "§7Низкие§!"
 GRS_toll_level_text_moderate:0 "§YУмеренные§!"
 GRS_toll_level_text_high:0 "§OВысокие§!"
 GRS_toll_level_text_extortionate:0 "§RГрабительские§!"

 GRS_control_centauri_dominant:0 "§RГосподство Кентаври§!"
 GRS_control_centauri_favoured:0 "§OПреимущество Кентаври§!"
 GRS_control_contested:0 "§YОспариваемый§!"
 GRS_control_grusan_favoured:0 "§7Преимущество Грусы§!"
 GRS_control_grusan_dominant:0 "§GГосподство Грусы§!"

 GRS_raise_tolls:0 "Повысить пошлины в проливе"
 GRS_raise_tolls_desc:0 "Повышение пошлин значительно увеличит государственные доходы, хотя чрезмерное налогообложение рискует оттолкнуть торговцев и иностранные державы."
 GRS_reduce_tolls:0 "Снизить пошлины в проливе"
 GRS_reduce_tolls_desc:0 "Снижение пошлин ослабит напряжённость и улучшит коммерческие отношения в проливе Сагиттариус."
 GRS_expand_patrols:0 "Расширить патрулирование пролива"
 GRS_expand_patrols_desc:0 "Дополнительные морские патрули укрепят власть Грусы в проливе Сагиттариус."
 GRS_reduce_patrols:0 "Сократить патрульное присутствие"
 GRS_reduce_patrols_desc:0 "Сокращение патрульных операций снизит нагрузку на флот, хотя рискует ослабить наш контроль над проливом."

 GRS_naval_reforms:0 "Морские реформы"
 GRS_naval_reforms_desc:0 "Кабо-Веска, 1868 год, Война за пролив. Великая Армада Короля была уничтожена одним катастрофическим ударом. Но это бедствие не должно определять нас вечно. Благодаря широким реформам, современной доктрине и обновлённым инвестициям мы можем снова создать флот, достойный господства над морями.\n\nТекущее состояние морских реформ: [GRS_naval_reform]"
 GRS_officer_training_programs:0 "Программы подготовки офицеров"
 GRS_officer_training_programs_desc:0 "Современному флоту требуются компетентные офицеры, способные адаптироваться к новым формам ведения войны."
 GRS_modernize_naval_logistics:0 "Модернизировать морскую логистику"
 GRS_modernize_naval_logistics_desc:0 "Эффективные цепочки поставок и скоординированные операции верфей необходимы для поддержания флота."
 GRS_update_fleet_coordination:0 "Обновить координацию флота"
 GRS_update_fleet_coordination_desc:0 "Улучшенные коммуникации и структуры командования позволят флоту действовать более эффективно."
 GRS_establish_naval_war_college:0 "Учредить Военно-морской колледж"
 GRS_establish_naval_war_college_desc:0 "Специализированная военно-морская академия подготовит новое поколение офицеров и стратегов."
 GRS_expand_coastal_shipyards:0 "Расширить прибрежные верфи"
 GRS_expand_coastal_shipyards_desc:0 "Дополнительные верфи ускорят ремонт и строительство кораблей."
 GRS_rebuild_the_grand_armada:0 "Восстановить Великую Армаду"
 GRS_rebuild_the_grand_armada_desc:0 "Унижение при Кабо-Веска будет наконец преодолено, когда Груса восстановит свой морской престиж."
 GRS_expand_naval_academies:0 "Расширить военно-морские академии"
 GRS_expand_naval_academies_desc:0 "Расширение военно-морского образования обеспечит постоянный приток обученного персонала для флота."
 GRS_recommission_old_vessels:0 "Вернуть в строй старые корабли"
 GRS_recommission_old_vessels_desc:0 "Несколько устаревших военных кораблей всё ещё могут служить, если их правильно отремонтировать и модернизировать."
 GRS_standardize_naval_doctrine:0 "Стандартизировать морскую доктрину"
 GRS_standardize_naval_doctrine_desc:0 "Единая доктрина улучшит координацию между эскадрами и командирами."
 GRS_expand_drydock_capacity:0 "Расширить мощность сухих доков"
 GRS_expand_drydock_capacity_desc:0 "Более крупные и мощные сухие доки обеспечат обслуживание современных военных кораблей."
 GRS_integrate_coastal_defenses:0 "Интегрировать береговую оборону"
 GRS_integrate_coastal_defenses_desc:0 "Прибрежные укрепления и морские патрули должны работать вместе для защиты наших берегов."
 GRS_naval_industrial_expansion:0 "Морское промышленное расширение"
 GRS_naval_industrial_expansion_desc:0 "Расширение морской промышленности позволит Грусе конкурировать с великими морскими державами."
 GRS_naval_reform_state_0:0 "§tЖалкое§!"
 GRS_naval_reform_state_1:0 "§RПосредственное§!"
 GRS_naval_reform_state_2:0 "§OВосстанавливающееся§!"
 GRS_naval_reform_state_3:0 "§YКомпетентное§!"
 GRS_naval_reform_state_4:0 "§7Модернизирующееся§!"
 GRS_naval_reform_state_5:0 "§GВозрождающееся§!"
 GRS_naval_reform_state_6:0 "§CВеликая Армада восстановлена§!"

 # ----- фокусы ------
 GRS_accept_the_loss_at_cabo_vesca:0 "Принять поражение при Кабо-Веска"
 GRS_accept_the_loss_at_cabo_vesca_desc:0 "Катастрофа при Кабо-Веска остаётся одним из величайших унижений в нашей морской истории. Это было решающее поражение, обеспечившее наш проигрыш в Войне за пролив. Вместо того чтобы зацикливаться на старых воспоминаниях или фантазировать о том, что могло бы быть, мы должны учиться на своих ошибках и восстановить наш флот до того, чем он когда-то был: могучим и грозным."
 GRS_learn_from_errors:0 "Учиться на ошибках"
 GRS_learn_from_errors_desc:0 "Мы проанализируем отчёты о битве, укажем на то, что пошло не так, и внесём корректировки, чтобы это никогда не повторилось."
 GRS_begin_the_reforms:0 "Начать реформы"
 GRS_begin_the_reforms_desc:0 "Мы начнём реформировать наш флот, хотя это займёт время."
 GRS_naval_reform_program:0 "Программа морских верфей"
 GRS_naval_reform_program_desc:0 "Мы запустим Программу морских верфей, которая позволит нам построить больше верфей в ближайшее время."
 GRS_expand_leopolis_dockyards:0 "Расширить верфи Леополиса"
 GRS_expand_leopolis_dockyards_desc:0 "Леополис — бьющееся сердце Грусы. Расширение верфей позволит нам строить больше кораблей."
 GRS_develop_northern_ports:0 "Развивать северные порты"
 GRS_develop_northern_ports_desc:0 "Развитие наших северных портов позволит нам иметь более сильное присутствие в проливе Сагиттариус."
 GRS_libran_dockyards:0 "Верфи Либерийского океана"
 GRS_libran_dockyards_desc:0 "Либерийский океан огромен. Если мы хотим оказать на него влияние, мы построим больше верфей на нашем восточном побережье."
 GRS_royal_screens:0 "Эсминцевые усилия"
 GRS_royal_screens_desc:0 "Мы приложим больше усилий к строительству небольших эскортных кораблей."
 GRS_knights_of_the_libran_ocean:0 "Рыцари Либерийского океана"
 GRS_knights_of_the_libran_ocean_desc:0 "Мы приложим больше усилий к строительству крейсеров."
 GRS_restore_the_armada:0 "Восстановить Армаду"
 GRS_restore_the_armada_desc:0 "Мы отдадим приоритет линкорам перед всеми другими судами."
 GRS_new_grand_armada:0 "Новая Великая Армада"
 GRS_new_grand_armada_desc:0 "Мы адаптировались и двинулись дальше после Кабо-Веска. Павшие никогда не будут забыты, но их жертва укрепила наш флот, сделав его снова грозным."
 GRS_rapida_class_destroyer:0 "Эсминец класса «Рапида»"
 GRS_rapida_class_destroyer_desc:0 "Быстрый, манёвренный и проворный. Эсминцы класса «Рапида» — более совершенный и современный эсминец."
 GRS_arida_class_cruiser:0 "Крейсер класса «Арида»"
 GRS_arida_class_cruiser_desc:0 "Названный в честь нашей грозной пустыни, крейсер класса «Арида» — более совершенный и современный крейсер."
 GRS_valentine_class_battleship:0 "Линкор класса «Валентин»"
 GRS_valentine_class_battleship_desc:0 "Названный в честь Валентина Фламенко, линкор класса «Валентин» — более современный и смертоносный «Стальной Горшок»."
 GRS_new_ship_of_the_line:0 "Новый линейный корабль"
 GRS_new_ship_of_the_line_desc:0 "Пришло время разработать новый линейный корабль для флота. Хотя его окончательные характеристики ещё предстоит определить, одно можно сказать наверняка: он должен превзойти даже могучие Супер-Стальные Горшки в размерах, огневой мощи и броне."
 GRS_armour_and_guns:0 "Броня и орудия"
 GRS_armour_and_guns_desc:0 "Прежде чем можно будет спроектировать новый военный корабль, необходимо провести обширные исследования более современной морской брони и более тяжёлых орудий."
 GRS_leopolis_class_dreadnought:0 "Дредноут класса «Леополис»"
 GRS_leopolis_class_dreadnought_desc:0 "Класс «Леополис» станет гордостью Великой Армады Короля. Огромные, тяжеловооружённые и исключительно дорогие, эти дредноуты будут господствовать на морях и уничтожать любое судно, которое будет достаточно невезучим, чтобы бросить им вызов."
 GRS_new_admirals:0 "Новые адмиралы"
 GRS_new_admirals_desc:0 "Требуется новое поколение военно-морского руководства. Перспективные офицеры, отличившиеся мастерством, дисциплиной и инновациями, будут возведены в ранг адмирала."
 GRS_expand_naval_academy:0 "Расширить Военно-морскую академию"
 GRS_expand_naval_academy_desc:0 "Наши военно-морские академии должны быть расширены для удовлетворения растущих потребностей современного флота. Улучшенные условия и больший набор обеспечат постоянный приток способных офицеров и адмиралов."
 GRS_prepare_for_an_invasion:0 "Подготовиться к вторжению"
 GRS_prepare_for_an_invasion_desc:0 "Рана Кабо-Веска не зажила. Будут разработаны детальные планы будущего вторжения в Кентаври, гарантирующие, что когда придёт время, наши силы будут готовы."
 GRS_avenge_cabo_vesca:0 "Отомстить за Кабо-Веска"
 GRS_avenge_cabo_vesca_desc:0 "Грусанские моряки погибли под кентаврийскими пушками при Кабо-Веска. Их жертва не будет забыта, и их смерть не останется без ответа. Пришло время добиться справедливости для павших."
 GRS_dominate_the_libran_ocean:0 "Господствовать в Либерийском океане"
 GRS_dominate_the_libran_ocean_desc:0 "С поражением нашего северного соперника Либерийский океан лежит перед нами открытым. Расширяя наше военно-морское присутствие, мы установим бесспорную морскую гегемонию во всём регионе."
 GRS_naval_design_bureau:0 "Королевское бюро военно-морского проектирования"
 GRS_naval_design_bureau_desc:0 "Специализированное бюро военно-морских архитекторов, инженеров и стратегов было собрано для надзора за проектированием будущих военных кораблей. Их работа гарантирует, что каждое судно, спущенное на воду под грусанским флагом, отражает последние инновации в морской войне."
 GRS_advanced_gunnery_trials:0 "Испытания передовой артиллерии"
 GRS_advanced_gunnery_trials_desc:0 "Орудия будущего не могут быть созданы только на основе теории. Обширные испытания и учебные стрельбы выявят сильные и слабые стороны нашей новейшей морской артиллерии."
 GRS_admiralty_reforms:0 "Реформы Адмиралтейства"
 GRS_admiralty_reforms_desc:0 "Структура Адмиралтейства была модернизирована и оптимизирована. Более эффективная система командования позволит нашим офицерам реагировать на угрозы с большей скоростью и гибкостью."
 GRS_fleet_war_games:0 "Военно-морские учения"
 GRS_fleet_war_games_desc:0 "Крупномасштабные военно-морские учения стали регулярным явлением. Эти учения позволяют офицерам тестировать новые тактики, улучшать координацию и готовиться к будущим конфликтам."
 GRS_marine_assault_training:0 "Подготовка морского десанта"
 GRS_marine_assault_training_desc:0 "Специализированные штурмовые силы начали тренировки для крупномасштабных десантных операций. Эти элитные формирования возглавят будущие высадки на вражеские берега."
 GRS_amphibious_logistics:0 "Десантная логистика"
 GRS_amphibious_logistics_desc:0 "Успешное вторжение зависит не только от кораблей и солдат, но и от способности их снабжать. Улучшенное логистическое планирование гарантирует, что наши силы останутся снабжёнными даже во время затяжных заморских операций."
 GRS_study_naval_armour:0 "Изучать морскую броню"
 GRS_study_naval_armour_desc:0 "Броня — основа любого современного корабля. Неадекватная броня или её размещение в неправильных местах подвергнет грусанских моряков риску. Изучение того, почему и где броня должна и не должна привариваться, критически важно для проектирования военных кораблей."
 GRS_begin_production_of_aeroplanes:0 "Начать производство самолётов"
 GRS_begin_production_of_aeroplanes_desc:0 "Самолёты быстро становятся заметной особенностью современной войны. Груса должна создать собственную авиационную промышленность, прежде чем её обойдут."
 GRS_desert_flight_training:0 "Пустынная лётная подготовка"
 GRS_desert_flight_training_desc:0 "Небо над Аридой предоставляет идеальные условия для подготовки опытных пилотов, способных действовать в самых суровых условиях."
 GRS_construction_of_air_bases:0 "Строительство авиабаз"
 GRS_construction_of_air_bases_desc:0 "Военно-воздушным силам требуется нечто большее, чем просто самолёты. Новые аэродромы обеспечат инфраструктуру, необходимую для запуска наших самолётов."
 GRS_flying_artillery:0 "Летающая артиллерия"
 GRS_flying_artillery_desc:0 "Самолёты могут служить продолжением армии, поражая позиции врага и поддерживая войска с воздуха."
 GRS_royal_fighter_squadron:0 "Королевская истребительная эскадрилья"
 GRS_royal_fighter_squadron_desc:0 "Элитные пилоты-истребители станут основой наших растущих военно-воздушных сил, защищая грусанское небо и бросая вызов вражеским самолётам."
 GRS_streamline_domestic_production:0 "Оптимизировать внутреннее производство"
 GRS_streamline_domestic_production_desc:0 "Стандартизируя конструкции и координируя промышленные усилия, мы можем значительно повысить эффективность производства самолётов."

 GRS_deport_disloyal_vegans:0 "Депортировать нелояльных веганцев"
 GRS_deport_disloyal_vegans_desc:0 "Мы депортируем всех веганцев, которые не лояльны Грусе. Их дерзость не будет терпима, и они будут насильственно отправлены к нашим соседям." # Я ЛЮБЛЮ ОТЫГРЫВАТЬ

 # ----- разное ----------
 GRS_centimado_equipment_tt:0 "Мы конфискуем оборудование Центимадо."
 GRS_penal_equipment_tt:0 "Старые склады оборудования будут опустошены."
 GRS_fallback_lines_tt:0 "§CСтроит несколько укреплений первого и второго уровня в Северной пустыне Арида§!"
 GRS_coastal_lines_tt:0 "§CСтроит береговые укрепления в Южной Грусе, регионе Леополис и Северо-Восточной Грусе§!"
 GRS_leopolis_lines_tt:0 "§CСтроит укрепления третьего уровня вокруг Леополиса§!"
 GRS_desert_lines_tt:0 "§CСтроит укрепления второго уровня в узловых точках пустыни Арида§!"
 GRS_plains_lines_tt:0 "§CСтроит укрепления второго уровня на грусано-веганской границе§!"
 GRS_north_coast_tt:0 "§CСтроит береговые укрепления второго уровня вдоль пролива Сагиттариус§!"
 GRS_imprisoned_council_tt:0 "§tЭТО ПРЕДОТВРАТИТ НАЙМ ЛЮБЫХ §! §CПОЛИТИЧЕСКИХ СОВЕТНИКОВ§! §tНАЙМИТЕ ИХ ДО ТОГО, КАК ВОЗЬМЁТЕ ЭТОТ ФОКУС!§!"
 GRS_non_historical_tt:0 "§6Эта ветка содержит контент, который не является частью официального лора Грусы. Если вы предпочитаете более лорно-дружелюбный опыт, другой путь может быть более подходящим.§!"