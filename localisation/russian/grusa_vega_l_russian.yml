 VEG_alina_verda:0 "Алина Верда"
 VEG_queens_blessing_idea:0 "Наследие Люсии"
 VEG_queens_blessing_idea_desc:0 "Веганское государство ведёт своё происхождение от кризиса престолонаследия, разделившего Грусу, и героической битвы, в которой первая королева и её рыцари разгромили грусанскую армию, отброшенную обратно в пустыню Арида. Успешно защитив суверенитет своего государства и получив свидетельства восхваляющих подвиги королевы, Люсия Верде получила от священника астранистское имя Лира, и в честь королевы её новое государство было названо Вега — ярчайшая звезда Лиры."
 VEG_protected_by_murus_idea:0 "Защищена Мурусом"
 VEG_protected_by_murus_idea_desc:0 "Плато Мурус — это высокий скалистый хребет, простирающийся вдоль границы Аквилы и Веги. Иногда называемый Эль-Муро, это плато использовалось древней Грусанской империей для отражения захватчиков, приближающихся со стороны Аквилы. Оно всё ещё служит этой цели, но теперь защищает новое веганское государство, а не старую объединённую Грусу."