l_russian:
 news.caromite.t:0 "Каромиты"
 news.caromite.d:0 "В одном из наших регионов зафиксированы сообщения о перенаселении каромитов. Стоит взвесить имеющиеся у нас варианты.\n\nЧто нам делать?"
 news.caromite.a:0 "Оставить их в покое"
 news.caromite.b:0 "Истребить их"
 news.caromite.c:0 "Переселить их"

 # модовые новости

 #MINIMIZE_EVENT:0 "§GНажмите§! чтобы свернуть. Событие будет помещено в очередь событий в разделе §HСобытия и Решения§!."
 # падение victory_point_xxx, южнокорвусская война
 news.409.t:0 "Начало Южнокорвусской войны"
 news.409.d:0 "Корвус вторгся в Цетус."
 news.409.a:0 "Любопытное развитие событий."
 news.409.b:0 "Что? Защитить территорию!"
 news.409.b2:0 "Что? Защитить нашу землю!"
 news.409.c:0 "Пусть это будет быстрая война."
 news.410.t:0 "Падение Науты" # антарес
 news.410.d:0 "Наута, столица Цетуса, пала перед Антаресом в ходе недавнего вторжения. Внешний оборонительный периметр города с его многочисленными укреплениями и траншеями пал быстро после масштабного артиллерийского обстрела и стремительного прорыва кавалерии. В городских кварталах Цетанская армия держалась, однако из-за нехватки войск для прикрытия всего города они были постепенно вытеснены. Будущее Цетуса ещё никогда не было столь мрачным. Репортаж с линии фронта от Петера Мейрреза (1872-), Маркоса Троннеля (1886-), Томаса Эммеиза (1893-) и Алана Уджери (1883-)"
 news.410.a:0 "Любопытное развитие событий."
 news.410.b:0 "Мы выступим на Науту!"
 news.410.c:0 "Это катастрофа!"
 news.410.e:0 "Они выступят на Науту!" # корвус
 news.411.t:0 "Падение Миры" # антарес
 news.411.d:0 "С самого начала Южнокорвусской войны оборона Миры ставилась под сомнение из-за отсутствия финансирования каких-либо оборонительных укреплений на юге, и теперь, после долгих лет непрерывной войны, Мира пала перед антареанскими захватчиками. Будущее Цетуса ещё никогда не было столь мрачным. Репортаж с линии фронта от Петера Мейрреза (1872-), Маркоса Троннеля (1886-), Томаса Эммеиза (1893-) и Алана Уджери (1883-)"
 news.411.a:0 "Любопытное развитие событий."
 news.411.b:0 "Мы выступим на Миру!"
 news.411.c:0 "Это катастрофа!"
 news.411.e:0 "Антарес выступил на МИРУ!" # корвус
 news.412.t:0 "Падение Науты" # корвус
 news.412.d:0 ""Цетус ещё не потерян!" — Цетанский солдат\n\nСегодня Корвунские силы полностью окружили и зачистили последний оплот сопротивления Цетанской армии и флота у сухих доков Науты, вместе с ними пала и столица Цетуса. Битва за город превратила его в руины, поскольку стойкое сопротивление защитников, отстаивавших свою родину, не оставила ни одного уцелевшего здания.\n\nНеизвестно, сможет ли Цетус продолжать сопротивление, но, тем не менее. Стоя среди камней и обломков после смертоносного артиллерийского обстрела Корвуса, на ум приходит лишь одна мысль: «Есть ли смысл в этом безумии? Должны ли были они умереть?»"
 #news.412.d:0 "Наута, столица Цетуса, пала перед Корвусом после битвы в исторической столице. Цетус приказал каждому подразделению в городе сражаться до смерти, но этого оказалось недостаточно, чтобы остановить наступление Корвуса."
 news.412.a:0 "Любопытное развитие событий."
 news.412.b:0 "Корвус выступит на Науту."
 news.412.c:0 "Это катастрофа!"
 news.412.e:0 "Мы выступим на Науту!"
 news.413.t:0 "Падение Миры"
 news.413.d:0 "С самого начала Южнокорвусской войны оборона Миры ставилась под сомнение из-за отсутствия финансирования каких-либо оборонительных укреплений на юге, приоритет отдавался северному фронту, и теперь, после долгих лет непрерывной войны, Мира пала перед корвунскими захватчиками. Будущее Цетуса ещё никогда не было столь мрачным. Репортаж с линии фронта от Андреу Доддика (1879-), Рафаэля Тупи Тавареса (1864-), Диего Нистикка (1866-), Диего Оба (1894-), Хосефа Лионнарды (1891-), Хуана Лопеса (1889-1957), Эдуардо Монггло (1894-) и Иларио Тромблея (1892-)"
 news.413.a:0 "Любопытное развитие событий."
 news.413.b:0 "Корвус выступил на МИРУ!"
 news.413.c:0 "Это катастрофа!"
 news.413.e:0 "Мы выступим на МИРУ!"
 news.415.t:0 "Падение Мулты"
 news.415.d:0 "Мулта, крупнейший город Южного Корвуса, недавно был взят Корвунскими силами, и лишь батальоны Цетанского сопротивления пытаются организовать оборону на южных окраинах.\n\nДипломаты и военные стратеги по всей Форме в шоке от того, что наступление Корвуса движется с беспрецедентной скоростью.\n\nЦетанская монархия пока отказывается от комментариев, но большинство опрошенных офицеров сходятся в одном — это только начало."
 news.415.a:0 "Любопытное развитие событий."
 news.415.b:0 "Это катастрофа!"
 news.415.c:0 "Это исторический момент."
 news.416.t:0 "Падение Сент-Керка"
 news.416.d:0 "Южнокорвусская война официально вступила на территорию собственно Цетуса, поскольку вчера силы Корвуса взяли под полный контроль Сент-Керк.\n\nИзвестный своим положением как врата между Цетанской и Корвунской цивилизациями на протяжении многих веков, падение этого города фактически разрушило любые надежды на прекращение огня между странами, поскольку Цетанская монархия объявляет тотальную войну."
 news.416.a:0 "Любопытное развитие событий."
 news.416.b:0 "Это катастрофа!"
 news.416.c:0 "Это исторический момент."
 news.417.t:0 "Падение Каррана"
 news.417.d:0 "Карран пал перед Корвусом. Извините, я не могу нормально писать эти сводки."
 news.417.a:0 "Любопытное развитие событий."
 news.417.b:0 "Это катастрофа!"
 news.417.c:0 "Это исторический момент."
 news.421.t:0 "Падение Каррана"
 news.421.d:0 "Карран пал перед Антаресом"
 news.421.a:0 "Любопытное развитие событий."
 news.421.b:0 "Это катастрофа!"
 news.421.c:0 "Это замечательно!"
 news.418.t:0 "Разграбление Менкара"
 news.418.d:0 "Неофициально известный многим как внутренняя столица Цетуса, Менкар лежит в руинах. Корвунские войска вошли в город после капитуляции мэра, который надеялся избежать разрушения города, но вместо того, чтобы его пожелания были исполнены, город сейчас разграбляется захватчиками.\n\nВероятно, высшее командование попытается остановить разрушение из-за важных железнодорожных соединений Менкара, но неизвестно, как быстро они это сделают."
 news.418.a:0 "Любопытное развитие событий."
 news.418.b:0 "Это катастрофа!"
 news.418.c:0 "Забирайте всё, что видите!"
 news.418.d:0 "Это тактическая победа!"
 news.419.t:0 "Падение Менкара"
 news.419.d:0 "Неофициально известный многим как внутренняя столица Цетуса, Менкар лежит в руинах. После тяжелой битвы Антареанские войска вошли в город после капитуляции мэра, который надеялся избежать дальнейшего разрушения города. Сейчас видно, что Антареанские войска укрепляют эту стратегическую позицию.\n\nЦетанское высшее командование, вероятно, попытается отбить город из-за важных железнодорожных соединений Менкара, но неизвестно, как быстро они это сделают."
 news.419.a:0 "Любопытное развитие событий."
 news.419.b:0 "Это катастрафа!"
 news.419.c:0 "Это тактическая победа!"
 news.420.t:0 "Падение Ликуса"
 news.420.d:0 "Южнокорвусская война дала обратный эффект против Ворона. Ликус, самый южный корвунский город по состоянию на 1886 год, был захвачен цетанскими силами после изнурительных недель уличных боёв. Население города, движимое ненавистью за то, что стало величайшей жертвой 1886 года, ожесточённо защищало каждый дюйм своего города, что привело к огромным потерям среди мирного населения.\n\nЭксперты говорят, что это повторится во всех корвунских городах, пока не падёт последний."
 news.420.a:0 "Любопытное развитие событий."
 news.420.b:0 "Это хорошо."
 news.420.c:0 "Мы должны контратаковать!"
 news.422.t:0 "Разрушение Раво"
 news.422.d:0 "Только что завершилась самая жестокая осада в истории Формы на сегодняшний день. Цетанские газеты распространяют фотографии мэра Раво, Эрнста Ноллака, избитого и протащенного по разрушенным городам столицы Корвуса как демонстрация полной победы над городом. Перед тем как королевская семья бежала из города, они приказали защищать город до последнего человека, приказ, который в значительной степени был выполнен, поскольку разрозненные сообщения предполагают, что даже сын короля принял участие в боях.\n\nБольшая часть города была сровнена с землёй постоянными артиллерийскими обстрелами, взрывчаткой и перестрелками. Большинство считает это концом Корвуса."
 news.422.a:0 "Любопытное развитие событий."
 news.422.b:0 "Это наша победа!"
 news.422.c:0 "Нас поджарили, сынок"
 news.423.t:0 "Падение Порт-Драмона"
 news.423.d:0 "Важный город, соединяющий Раво и Краз по морю, а также острова у побережья Корвуса, Порт-Драмон, пал перед Цетанскими силами.\n\nПроизошло ожесточённое сражение, в котором даже Корвунский флот участвовал в битве, обстреливая Цетанские позиции. В конце концов, Корвунские корабли были потоплены прибывшими Цетанскими кораблями, и город пал перед Цетанскими силами."
 news.423.a:0 "Любопытное развитие событий."
 news.423.b:0 "Это тактическая победа!"
 news.423.c:0 "Мы должны отбить его!"
 news.424.t:0 "Падение Краза" # вариант, Раво не пал
 news.424.d:0 "Неожиданно второй по важности город Корвуса, Раво, пал перед Цетанскими силами. В настоящее время Корвунские силы движутся к контратаке и возврату города, в то время как Цетанские войска остаются для укрепления своих позиций.\n\nОстаётся увидеть, что произойдёт в ближайшие дни."
 news.424.a:0 "Любопытное развитие событий."
 news.424.b:0 "Что? Мы взяли Краз, не взяв Раво?"
 news.424.c:0 "Всё кончено."
 news.425.t:0 "Падение Краза"
 news.425.d:0 "В том, что многие считают концом Южнокорвусской войны, Краз пал перед Цетанской армией. Королевская семья Корвуса едва успела бежать в Антарес с помощью всего, что осталось от Корвунского флота, и благодаря дипломатическому давлению Антареанского правительства.\n\nМногие могут ожидать новостей о капитуляции Корвуса в течение следующих недель, если не дней."
 news.425.a:0 "Любопытное развитие событий."
 news.425.b:0 "Для Корвуса всё кончено."
 news.425.c:0 "Всё кончено."
