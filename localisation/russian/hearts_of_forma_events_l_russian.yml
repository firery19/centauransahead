 # события Гризианских войн
 #news.414.t:0 "Лепус Восстаёт Против Урсы"
 #news.414.d:0 "В ранние утренние часы повстанцы поднялись против Урсанских сил, расквартированных в Лепусе. Сообщается, что небольшие стычки произошли в Порт-Матисоне и Арнебе, а вывод Урсанских сил был объявлен Урсанским губернатором Лепуса."
 #news.414.a:0 "Мы не позволим унизить себя во второй раз!"
 #news.414.b:0 "Немедленно установить контакт с повстанцами!"
 news.414.t:0 "Лепунская весна"
 news.414.d:0 "Во время выступления в Обнизове Урсанский губернатор города обращался к толпе. Толпа, уставшая от угнетения, переросла в бунт, требующий свободы.\n\nБеспорядки подавили местные Урсанские силы, которые были вынуждены отступить. После этого было объявлено временное правительство Лепуса, а Урсанский губернатор Лепуса объявил о выводе Урсанских сил из Центрального и Восточного Лепуса."
 news.414.a:0 "Это ужасно!"
 news.414.b:0 "Немедленно установить контакт с Лепусом!"
 news.414.c:0 "Новое государство?"
 news.1.t:0 "Падение Алькора"
 news.1.d:0 "Исторический и важный город Алькор, изначально основанный Урсанскими поселенцами десятилетия назад, недавно пал перед силами Компакта.\n\nЭто был важный административный центр Урсы в Канисе, и потеря этого города немедленно скажется на контроле Урсанских сил над Канисом."
 news.1.a:0 "Подходит ли конец Войны Компакта и Урсы к завершению?"
 news.1.b:0 "Это успешная кампания!"
 news.1.c:0 "Мы должны отбить город!"
 news.2.t:0 "Конец Гризианских войн"
 news.2.d:0 "Война в Канисе завершена. Война завершилась в пользу сил Компакта, а страны Орион и Гидра углубили свои дипломатические отношения.\n\nИз войны вышла новейшая страна Каниса, которая также установила дипломатические связи с остальными силами Компакта.\n\nПобеждённые Урсанские силы покидают Алькор, полностью выводя свои войска с континента Гидра."
 news.2.a:0 "Любопытное развитие событий."
 news.2.b:0 "Мы вернули Канис у Урсы."
 news.2.c:0 "Позорное поражение, но мы вернёмся."
 news.3.t:0 "Формирование Драконьего Компакта"
 news.3.d:0 "После переговоров между двумя странами был сформирован новый союз между Республикой Орион и Гидрой. Союзу предшествовала помощь Орионитов Гидре, и он был создан в ответ на недавнюю агрессию Урсы.\n\nУрсанские дипломаты были шокированы таким поворотом событий, отказавшись комментировать новое развитие."
 news.3.a:0 "Любопытное развитие событий."
 news.3.b:0 "Мы выступаем против Урсы"
 news.3.c:0 "Какого чёрта? Это акт агрессии!"

 # ? события
 news.700.t:0 "Миррен-Элькский пакт"
 news.700.d:0 "Вау, Цетус и Антарес подписали пакт о ненападении."
 news.700.a:0 "Любопытное развитие событий."
 news.700.b:0 "Это нехорошо."
 news.700.c:0 "Надеюсь, между нами сохранится мир."