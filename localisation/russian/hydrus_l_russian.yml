 hydrus.13.b:0 "Ничего не делать"
 
 hydrus.14.t:0 "Келанийский саммит"
 hydrus.14.d:0 "С обретением независимости Лепусом влияние Урсы на Гидру ослабевает. Гидра и Лепус стремятся заключить с нами официальный союз, чтобы сдерживать будущие атаки Урсы и положить конец правлению Урсы над Гидрой."
