 hydrus.1:0 "Заглушка"
 hydrus.1.t:0 "Недоступное нарушение события"
 hydrus.1.d:0 "Это тестовое событие."
 hydrus.1.a:0 "Ты не должен был запускать это событие."
 hydrus.1.b:0 "Я больше не буду запускать случайные события!!"
 
 hydrus.2.t:0 "Гидра протягивает руку"
 hydrus.2.d:0 "Недавно обретшее независимость государство Гидра обратилось к нам за помощью. Что нам делать?"
 hydrus.2.a:0 "Отправить помощь"
 hydrus.2.b:0 "Отказать"
 
 hydrus.3.t:0 "Орион соглашается"
 hydrus.3.d:0 "Успешно!!"
 hydrus.3.a:0 "Это хорошо."
 
 hydrus.4.t:0 "Орион отказывается"
 hydrus.4.d:0 "Ну почему они так делают, блин"
 hydrus.4.a:0 "Поплакать об этом"
 
 hydrus.5.t:0 "Начинается организованное сопротивление в Лепусе"
 hydrus.5.d:0 "Граждане Лепуса, видя успех Гидры, начали организованное сопротивление на своей территории."
 hydrus.5.a:0 "Чушь!"
 
 hydrus.6.t:0 "Беспорядки в Восточном Лепусе"
