 lps.4.t:0 "Восстание в Лепусе"
 lps.4.d:0 "Последствия подавления гражданского населения наступили. Стоило ли оно того? Никто не знает.\n\n§RПотеря Западного Лепуса немедленно приведёт к нашему поражению!§!"
 lps.4.a:0 "Снова подавить восстание!"
 
 lps.5.t:0 "Потеря Лепуса"
 lps.5.d:0 "Мы потеряли весь регион Лепуса. Народ Лепуса установил контроль над территорией и выгнал нас."
 lps.5.a:0 "Унизительное поражение"
 
 # идеи
 HYS_recently_independent:0 "Недавно обретшая независимость"
 HYS_recently_independent_desc:0 "Государство Гидра — молодая страна, получившая независимость от Федерации Урсы всего год назад в результате ослабления контроля Урсы над Гидрой."
 HYS_new_army:0 "Недавно созданная армия"
 HYS_new_army_desc:0 "У Гидры не было времени на создание профессиональной армии — есть только ополченцы и горстка обученных пехотинцев."
 HYS_food_shortages:0 "Нехватка продовольствия"
 HYS_food_shortages_desc:0 "Остров Гидра всегда полагался на своё небольшое население и импорт продовольствия, чтобы не умереть с голоду. Теперь не только население вышло из-под контроля, но и наш единственный сосед хочет нашей смерти. Если не победить врага быстро, Гидра может пасть без единого выстрела — разве что один человек попытается съесть другого."
 HYS_against_the_goliath:0 "Против Голиафа"
 HYS_against_the_goliath_desc:0 "Наш единственный сосед и величайший противник — Урса — нависает над нами, как голодный хищник. Нет ни одного месяца без сообщений об инцидентах с их участием, и многие до сих пор живут в страхе, что вторжение может произойти в любой момент..."
 HYS_no_army_serves_the_state:0 "Ни одна армия не служит государству" # < не используется, заменено на HYS_new_army
 HYS_no_army_serves_the_state_desc:0 "Революцию выиграли вооружённые граждане и ополченцы, и остров защищался ими по сей день. Хотя их легко содержать, они рухнут при первой же встрече с настоящей военной силой."
 #HYS_inexperienced_industry_idea:0 "Неопытная промышленность"
 #HYS_inexperienced_industry_idea_desc:0 "Будучи новой страной, Гидра не имеет большого опыта управления промышленностью."
 #HYS_sabotaged_factories_idea:0 "Урсанский подарок"
 #HYS_sabotaged_factories_idea_desc:0 "Когда урсанцы покидали Гидру, они оставили инфраструктуру, нашпигованную ловушками и взрывчаткой. Многие здания были повреждены до такой степени, что восстановлению не подлежат."
 HYS_newly_established_factories_idea:0 "Строительство новых заводов"
 HYS_newly_established_factories_idea_desc:0 "Мы строим новые заводы?"
 HYS_recruiting_new_army_idea:0 "Призывная кампания"
 
