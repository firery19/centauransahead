 hydrus.10.t:0 "Неминуемое восстание в Лепусе"
 hydrus.10.d:0 "Наши гарнизонные части в настоящее время ведут бои с повстанцами в Лепусе, но очевидно, что силы повстанцев нас подавляют.\n\nНачинайте эвакуацию в Западный Лепус, §Rиначе ваши дивизии будут уничтожены§!."
 hydrus.10.a:0 "Выходит из-под контроля"
 
 hydrus.11.t:0 "Гарнизонные части в Лепусе атакованы!"
 hydrus.11.d:0 "Наш гарнизон в Лепусе был атакован группой партизан. Что нам делать?"
 hydrus.11.a:0 "Усилить гарнизон"
 hydrus.11.b:0 "Репрессалии"
 hydrus.11.c:0 "Ничего не делать"
 
 hydrus.12.t:0 "Инфраструктура Лепуса атакована!"
 hydrus.12.d:0 "Одно из наших зданий только что взорвалось! Должно быть, сопротивление. Что нам делать?"
