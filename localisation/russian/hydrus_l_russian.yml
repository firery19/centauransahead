 HYS_prepare_for_rebellion:0 "Подготовиться к войне"
 HYS_prepare_for_rebellion_desc:0 "У повстанцев в Канисе не будет лёгкого пути, как у нас. Их географическая близость означает, что им придётся сражаться более ожесточённо, чем нам, чтобы получить независимость. Мы должны подготовиться к неизбежному."
 
 HYS_unification_discussions:0 "Конференция трёх наций"
 HYS_unification_discussions_desc:0 "Как показали Гризианские войны, Урса представляет собой нависшую угрозу, которая без сомнения нападёт на любые государства Гидры. Мы должны обсудить объединение с Лепусом и недавно независимым Канисом."
 
 HYS_the_commonwealth_path:0 "Сформировать Содружество"
 HYS_the_commonwealth_path_desc:0 ""
 
 HYS_all_is_united_under_one_banner:0 "Под одним знаменем"
 HYS_all_is_united_under_one_banner_desc:0 "Три страны, существующие в северной Гидре — Гидра, Лепус и Канис — объединятся в Содружество — Гидранское Содружество."
 
 HYS_unitary_state_negotiation:0 "Сформировать унитарное государство"
 HYS_unitary_state_negotiation_desc:0 "[Root.Capital.GetName]"
 
 HYS_all_is_united_under_hydrus:0 "Объединены как одно целое"
 HYS_all_is_united_under_hydrus_desc:0 "Понятия Гидры, Лепуса и Каниса как отдельных государств перестанут существовать. Три страны объединятся в единую нацию — Северо-Гидранские Штаты."
 
