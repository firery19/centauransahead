l_russian:
#персонажи
 LGS_guard_duke:0 "Герцог Гвард IV"
#идеи
 LGS_industry_name:0 "Минимальная индустриализация"
 LGS_industry_name_desc:0 "Лингстония — маленькая и глубоко изолированная страна, которая ещё не начала индустриализацию. В низинах и городских центрах есть несколько небольших мануфактур, но остальная часть страны всё ещё находится в доиндустриальном состоянии."
 LGS_industry_2_name:0 "Лингстонийская индустриализация"
 LGS_industry_2_name_desc:0 "Лингстония начала процесс индустриализации, но потребуется время, чтобы развить и модернизировать страну, которая так долго была изолирована."
 LGS_industry_3_name:0 "Лингстонийская промышленность"
 LGS_industry_3_name_desc:0 "Лингстония развила мощную промышленную базу и теперь способна производить широкий ассортимент товаров и машин внутри страны. Вместе с обильными природными ресурсами Лингстония стала самодостаточной и индустриализированной страной."
 LGS_army_name:0 "Устаревшая армия"
 LGS_army_name_desc:0 "Великая армия Лингстонии никоим образом не является великой. Застрявшая в прошлом веке, она мала и плохо снабжена устаревшим оборудованием. Она отчаянно нуждается в реформах и модернизации, если мы хотим защищать себя в будущем."
 LGS_army_2_name:0 "Реформирование армии"
 LGS_army_2_name_desc:0 "Армия Лингстонии реформируется, реорганизуется и расширяется, чтобы стать более боеспособной силой."
 LGS_army_3_name:0 "Великая армия Лингстонии"
 LGS_army_3_name_desc:0 "Великая армия Лингстонии прошла через тщательную реформу и расширение и стала самой грозной армией в Центральной Кентавре. Она готова защищать и завоёвывать во имя Лингстонии."
 LGS_navy_name:0 "Отсутствие военно-морских сил"
 LGS_navy_name_desc:0 "Хотя Лингстония имеет береговую линию, крошечный флот герцогства был расформирован десятилетия назад из-за отсутствия причин для его существования. В ближайшие годы это, возможно, придётся изменить, но пока Лингстония является морским не-существом."
 LGS_navy_2_name:0 "Создание флота"
 LGS_navy_2_name_desc:0 "Лингстония восстановила свой флот, но он всё ещё мал и не имеет опыта. Предстоит ещё много работы, чтобы создать флот, готовый сражаться против противников Лингстонии."
 LGS_navy_3_name:0 "Великая армада Лингстонии"
 LGS_navy_3_name_desc:0 "Великая армада Лингстонии не только восстановлена, но и более мощна, чем когда-либо. С флотом из линкоров и модернизированным флотом Лингстония готова претендовать на морское господство на Западном побережье Кентавры."
 LGS_neutral_name:0 "Лингстонийский изоляционизм"
 LGS_neutral_name_desc:0 "Из-за своей географии Лингстония является глубоко изолированной страной с небольшим количеством внешних связей."
 LGS_neutral_2_name:0 "Лингстонийский нейтралитет"
 LGS_neutral_2_name_desc:0 "Хотя в последние годы она открылась, Лингстония по-прежнему придерживается политики нейтралитета и невмешательства в дела других стран."
 LGS_solism:0 "§8Солизм§!"
 LGS_solism_desc:0 "Государственная религия Лингстонии, Солизм — монотеистическая религия, поклоняющаяся солнцу как божеству. Она была доминирующей религией в Лингстонии на протяжении веков из-за преследований в других астранистских странах Кентавры. Из-за солистского верования, что работа, когда солнце не светит, греховна, только высокие и чистые горы Лингстонийских Мейсеров были единственным местом в Кентавре, где утвердилось солистское общество."
#подсказки
 LGS_2_slots_tt:0 "До §Y2 штатов§! с как минимум §G2 доступными слотами для строительства§! получают §G1§! §Yгражданский завод§! и §G1§! §Yвоенный завод§! от этого фокуса."
 LGS_4yp_warning_tt:0 "Неспособность получить §RСВЫШЕ§! §R16§! §Yгражданских заводов§!, §R5§! §Gвоенных заводов§! и §R3§! §2верфей§! до истечения срока действия идеи §Rзаблокирует§! завершение §YЧетырёхлетнего плана§! и улучшение национального духа промышленности."
 LGS_units1_tt:0 "Три §Gрасширенные§! §Yтерриториальные бригады§! будут сформированы."
 LGS_units2_tt:0 "Две §Gрасширенные§! §Yпехотные дивизии§! и одна §Gрасширенная§! §Yгорнострелковая дивизия§! будут сформированы."
 LGS_chronos_tt:0 "§YИмперия Цетус§! передаёт корабль класса §Y«Хронос»§!"
 CET_approval_tt:0 "§R[CET.GetName] должна одобрить соглашение для получения бонусов.§!\n"
 CLB_approval_tt:0 "§R[CLB.GetName] должна одобрить соглашение для получения бонусов.§!\n"
 AQU_war_tt:0 "§CМы §Gприсоединимся§! к любой войне, в которую ввязалась Аквила.§!"

#события
 T.LGS.1:0 "Лингстония покупает эсминцы"
 D.LGS.1:0 "К нам обратилась Лингстония с просьбой использовать наши верфи для строительства для них эскортных кораблей. Шесть эсминцев пойдут на воссоздание Лингстонийского флота. Хотя продажа кораблей потенциальному противнику может быть плохой идеей, это отличная возможность заработать деньги."
 A.LGS.1:0 "Отличная сделка!"
 T.LGS.2:0 "Лингстония покупает линкоры"
 D.LGS.2:0 "К нам обратилась Лингстония с просьбой продать некоторые из наших старых линкоров, в частности два корабля класса «Хронос». Кроме того, они также хотят, чтобы мы построили для них два новых корабля класса «Кайтос»."
 A.LGS.2:0 "Плюсы перевешивают минусы."
 B.LGS.2:0 "Продавать линкоры потенциальному врагу? Возмутительно!"
 T.LGS.3:0 "Цетус отказывается от продажи линкоров"
 D.LGS.3:0 "Цетус прислал ответ. Они отказываются продавать свои линкоры и строить для нас любые другие линейные корабли."
 A.LGS.3:0 "Ну и ладно."
 T.LGS.4:0 "Претензии Лингстонии на долину Линг урегулированы"
 D.LGS.4:0 "Наши претензии на территорию Лингстонии были проблемой с момента основания Колумбийского государства. Это хорошая возможность решить эту проблему."
 A.LGS.4:0 "Отказаться от наших претензий"
 B.LGS.4:0 "Кем они себя возомнили?"
 T.LGS.5:0 "Претензии Лингстонии на Западную Лингстонию урегулированы"
 D.LGS.5:0 "Изолированное государство-отшельник Лингстония обращается к нам с просьбой урегулировать наши претензии на их территорию. Это хорошая возможность решить эту проблему."
 A.LGS.5:0 "Отказаться от наших претензий"
 B.LGS.5:0 "Кем они себя возомнили?"
 T.LGS.6:0 "Лингстония предлагает военный пакт"
 D.LGS.6:0 "Лингстония обратилась к нам с предложением о пакте о ненападении, а также взаимных гарантиях и военном доступе. Это может быть отличной возможностью закрепить наше влияние над маленьким герцогством."
 A.LGS.6:0 "Принять пакт"
 B.LGS.6:0 "Отклонить пакт"
#фокусы
 LGS_great_lingstonia:0 "Лингстония в XX веке"
 LGS_great_lingstonia_desc:0 "Лингстония — величайшая страна, но как мы справимся в новом веке?"
 LGS_shining_example_of_country:0 "Маяк свободы Кентавры"
 LGS_shining_example_of_country_desc:0 "Наша страна — яркий пример стабильной конституционной монархии в Кентавре, но мы всё ещё должны реформировать нашу страну в эту новую эпоху."
 LGS_deport_everyone_to_ocean:0 "Депортировать религиозные меньшинства"
 LGS_deport_everyone_to_ocean_desc:0 "Астранисты и унисты представляют угрозу для нашей страны и исторически были дестабилизирующим фактором. Для безопасности нашей страны мы должны депортировать их и очистить наши горы от их греха!"
 LGS_keep_not_solists_people:0 "Терпимо относиться к несолистам"
 LGS_keep_not_solists_people_desc:0 "Мы примем астранистов, унистов и другие религиозные меньшинства в нашей стране и будем работать над прекращением дискриминации."
 LGS_industrialisation:0 "Начать индустриализацию"
 LGS_industrialisation_desc:0 "Лингстония — маленькая и изолированная страна, но мы не можем отставать от наших более крупных соседей. Мы должны начать долгий путь к индустриализации в нашей горной стране."
 LGS_new_rails:0 "Великая западная железная дорога"
 LGS_new_rails_desc:0 "Великая западная железная дорога соединит изолированные прибрежные регионы на западе с остальной частью страны на востоке. Это улучшит транспорт внутри страны и соединит Восточную Лингстонию с остальным миром через океаны."
 LGS_self_sufficiency:0 "Обеспечить самодостаточность"
 LGS_self_sufficiency_desc:0 "Лингстония всегда была самодостаточной страной из-за своей изоляции, и мы должны обеспечить нашу самодостаточность в индустриализированном будущем."
 LGS_develop_country:0 "Развивать страну"
 LGS_develop_country_desc:0 "Наши глубокие долины и холмистые склоны — одни из самых живописных мест в мире, но также и очень слаборазвитые. Мы должны расширить сельскую инфраструктуру и инвестировать в ключевые области, такие как образование, чтобы модернизировать нашу страну для новой эпохи."
 LGS_more_factories:0 "Инвестировать в промышленность"
 LGS_more_factories_desc:0 "Мы импортируем машины и экспертов из наших более развитых соседей и начнём создавать собственную промышленную базу."
 LGS_resources_spawn:0 "Развивать наши ресурсы"
 LGS_resources_spawn_desc:0 "Наша страна богата ресурсами, но мы ещё не полностью их используем. Мы модернизируем и расширим нашу горнодобывающую промышленность и построим инфраструктуру, необходимую для её поддержки."
 LGS_four_year_plan:0 "Четырёхлетний план"
 LGS_four_year_plan_desc:0 "Чтобы завершить нашу индустриализацию, мы приступим к амбициозному четырёхлетнему плану по созданию нашей промышленности."
 LGS_year_1_infra:0 "Национальный инфраструктурный проект"
 LGS_year_1_infra_desc:0 "Мы построим нашу инфраструктуру для поддержки растущей промышленности и свяжем нашу страну воедино."
 LGS_year_2_coastal:0 "Развивать прибрежные регионы"
 LGS_year_2_coastal_desc:0 "Из-за нашей горной местности и изоляции наши прибрежные регионы являются наименее развитыми частями страны, но также и теми, у которых наибольший промышленный потенциал."
 LGS_year_3_light_industry:0 "Инвестиции в лёгкую промышленность"
 LGS_year_3_light_industry_desc:0 "Мы инвестируем в лёгкую промышленность для производства потребительских товаров и развития нашей гражданской экономики."
 LGS_year_4_heavy_industry:0 "Инвестиции в тяжёлую промышленность"
 LGS_year_4_heavy_industry_desc:0 "Мы инвестируем в тяжёлую промышленность для производства машин, инструментов и ресурсов, необходимых для самодостаточности."
 LGS_finish_industry:0 "Завершить Четырёхлетний план"
 LGS_finish_industry_desc:0 "Наш четырёхлетний план завершён, и мы создали мощную промышленность по сравнению с нашей маленькой страной. Воистину, Лингстония теперь готова к XX веку!"

 LGS_end_isolation:0 "Прекратить изоляцию"
 LGS_end_isolation_desc:0 "Лингстония была глубоко изолирована веками из-за нашей географии, но в этом новом веке с быстрым прогрессом мы больше не можем оставаться герцогством-отшельником."

 LGS_lingston_nationalism:0 "Поощрять лингстонийский национализм"
 LGS_lingston_nationalism_desc:0 "Наша великая страна Лингстония — лучшая страна в мире, и наши люди это знают."
 LGS_sollist_supremacy:0 "Солистское превосходство"
 LGS_sollist_supremacy_desc:0 "Солнце — величайшая сила из всех, работа в ночное время означала бы, что мы отдаём наши силы тьме."
 LGS_sunshine_rays:0 "Академия Солнечного Света"
 LGS_sunshine_rays_desc:0 "Исследования важны! Давайте создадим Академию Солнечного Света как первый в мире солистский университет."
 LGS_establish_diplomacy:0 "Установить дипломатические каналы"
 LGS_establish_diplomacy_desc:0 "С окончанием нашей изоляции дипломатические каналы будут важны для развития связей с другими странами. Заодно мы можем попросить Рию отказаться от претензий на наши земли."
 LGS_everyone_is_useless:0 "Все бесполезны"
 LGS_everyone_is_useless_desc:0 "Неважно. Контакт с внешним миром был ошибкой. Давайте просто разорвём связи с миром."
 LGS_formalise_columba:0 "Оформить колумбийскую дипломатию"
 LGS_formalise_columba_desc:0 "Даже в период нашей изоляции у нас был контакт с Колумбой независимо от того, что мы делали. Оформление связей с Колумбой будет важным шагом к связи с миром."

 LGS_save_aquila:0 "Спасти §3Аквилу§!"
 LGS_save_aquila_desc:0 "Народ Аквилы — наши давно забытые братья и сёстры из прошлого мира, и мы должны сделать всё возможное, чтобы спасти их от антареанского вторжения!"
 LGS_liberation_war:0 "§RОсвободительная война§!"
 LGS_liberation_war_desc:0 "Отправка добровольцев и оборудования недостаточна: если Антарес не остановит свою агрессию в Аквиле, могущественная Лингстония должна вмешаться напрямую и спасти Аквилу!"

 LGS_military:0 "Решить проблему устаревшей армии"
 LGS_military_desc:0 "Наша армия не только мала и плохо оснащена, но и ужасно устарела. Мы должны исправить это, если хотим защитить себя и мир от надвигающейся бури."
 LGS_equipment:0 "Потребности в оборудовании"
 LGS_equipment_desc:0 "Мы начнём с решения текущих потребностей в оборудовании и обеспечим полное оснащение нашей армии."
 LGS_units:0 "Расширить территориальное ополчение"
 LGS_units_desc:0 "Мы расширим наше ополчение и резервы для поддержки нашей регулярной армии во время войны."
 LGS_army_reform:0 "Реформировать набор в армию"
 LGS_army_reform_desc:0 "Текущая система набора устарела и неэффективна. Мы реформируем её, чтобы обеспечить большое количество обученных солдат для армии."
 LGS_regular_units:0 "Расширить регулярную армию"
 LGS_regular_units_desc:0 "Наша постоянная армия позорно мала даже для нашего размера: мы должны расширить её новыми и реформированными формированиями."
 LGS_mil_factories:0 "Создать внутреннее производство"
 LGS_mil_factories_desc:0 "Мы слишком долго полагались на иностранные компании для нашего оборудования. С приходом промышленной революции мы должны инвестировать в наши внутренние производственные возможности."
 LGS_better_army:0 "Реорганизация армии"
 LGS_better_army_desc:0 "Пришло время должным образом реорганизовать нашу армию и завершить армейскую реформу."
 LGS_regular_army:0 "Регулярная армия"
 LGS_regular_army_desc:0 "Теперь мы должны решить, какую армию мы хотим. Гибкая и большая регулярная армия из пехоты — вот что нам нужно."
 LGS_mountaineer_army:0 "Армия для Мейсера"
 LGS_mountaineer_army_desc:0 "Теперь мы должны решить, какую армию мы хотим. Специализированная горнострелковая армия — вот что нам нужно для боёв в великих горах Мейсер."

 LGS_establish_navy:0 "Создать флот"
 LGS_establish_navy_desc:0 "Прошли десятилетия с тех пор, как у нас был нормальный флот, но в эти времена мы должны снова защищать наши берега и торговлю. Мы начнём с покупки старых эсминцев у наших соседей и восстановления наших старых, ржавых и устаревших крейсеров, корпуса которых ещё не были списаны."
 LGS_train_ships:0 "Разобраться, как делать флот"
 LGS_train_ships_desc:0 "У нас нет опыта в морской войне, поэтому мы начнём с обучения небольшого флота кораблей, моряков, адмиралов и наймём иностранных советников, чтобы понять, как на самом деле делать флот."
 LGS_dockyards:0 "Создать внутреннюю военно-морскую промышленность"
 LGS_dockyards_desc:0 "Мы не можем полагаться на иностранную промышленность для строительства нашего флота. Мы должны создать собственные верфи и военно-морскую промышленность для создания нашего флота. Верфи в Икаре — хорошее место для начала, и они построят нам два современных лёгких крейсера в дополнение к дюжине торпедных катеров."
 LGS_dominate_ianis:0 "Господствовать над Ианисом"
 LGS_dominate_ianis_desc:0 "Наш флот не должен быть маленьким и незначительным: мы построим флот, достаточно сильный, чтобы господствовать над всем океаном Ианис!... со временем. А пока несколько цетанских линкоров будут хорошим началом."

 LGS_fascist_lapdog:0 "Фашистский переворот"
 LGS_fascist_lapdog_desc:0 "Нынешнее руководство страны не готово к надвигающейся буре, но, к счастью, есть те, кто готов... Быстрый силовой захват столицы не может пойти не так, верно?"
 LGS_privatise_everything:0 "Приватизировать §RВСЁ§!"
 LGS_privatise_everything_desc:0 "С окончанием гражданской войны пришло время отдать долги нашим сторонникам-промышленникам и укрепить государство."
 LGS_commie_bastard:0 "Народная революция"
 LGS_commie_bastard_desc:0 "Слышите ли вы, как поёт народ? Шахтёры, крестьяне, рабочие, которые трудятся, пока декадентская буржуазия устраивает очередной роскошный пир. Пришло время Лингстонии перестать быть герцогством и стать §Rавангардом§! форманской §Rсоциалистической революции!§!"
 LGS_share_one_share_all:0 "Всё общее для всех"
 LGS_share_one_share_all_desc:0 "С окончанием гражданской войны мы создадим истинную коммунистическую экономику народа. Никто ничем не владеет, потому что все владеют всем."
 LGS_duchy_of_lingstonia:0 "Вернуться к монархическому руководству"
 LGS_duchy_of_lingstonia_desc:0 "В эти трудные времена наши демократические институты подвергаются испытанию. Пришло время герцогу стабилизировать страну и получить больше власти... только временно, конечно."
 LGS_elevate_to_empire:0 "Провозгласить §CИмперию Лингстония§!"
 LGS_elevate_to_empire_desc:0 "Чтобы обеспечить нашу безопасность и дальнейшую стабильность, герцогство будет реорганизовано в первую Лингстонийскую империю, ради безопасного и защищённого общества!"
 LGS_three_democracies:0 "Укрепить лингстонийскую демократию"
 LGS_three_democracies_desc:0 "Пришло время быть скучными и играть по «историческому» демократическому пути. Лингстонийский отыгрыш, вперёд!"

 LGS_claim_oculum:0 "Острова Окулум"
 LGS_claim_oculum_desc:0 "У нас издавна была сильная связь с морем Окулум, и пришло время заявить острова и прилегающую территорию как наши собственные."
 LGS_claim_north_corvus:0 "Претензии на Северный Корвус"
 LGS_claim_north_corvus_desc:0 "Многие из наших людей давно мигрировали из Северного Корвуса, спасаясь от религиозных преследований. Пришло время вернуться."
 LGS_war_corvus:0 "Война с Корвусом"
 LGS_war_corvus_desc:0 "Жалкое государство-остаток конфедерации, оставшееся после оккупации Южного Корвуса Цетусом, будет интегрировано в нашу славную нацию."
 LGS_corvo-lingstonian_reich:0 "Провозгласить §gКорво-Лингстонию§!"
 LGS_corvo-lingstonian_reich_desc:0 "Мы объединим Корвус и Лингстонию в единое великое государство и провозгласим Корво-Лингстонийскую империю! Да продлится она тысячу лет! Для начала мы вернём земли у жалких цетанцев, у которых нет причин контролировать такую огромную империю."
 LGS_columban_war:0 "Колумбийский вопрос"
 LGS_columban_war_desc:0 "Самые отдалённые части Колумбы всегда имели больше общего с Лингстонией, чем с крупными населёнными центрами северной Колумбы. Пришло время вернуть то, что по праву наше, и расширить нашу империю!"
 LGS_integrate_clb:0 "Интегрировать горный хребет Мейсер"
 LGS_integrate_clb_desc:0 "Теперь, когда земли под нашим контролем, мы начнём интегрировать эту территорию в нашу империю."
 LGS_clb_military_pact:0 "Колумбийско-лингстонийский пакт"
 LGS_clb_military_pact_desc:0 "В эти тревожные времена укрепление наших отношений с Колумбой будет важным. Подписание военного пакта с Колумбой обеспечит нашу безопасность, а также даст нам доступ к странам Восточной Кентавры."