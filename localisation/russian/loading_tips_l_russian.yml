﻿﻿﻿l_russian:
 LOADING_TIP_0: "«Унизительно сидеть сложа руки, когда другие пишут историю. И неважно, кто победит».\n- Неизвестный"
 LOADING_TIP_1: "Человечество неисправимо. \n- Каден Тау"
 LOADING_TIP_2: "Это было во имя Корвуса. \n- Варрен"
 LOADING_TIP_3: "Разбомбите ебанные горы с пути! \n- Генштаб Антареса"
 LOADING_TIP_4: "Мы сидели в тишине, отдалёные рёвы артиллерии разносились эхом через горы весь вечер. \n- Кассиус"
 LOADING_TIP_5: "Только мёртвые видели конец войны. \n- Неизвестный"
 LOADING_TIP_6: "Жирафы бессердечные создания"
 LOADING_TIP_7: "Никогда в жизни больше не буду переводить цитаты во время загрузки"
 LOADING_TIP_8: "ЩПЕРМА МОИХ СОЛДАТ! \n- Корвунский генерал Джумбо"
 LOADING_TIP_9: "АРТИЛЛЕРИЯ! В УКРЫТИЕ! \n- неизвестный Цетанский рядовой"
 LOADING_TIP_10: "Ты это чуствуешь? Несёт перцем. \n- Цетанский полковник"
 LOADING_TIP_11: "Война всегда была тут. До человека, война ждала его. Главная ставка ожидает самого заядлого игрока. \n- Безымянный генерал"
 LOADING_TIP_12: "Нету различия что люди думают о войне, война продолжается. \n- Судья"
 LOADING_TIP_13: "Люди бога и люди войны имеют странные связи. \n-Безымяный солдат"
 LOADING_TIP_14: "Война это ультимативная игра, ведь только она призывает нас к единству. \n- Генерал Ориона"
 LOADING_TIP_15: "Мир должен расцветать и умирать, но в делах людских нету увядания, а полдень ознаменует полночь. \n- Поэма из 18 века"
 LOADING_TIP_16: "Что существует, он промолвил. Что созданное существует без моего ведома, без моих знаний, без моего согласия. \n- Антарийский Генерал"
 LOADING_TIP_17: "Тут должна была быть цитата адольфа гитлера, хз почему её оставили."
 LOADING_TIP_18: "Если бог должен вмешиватся в ужасы которое творит человечество, то где он? \n- Антарийский солдат"
 LOADING_TIP_19: "Война всегда была тут, главная ставка ожидает самых заядлых игроков. \n- Книга из 19 века"
 LOADING_TIP_20: "Ни одна внешняя сила не пошатнёт величественное сияние Антареса! \n- Антарийская анти-орионитская пропаганда во время форманской войны"
 LOADING_TIP_21: "Война это бог. \n- Безымянный солдат"
 LOADING_TIP_22: "Вороны жестоки"
 LOADING_TIP_23: "О, очередной чёртов журналяга? \n- Антарийский солдат"
 LOADING_TIP_24: "Только живые видели конец мира \n- Неизвестный"
 LOADING_TIP_25: "Петя, смотри! Салют!\n- Ребёнок"
 LOADING_TIP_26: "Любите, не воюйте. Он вывел это на новый уровень! Спорю он думает что если переспит с каждым солдатом в Риаа, эта война закончится.\n- Гарви"
 LOADING_TIP_27: "Воздух выводит нас из себя. Мы были в этом запахе перца и ананаса настолько долго что перестали его чуствовать.\n- Неизвестный генерал"
 LOADING_TIP_28: "Касане Тето"
 LOADING_TIP_29: "бля. \n- Неизвестный солдат после того как услышал ЦИС Миру"
 LOADING_TIP_30: "Железные орлы, время для чего??? ВРЕМЯ ДЛЯ БОМБЁЖКИ!!! \n- Клич Железных Орлов во время форманской войны"
 LOADING_TIP_31: "ДА ПОШЛИ В ПЕКЛО ТОРПЕДЫ, ПЛЫВЁМ ПРЯМО! \n- Капитан новичок перед катастрофой"
 LOADING_TIP_32: "Приём, смерть попереди. Всем занять свои посты! \n- Орионитский капитан"
 LOADING_TIP_33: "Это радио Талона, говорит в прямом эфире из последней позиции Аквилы. На этих выжженых землях, мы дадим последний бой. \n- Радио Талона, 1914"
 LOADING_TIP_34: "Это не конец, и не начало конца, но это конец начала. \n- Радио Талона, 1914"
 LOADING_TIP_35: "Только через войну, мы достигнем мир \n- Император Кальвин Тау, 1911"
 LOADING_TIP_36: "Одна лишь мысль о виде который убивает друг друга злила Кальвина. Кальвин считал что единственный метод остановить войну - война. Он был глубоко опечален понимая то чтобы достичь его цели он должен был пойти поперёк своим идеям. Но кто-то должен был это сделать. "
