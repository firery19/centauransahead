 TAKOPIS_ORIGINAL_SIN:0 "1899–1901: Гидрус и Лепус обретают независимость, закладывая основу для Масляных войн.\n\n1902–1905: Масляные войны, Урса против Ориона и сепаратистов. Урса поджигает нефтяные вышки при отступлении, вызывая Церберские нефтяные пожары.\n\n1906: Масляные войны заканчиваются, побеждает Орион. Канис получает независимость от Урсы; Гидрус, Лепус и Канис объединяются в Содружество.\n\n1908: Корвус вторгается в Цетус, чтобы вернуть утерянные территории с драгоценными угольными шахтами.\n\n1911: Когда запасы Корвуса в войне с Цетусом истощаются, они отчаиваются и просят вмешательства Антареса против Цетуса. Взамен Корвус соглашается стать вассалом Антареса.\n\n1911: Антарес вторгается в Цетус. Многие морские подразделения бегут на север, в Рию и Вульпу. Корвус становится вассалом Антареса в виде Скорпии Корвуса.\n\n1912: Антарес атакует Аквилу, «Кольцо Огня» сдерживает первые атаки Антареса." #В попытке искоренить сопротивление Аквилы, Антарес начинает поджигать леса. Огонь быстро выходит из-под контроля, и к концу года сгорает 10% страны.
 TOKIDOKI_BOSOTTO_ROSHIA_GO_DE_DEDERU_TONARI_NO_ALYA_SAN:0 "Есть ли у вас отчёты об ошибках?" #Прошло много времени, не так ли? #В этом обновлении Гидра получает новый контент!! Теперь вы можете играть дальше Гризианских войн с реальными фокусами.
