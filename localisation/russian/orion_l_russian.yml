 #orion.1.d:0 "Орион обратился к нам с просьбой о создании союза для предстоящего конфликта против Урсы."
 #orion.1.a:0 "Возможно, будет мудрым решением принять."
 #orion.1.b:0 "Нет! Мы можем сами взять Канис!"
 #orion.1.t:0 "Орион обращается к нам!"
 #orion.1.d:0 "После восстания в Гидре мы готовились освободить все урсанские колонии. С тех пор Орион внимательно следил за нами, и теперь они пригласили нас присоединиться к их коалиции против Урсы."
 #orion.1.a:0 "Возможно, будет мудрым решением принять."
 #orion.1.b:0 "Нет! Мы можем сами взять Канис!"
 orion.1.t:0 "Орион принимает"
 orion.1.d:0 "Орион ратифицировал договор о формировании Драконьего Компакта с Гидрой и Лепусом."
 orion.1.a:0 "Это замечательно."
