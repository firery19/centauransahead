 ORI_repatriating_canisians:0 "Репатриация канисийцев"
 ORI_repatriating_canisians_desc:0 "Некоторые канисийцы, живущие на западе, могут не соглашаться с нашим правлением, предпочитая местное канисийское правление. У нас нет проблем с этим, и мы стремимся помочь им переехать на восток со своими вещами."
