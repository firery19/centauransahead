 ORI_the_canis_issue:0 "Канисийский вопрос"
 ORI_the_canis_issue_desc:0 "Части Каниса снова вернулись в наши руки после Войны за высадку. Однако потребуется время, чтобы реинтегрировать их в Орион."
 ORI_clearing_the_minefields_act:0 "Очистка минных полей"
 ORI_clearing_the_minefields_act_desc:0 "Отступающие урсанцы оставили много минных полей в оккупированном Канисе. Это создаёт много проблем для нас! Необходимо предпринять шаги по удалению мин."
