l_russian:
 ORS_CanisCrisis:0 "Канисийский кризис"
 ORS_CanisCrisis_desc:0 "С момента дестабилизации урсанских колоний на севере ситуация становилась всё хуже и хуже. В сочетании с растущим спросом на нефть, которая находится в Канисе, кажется лишь вопросом времени, когда начнётся война."
 ORS_Intervene:0 "Подготовиться к вмешательству"
 ORS_Intervene_desc:0 "Оценив текущий Канисийский кризис, мы определили курс действий — мы вмешаемся на стороне Гидры и её союзников против правления Урсы."
 ORS_RallyPeople:0 "Сплотить народ"
 ORS_RallyPeople_desc:0 "Чтобы обеспечить победу в предстоящем конфликте, крайне важно сплотить народ вокруг нашего дела. Мобилизуя широкую поддержку и создавая единый фронт, мы можем укрепить наши позиции и повысить шансы на успех в предстоящей войне."
 ORS_ContactHydrus:0 "Связаться с Гидрой"
 ORS_ContactHydrus_desc:0 "Чтобы помочь Гидре в предстоящей войне, мы должны начать дипломатические усилия, установить каналы связи и создать стратегический союз. Этот единый фронт обеспечит нашу коллективную силу и устойчивость перед лицом грядущих вызовов."

 ORS_RallyPeopleIdea:0 "Сплочение народа"
 ORS_PrepareMilitary:0 "Подготовить вооружённые силы"
 ORS_PrepareMilitary_desc:0 "В преддверии предстоящего конфликта необходима тщательная военная готовность. Это включает комплексные программы обучения, модернизацию оборудования и совершенствование логистических возможностей."
 ORS_PrepareMilitaryIdea:0 "Военная готовность"
 ORS_PromiseBusinesses:0 "Пообещать бизнесу"
 ORS_PromiseBusinesses_desc:0 "Чтобы заручиться поддержкой бизнеса, мы пообещаем им доступ к необходимым ресурсам по низким ценам после завоевания богатых ресурсами территорий. Это обязательство обеспечивает стабильные поставки жизненно важного оборудования для наших военных нужд. Давая такую гарантию, мы можем мобилизовать поддержку бизнеса и стимулировать экономический рост через стратегические партнёрства."
 ORS_PromiseBusinessesIdea:0 "Поддержка бизнеса"
