 ORS_OrioniteImperialism:0 "Орионитский империализм"
 ORS_OrioniteImperialism_desc:0 "В нашем прошлом Королевство Орион было великой империей, завоевавшей многие земли на Гидре, которыми мы владеем до сих пор. Мы должны пересмотреть наше прошлое и продолжить захват мира на этот раз. Хотя это может быть непопулярно среди народа."
 ORS_OrioniteInterventionism:0 "Орионитский интервенционизм"
 ORS_OrioniteInterventionism_desc:0 "Орион не может стоять в стороне и смотреть, как другие нации нарушают баланс сил в мире. Мы будем принимать меры против любых стран, которые осмелятся угрожать ему."
 ORS_OrioniteIsolationism:0 "Орионитский изоляционизм"
 ORS_OrioniteIsolationism_desc:0 "Ориону не нужно вмешиваться в дела других стран. Мы будем смотреть внутрь себя и управлять нашей страной."

