 orion.2.t:0 "Орион отправляет нам мирное предложение!"
 orion.2.d:0 "Теперь, когда мы потеряли нашу последнюю гидранскую колонию, Орион хочет подписать мирный договор, который отдаст им и Гидре нашу последнюю колонию и репарации за войну. Примем ли мы?"
 orion.2.a:0 "Мы потеряли колонию, воевать дальше не стоит."
 orion.2.b:0 "Нет! Мы никогда не сдадимся!"
 orion.3.t:0 "Урса принимает наш мирный договор!"
 orion.3.d:0 "После нашего быстрого вторжения в Канис мы отправили Урсе мирный договор, который включал отказ от Каниса и выплату военных репараций нам и Гидре. После нескольких недель дипломатического давления и перехвата их конвоев они наконец сдались."
 orion.3.a:0 "Отлично"
 orion.4.t:0 "Урса не сдаётся!"
 orion.4.d:0 "Несмотря на наши усилия принудить их к капитуляции, они отказались от любого мирного договора, и теперь мы вынуждены вести «странную войну» против Урсы."
 orion.4.a:0 "Чёрт возьми!"
 #ORS_EndHartTerm:0 "Конец срока Харта"
