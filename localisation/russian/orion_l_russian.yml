 orion.6.t:0 "Экономика рушится!"
 orion.6.d:0 "После открытия нефти в Канисе многие нефтяные компании Ориона устремились туда, чтобы получить как можно больше прибыли. Сначала всё шло хорошо, пока мы не решили помочь гидранским повстанцам. С тех пор правительство Урсы ввело против нас эмбарго, и с тех пор экономика начала стагнировать. В сочетании с другими проблемами, которые только усугубляют ситуацию, всем стало ясно, что вопрос лишь во времени, когда экономика рухнет. И теперь это время настало."
 orion.6.a:0 "Может ли быть ещё хуже?"

