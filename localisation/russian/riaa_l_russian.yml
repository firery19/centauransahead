l_russian:
 RIA_north_centauran_alliance:0 "Создать СКА"
 RIA_north_centauran_alliance_desc:0 "Временный фокус-заглушка. СКА — Северо-Кентаврийский Альянс, созданный для остановки антареанского вторжения в Северную Кентавру."

 ria.1.t:0 "Риа приглашает нас в Северо-Кентаврийский Альянс"
 ria.1.d:0 "В связи с угрозой вторжения Антареса в северные страны, Риа стремится объединить с нами силы для борьбы с антареанской угрозой. Стоит ли нам присоединиться?"
 ria.1.a:0 "Антарес — угроза."
 ria.1.b:0 "Нам не следует вмешиваться."