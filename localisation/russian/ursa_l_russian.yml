 fallen_empire:0 "Павшая империя"
 fallen_empire_desc:0 "Давайте посмотрим правде в глаза: Урса медленно приходила в упадок со времён своего расцвета в XIX веке, но с тех пор мы пали так низко. Беспорядки охватывают наши отдалённые территории, пока правительство грызётся, а армия становится неспособной вести войны. Орион и Гидра воспользовались этим, но мы должны сделать так, чтобы они больше не могли этого делать."
 urs.1.t:0 "Лепунская весна"
 urs.1.d:0 "С тех пор как Гидра объявила независимость, повстанцы в Лепусе постоянно пытались повторить то, что произошло в Гидре, но безуспешно — до сих пор. Мы недооценили их силу в сочетании с тем фактом, что армия находится в очень плохом состоянии — повстанцам удалось вырваться из-под нашего контроля."
 urs.1.a:0 "Как будто и так было недостаточно плохо!"
 ursa_a.1.t:0 "Тест"
 urs.2.t:0 "Федерация Урсы пытается экономически изолировать Гидру!"
 urs.2.d:0 "В разработке"
 urs.2.a:0 "Они заплатят в своё время!"
 urs.2.b:0 "Они заплатят в своё время!"
 urs.3.t:0 "Эскалация антивоенных демонстраций!"
 urs.3.d:0 "Гражданские протестуют всё более активно."
 urs.3.a:0 "Но мы сражаемся за свободу!"
 urs.4.t:0 "Будущее нашей армии"
 urs.4.d:0 "Каково наше будущее? Решайте здесь!!"
 urs.4.a:0 "Нам нужна элитная индивидуальная подготовка!"
 urs.4.b:0 "Командование армией нуждается в перестановках!"
 urs.4.c:0 "Нам нужны все руки на палубе, чтобы победить врага!"
 urs.5.t:0 "Военное командование проникнуто!"
 urs.5.d:0 "Многие документы нашей армии стали общедоступными после обнаружения утечки."
 urs.5.a:0 "Наши секретные планы раскрыты!"
 urs.6.t:0 "Терроризм, направленный против урсанцев!"
 urs.6.d:0 "Повстанцы напали на наших гражданских. Это подлый поступок!"
 urs.6.a:0 "Насколько низко падут эти бандиты?"
 urs.7.t:0 "Сопротивление получает поддержку в сельской местности"
 urs.7.d:0 "Травоядные в последнее время сопротивляются нам."
 urs.7.a:0 "Крестьянство так легко поддаётся влиянию..."
 urs.8.t:0 "Внутренние беспорядки среди студентов растут"
 urs.8.d:0 "Многие студенты собрались на городской площади с протестами, требуя перемен."
 urs.8.a:0 "Этим студентам нужно вернуться в классы."
 urs.9.t:0 "Местные арсеналы разграблены!"
 urs.9.d:0 "Повстанцы украли оружие из наших арсеналов! Теперь они, должно быть, распространяют его среди повстанцев."
 urs.9.a:0 "Лепус становится только сильнее!"
 urs.10.t:0 "Восточный Лепус пал перед повстанцами"
 urs.10.d:0 "Быстро распространилась новость о том, что урсанские войска потеряли всякое влияние в самой изолированной части Федерации — Восточном Лепусе. За последние несколько десятилетий Урсанская федерация постепенно теряла контроль над своими колониальными владениями. После вывода войск из Гидры правительство Урсы усилило нетерпимость к инакомыслию, что привело к ухудшению качества жизни в Канисе и Лепусе. Всё это вылилось в восстание в Восточном Лепусе, где тысячи партизан захватили важные города и инфраструктуру. Разведка сообщает, что ситуация в Лепусе нестабильна, и урсанские войска будут вынуждены полностью вывестись. Война на подходе. Мы не допустим второго унижения от повстанцев; однако Орион и Гидра ждали момента, чтобы нанести удар по нашей империи и покончить с ней навсегда! Мы должны готовиться к войне на всех фронтах!"
 urs.10.a:0 "Фитиль пороховой бочки зажжён."
 urs.11.t:0 "Восточный Лепус пал перед повстанцами"
 urs.11.d:0 "Быстро распространилась новость о том, что урсанские войска потеряли всякое влияние в самой изолированной части Федерации — Восточном Лепусе. За последние несколько десятилетий Урсанская федерация постепенно теряла контроль над своими колониальными владениями. После вывода войск из Гидры правительство Урсы усилило нетерпимость к инакомыслию, что привело к ухудшению качества жизни в Канисе и Лепусе. Всё это вылилось в восстание в Восточном Лепусе, где тысячи партизан захватили важные города и инфраструктуру. Разведка сообщает, что ситуация в Лепусе нестабильна, и урсанские войска будут вынуждены полностью вывестись. Война на подходе. Урсанцы не допустят второго унижения от повстанцев. Наш долг — защитить право народа на самоопределение! Мы должны поддержать Лепус и обеспечить его независимость от Урсы!"
 urs.11.a:0 "Фитиль пороховой бочки зажжён."
 urs.12.t:0 "Лепус провозглашает временное правительство"
 urs.12.d:0 "Лепунские силы поднялись против нас. Сейчас шансы не в нашу пользу. Наши следующие шаги на этом континенте должны быть осторожными."
 urs.12.a:0 "Сделать символическую попытку борьбы с повстанцами"
 urs.12.b:0 "Мы должны сохранить плацдарм в Лепусе!"
 urs.13.t:0 "Полный вывод войск из Лепуса"
 urs.13.d:0 "После нескольких месяцев боёв с лепунскими повстанцами стало ясно, что ситуация в Лепусе складывается не в нашу пользу. Припасы, направляющиеся к нашим войскам в Западном Лепусе, постоянно перехватываются повстанцами в Восточном Канисе и за морем в Гидранском проливе. Разведка в Орионе и Гидре предупредила нас о поддержке двумя странами нового открытого восстания в Восточном Канисе. Наше Верховное командование предлагает вывести войска из Лепуса и сосредоточиться на обороне Каниса, так как там находятся огромные запасы нефти, на которые полагается наш флот."
 urs.13.a:0 "Будем надеяться, что мы приняли правильное решение"
 urs.14.t:0 "Удар в Канисе"
 urs.14.d:0 "Повстанцы Каниса поднялись против нашего правления. Это явный признак того, что война с Орионом неизбежна."
 urs.14.a:0 "Урса не падёт перед своими врагами!"
 urs.1401.t:0 "Удар в Канисе"
 urs.1401.d:0 "Повстанцы Каниса поднялись против нашего правления. Это явный признак того, что война с Орионом неизбежна."
 urs.1401.a:0 "Урса не падёт перед своими врагами!"
 urs.15.t:0 "Экономическое опустошение"
 urs.15.d:0 "Наша экономика разрушена, нееет"
 urs.15.a:0 "Боже мой."
 urs.16.t:0 "Хаос в Урсе"
 urs.16.d:0 "Студенты, оппозиция и крестьяне начали общенациональный протест. Многие рабочие начали забастовки, а многие другие начали антивоенные протесты, требуя прекращения войны в Канисе."
 urs.16.a:0 "Мы не можем позволить себе отвлекаться сейчас!"
 urs.17.t:0 "Выжженный песок"
 urs.17.d:0 "событие, объясняющее, что мы не можем долго удерживать пустыню, и лучший вариант — уничтожить нефтяные вышки"
 urs.17.a:0 "Лишить их нефти!"
 urs.18.t:0 "Смерть Эдуарда Магора"
 urs.18.d:0 "Сегодня утром наш великий лидер Эдуард Магор скончался."
 urs.18.a:0 "Он был великим лидером, я думаю."

