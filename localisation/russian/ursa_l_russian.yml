URS_oil_field_defense_tooltip:0 "§YЗавершение этого фокуса добавит укрепления 1-го уровня вдоль границы Ориона в Западном Канисе!§!"
URS_lepus_destruction_tooltip:0 "§YВ начале открытого восстания Лепус получит штраф -75% к скорости восстановления!§!"
