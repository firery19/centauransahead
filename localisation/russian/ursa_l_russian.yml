#Дерево фокусов
URS_resistance_policy:0 "Продолжить кампанию подавления"
URS_resistance_policy_desc:0 "Даже если колонии сопротивляются, они должны знать своё место под урсанским сапогом. Мы должны продолжить кампании подавления."
URS_garrison_help:0 "Патрулирование сельской местности Лепуса"
URS_garrison_help_desc:0 "Мы должны проводить постоянные патрули в сельских районах Лепуса."
URS_free_repair_focus:0 "Ужесточение безопасности на заводах"
URS_free_repair_focus_desc:0 "Террористы могут появиться в любой момент, закладывая бомбы и саботируя работу заводов. Усиление безопасности вокруг заводов может смягчить эти проблемы."
URS_equipment_shipments:0 "Контракты на оборудование"
URS_equipment_shipments_desc:0 "Оружие важно для любой армии в мире. Мы должны закупить оружие у других государств."
URS_garrison_reduction:0 "Урсанские организации самообороны"
URS_garrison_reduction_desc:0 "Повстанцы иногда наносят потери в засадах и во время акций сопротивления. Создание этих организаций может помочь смягчить некоторые из этих последствий."
URS_lepus_destruction:0 "Уловка палача"
URS_lepus_destruction_desc:0 "Оставляя хорошо замаскированные ловушки, мы сможем активировать их и уничтожить инфраструктуру перед уходом, если Лепус решит восстать против нас."
URS_resistance_sweep_units:0 "Контрпартизанские отряды ополчения"
URS_resistance_sweep_units_desc:0 "Повстанцы в наших колониях могут нанести удар в любой момент. Наличие этих отрядов ополчения поможет нам бороться с ними."

URS_extraction_policy:0 "Осознать надвигающуюся войну"
URS_extraction_policy_desc:0 "Ситуация в наших колониях стремительно ухудшается, и мы не настолько глупы, чтобы не понимать, что война может начаться в любой момент."
URS_war_propaganda:0 "Пресечь пораженчество"
URS_war_propaganda_desc:0 "Поражение не вариант. Мы выиграем любые будущие войны на Гидре благодаря нашей воле и силе."
URS_mobolization_act:0 "Акт о национальной мобилизации" # почему mobolization
URS_mobolization_act_desc:0 "Принятие акта о мобилизации может подготовить нас к войне."
URS_prevent_economic_collapse:0 "Внедрение автаркии"
URS_prevent_economic_collapse_desc:0 "Самообеспечение важно для каждой нации. Мы должны последовать их примеру."
URS_eliminate_dissent:0 "Устранить внутреннее инакомыслие"
URS_eliminate_dissent_desc:0 "Многие внутренние факторы в нашей стране в последнее время создают проблемы, рассуждая о какой-то бесполезной «Мы ненавидим войну!», «Война не принесёт нашей стране ничего хорошего!». Давайте просто заставим их замолчать."
URS_selected_service_act:0 "Акт о выборочной службе"
URS_selected_service_act_desc:0 "Можем ли мы позволить себе выбирать призывников в эти трудные времена? Я так не думаю. Давайте призывать любого мужчину с работающими конечностями и руками."
URS_factory_enticement:0 "Увеличение колониальных квот"
URS_factory_enticement_desc:0 "Мы используем промышленный потенциал и ресурсы наших колоний. Но этого недостаточно, мы должны увеличить наши квоты в Канисе."
URS_factory_moving:0 "Перемещение промышленности в Урсу"
URS_factory_moving_desc:0 "Промышленный потенциал, находящийся в наших колониях, не имеет гарантированной безопасности, так как мы можем потерять их в любой момент. Мы должны переместить заводы в более безопасную урсанскую метрополию."

URS_counter_resistance_support:0 "Гидранский шип"
URS_counter_resistance_support_desc:0 "Недавняя независимость Гидры от нас стала проблемой. Они контролируют часть вод, ведущих к Лепусу, и мы должны что-то с этим сделать."
URS_secure_west_canis:0 "Увеличить присутствие войск" # этот фокус не имеет отношения к западному Канису
URS_secure_west_canis_desc:0 "Демонстрация наших войск в общественных местах может повысить доверие к нашей армии."
URS_antiwar_orion:0 "Поддержка антивоенных движений в Орионе"
URS_antiwar_orion_desc:0 "У нас есть много связей во внутренних структурах Ориона, и мы можем использовать их с большим эффектом, поддерживая антивоенные протесты внутри Ориона и сея недовольство в их стране."
URS_cp_resistance_support:0 "Военное положение в Западном Канисе"
URS_cp_resistance_support_desc:0 "Канис в последнее время усиливает сопротивление нашему правлению. Мы больше не будем это терпеть. Мы введём военное положение в ближайшем к нам регионе Каниса и подавим сопротивление."
URS_improve_supply:0 "Моторизация снабжения"
URS_improve_supply_desc:0 "Грузовики — революционное изобретение, быстрее лошадей и способные перевозить больше припасов. Больше грузовиков принесёт нам пользу."
#URS_defense_bonus:0 "Наш звёздный час"
URS_defense_bonus:0 "Оборонительные планы"
URS_defense_bonus_desc:0 "Планирование — важный аспект в армии. Если армия никогда не планирует, она никогда не сможет ничего добиться. Мы должны подготовиться к любым атакам Ориона и Гидры."

URS_leave_policy:0 "Оставление колоний"
URS_leave_policy_desc:0 "Ситуация в колониях развилась не обязательно в нашу пользу. Чтобы избежать затяжного конфликта с всё более агрессивными повстанцами в Лепусе и Канисе, мы начнём переговоры с лидерами этих групп."
URS_holding_referendums:0 "Провести референдумы"
URS_holding_referendums_desc:0 "Пусть народ решит сам, хотят ли они остаться с Урсой?"
URS_establish_transitional_governments:0 "Создать переходные правительства"
URS_establish_transitional_governments_desc:0 ""
URS_end_military_involvement_colonies:0 "Прекратить военное участие"
URS_end_military_involvement_colonies_desc:0 ""
URS_negotiate_peaceful_leaving_hydra:0 "Уход из Гидры"
URS_negotiate_peaceful_leaving_hydra_desc:0 "Пусть будет известно, что мы не хотим воевать."
URS_internal_affairs:0 "Управление внутренними проблемами"
URS_internal_affairs_desc:0 ""
URS_resolve_protests:0 "Урегулирование внутренних беспорядков"
URS_resolve_protests_desc:0 ""
URS_kill_radical_rioters:0 "Заткнуть радикальные протесты"
URS_kill_radical_rioters_desc:0 "Опасные протестующие, желающие привнести в Урсу неизвестную идеологию, не должны существовать."
URS_approach_hydrus:0 "Сближение с Гидрой"
URS_approach_hydrus_desc:0 ""

URS_radical_path:0 "Радикальные восстания"
URS_radical_path_desc:0 "Правительство Урсы нанесло себе унизительный удар, оставив колонии без боя. Это признак слабеющего правительства, неспособного справиться с угрозами, и мы должны взять контроль в свои руки."
stop_radical_path_ursa_tt:0 "Предотвращает возможность взять фокус §Y$URS_radical_path$§!."
URS_democracy_path:0 "Демократический переход"
URS_democracy_path_desc:0 "С окончанием правления на Гидре монархия потеряла большую часть своей власти. Это возможность для мирного перехода к демократии."
URS_monarchy_path:0 "Продолжение правления монархии"
URS_monarchy_path_desc:0 "Даже теряя наши колониальные владения на Гидре, мир в Урсе сохранился. Монархия не пала."

URS_prelude_grease_war:0 "Чрезвычайное положение"
URS_prelude_grease_war_desc:0 "Война неизбежна."
URS_economy_fixing_kill_peasants:0 "Пресечь крестьянские бунты" # я тоже не замечал, что там было «убить крестьян» 🙏🙏🙏
URS_economy_fixing_kill_peasants_desc:0 "Многие крестьяне в нашей стране начали бунтовать против нас, создавая внутренние проблемы. Подавление этих бунтов может быть единственным выходом."
URS_economy_fixing2:0 "Ограничить государственные расходы"
URS_economy_fixing2_desc:0 "Чтобы смягчить последствия экономической депрессии, мы должны ограничить государственные расходы."
URS_economy_fixing:0 "Экономическое свободное падение"
URS_economy_fixing_desc:0 "Уааа, экономическая депрессия никому не идёт на пользу"
URS_economy_fixing3:0 "Субсидии фермерам"
URS_economy_fixing3_desc:0 "Мы можем субсидировать наших фермеров, чтобы успокоить их, получая взамен их урожай."
URS_economy_fixing_trade_partners:0 "Взгляд в сторону Кентавры"
URS_economy_fixing_trade_partners_desc:0 "Мы должны обратиться к Антаресу, державе южной Кентавры, и договориться о торговой сделке на поставку оружия."
URS_economy_fixing_wartime_pwa:0 "Военные общественные работы"
URS_economy_fixing_wartime_pwa_desc:0 "Во времена экономической депрессии и войны занятость является важным фактором восстановления. Создание этой компании общественных работ может помочь нам строить военную инфраструктуру, одновременно обеспечивая работой многих людей."
URS_alcor_trenching:0 "Обезопасить наш важнейший порт"
URS_alcor_trenching_desc:0 "[117.GetCapitalVictoryPointName], ближайший портовый город Каниса к урсанской метрополии, является стратегически важным городом. Мы должны интегрировать город и сам регион в состав Урсы."

