URS_army_tree_start:0 "Вопрос организации армии"
URS_army_tree_start_desc:0 ""
URS_army_tree_stay_cavalry:0 "Сохранить кавалерийское наследие"
URS_army_tree_stay_cavalry_desc:0 "Лошади помогали человечеству перевозить многие вещи на большие расстояния, включая солдат и припасы. Давайте уважать кавалерийское наследие."
URS_horse_breeds:0 "Более сильные лошади"
URS_horse_breeds_desc:0 "Мы можем вывести более сильных лошадей для улучшения наших кавалерийских частей."
URS_mobile_warfare:0 "Кавалерийская мобильная война"
URS_mobile_warfare_desc:0 "Кавалерия быстрее и маневреннее наших обычных пехотных частей. При необходимости они могут обойти противника."
URS_meteor_chasers:0 "Метеоритные преследователи"
URS_meteor_chasers_desc:0 "Следуя за артиллерийскими снарядами, кавалерия-«метеоритный преследователь» появляется после артиллерийской бомбардировки."
URS_cav_art_combined_arms:0 "Комбинированные роды войск"
URS_cav_art_combined_arms_desc:0 "Сочетая скорость кавалерии и разрушительную силу артиллерии, мы можем достичь больших высот."
URS_concentrated_breakthrough:0 "Концентрированный прорыв"
URS_concentrated_breakthrough_desc:0 "Стратегия сосредоточения всех мобильных и ударных частей в одной небольшой зоне на линии фронта может подавить любые оборонительные позиции."
URS_army_tree_stay_artillery:0 "Принять артиллерийское превосходство"
URS_army_tree_stay_artillery_desc:0 "Артиллерия доказала свою эффективность в войне. Возможность подавлять врага с больших расстояний — слишком имба!"
URS_artillery_research:0 "Тарасвикский артиллерийский полигон"
URS_artillery_research_desc:0 "В этом месте исследуют артиллерию."
URS_priority_artillery:0 "Приоритет выпуска"
URS_priority_artillery_desc:0 "Мы должны создавать больше артиллерии! Или больше орудий, как вам угодно."
URS_art_striking_power:0 "Ударная мощь артиллерии"
URS_art_striking_power_desc:0 "Артиллерия может обрушить на врага сокрушительный огонь во время нашего наступления — эффективная стратегия."
URS_art_defensive_positions:0 "Оборонительные артиллерийские позиции"
URS_art_defensive_positions_desc:0 "Артиллерия должна использоваться для обстрела любых врагов, осмелившихся приблизиться к нашим линиям."

URS_army_tree_side_tree:0 "Департизация армии"
URS_army_tree_side_tree_desc:0 ""
URS_army_tree_centralized_field:0 "Полевые госпитали"
URS_army_tree_centralized_field_desc:0 "Потери солдат происходят по-разному. Некоторые потери легко предотвратить, если развернуть госпитальные подразделения на передовой."
URS_army_tree_centralized:0 "Армия, основанная на заслугах"
URS_army_tree_centralized_desc:0 "заполнитель"
URS_army_tree_centralized_planning:0 "Планирование Верховного командования"
URS_army_tree_centralized_planning_desc:0 "Создание Верховного командования для планирования — отличная идея."
