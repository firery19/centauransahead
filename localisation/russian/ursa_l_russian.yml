URS_navy_land_sync:0 "Взаимодействие армии и флота"
URS_navy_land_sync_desc:0 "Оптимизация связи для оптимальной поддержки береговой бомбардировки."
URS_army_marine_command:0 "Создать командование армии и морской пехоты"
URS_army_marine_command_desc:0 "Морская пехота и пехота работают вместе."

