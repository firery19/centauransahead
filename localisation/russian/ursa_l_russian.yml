URS_resistance_policy_tooltip:0 "§YМы продолжим подавлять сопротивление в Канисе и Лепусе, что может привести к ослаблению сил открытого восстания!§!"
URS_extraction_policy_tooltip:0 "§YСитуация в Канисе и Лепусе стремительно выходит из-под контроля. Мы должны извлечь как можно больше из этих земель, чтобы создать более сильную армию для противостояния открытому восстанию!§!"
grease_wars_not_started:0 "Гризианские войны не начались"
