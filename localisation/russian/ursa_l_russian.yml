URS_withdraw_from_east_canis:0 "Вывод из Восточного Каниса"
URS_withdraw_from_east_canis_desc:0 "Восточный Канис невозможно оборонять. Далеко от урсанской метрополии и окружён врагами, мы должны вывести войска."
URS_every_inch:0 "Защищать каждый дюйм"
URS_every_inch_desc:0 "Любой клочок земли на материковой Гидре драгоценен. Мы удержим любую территорию."
URS_the_circinnian_desert_minefield:0 "Цирцинийские минные поля"
URS_the_circinnian_desert_minefield_desc:0 ""
URS_alcor_perimeter:0 "Периметр [117.GetCapitalVictoryPointName]"
URS_alcor_perimeter_desc:0 "Мы должны создать оборонительный периметр вокруг этого важного города."
URS_alcor_coastal_defence:0 "Береговая оборона [117.GetCapitalVictoryPointName]"
URS_alcor_coastal_defence_desc:0 "Мы не можем забывать о береговой обороне вокруг [117.GetCapitalVictoryPointName], чтобы враг не использовал это слабое место."
URS_west_lepus_strategy:0 "Стратегия [130.GetName]"
URS_west_lepus_strategy_desc:0 "Наш плацдарм в [130.GetName] должен быть сохранён. Он может стать отправной точкой для будущих планов против [ORI.GetNameDef] и [LPS.GetNameDef]."
URS_west_lepus_stronghold:0 "Оплот [130.GetName]"
URS_west_lepus_stronghold_desc:0 "После стратегических обсуждений было решено, что этот клочок земли будет служить занозой в боку [ORI.GetNameDef] и [LPS.GetNameDef]."
URS_port_lewis_coastal_defence:0 "Береговая оборона [130.GetCapitalVictoryPointName]"
URS_port_lewis_coastal_defence_desc:0 "Любые береговые орудия, которые мы смогли вывезти из Лепуса, всё ещё можно использовать для обороны этого города. В конце концов, они не покидали этот город, не так ли?"
URS_river_holds:0 "Оборона проливов"
URS_river_holds_desc:0 "Предотвращение переправы врага через проливы — главный приоритет, они легко обороняемы и имеют тактическую ценность."
URS_lepus_offensive_strategy:0 "Стратегия удара по Лепусу"
URS_lepus_offensive_strategy_desc:0 "После стратегических обсуждений было решено, что этот клочок земли будет служить плацдармом для удара по [ORI.GetNameDef] и [LPS.GetNameDef]."
URS_the_grease_wars:0 "Гризианские войны"
URS_the_grease_wars_desc:0 "Примечание: они стали называться Гризианскими войнами только после войны."
URS_recruit_warcriminal:0 "Нанять военных преступников"
URS_recruit_warcriminal_desc:0 "Военные преступления? Их не существует в Форме."
URS_secure_waterway_to_alcor:0 "Обезопасить водный путь к Алькору"
URS_secure_waterway_to_alcor_desc:0 "Водный путь между Алькором и урсанской метрополией — важная линия. Мы должны защитить его от врагов!"