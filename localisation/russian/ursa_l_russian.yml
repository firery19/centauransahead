#Решения
URS_preGreaseWars_Decisions:0 "Управление непокорными колониями"
URS_preGreaseWars_Decisions_desc:0 "Не секрет, что наше влияние на Гидре медленно ослабевает в течение последних десятилетий. Наша федерация была унижена, когда мы были вынуждены вывести войска из Гидры в 1899 году. Наш долг — показать миру, что мы всё ещё сильная и гордая нация, которой нам суждено быть.\n\nСтатус: [LepusRebellionProgress] [?lepus_revolution_counter|Y0]\n\nНестабильность: [LepusAngerProgress] [?lepus_anger_counter|Y0]"
